name: Universal Link Checker

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: write-all
on:
  workflow_call:
    secrets:
      COUNTER_API_KEY:
        required: false

jobs:
  telemetry:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Track Usage
        env:
          API_KEY: ${{ secrets.COUNTER_API_KEY }}
        if: env.API_KEY != ''
        run: |
          curl -X GET "https://api.counterapi.dev/v2/rokctai/usage/up" \
          -H "Authorization: Bearer $API_KEY"

  link-check:
    needs: telemetry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link Checker
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --no-progress './**/*.md'
          fail: false # Don't break build, just warn
