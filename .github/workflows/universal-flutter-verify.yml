# Copyright 2024 RokctAI

name: Universal Flutter Verify

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: write-all
on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
        description: "The Android package name (applicationId)"

jobs:
  verify:
    name: 🔍 Verify App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download Debug APK
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: flutter-apks
          path: build/app/outputs/flutter-apk/

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # reactivecircus/android-emulator-runner executes each line of its
      # `script:` input as a SEPARATE `sh -c` command: multi-line if/fi blocks
      # die with 'Syntax error: end of file unexpected (expecting "fi")' and
      # variables do not survive between lines. Write the whole verification
      # flow to a file first, then hand the runner a single-line invocation.
      - name: Prepare Verification Script
        run: |
          cat > verify_app.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -e

          DEBUG_APK="build/app/outputs/flutter-apk/app-debug.apk"
          RELEASE_APK="build/app/outputs/flutter-apk/app-release.apk"
          APK_PATH=""

          if [ -f "$DEBUG_APK" ]; then
            echo "✅ Using Debug APK: $DEBUG_APK"
            APK_PATH="$DEBUG_APK"
          elif [ -f "$RELEASE_APK" ]; then
            echo "⚠️ Debug APK missing, using Release APK: $RELEASE_APK"
            APK_PATH="$RELEASE_APK"
          else
            echo "❌ ERROR: No APK found at $DEBUG_APK or $RELEASE_APK"
            exit 1
          fi

          echo "🚀 Installing APK: $APK_PATH"
          adb install "$APK_PATH"

          echo "🧹 Clearing logs..."
          adb logcat -c

          echo "🎬 Launching App..."
          adb shell monkey -p "$PACKAGE_NAME" -c android.intent.category.LAUNCHER 1

          echo "⏳ Waiting for UI to render (Retry Loop)..."
          ATTEMPT=1
          MAX_ATTEMPTS=5
          SUCCESS=false

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "📸 Capture Attempt $ATTEMPT/$MAX_ATTEMPTS..."
            adb shell screencap -p /sdcard/verification.png
            adb pull /sdcard/verification.png verification.png

            if [ -s verification.png ]; then
              echo "✅ Screenshot captured successfully."
              SUCCESS=true
              break
            fi

            echo "⏳ Empty screenshot, waiting 5s before retry..."
            sleep 5
            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ "$SUCCESS" = false ]; then
            echo "❌ Failed to capture a valid screenshot after $MAX_ATTEMPTS attempts."
            exit 1
          fi

          echo "📜 Capturing Logs..."
          adb logcat -d > logs.txt

          echo "🏁 Checking if app is still running..."
          if adb shell pidof "$PACKAGE_NAME" > /dev/null; then
            echo "✅ App is running."
          else
            echo "❌ App is NOT running. It might have crashed."
            exit 1
          fi

          echo "✅ Verification complete."
          SCRIPT
          chmod +x verify_app.sh

      # Emulator infra flakes (boot timeouts, adb "Broken pipe", dead adb
      # daemon on port 5037) kill whole release runs. Give the job ONE retry
      # with a freshly-created AVD before failing for real.
      - name: Run Emulator and Verify
        id: verify
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ./verify_app.sh

      - name: Reset Emulator State Before Retry
        if: steps.verify.outcome == 'failure'
        run: |
          echo "First verify attempt failed — killing stale emulator/adb before retry."
          adb emu kill || true
          pkill -f "qemu-system" || true
          adb kill-server || true
          sleep 10

      - name: Run Emulator and Verify (Retry)
        id: verify-retry
        if: steps.verify.outcome == 'failure'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ./verify_app.sh

      - name: Verify Status
        if: always()
        run: |
          if [ "${{ steps.verify.outcome }}" = "success" ] || [ "${{ steps.verify-retry.outcome }}" = "success" ]; then
            echo "✅ Verification succeeded (first attempt: ${{ steps.verify.outcome }}, retry: ${{ steps.verify-retry.outcome }})."
          else
            echo "❌ Verification failed on both attempts (first: ${{ steps.verify.outcome }}, retry: ${{ steps.verify-retry.outcome }})."
            exit 1
          fi

      - name: Upload Verification Artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verification-results
          path: |
            verification.png
            logs.txt
