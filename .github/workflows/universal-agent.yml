name: Universal Agent Orchestrator

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PIP_BREAK_SYSTEM_PACKAGES: 1
  LEDGER: .rokct/agent/ledger.json

permissions: write-all

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        required: false
        default: 'ubuntu-latest'
      python-version:
        type: string
        required: false
        default: '3.10'
      process-queue:
        type: boolean
        required: false
        default: true
      mode:
        type: string
        required: false
        default: 'auto'
        description: "Execution mode: 'run' (process queue), 'cleanup' (lifecycle cleanup), 'scheduler' (session auditor), 'ledger' (ledger updater), 'idea-session', 'process-queue', 'protocol-delegation', 'protocol-review', 'protocol-publisher'"
      # Ledger update inputs
      ledger_id:
        type: string
        required: false
      ledger_type:
        type: string
        required: false
      ledger_theme:
        type: string
        required: false
      ledger_status:
        type: string
        required: false
      ledger_agent:
        type: string
        required: false
      ledger_session:
        type: string
        required: false
      ledger_pr:
        type: string
        required: false
    secrets:
      JULES_API_KEY:
        required: false
      GROQ_API_KEY:
        required: false
      MONOREPO_PAT:
         required: false


jobs:
  agent-run:
    if: |
      inputs.mode == 'run' ||
      (inputs.mode == 'auto' &&
       (github.repository == 'RokctAI/opportunities' || github.repository == 'RokctAI/factory') &&
       (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'schedule' && github.event.schedule == '0 20 * * *')))
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Initiate Protocol
        run: |
          if [ -f ".rokct/initiate.py" ]; then
            echo "🚀 Running local initiate.py..."
            python .rokct/initiate.py
          else
            echo "🌐 Fetching web initiate.py from remote protocol..."
            curl -sSL https://raw.githubusercontent.com/RokctAI/The-Rokct-Protocol/main/profiles/web/initiate.py -o initiate_temp.py
            python initiate_temp.py
            rm initiate_temp.py
          fi

      - name: Process Queue
        if: ${{ inputs.process-queue }}
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MONOREPO_PAT: ${{ secrets.MONOREPO_PAT }}
        run: |
          FILES=$(ls .rokct/agent/queue/*.json .rokct/agent/prompts/in_progress/*.json 2>/dev/null || true)

          if [ -z "$FILES" ]; then
            echo "ℹ️ No task files found to process."
            exit 0
          fi

          CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          HAS_UPDATES=false
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M")

          for FILE in $FILES; do
            if [ ! -f "$FILE" ]; then continue; fi

            echo "📂 Analyzing: $FILE"

            SCHEDULED_AT=$(jq -r '.scheduled_at // empty' "$FILE")
            if [ -n "$SCHEDULED_AT" ] && [[ "$CURRENT_TIME" < "$SCHEDULED_AT" ]]; then
              echo "⏳ Task is scheduled for $SCHEDULED_AT. Skipping."
              continue
            fi

            AGENT=$(jq -r '.agent // "jules"' "$FILE")
            REPO=$(jq -r '.repo' "$FILE")
            PROMPT=$(jq -r '.prompt' "$FILE")
            TITLE=$(jq -r '.title // "AI-Automation"' "$FILE")
            LEVEL=$(jq -r '.level // 0' "$FILE")
            CARD_FILE=$(jq -r '.card_file // empty' "$FILE")

            if [ "$LEVEL" == "1" ]; then
               printf '%s\n' \
                 'import os, glob' \
                 'files = sorted(glob.glob(".rokct/agent/jobs/pending/*.md"), key=os.path.getmtime)' \
                 'for f in files:' \
                 '    try:' \
                 '        if "status: theme_generated" in open(f, encoding="utf-8").read():' \
                 '            print(f)' \
                 '            break' \
                 '    except Exception:' \
                 '        pass' \
                 > /tmp/_find_card.py
               OLDEST_CARD=$(python3 /tmp/_find_card.py 2>/dev/null || true)

               if [ -n "$OLDEST_CARD" ]; then
                  TYPE=$(grep '^type:' "$OLDEST_CARD" | cut -d':' -f2 | xargs)
                  THEME=$(grep '^theme:' "$OLDEST_CARD" | cut -d':' -f2 | xargs)
                  PROMPT=$(echo "$PROMPT" | sed "s/{theme}/$THEME/g" | sed "s/{type}/$TYPE/g")
                  CARD_FILE="$OLDEST_CARD"
                  echo "🎯 Injected card data: $THEME ($TYPE) from $CARD_FILE"
               else
                  echo "ℹ️ No pending cards for Level 1. Skipping task $FILE."
                  continue
               fi
            fi

            if [ -n "$CARD_FILE" ] && [ -f "$CARD_FILE" ]; then
              if ! python .rokct/skills/agent_delegation/scripts/lock_job.py --file "$CARD_FILE" --action claim --agent "$AGENT" --session "AUTO-$GITHUB_RUN_ID"; then
                 echo "Card $CARD_FILE is locked. Skipping task $FILE."
                 continue
              fi
            fi

            SUCCESS=false
            SESSION_ID="—"
            if [ "$AGENT" == "groq" ]; then
              echo "🚀 Calling Groq for $TITLE..."
              if RESPONSE=$(python .rokct/skills/agent_delegation/scripts/call_groq.py groq --prompt "$PROMPT" 2>&1) && [ -n "$RESPONSE" ] && [[ ! "$RESPONSE" == *"Error:"* ]]; then
                echo "✅ Groq responded. Handling output..."
                python .rokct/skills/agent_delegation/scripts/handle_groq_output.py --level "$LEVEL" --content "$RESPONSE" ${CARD_FILE:+--file "$CARD_FILE"}
                SUCCESS=true
                HAS_UPDATES=true
              else
                echo "❌ Groq call failed."
                REASON=$(echo "$RESPONSE" | tail -n 1 | sed 's/|/\\|/g')
              fi
            else
              echo "🚀 Delegating to Jules for $TITLE..."
              if RESULT=$(python .rokct/skills/agent_delegation/scripts/call_jules.py create \
                --repo "sources/github/$REPO" \
                --prompt "$PROMPT" \
                --title "$TITLE" 2>&1); then
                echo "✅ Jules delegation successful."
                SESSION_ID=$(echo "$RESULT" | jq -r '.id' 2>/dev/null || echo "—")
                SUCCESS=true
                HAS_UPDATES=true
              else
                echo "❌ Jules delegation failed."
                REASON=$(echo "$RESULT" | tail -n 1 | sed 's/|/\\|/g')
              fi
            fi

            if [ "$SUCCESS" = true ]; then
              mkdir -p .rokct/agent/logs
              echo "| $TIMESTAMP | $TITLE | $AGENT | ✅ SUCCESS | $SESSION_ID | Task processed successfully. |" >> .rokct/agent/logs/ai_delegation.md
              HAS_UPDATES=true

              if [ -n "$CARD_FILE" ] && [ -f "$CARD_FILE" ]; then
                 ID=$(grep '^id:' "$CARD_FILE" | cut -d':' -f2 | xargs)
                 TYPE=$(grep '^type:' "$CARD_FILE" | cut -d':' -f2 | xargs)
                 THEME=$(grep '^theme:' "$CARD_FILE" | cut -d':' -f2 | xargs)
                 STATUS=$(grep '^status:' "$CARD_FILE" | cut -d':' -f2 | xargs)
                 echo "| $ID | $TYPE | $THEME | $STATUS | $AGENT | $SESSION_ID | — | $TIMESTAMP |" >> .rokct/agent/log/ledger.md

                 python .rokct/skills/agent_delegation/scripts/lock_job.py --file "$CARD_FILE" --action release
              fi

              RECURRENCE=$(jq -r '.recurrence // "Once"' "$FILE")
              if [ "$RECURRENCE" == "Daily" ]; then
                NEXT_RUN=$(date -u -d "tomorrow" +"%Y-%m-%dT%H:%M:%SZ")
                jq --arg next "$NEXT_RUN" '.scheduled_at = $next | .immediate = "false"' "$FILE" > tmp.json && mv tmp.json "$FILE"
                HAS_UPDATES=true
              elif [ "$RECURRENCE" == "Once" ]; then
                mkdir -p .rokct/agent/prompts/completed
                mv "$FILE" ".rokct/agent/prompts/completed/$(basename "$FILE")"
                HAS_UPDATES=true
              fi
            else
              ATTEMPTS=0
              if [ -n "$CARD_FILE" ] && [ -f "$CARD_FILE" ]; then
                 ATTEMPTS=$(grep '^attempts:' "$CARD_FILE" | cut -d':' -f2 | xargs || echo "0")
              fi
              NEW_ATTEMPTS=$((ATTEMPTS + 1))
              mkdir -p .rokct/agent/logs
              echo "| $TIMESTAMP | $TITLE | $AGENT | ❌ FAILED | ${{ github.run_id }} | Attempt $NEW_ATTEMPTS. Reason: $REASON |" >> .rokct/agent/logs/ai_delegation.md
              HAS_UPDATES=true

              if [ -n "$CARD_FILE" ] && [ -f "$CARD_FILE" ]; then
                 sed -i "s/^attempts: .*/attempts: $NEW_ATTEMPTS/" "$CARD_FILE"
                 sed -i "s/^last_error: .*/last_error: ${{ github.run_id }} failed at $(date -u)/" "$CARD_FILE"

                 mkdir -p .rokct/agent/log
                 echo "[$TIMESTAMP] Automated | $TITLE | ${{ github.run_id }} | Failure" >> .rokct/agent/log/errors.log

                 if [ "$NEW_ATTEMPTS" -ge 3 ]; then
                   python .rokct/skills/agent_delegation/scripts/update_status.py --file "$CARD_FILE" --status stalled
                 else
                   python .rokct/skills/agent_delegation/scripts/lock_job.py --file "$CARD_FILE" --action release
                 fi
                 HAS_UPDATES=true
              fi
            fi
          done

          echo "HAS_UPDATES=$HAS_UPDATES" >> "$GITHUB_ENV"

      - name: End Protocol
        run: |
          if [ -f ".rokct/end_protocol.py" ]; then
            echo "🧹 Running end_protocol.py..."
            python .rokct/end_protocol.py
          fi

      - name: Commit and Push Updates
        if: env.HAS_UPDATES == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "🤖 [CI] Agent Automation Updates & Ledger [skip ci]" || echo "No changes"
          git push origin main

  agent-cleanup:
    if: |
      inputs.mode == 'cleanup' ||
      (inputs.mode == 'auto' &&
       github.repository == 'RokctAI/factory' &&
       github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Extract Session ID
        id: extract_id
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$BRANCH_NAME" =~ ([0-9]{18,20}) ]]; then
            SESSION_ID="${BASH_REMATCH[1]}"
            echo "session_id=$SESSION_ID" >> "$GITHUB_OUTPUT"
            echo "✅ Found Agent Session ID: $SESSION_ID"
          else
            echo "ℹ️ No Agent Session ID in branch: $BRANCH_NAME"
            exit 0
          fi

      - name: Delete Session
        if: steps.extract_id.outputs.session_id != ''
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          MONOREPO_PAT: ${{ secrets.MONOREPO_PAT }}
          SESSION_ID: ${{ steps.extract_id.outputs.session_id }}
        run: |
          python .rokct/skills/agent_delegation/scripts/call_jules.py delete \
            --id "$SESSION_ID"

      - name: Update Agent Memory
        if: steps.extract_id.outputs.session_id != ''
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          DATE=$(date +'%Y-%m-%d')
          mkdir -p .rokct/agent/log
          echo "* **[$DATE]** - Completed Agent Task: $PR_TITLE ($PR_URL)" >> .rokct/agent/log/memory.md

      - name: Commit Knowledge Updates
        if: steps.extract_id.outputs.session_id != ''
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .rokct/agent/log/memory.md
          git commit -m "🤖 chore: sync agent memory after PR merge [skip ci]" || echo "No changes to commit"
          git push origin main

  agent-scheduler:
    if: |
      inputs.mode == 'scheduler' ||
      (inputs.mode == 'auto' &&
       github.repository == 'RokctAI/factory' &&
       (github.event_name == 'schedule' && github.event.schedule == '*/30 * * * *'))
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: pip install PyYAML

      - name: Update Session State
        run: python .rokct/skills/agent_delegation/scripts/manage_sessions.py

      - name: Commit State Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .rokct/agent/session_state.md
          if git diff --staged --quiet; then
            echo "No state changes."
          else
            git commit -m "chore: update session state [skip ci]"
            git push origin main
          fi

  agent-ledger:
    if: |
      inputs.mode == 'ledger' ||
      (inputs.mode == 'auto' &&
       github.event_name == 'workflow_call')
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: Append to Ledger
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M")
          PR_VALUE="${{ inputs.ledger_pr }}"
          if [ -z "$PR_VALUE" ]; then PR_VALUE="—"; fi
          echo "| ${{ inputs.ledger_id }} | ${{ inputs.ledger_type }} | ${{ inputs.ledger_theme }} | ${{ inputs.ledger_status }} | ${{ inputs.ledger_agent }} | ${{ inputs.ledger_session }} | $PR_VALUE | $TIMESTAMP |" >> .rokct/agent/log/ledger.md

      - name: Commit Ledger Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .rokct/agent/log/ledger.md
          git commit -m "chore: update ledger for ${{ inputs.ledger_id }} [skip ci]" || exit 0
          git push origin main

  # ─────────────────────────────────────────────
  # NEW: PROTOCOL AGENT MODES
  # ─────────────────────────────────────────────

  idea-session:
    if: |
      inputs.mode == 'idea-session' ||
      (inputs.mode == 'auto' &&
       github.repository == 'RokctAI/the-rokct-protocol' &&
       (github.event_name == 'schedule' && github.event.schedule == '0 20 1 * *'))
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Check if queue and running are empty
        id: check_empty
        run: |
          QUEUE=$(find .rokct/agent/queue -maxdepth 1 -name "*.json" 2>/dev/null | wc -l)
          RUNNING=$(find .rokct/agent/running -maxdepth 1 -name "*.json" 2>/dev/null | wc -l)
          echo "queue=$QUEUE" >> "$GITHUB_OUTPUT"
          echo "running=$RUNNING" >> "$GITHUB_OUTPUT"
          if [ "$QUEUE" -eq 0 ] && [ "$RUNNING" -eq 0 ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Call Jules — Idea Session
        if: steps.check_empty.outputs.empty == 'true'
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          PROMPT="Read and follow The-Rokct-Protocol/workflows/start_session.md first.
          For the session:
          - Name: Protocol Idea Session
          - Mode: Planning
          - Agent: Jules
          - Workspace: FALSE
          Do not ask questions — use the values above directly.
          Then read and follow the instructions in .rokct/agent/idea_prompt.md exactly."

          python .rokct/skills/agent_delegation/scripts/delegate_to_agent.py create \
            --repo "sources/github/RokctAI/the-rokct-protocol" \
            --prompt "$PROMPT" \
            --branch "main" \
            --title "Protocol: Idea Session" \
            --automation-mode "AUTO_CREATE_PR"

  process-queue:
    if: |
      inputs.mode == 'process-queue' ||
      (inputs.mode == 'auto' &&
       github.repository == 'RokctAI/the-rokct-protocol' &&
       (github.event_name == 'schedule' && github.event.schedule == '0 21 * * 0'))
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Process Protocol Queue
        run: |
          mkdir -p .rokct/agent/rejected
          mkdir -p .rokct/agent/running
          mkdir -p .rokct/agent/log
          LEDGER_FILE="$LEDGER"
          [ -f "$LEDGER_FILE" ] || echo "[]" > "$LEDGER_FILE"

          HAS_UPDATES=false
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M")

          # ── Reject low-rated ideas ──
          for FILE in $(ls .rokct/agent/queue/*.json 2>/dev/null || true); do
            RATING=$(jq -r '.rating // 10' "$FILE")
            if [ "$RATING" -lt 4 ]; then
              echo "🗑️ Rejecting $(basename "$FILE") — rated $RATING/10"
              jq 'del(.rating)' "$FILE" > ".rokct/agent/rejected/$(basename "$FILE")"
              rm "$FILE"
              HAS_UPDATES=true
            fi
          done

          # ── Move queue to running ──
          RUNNING=$(find .rokct/agent/running -maxdepth 1 -name "*.json" 2>/dev/null | wc -l)
          SLOTS=$(( 4 - RUNNING ))
          echo "🔢 Available slots: $SLOTS"

          if [ "$SLOTS" -gt 0 ]; then
            COUNT=0
            for FILE in $(ls .rokct/agent/queue/*.json 2>/dev/null || true); do
              if [ "$COUNT" -ge "$SLOTS" ]; then break; fi

              NUMBER=${{ github.run_number }}_$(( COUNT + 1 ))
              BASENAME=$(basename "$FILE" .json)
              NEWNAME="${BASENAME}_${NUMBER}.json"

              echo "📦 Moving $BASENAME → running/$NEWNAME"
              mv "$FILE" ".rokct/agent/running/$NEWNAME"
              TITLE=$(jq -r '.title' ".rokct/agent/running/$NEWNAME")

              # 1. Update JSON ledger
              jq --arg number "$NUMBER" \
                 --arg file "$NEWNAME" \
                 --arg title "$TITLE" \
                 '. += [{
                    "number": $number,
                    "file": $file,
                    "title": $title,
                    "session_id": null,
                    "branch": null,
                    "approved": false,
                    "published": false,
                    "merged": false
                 }]' "$LEDGER_FILE" > tmp.json && mv tmp.json "$LEDGER_FILE"

              # 2. Update MD ledger
              echo "| $NUMBER | protocol | $TITLE | running | jules | — | — | $TIMESTAMP |" >> .rokct/agent/log/ledger.md

              COUNT=$(( COUNT + 1 ))
              HAS_UPDATES=true
            done
          fi

          echo "has_updates=$HAS_UPDATES" >> "$GITHUB_ENV"

      - name: Commit changes
        if: env.has_updates == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "🤖 [CI] Process Queue — Reject low-rated, move to running/ [skip ci]"
          git pull --rebase origin main
          git push origin main

  protocol-delegation:
    needs: process-queue
    if: |
      always() &&
      (needs.process-queue.result == 'success' || needs.process-queue.result == 'skipped') &&
      (inputs.mode == 'protocol-delegation' ||
       (inputs.mode == 'auto' &&
        github.repository == 'RokctAI/the-rokct-protocol' &&
        (github.event_name == 'schedule' && github.event.schedule == '0 21 * * 0')))
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Check ledger and delegate
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          LEDGER_FILE="$LEDGER"
          [ -f "$LEDGER_FILE" ] || { echo "ℹ️ No ledger found."; exit 0; }

          LAST=$(jq '.[-1]' "$LEDGER_FILE")
          LAST_MERGED=$(echo "$LAST" | jq -r '.merged // empty')
          NEXT=$(jq '[.[] | select(.session_id == null)] | first' "$LEDGER_FILE")

          if [ "$NEXT" == "null" ] || [ -z "$NEXT" ]; then
            if [ "$LAST_MERGED" != "true" ] && [ -n "$LAST_MERGED" ]; then
              echo "⏳ Waiting for current entry to be merged before delegating next."
              exit 0
            fi
            echo "ℹ️ No unstarted entries in ledger."
            exit 0
          fi

          NUMBER=$(echo "$NEXT" | jq -r '.number')
          FILE=$(echo "$NEXT" | jq -r '.file')
          TITLE=$(echo "$NEXT" | jq -r '.title')
          TASK_PROMPT=$(jq -r '.prompt' ".rokct/agent/running/$FILE")
          PROMPT="Read and follow The-Rokct-Protocol/workflows/start_session.md first.
          For the session:
          - Name: $TITLE
          - Mode: Building
          - Agent: Jules
          - Workspace: FALSE
          Do not ask questions — use the values above directly.
          Then proceed with the following task:

          $TASK_PROMPT"

          echo "🚀 Delegating: $TITLE (#$NUMBER)"

          RESULT=$(python .rokct/skills/agent_delegation/scripts/delegate_to_agent.py create \
            --repo "sources/github/RokctAI/the-rokct-protocol" \
            --prompt "$PROMPT" \
            --branch "main" \
            --title "Protocol: $TITLE" \
            --automation-mode "AUTO_CREATE_PR")

          SESSION_ID=$(echo "$RESULT" | jq -r '.name // .id // empty' | sed 's|.*/||')

          if [ -z "$SESSION_ID" ]; then
            echo "❌ Could not extract session ID from response."
            exit 1
          fi

          echo "✅ Session ID: $SESSION_ID"

          # 1. Update JSON ledger
          jq --arg number "$NUMBER" \
             --arg session "$SESSION_ID" \
             'map(if .number == $number then .session_id = $session else . end)' \
             "$LEDGER_FILE" > tmp.json && mv tmp.json "$LEDGER_FILE"

          # 2. Update MD ledger (Replace session column)
          sed -i "s/| $NUMBER | protocol | $TITLE | running | jules | — /| $NUMBER | protocol | $TITLE | running | jules | $SESSION_ID /" .rokct/agent/log/ledger.md

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "🤖 [CI] Delegated #$NUMBER to Jules (session: $SESSION_ID) [skip ci]"
          git pull --rebase origin main
          git push origin main

  protocol-review:
    if: |
      inputs.mode == 'protocol-review' ||
      (inputs.mode == 'auto' &&
       github.repository == 'RokctAI/the-rokct-protocol' &&
       (github.event_name == 'schedule' && github.event.schedule == '0 22 * * 0'))
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Review pending entries
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LEDGER_FILE="$LEDGER"
          [ -f "$LEDGER_FILE" ] || { echo "ℹ️ No ledger."; exit 0; }

          PENDING=$(jq '[.[] | select(.session_id != null and .approved == false)]' "$LEDGER_FILE")
          COUNT=$(echo "$PENDING" | jq 'length')

          if [ "$COUNT" -eq 0 ]; then
            echo "ℹ️ No entries pending review."
            exit 0
          fi

          HAS_UPDATES=false

          echo "$PENDING" | jq -c '.[]' | while read -r ENTRY; do
            NUMBER=$(echo "$ENTRY" | jq -r '.number')
            SESSION_ID=$(echo "$ENTRY" | jq -r '.session_id')
            TITLE=$(echo "$ENTRY" | jq -r '.title')

            echo "🔍 Reviewing #$NUMBER: $TITLE (session: $SESSION_ID)"

            STATUS=$(python .rokct/skills/agent_delegation/scripts/delegate_to_agent.py status \
              --id "$SESSION_ID" 2>/dev/null || echo "{}")

            BRANCH=$(echo "$STATUS" | jq -r '.sourceContext.githubRepoContext.startingBranch // empty')
            PR_BRANCH=$(echo "$STATUS" | jq -r '.pullRequestBranch // .branch // empty')
            REVIEW_BRANCH="${PR_BRANCH:-$BRANCH}"

            if [ -z "$REVIEW_BRANCH" ]; then
              echo "⚠️ Could not determine branch for #$NUMBER. Skipping."
              continue
            fi

            # Update ledger with branch if not set
            jq --arg number "$NUMBER" \
               --arg branch "$REVIEW_BRANCH" \
               'map(if .number == $number and .branch == null then .branch = $branch else . end)' \
               "$LEDGER_FILE" > tmp.json && mv tmp.json "$LEDGER_FILE"

            REVIEW_PROMPT="You are a protocol reviewer. Your job is to review changes on branch '$REVIEW_BRANCH' in the Rokct Protocol repo.

            1. Read the diff between '$REVIEW_BRANCH' and main carefully.
            2. Check that the changes:
               - Do not regress existing protocol rules
               - Are consistent with the protocol's existing style and structure
               - Actually implement what was proposed (read .rokct/agent/running/ for the original prompt)
               - Do not introduce conflicts with other protocol files
            3. If satisfied → output exactly: APPROVED
            4. If not satisfied → output exactly: REJECTED and explain why."

            python .rokct/skills/agent_delegation/scripts/delegate_to_agent.py create \
              --repo "sources/github/RokctAI/the-rokct-protocol" \
              --prompt "$REVIEW_PROMPT" \
              --branch "$REVIEW_BRANCH" \
              --title "Review: $TITLE" \
              --automation-mode "SUGGEST_CHANGES" 2>/dev/null || true

            echo "✅ Review submitted for #$NUMBER"

            jq --arg number "$NUMBER" \
               'map(if .number == $number then .approved = true | .reviewed_at = now | todate else . end)' \
               "$LEDGER_FILE" > tmp.json && mv tmp.json "$LEDGER_FILE"

            # Update MD ledger status to approved
            sed -i "s/| $NUMBER | protocol | $TITLE | running /| $NUMBER | protocol | $TITLE | approved /" .rokct/agent/log/ledger.md

            HAS_UPDATES=true
          done

          if [ "$HAS_UPDATES" == "true" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "🤖 [CI] Review completed — ledger updated [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

  protocol-publisher:
    if: |
      inputs.mode == 'protocol-publisher' ||
      (inputs.mode == 'auto' &&
       github.repository == 'RokctAI/the-rokct-protocol' &&
       (github.event_name == 'schedule' && github.event.schedule == '0 23 * * 0'))
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish approved PRs and detect merges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LEDGER_FILE="$LEDGER"
          [ -f "$LEDGER_FILE" ] || { echo "ℹ️ No ledger."; exit 0; }

          HAS_UPDATES=false

          # ── Publish approved, unpublished entries ──
          jq -c '.[] | select(.approved == true and .published == false)' "$LEDGER_FILE" | while read -r ENTRY; do
            NUMBER=$(echo "$ENTRY" | jq -r '.number')
            BRANCH=$(echo "$ENTRY" | jq -r '.branch')
            TITLE=$(echo "$ENTRY" | jq -r '.title')

            echo "📬 Publishing PR for #$NUMBER: $TITLE (branch: $BRANCH)"

            PR=$(curl -sf -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/RokctAI/the-rokct-protocol/pulls?head=RokctAI:$BRANCH&state=open" \
              | jq '.[0]')

            PR_NUMBER=$(echo "$PR" | jq -r '.number // empty')
            IS_DRAFT=$(echo "$PR" | jq -r '.draft // false')

            if [ -z "$PR_NUMBER" ]; then
              echo "⚠️ No open PR found for branch $BRANCH. Skipping."
              continue
            fi

            if [ "$IS_DRAFT" == "true" ]; then
              curl -sf -X PATCH \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Content-Type: application/json" \
                -d '{"draft": false}' \
                "https://api.github.com/repos/RokctAI/the-rokct-protocol/pulls/$PR_NUMBER"
              echo "✅ PR #$PR_NUMBER published."
            fi

            jq --arg number "$NUMBER" \
               --arg pr "$PR_NUMBER" \
               'map(if .number == $number then .published = true | .pr_number = ($pr | tonumber) else . end)' \
               "$LEDGER_FILE" > tmp.json && mv tmp.json "$LEDGER_FILE"

            # Update MD ledger status to published
            sed -i "s/| $NUMBER | protocol | $TITLE | approved /| $NUMBER | protocol | $TITLE | published /" .rokct/agent/log/ledger.md
            # Fill the PR column
            sed -i "s/| $NUMBER | protocol | $TITLE | published | jules | \([a-zA-Z0-9_-]\{1,\}\) | — /| $NUMBER | protocol | $TITLE | published | jules | \1 | PR#$PR_NUMBER /" .rokct/agent/log/ledger.md

            HAS_UPDATES=true
          done

          # ── Detect merged PRs ──
          jq -c '.[] | select(.published == true and .merged == false)' "$LEDGER_FILE" | while read -r ENTRY; do
            NUMBER=$(echo "$ENTRY" | jq -r '.number')
            PR_NUMBER=$(echo "$ENTRY" | jq -r '.pr_number // empty')
            FILE=$(echo "$ENTRY" | jq -r '.file')
            TITLE=$(echo "$ENTRY" | jq -r '.title')

            [ -z "$PR_NUMBER" ] && continue

            PR_STATE=$(curl -sf -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/RokctAI/the-rokct-protocol/pulls/$PR_NUMBER" \
              | jq -r '.merged // false')

            if [ "$PR_STATE" == "true" ]; then
              echo "🎉 PR #$PR_NUMBER merged! Completing #$NUMBER."

              mkdir -p .rokct/agent/completed
              [ -f ".rokct/agent/running/$FILE" ] && \
                mv ".rokct/agent/running/$FILE" ".rokct/agent/completed/$FILE"

              jq --arg number "$NUMBER" \
                 'map(if .number == $number then .merged = true | .merged_at = now | todate else . end)' \
                 "$LEDGER_FILE" > tmp.json && mv tmp.json "$LEDGER_FILE"

              # Update MD ledger status to merged
              sed -i "s/| $NUMBER | protocol | $TITLE | published /| $NUMBER | protocol | $TITLE | merged /" .rokct/agent/log/ledger.md

              HAS_UPDATES=true
            fi
          done

          if [ "$HAS_UPDATES" == "true" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "🤖 [CI] Publisher — PRs published/merged, ledger updated [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
