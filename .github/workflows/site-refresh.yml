# Weekly Site Refresh
#
# The Next.js site shells deploy on Vercel from what is COMMITTED: the SDK
# pins in .rokct/lock.json and the vendored .rokct/cache/. The Monday SDK
# poller (sdk-bump-poller.yml) rebuilds the Flutter shells but cannot move a
# site, so this robot does it, every Monday after the poller:
#
#   1. discover  every active, non-fork RokctAI repo with scripts/compose.sh,
#                .rokct/lock.json and a package.json that depends on next
#                (no hardcoded list; frappenize/* and archived repos never).
#   2. refresh   per shell: run the shell's own `scripts/compose.sh refresh`
#                (MONOREPO_PAT reads the private SDK repos), keep only what
#                that refresh says to commit (install_state.json and bytecode
#                are never committed), and prove the result composes OFFLINE
#                from the committed cache with zero drift. If something moved,
#                push the robot's own branch `rokct/site-refresh` (append-only,
#                main merged in, never force-pushed) and keep ONE PR per site,
#                titled "Refresh site building blocks", with a Before/After
#                table of the SDK versions.
#   3. merge     ONLY on green (scripts/site-refresh/publish.sh):
#                - repo REQUIRES the "Compose Offline + Build (Vercel parity)"
#                  check and allows auto-merge -> PR opened ready, GitHub
#                  auto-merge armed (GitHub waits for the required checks).
#                - otherwise (today: every shell; none protects main) -> the
#                  PR is a DRAFT, which GitHub will not merge or auto-merge,
#                  so neither this robot nor a shell's merge.yml (which arms
#                  auto-merge on any ready PR, and with no required checks
#                  that merges at once) can merge it early. The robot waits
#                  for the shell's build.yml run on the PR's exact head
#                  commit; only when that run AND its parity job succeeded
#                  does it mark the PR ready and merge it, pinned to that
#                  commit. A red build is never merged.
#   4. health    after the refresh, the site-shots health gate (real
#                Chromium; HTTP 200, no console errors, no broken images,
#                a <main>, a hero heading, not blank) runs against each
#                site's LIVE URL (.rokct/showcase.json url, else the repo
#                homepage). Sites with a showcase card but no compose shell
#                are checked too.
#   5. report    one table in the run summary, and ONE live issue per site
#                and failure kind in RokctAI/platformstack, in the Flutter
#                builds' central-report format, labels and dedupe:
#                "<repo>: site refresh failed" (build-failure) and
#                "<repo>: live site unhealthy" (site-health), commented while
#                still failing and closed automatically on recovery.
#
# dry_run: discovery, refresh and the offline zero-drift proof run for real;
# nothing is pushed, no PR is opened or merged, no issue is touched (the
# health check still runs; it only reads public pages).
#
# Runs on this PUBLIC repo for free Actions minutes; MONOREPO_PAT does the
# cross-repo work, as in sdk-bump-poller.yml and showcase-announce.yml.

name: Weekly Site Refresh

on:
  schedule:
    # Mondays 12:00 UTC: after the 05:00 SDK poller, whose staged builds can
    # take up to its 6 h timeout.
    - cron: '0 12 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Refresh and prove locally, but push nothing, open/merge no PR, file no issue'
        required: false
        type: boolean
        default: false
      repo:
        description: 'Only this site repo (name or RokctAI/name); empty = every site'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: site-refresh
  cancel-in-progress: false

env:
  ORG: RokctAI
  CENTRAL_REPO: RokctAI/platformstack
  REFRESH_BRANCH: rokct/site-refresh
  DRY_RUN: ${{ inputs.dry_run == true }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  discover:
    name: Discover sites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      run: ${{ steps.guard.outputs.run }}
      shells: ${{ steps.find.outputs.shells }}
      sites: ${{ steps.find.outputs.sites }}
    steps:
      - name: Check MONOREPO_PAT availability
        id: guard
        env:
          TOKEN: ${{ secrets.MONOREPO_PAT }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::MONOREPO_PAT is not available; nothing to do."
            {
              echo "## Weekly site refresh"
              echo ""
              echo "\`MONOREPO_PAT\` is not available, so this run did nothing."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Find the site shells and live sites
        id: find
        if: steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_PAT }}
          ONLY_REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          bash scripts/site-refresh/discover.sh "$RUNNER_TEMP/shells.json" "$RUNNER_TEMP/sites.json" "$RUNNER_TEMP/skipped.tsv"
          {
            echo "shells=$(cat "$RUNNER_TEMP/shells.json")"
            echo "sites=$(cat "$RUNNER_TEMP/sites.json")"
          } >> "$GITHUB_OUTPUT"

  refresh:
    name: Refresh ${{ matrix.site.repo }}
    needs: discover
    if: needs.discover.outputs.run == 'true' && needs.discover.outputs.shells != '[]'
    runs-on: ubuntu-latest
    # Refresh + offline proof take minutes; waiting for the PR build to go
    # green (WAIT_MINUTES) is most of this.
    timeout-minutes: 130
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        site: ${{ fromJSON(needs.discover.outputs.shells) }}
    env:
      REPO: RokctAI/${{ matrix.site.repo }}
      BASE: ${{ matrix.site.branch }}
      RESULT_DIR: ${{ github.workspace }}/results/refresh-${{ matrix.site.repo }}
    steps:
      - name: Checkout shared-workflows (scripts)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: sw
          persist-credentials: false

      - name: Checkout ${{ matrix.site.repo }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.REPO }}
          ref: ${{ matrix.site.branch }}
          token: ${{ secrets.MONOREPO_PAT }}
          path: site
          fetch-depth: 1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      # Only shells whose lockfile is pnpm-lock.yaml need pnpm (their
      # compose.sh refresh re-resolves it when a dependency changed).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: hashFiles('site/pnpm-lock.yaml') != ''
        with:
          version: 9

      - name: Refresh the pins and prove them offline
        env:
          MONOREPO_PAT: ${{ secrets.MONOREPO_PAT }}
        run: bash sw/scripts/site-refresh/refresh.sh site "$RESULT_DIR"

      - name: Push, open or update the PR, merge only on green
        if: hashFiles(format('results/refresh-{0}/candidate', matrix.site.repo)) != ''
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_PAT }}
          BRANCH: ${{ env.REFRESH_BRANCH }}
          WAIT_MINUTES: '100'
        run: bash sw/scripts/site-refresh/publish.sh site "$RESULT_DIR"

      - name: Record the result
        if: always()
        env:
          SITE: ${{ matrix.site.repo }}
        run: |
          mkdir -p "$RESULT_DIR"
          if [ ! -s "$RESULT_DIR/status" ]; then
            echo failed > "$RESULT_DIR/status"
            echo "the job stopped before a result was recorded; see the job log" > "$RESULT_DIR/detail"
          fi
          # Public repo: artifacts are downloadable. The raw compose logs are
          # already in this job's (masked) log, so they are not uploaded.
          rm -f "$RESULT_DIR/repo.json" "$RESULT_DIR/refresh.log" "$RESULT_DIR/verify.log"
          STATUS="$(cat "$RESULT_DIR/status")"
          echo "$SITE: $STATUS - $(cat "$RESULT_DIR/detail" 2>/dev/null || true)"
          {
            echo "## $SITE: $STATUS"
            echo ""
            cat "$RESULT_DIR/detail" 2>/dev/null || true
            if [ -s "$RESULT_DIR/versions.md" ]; then echo ""; cat "$RESULT_DIR/versions.md"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: site-refresh-${{ matrix.site.repo }}
          path: results/
          retention-days: 30

      # A failed refresh shows as a red leg (after its result is uploaded).
      - name: Fail the leg when the refresh failed
        run: |
          if [ "$(cat "$RESULT_DIR/status")" = "failed" ]; then
            echo "::error::$(cat "$RESULT_DIR/detail")"
            exit 1
          fi

  health:
    name: Live health ${{ matrix.site.repo }}
    needs: [discover, refresh]
    # After the refresh, whether or not any refresh failed or was skipped.
    if: always() && needs.discover.outputs.run == 'true' && needs.discover.outputs.sites != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        site: ${{ fromJSON(needs.discover.outputs.sites) }}
    env:
      PLAYWRIGHT_VERSION: '1.56.1'
      SHARP_VERSION: '0.34.5'
      RESULT_DIR: ${{ github.workspace }}/results/health-${{ matrix.site.repo }}
      SITE_URL: ${{ matrix.site.url }}
    steps:
      - name: Checkout shared-workflows (scripts)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: matrix.site.url != ''
        with:
          node-version: '24'

      - name: Install the browser (Playwright Chromium and sharp)
        if: matrix.site.url != ''
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/health-tools"
          cd "$RUNNER_TEMP/health-tools"
          echo '{"name":"health-tools","private":true}' > package.json
          npm install --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION" "sharp@$SHARP_VERSION"
          npx playwright install --with-deps chromium

      - name: Check the live site
        run: |
          mkdir -p "$RESULT_DIR"
          printf '%s\n' "$SITE_URL" > "$RESULT_DIR/url"
          if [ -z "$SITE_URL" ]; then
            echo no-url > "$RESULT_DIR/status"
            exit 0
          fi
          set +e
          HEALTH_URL="$SITE_URL" HEALTH_OUT="$RESULT_DIR" HEALTH_TOOLS="$RUNNER_TEMP/health-tools" \
            node scripts/site-refresh/site-health.mjs
          RC=$?
          set -e
          case "$RC" in
            0) echo healthy > "$RESULT_DIR/status" ;;
            1) echo unhealthy > "$RESULT_DIR/status" ;;
            *) echo error > "$RESULT_DIR/status"; echo "health check exited $RC" > "$RESULT_DIR/detail" ;;
          esac
          echo "$SITE_URL: $(cat "$RESULT_DIR/status")"

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: site-health-${{ matrix.site.repo }}
          path: results/
          retention-days: 30

  report:
    name: Run summary and central issues
    needs: [discover, refresh, health]
    if: always() && needs.discover.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout shared-workflows (scripts)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download results
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: site-*
          path: results
          merge-multiple: true
        continue-on-error: true

      - name: Mark refresh legs that left no result
        env:
          SHELLS: ${{ needs.discover.outputs.shells }}
        run: |
          mkdir -p results
          for R in $(jq -r '.[].repo' <<< "${SHELLS:-[]}"); do
            if [ ! -s "results/refresh-$R/status" ]; then
              mkdir -p "results/refresh-$R"
              echo failed > "results/refresh-$R/status"
              echo "the refresh job left no result (cancelled or timed out?)" > "results/refresh-$R/detail"
            fi
          done

      - name: Summarize and keep the platformstack issues current
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_PAT }}
        run: bash scripts/site-refresh/report.sh results
