# Copyright 2024 RokctAI

name: Frappe App Test

permissions: write-all
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PIP_BREAK_SYSTEM_PACKAGES: 1
on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: '3.14.2'
      db-password:
        required: false
        type: string
        default: 'travis'
      mariadb-version:
        required: false
        type: string
        default: '10.6'
      postgres-version:
        required: false
        type: string
        default: '16'
      db-type:
        required: false
        type: string
        default: 'mariadb'
        description: "Database type: 'mariadb' or 'postgres'"
      redis-version:
        required: false
        type: string
        default: '6.0'
      node-version:
        required: false
        type: string
        default: '24'
      install-erpnext:
        required: false
        type: boolean
        default: false
      install-rpanel:
        required: false
        type: boolean
        default: false
      install-payments:
        required: false
        type: boolean
        default: false
      bootstrap:
        required: false
        type: boolean
        default: false
      rpanel-db-version:
        required: false
        type: string
        default: '2.4.8'
        description: "Tag of the rpanel-db image to use for PostgreSQL CI (e.g. 2.4.8). Use a pinned stable tag — :latest may not exist."

    secrets:
      COUNTER_API_KEY:
        required: false
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false
      MONOREPO_PAT:
        required: false
      DB_ROOT_PASSWORD:
        required: false
      DB_PW:
        required: false


jobs:
  # --- 0. TELEMETRY (Usage Tracking) ---
  telemetry:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Track Usage (CounterAPI)
        env:
          API_KEY: ${{ secrets.COUNTER_API_KEY }}
        if: env.API_KEY != ''
        run: |
          curl -X GET "https://api.counterapi.dev/v2/rokctai/usage/up" \
          -H "Authorization: Bearer $API_KEY"

  test:
    needs: telemetry
    permissions: write-all
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
      options: --user root -v /var/run/docker.sock:/var/run/docker.sock
    timeout-minutes: 60
    env:
      DB_PW: ${{ secrets.DB_ROOT_PASSWORD || inputs.db-password }}

    services:
      redis:
        image: redis:${{ inputs.redis-version }}
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=2s --health-retries=5

    steps:
      - name: System Essentials
        run: |
          apt-get update && apt-get install -y sudo git curl wget ca-certificates gnupg2
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          . /etc/os-release
          echo "deb http://apt.postgresql.org/pub/repos/apt/ ${VERSION_CODENAME}-pgdg main" > /etc/apt/sources.list.d/pgdg.list
          apt-get update && apt-get install -y sudo git curl wget redis-server wkhtmltopdf mariadb-client postgresql-client ca-certificates procps gnupg2 build-essential pkg-config libmariadb-dev libpq-dev cron
          # Install Docker CLI to support Docker commands from within the container
          curl -fsSL https://get.docker.com | sh

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.MONOREPO_PAT || github.token }}

      - uses: actions/checkout@v6
      - name: Fetch and Merge Private Repository
        shell: bash
        run: |
          if [ -f ".private_repo" ]; then
            REPO_NAME=$(tr -d '\r\n[:space:]' < .private_repo)
            if [ -n "$REPO_NAME" ]; then
              echo "Private repository configured: $REPO_NAME"
              TOKEN="${{ secrets.MONOREPO_PAT || github.token }}"
              URL="https://x-access-token:${TOKEN}@github.com/${REPO_NAME}.git"
              if git clone --depth 1 "$URL" .private-temp; then
                echo "Excluding private files from git tracking..."
                mkdir -p .git/info
                (cd .private-temp && find . -type f) | sed 's|^\./||' >> .git/info/exclude
                echo "Merging private files..."
                rm -rf .private-temp/.git .private-temp/.github
                rsync -a .private-temp/ ./
                rm -rf .private-temp
              else
                echo "::warning::Failed to clone private repository $REPO_NAME."
              fi
            fi
          fi
      - name: Debug Secret Presence
        run: |
          if [ -n "${{ secrets.APP_ID }}" ]; then echo "✅ APP_ID reached this workflow."; else echo "❌ APP_ID is MISSING."; fi
          if [ -n "${{ secrets.APP_PRIVATE_KEY }}" ]; then echo "✅ APP_PRIVATE_KEY reached this workflow."; else echo "❌ APP_PRIVATE_KEY is MISSING."; fi

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        continue-on-error: true
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Start Database Service
        if: inputs.bootstrap == false
        run: |
          # Auto-detect GHA runner container network
          GHA_NET=""
          if [ -f /var/run/docker.sock ] || docker ps >/dev/null 2>&1; then
             MY_CONTAINER_ID=$(hostname)
             GHA_NET=$(docker inspect "$MY_CONTAINER_ID" -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}' 2>/dev/null || echo "")
          fi

          if [ -n "$GHA_NET" ]; then
             echo "Detected GHA runner network: $GHA_NET"
             DB_NET="$GHA_NET"
          else
             echo "Fallback to default bridge network"
             docker network create rokct-net || true
             DB_NET="rokct-net"
          fi

          if [ "${{ inputs.db-type }}" = "mariadb" ]; then
             echo "Starting MariaDB..."
             docker run -d --name db-service --network "$DB_NET" -p 3306:3306 -e MARIADB_ROOT_PASSWORD="${{ env.DB_PW }}" mariadb:${{ inputs.mariadb-version }}

             # Standard Probe (db-service or localhost fallback)
             timeout 15s bash -c "until mariadb-admin -h db-service -u root -p${{ env.DB_PW }} ping --silent || mariadb-admin -h 127.0.0.1 -u root -p${{ env.DB_PW }} ping --silent; do sleep 1; done"

             if mariadb-admin -h db-service -u root -p${{ env.DB_PW }} ping --silent >/dev/null 2>&1; then
                 DB_HOST="db-service"
             else
                 DB_HOST="127.0.0.1"
             fi
             echo "DB_HOST=$DB_HOST" >> "$GITHUB_ENV"
             echo "✅ MariaDB ready on $DB_HOST"
          else
              echo "Starting PostgreSQL..."
              # rpanel-db:latest is always available — the rollback job explicitly excludes
              # the DB image so :latest is never accidentally deleted on upgrade test failures.
              DB_IMAGE="ghcr.io/rokctai/occultation/rpanel-db:latest"
              echo "Logging into GHCR..."
              echo "${{ secrets.MONOREPO_PAT || github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
              echo "Pulling $DB_IMAGE..."
              docker pull "$DB_IMAGE"

              docker run -d --name db-service --network "$DB_NET" -p 5432:5432 -e POSTGRES_PASSWORD="${{ env.DB_PW }}" -e POSTGRES_USER=postgres "$DB_IMAGE"

              # Standard Probe (db-service or localhost fallback)
              timeout 15s bash -c 'until pg_isready -h db-service -U postgres || pg_isready -h 127.0.0.1 -U postgres; do sleep 1; done'

              if pg_isready -h db-service -U postgres >/dev/null 2>&1; then
                  TARGET_HOST="db-service"
              else
                  TARGET_HOST="127.0.0.1"
              fi
              echo "DB_HOST=$TARGET_HOST" >> "$GITHUB_ENV"

              # Ensure critical extensions are active
              echo "Initializing PostgreSQL extensions (vector, cube, earthdistance) on $TARGET_HOST..."
              export PGPASSWORD="${{ env.DB_PW }}"
              psql -h "$TARGET_HOST" -U postgres -d template1 -c "CREATE EXTENSION IF NOT EXISTS vector;"
              psql -h "$TARGET_HOST" -U postgres -d template1 -c "CREATE EXTENSION IF NOT EXISTS cube;"
              psql -h "$TARGET_HOST" -U postgres -d template1 -c "CREATE EXTENSION IF NOT EXISTS earthdistance;"
              echo "✅ PostgreSQL ready on $TARGET_HOST"
          fi

      - name: Install Runtime Toolchains (Python & Node)
        run: |
          # 1. Install Python
          apt-get install -y software-properties-common
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update
          
          # Parse version (e.g. 3.14.2 -> 3.14)
          INPUT_VER="${{ inputs.python-version }}"
          PY_VER=$(echo "${INPUT_VER:-3.14}" | cut -d. -f1,2)
          echo "Installing Python $PY_VER..."
          
          apt-get install -y "python${PY_VER}" "python${PY_VER}-venv" "python${PY_VER}-dev"
          
          # Symlink python & python3 to our custom version
          ln -sf "/usr/bin/python${PY_VER}" /usr/bin/python3
          ln -sf "/usr/bin/python${PY_VER}" /usr/bin/python
          
          # Install pip for this specific Python version
          curl -sS https://bootstrap.pypa.io/get-pip.py | python3
          
          # 2. Install Node.js
          curl -fsSL https://deb.nodesource.com/setup_${{ inputs.node-version }}.x | bash -
          apt-get install -y nodejs

      - name: Cache Python Pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ inputs.python-version }}-

      - name: Cache Node/Yarn
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/yarn
          key: node-yarn-${{ runner.os }}-${{ inputs.node-version }}-${{ hashFiles('**/package.json', '**/yarn.lock') }}
          restore-keys: |
            node-yarn-${{ runner.os }}-${{ inputs.node-version }}-

      - name: Install System Dependencies
        run: |
          # Packages already installed in System Essentials: wkhtmltopdf, mariadb-client, postgresql-client
          echo "System dependencies already satisfied in previous steps."

      - name: Checkout Occultation for Overrides
        if: inputs.bootstrap == true
        # Graceful Skip: Don't fail if Occultation is inaccessible (e.g. Forks or Token errors)
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: RokctAI/Occultation
          path: occultation_overrides
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Setup CI Identity & Services 🔐⚙️
        run: |
          # 1. Setup Global Git Config for Private Repos (HTTPS + Token)
          # This ensures that even nested dependencies (bench get-app) in install.sh use the token
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token || github.token }}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token || github.token }}@github.com/".insteadOf "https://github.com/"
          echo "✅ Global Git config updated for authenticated HTTPS fetching."

          # 2. Manual Redis Startup (Bypassing Supervisor failures in CI)
          echo "Starting Redis instances manually..."
          apt-get install -y -qq redis-server
          redis-server --port 11000 --daemonize yes # Queue
          redis-server --port 12000 --daemonize yes # Socketio
          redis-server --port 13000 --daemonize yes # Cache
          
          # Wait for Redis to be ready
          for port in 11000 12000 13000; do
             while ! command -v nc >/dev/null || ! nc -z localhost $port; do
                if ! command -v nc >/dev/null; then
                   apt-get install -y -qq netcat-openbsd
                fi
                echo "Waiting for Redis on $port..."
                sleep 1
             done
             echo "Redis is up on $port"
          done
          echo "✅ Redis instances ready (Ports: 11000, 12000, 13000)."

      - name: Install Frappe Bench (Manual)
        if: github.repository != 'RokctAI/PlatformStack' && inputs.bootstrap == false
        run: |
          npm install -g yarn
          python3 -m pip install frappe-bench --break-system-packages || python3 -m pip install frappe-bench

          # Create non-root user so getpwuid resolves successfully
          id -u frappe >/dev/null 2>&1 || useradd -m -s /bin/bash frappe || true
          
          # Monkey-patch bench CLI to allow running as root in container
          BENCH_BIN=$(which bench)
          BENCH_BIN=$BENCH_BIN python3 -c "import os, pwd, getpass; path = os.getenv('BENCH_BIN'); content = open(path).read().splitlines(); patch = 'import os, pwd, getpass\ntry:\n    f_uid = pwd.getpwnam(\"frappe\").pw_uid\nexcept Exception:\n    f_uid = 1000\nos.getuid = lambda: f_uid\nos.geteuid = lambda: f_uid\ngetpass.getuser = lambda: \"frappe\"'; content.insert(1, patch); open(path, 'w').write('\n'.join(content) + '\n')"

          bench init --skip-redis-config-generation --skip-assets --python python3 --frappe-branch rokct --frappe-path https://github.com/Frappenize/frappe.git frappe-bench

      - name: Install Frappe Bench (Bootstrap with Overrides)
        if: github.repository != 'RokctAI/PlatformStack' && inputs.bootstrap == true
        run: |
          npm install -g yarn
          # Install official bench first
          python3 -m pip install frappe-bench --break-system-packages || python3 -m pip install frappe-bench
          
          # Create non-root user so getpwuid resolves successfully
          id -u frappe >/dev/null 2>&1 || useradd -m -s /bin/bash frappe || true

          # Monkey-patch bench CLI to allow running as root in container
          BENCH_BIN=$(which bench)
          BENCH_BIN=$BENCH_BIN python3 -c "import os, pwd, getpass; path = os.getenv('BENCH_BIN'); content = open(path).read().splitlines(); patch = 'import os, pwd, getpass\ntry:\n    f_uid = pwd.getpwnam(\"frappe\").pw_uid\nexcept Exception:\n    f_uid = 1000\nos.getuid = lambda: f_uid\nos.geteuid = lambda: f_uid\ngetpass.getuser = lambda: \"frappe\"'; content.insert(1, patch); open(path, 'w').write('\n'.join(content) + '\n')"

          # PATCH: Override bench source code with Occultation version
          if [ -d "occultation_overrides/bench" ]; then
             echo "🔥 Applying Bench Overrides from Occultation..."
             BENCH_PATH="$(python3 -c "import bench; import os; print(os.path.dirname(bench.__file__))")"
             echo "Target Bench Path: $BENCH_PATH"
             cp -r occultation_overrides/bench/bench/* "$BENCH_PATH/"
             echo "✅ Bench patches applied."
          fi
          
          # NOTE: We skip 'bench init' here because install.sh will handle it.
          # We just wanted the bench source code patched for when install.sh calls it.

      - name: Install RPanel via Bootstrap Script
        if: github.repository != 'RokctAI/PlatformStack' && inputs.bootstrap == true
        env:
          DB_TYPE: ${{ inputs.db-type }}
        run: |
          # Download and run the official installer
          wget "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install.sh"
          chmod +x install.sh
          # Run as root in CI mode
          CI=true DB_TYPE="$DB_TYPE" ./install.sh
          
          # move frappe-bench to standard location if needed by later steps
          # install.sh uses /home/frappe/frappe-bench
          if [ -d "/home/frappe/frappe-bench" ]; then
             # Clean up any existing folder created by previous steps before symlinking
             if [ -d "frappe-bench" ] && [ ! -L "frappe-bench" ]; then
                echo "Cleaning up local frappe-bench folder..."
                rm -rf frappe-bench
             fi
             ln -sf /home/frappe/frappe-bench ./frappe-bench
             chown -R root:root /home/frappe/frappe-bench
          fi

      - name: Sync Workspace Code to Bootstrap Bench 🔄
        if: github.repository != 'RokctAI/PlatformStack' && inputs.bootstrap == true
        working-directory: frappe-bench
        run: |
          # Detect actual app name again or use repo name
          APP_NAME=${{ github.event.repository.name }}
          APP_NAME_LOWER=$(echo $APP_NAME | tr '[:upper:]' '[:lower:]')
          
          # We need to find which directory to replace. install.sh usually uses lowercase
          if [ -d "apps/$APP_NAME_LOWER" ]; then
             TARGET_DIR=$APP_NAME_LOWER
          else
             TARGET_DIR=$APP_NAME
          fi
          
          echo "Syncing workspace code into apps/$TARGET_DIR..."
          # Source is the GITHUB_WORKSPACE root
          # We use a trailing slash to copy contents, and ensure absolute path resolution
          rsync -a --delete --exclude 'frappe-bench' --exclude 'occultation_overrides' --exclude '.git' --exclude '.github' "$GITHUB_WORKSPACE/" "./apps/$TARGET_DIR/"
          
          echo "Verifying sync results in apps/$TARGET_DIR/:"
          ls -la "apps/$TARGET_DIR/" || true
          
          if [ ! -f "apps/$TARGET_DIR/setup.py" ] && [ ! -f "apps/$TARGET_DIR/pyproject.toml" ]; then
             echo "⚠️ WARNING: No setup.py or pyproject.toml found in synced app directory!"
          else
             echo "✅ Workspace code successfully synced and verified."
          fi

      - name: Install App & Run Tests
        if: github.repository != 'RokctAI/PlatformStack'
        working-directory: frappe-bench
        shell: bash
        run: |
          # 1. Standard Environment Activation
          if [ -f "env/bin/activate" ]; then
             . env/bin/activate
          fi

          # Configure Bench to use the service DB/Redis
          if [ "${{ inputs.bootstrap }}" = "false" ]; then
             bench set-config -g db_host "${{ env.DB_HOST }}"
             bench set-config -g redis_cache redis://redis:6379
             bench set-config -g redis_queue redis://redis:6379
             bench set-config -g redis_socketio redis://redis:6379
          fi

          # Fix for Missing pkg_resources in payments app
          bench pip install setuptools

          # Install Payments if requested (Required by some apps like rcore)
          if [ "${{ inputs.install-payments }}" = "true" ] && [ "${{ inputs.bootstrap }}" = "false" ]; then
             echo "Installing Payments App..."
             bench get-app https://github.com/Frappenize/payments.git --branch rokct --resolve-deps --skip-assets
          fi

          # Install ERPNext if requested
          if [ "${{ inputs.install-erpnext }}" = "true" ] && [ "${{ inputs.bootstrap }}" = "false" ]; then
             echo "Installing ERPNext (version-16)..."
             bench get-app https://github.com/Frappenize/erpnext.git --branch rokct --resolve-deps --skip-assets
          fi

          # Install RPanel if requested
          if [ "${{ inputs.install-rpanel }}" = "true" ] && [ "${{ inputs.bootstrap }}" = "false" ]; then
             echo "Installing RPanel..."
             bench get-app https://github.com/RokctAI/rpanel.git --branch main --resolve-deps --skip-assets
          fi

          # Configure git to use GitHub token for private repos
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token || github.token }}@github.com/".insteadOf "https://github.com/"
          
          # Fetch key app (the repo calling this workflow)
          if [ "${{ inputs.bootstrap }}" = "false" ]; then
             # Use --skip-assets to avoid esbuild failures (assets aren't needed for python tests)
             bench get-app ${{ github.server_url }}/${{ github.repository }} --branch ${{ github.ref_name }} --skip-assets
          fi
          
          # Detect actual app directory and name
          cd apps
          
          # 1. Determine app directory (derived directly from apps folder)
          # Identify all potential app directories, excluding core dependencies
          APP_DIR=""
          for d in *; do
            [ -d "$d" ] || continue
            case "$d" in
              frappe|erpnext|payments) continue ;;
            esac
            
            # Default to first one found if not set
            if [ -z "$APP_DIR" ]; then
              APP_DIR="$d"
            fi
            # Prioritize directory that contains pyproject.toml OR setup.py
            if [ -f "$d/pyproject.toml" ] || [ -f "$d/setup.py" ]; then
              APP_DIR="$d"
              break
            fi
          done
          
          echo "Detected App Directory: $APP_DIR"

          # 3. Derive APP_NAME from inside that directory
          APP_NAME=""
          if [ -n "$APP_DIR" ] && [ -d "$APP_DIR" ]; then
            if [ -f "$APP_DIR/pyproject.toml" ]; then
              APP_NAME=$(grep -m1 'name = "' "$APP_DIR/pyproject.toml" | cut -d'"' -f2)
            elif [ -f "$APP_DIR/setup.py" ]; then
              APP_NAME=$(grep -m1 'name=' "$APP_DIR/setup.py" | cut -d"'" -f2 | cut -d'"' -f2)
            else
              APP_NAME="$APP_DIR"
            fi
          fi

          # 5. APP_NAME MUST ALWAYS BE SET EVEN IF EVERYTHING FAILS
          if [ -z "$APP_NAME" ]; then
            echo "⚠️ APP_NAME empty, forcing repo name fallback"
            APP_NAME="${{ github.event.repository.name }}"
          fi

          echo "Resolved APP_NAME: $APP_NAME"
          
          # Return to bench root
          cd ..
          
          echo "Expected App Name: ${{ github.event.repository.name }}"
          echo "Actual App Name: $APP_NAME"
          
          # If names differ (package name != current folder name), rename the app directory
          if [ -n "$APP_DIR" ] && [ "$APP_NAME" != "$APP_DIR" ] && [ -n "$APP_NAME" ]; then
             echo "Renaming apps/$APP_DIR to apps/$APP_NAME"
             mv "apps/$APP_DIR" "apps/$APP_NAME"
             
             # Re-install editable pip package with new path
             bench pip install -e "apps/$APP_NAME"
          fi
          
          # HACK: Workaround for potential module rename issues (e.g. brain code importing frappebrain)
          # If 'brain' directory exists but code imports 'frappebrain', create a symlink alias
          if [ -d "apps/$APP_NAME/$APP_NAME" ] && [ ! -d "apps/$APP_NAME/frappebrain" ]; then
             echo "Creating alias: apps/$APP_NAME/frappebrain -> apps/$APP_NAME/$APP_NAME"
             ln -s "$APP_NAME" "apps/$APP_NAME/frappebrain"
          fi
          
          # HACK: Fix namespace packages (missing __init__.py) which cause Frappe install to fail
          # Frappe requires modules to have valid __file__ paths
          echo "Ensuring __init__.py exists in app directories..."
          find "apps/$APP_NAME/$APP_NAME" -type d | while read -r dir; do
             if [ ! -f "$dir/__init__.py" ]; then
                echo "Creating missing __init__.py in $dir"
                touch "$dir/__init__.py"
             fi
          done
          
          # HACK: Fix deprecated/incorrect API usage in brain app (frappe.utils.update_site_config -> frappe.installer.update_site_config)
           if [ -d "apps/$APP_NAME/$APP_NAME" ]; then
              echo "Patching update_site_config usage in app..."
              grep -rl "frappe.utils.update_site_config" "apps/$APP_NAME" | xargs -r sed -i 's/frappe.utils.update_site_config/frappe.installer.update_site_config/g' || true
           fi

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          
          # Create Test Site
          if [ "${{ inputs.bootstrap }}" = "false" ]; then
             if [ "${{ inputs.db-type }}" = "mariadb" ]; then
                bench new-site test_site --db-root-password "${{ env.DB_PW }}" --admin-password admin --no-mariadb-socket
             else
                bench new-site test_site --db-type postgres --db-root-password "${{ env.DB_PW }}" --admin-password admin
             fi
             SITE_NAME="test_site"
          else
             # Use site created by bootstrap (defaults to rpanel.local)
             # Extract from sites folder if not found
             SITE_NAME=$(find sites -maxdepth 1 -name "*.local" -printf "%f\n" | head -n 1)
             SITE_NAME=${SITE_NAME:-rpanel.local}
          fi
          
          echo "Using Site: $SITE_NAME"
          
          # Ensure app is in apps.txt (required for install-app)
          # Use printf to ensure valid newline handling
          echo "Current apps.txt:"
          cat sites/apps.txt
          
          if ! grep -q "^$APP_NAME$" sites/apps.txt; then
             echo "Adding $APP_NAME to apps.txt"
             # Ensure newline at EOF before appending
             [ -n "$(tail -c1 sites/apps.txt 2>/dev/null)" ] && echo "" >> sites/apps.txt
             echo "$APP_NAME" >> sites/apps.txt
          fi
          
          echo "Updated apps.txt:"
          cat sites/apps.txt

          # Ensure standard initialization log is clean
          true > test_output.log
          
          # Sync DocTypes before testing (Prevents DoesNotExistError)
          echo "Syncing DocTypes via Migration..."
          bench --site "$SITE_NAME" migrate
          
          # Install App & Run Tests
          # Use pipefail to ensure tee doesn't mask test failures
          set -o pipefail
           if [ "${{ inputs.bootstrap }}" = "false" ]; then
             if [ "${{ inputs.install-payments }}" = "true" ]; then
                echo "Installing payments app on $SITE_NAME..."
                bench --site "$SITE_NAME" install-app payments
             fi
             if [ "${{ inputs.install-erpnext }}" = "true" ]; then
                echo "Installing erpnext app on $SITE_NAME..."
                bench --site "$SITE_NAME" install-app erpnext
             fi
             bench --site "$SITE_NAME" install-app "$APP_NAME"
          fi
          
          if ! bench --site "$SITE_NAME" run-tests --app "$APP_NAME" 2>&1 | tee test_output.log; then
             echo "⚠️ Tests failed. Initiating smart flaky test recovery..."
             if grep -qiE "OperationalError|ConnectionAbortedError|ConnectionResetError|LockWaitTimeout|Deadlock|MySQL server has gone away" test_output.log; then
                echo "♻️ Flaky infrastructure or database lock issue detected. Retrying tests in 5 seconds..."
                sleep 5
                bench --site "$SITE_NAME" run-tests --app "$APP_NAME" 2>&1 | tee test_output.log
             else
                echo "❌ Genuine code regression or unknown error detected."
                exit 1
             fi
          fi



