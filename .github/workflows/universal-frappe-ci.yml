name: Frappe App Test
on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: '3.14.2'
      db-password:
        required: false
        type: string
        default: 'travis'
      mariadb-version:
        required: false
        type: string
        default: '10.6'
      postgres-version:
        required: false
        type: string
        default: '15'
      db-type:
        required: false
        type: string
        default: 'mariadb'
        description: "Database type: 'mariadb' or 'postgres'"
      redis-version:
        required: false
        type: string
        default: '6.0'
      node-version:
        required: false
        type: string
        default: '24'
      install-erpnext:
        required: false
        type: boolean
        default: false
      install-payments:
        required: false
        type: boolean
        default: false
      bootstrap:
        required: false
        type: boolean
        default: false

    secrets:
      COUNTER_API_KEY:
        required: false
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false


jobs:
  # --- 0. TELEMETRY (Usage Tracking) ---
  telemetry:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Track Usage (CounterAPI)
        env:
          API_KEY: ${{ secrets.COUNTER_API_KEY }}
        if: env.API_KEY != ''
        run: |
          curl -X GET "https://api.counterapi.dev/v2/rokctai/usage/up" \
          -H "Authorization: Bearer $API_KEY"

  test:
    needs: telemetry
    permissions:
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DB_PW: ${{ secrets.DB_ROOT_PASSWORD || inputs.db-password }}

    services:
      redis:
        image: redis:${{ inputs.redis-version }}
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=2s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Debug Secret Presence
        run: |
          if [ -n "${{ secrets.APP_ID }}" ]; then echo "✅ APP_ID reached this workflow."; else echo "❌ APP_ID is MISSING."; fi
          if [ -n "${{ secrets.APP_PRIVATE_KEY }}" ]; then echo "✅ APP_PRIVATE_KEY reached this workflow."; else echo "❌ APP_PRIVATE_KEY is MISSING."; fi

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        continue-on-error: true
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Start Database Service
        if: inputs.bootstrap == false
        run: |
          if [ "${{ inputs.db-type }}" == "mariadb" ]; then
             echo "Starting MariaDB..."
             docker run -d --name db-service -p 3306:3306 -e MARIADB_ROOT_PASSWORD=${{ env.DB_PW }} mariadb:${{ inputs.mariadb-version }}
             # Wait for health
             timeout 60s bash -c "until docker exec db-service mysqladmin ping -p${{ env.DB_PW }} --silent; do echo 'Waiting for MariaDB...'; sleep 2; done"
          else
             echo "Starting PostgreSQL (pgvector/pgvector)..."
             # Standardized fleet database: pgvector/pgvector (Official)
             docker run -d --name db-service -p 5432:5432 -e POSTGRES_PASSWORD=${{ env.DB_PW }} -e POSTGRES_USER=postgres pgvector/pgvector:pg15
             # Wait for health
             timeout 60s bash -c 'until docker exec db-service pg_isready -U postgres; do echo "Waiting for PostgreSQL..."; sleep 2; done'
             
             # Pre-enable pgvector, cube, earthdistance in template1 so all new bench sites have them
             echo "Enabling pgextensions in template1..."
             docker exec db-service psql -U postgres -d template1 -c "CREATE EXTENSION IF NOT EXISTS vector;"
             docker exec db-service psql -U postgres -d template1 -c "CREATE EXTENSION IF NOT EXISTS cube;"
             docker exec db-service psql -U postgres -d template1 -c "CREATE EXTENSION IF NOT EXISTS earthdistance;"
          fi

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ inputs.python-version }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf
          if [ "${{ inputs.db-type }}" == "mariadb" ]; then
             sudo apt-get install -y mariadb-client
          else
             sudo apt-get install -y postgresql-client
          fi

      - name: Checkout Monorepo for Overrides
        if: inputs.bootstrap == true
        # Graceful Skip: Don't fail if Monorepo is inaccessible (e.g. Forks or Token errors)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: RokctAI/Monorepo
          path: monorepo_overrides
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Setup CI Identity & Services 🔐⚙️
        run: |
          # 1. Setup Global Git Config for Private Repos (HTTPS + Token)
          # This ensures that even nested dependencies (bench get-app) in install.sh use the token
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token || github.token }}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token || github.token }}@github.com/".insteadOf "https://github.com/"
          echo "✅ Global Git config updated for authenticated HTTPS fetching."

          # 2. Manual Redis Startup (Bypassing Supervisor failures in CI)
          echo "Starting Redis instances manually..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server
          sudo redis-server --port 11000 --daemonize yes # Queue
          sudo redis-server --port 12000 --daemonize yes # Socketio
          sudo redis-server --port 13000 --daemonize yes # Cache
          
          # Wait for Redis to be ready
          for port in 11000 12000 13000; do
             while ! nc -z localhost $port; do
                echo "Waiting for Redis on $port..."
                sleep 1
             done
             echo "Redis is up on $port"
          done
          echo "✅ Redis instances ready (Ports: 11000, 12000, 13000)."

      - name: Install Frappe Bench (Manual)
        if: github.repository_owner != 'RokctAI' && inputs.bootstrap == false
        run: |
          npm install -g yarn
          ${{ steps.setup-python.outputs.python-path }} -m pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python ${{ steps.setup-python.outputs.python-path }} frappe-bench

      - name: Install Frappe Bench (Bootstrap with Overrides)
        if: github.repository_owner != 'RokctAI' && inputs.bootstrap == true
        run: |
          npm install -g yarn
          # Install official bench first
          ${{ steps.setup-python.outputs.python-path }} -m pip install frappe-bench
          
          # PATCH: Override bench source code with Monorepo version
          if [ -d "monorepo_overrides/bench" ]; then
             echo "🔥 Applying Bench Overrides from Monorepo..."
             BENCH_PATH=$(${{ steps.setup-python.outputs.python-path }} -c "import bench; import os; print(os.path.dirname(bench.__file__))")
             echo "Target Bench Path: $BENCH_PATH"
             cp -r monorepo_overrides/bench/bench/* "$BENCH_PATH/"
             echo "✅ Bench patches applied."
          fi
          
          # NOTE: We skip 'bench init' here because install.sh will handle it.
          # We just wanted the bench source code patched for when install.sh calls it.

      - name: Install RPanel via Bootstrap Script
        if: github.repository_owner != 'RokctAI' && inputs.bootstrap == true
        env:
          DB_TYPE: ${{ inputs.db-type }}
        run: |
          # Download and run the official installer
          wget https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install.sh
          chmod +x install.sh
          # Run as root in CI mode
          sudo CI=true DB_TYPE=$DB_TYPE ./install.sh
          
          # move frappe-bench to standard location if needed by later steps
          # install.sh uses /home/frappe/frappe-bench
          if [ -d "/home/frappe/frappe-bench" ]; then
             # Clean up any existing folder created by previous steps before symlinking
             if [ -d "frappe-bench" ] && [ ! -L "frappe-bench" ]; then
                echo "Cleaning up local frappe-bench folder..."
                rm -rf frappe-bench
             fi
             sudo ln -sf /home/frappe/frappe-bench ./frappe-bench
             sudo chown -R $USER:$USER /home/frappe/frappe-bench
          fi

      - name: Sync Workspace Code to Bootstrap Bench 🔄
        if: github.repository_owner != 'RokctAI' && inputs.bootstrap == true
        working-directory: frappe-bench
        run: |
          # Detect actual app name again or use repo name
          APP_NAME="${{ github.event.repository.name }}"
          APP_NAME_LOWER=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]')
          
          # We need to find which directory to replace. install.sh usually uses lowercase
          if [ -d "apps/$APP_NAME_LOWER" ]; then
             TARGET_DIR="$APP_NAME_LOWER"
          else
             TARGET_DIR="$APP_NAME"
          fi
          
          echo "Syncing workspace code into apps/$TARGET_DIR..."
          # Source is the GITHUB_WORKSPACE root
          # We use a trailing slash to copy contents, and ensure absolute path resolution
          sudo rsync -a --delete --exclude 'frappe-bench' --exclude 'monorepo_overrides' --exclude '.git' --exclude '.github' "$GITHUB_WORKSPACE/" "./apps/$TARGET_DIR/"
          
          echo "Verifying sync results in apps/$TARGET_DIR/:"
          ls -la "apps/$TARGET_DIR/" || true
          
          if [ ! -f "apps/$TARGET_DIR/setup.py" ] && [ ! -f "apps/$TARGET_DIR/pyproject.toml" ]; then
             echo "⚠️ WARNING: No setup.py or pyproject.toml found in synced app directory!"
          else
             echo "✅ Workspace code successfully synced and verified."
          fi

      - name: Install App & Run Tests
        if: github.repository_owner != 'RokctAI'
        working-directory: frappe-bench
        run: |
          # 1. Standard Environment Activation
          if [ -f "env/bin/activate" ]; then
             source env/bin/activate
          fi

          # Configure Bench to use the service DB/Redis
          if [ "${{ inputs.bootstrap }}" == "false" ]; then
             bench set-config -g db_host 127.0.0.1
             bench set-config -g redis_cache redis://127.0.0.1:6379
             bench set-config -g redis_queue redis://127.0.0.1:6379
             bench set-config -g redis_socketio redis://127.0.0.1:6379
          fi

          # Fix for Missing pkg_resources in payments app
          bench pip install setuptools

          # Install Payments if requested (Required by some apps like rcore)
          if [ "${{ inputs.install-payments }}" == "true" ] && [ "${{ inputs.bootstrap }}" == "false" ]; then
             echo "Installing Payments App..."
             bench get-app payments --branch version-15 --resolve-deps --skip-assets
          fi

          # Install ERPNext if requested
          if [ "${{ inputs.install-erpnext }}" == "true" ] && [ "${{ inputs.bootstrap }}" == "false" ]; then
             echo "Installing ERPNext (version-16)..."
             bench get-app erpnext --branch version-16 --resolve-deps --skip-assets
          fi

          # Configure git to use GitHub token for private repos
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token || github.token }}@github.com/".insteadOf "https://github.com/"
          
          # Fetch key app (the repo calling this workflow)
          if [ "${{ inputs.bootstrap }}" == "false" ]; then
             # Use --skip-assets to avoid esbuild failures (assets aren't needed for python tests)
             bench get-app ${{ github.server_url }}/${{ github.repository }} --branch ${{ github.ref_name }} --skip-assets
          fi
          
          # Detect actual app directory and name
          # This handles case sensitivity (rPanel vs rpanel) and repo vs package name mismatches
          echo "Listing apps directory content:"
          ls -la apps/ || true
          
          cd apps
          
          # Priority 1: Check if directory matches Repo Name (e.g. rCore)
          REPO_NAME="${{ github.event.repository.name }}"
          if [ -n "$REPO_NAME" ] && [ -d "$REPO_NAME" ]; then
              APP_DIR="$REPO_NAME"
          # Priority 2: Check if directory matches Lowercase Repo Name (e.g. rcore)
          elif [ -n "$REPO_NAME" ] && [ -d "$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')" ]; then
              APP_DIR="$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')"
          else
              # Priority 3: Fallback to first non-excluded dir (excluding deps like payments)
              # Using find to be more robust than ls
              APP_DIR=$(find . -maxdepth 1 -type d ! -name "." ! -name "frappe" ! -name "erpnext" ! -name "payments" -printf "%f\n" | head -n 1)
          fi
          
          echo "Detected App Directory: $APP_DIR"
          
          if [ -n "$APP_DIR" ]; then
              cd "$APP_DIR"
              if [ -f "pyproject.toml" ]; then
                 APP_NAME=$(grep -m1 'name = "' pyproject.toml | cut -d'"' -f2)
              elif [ -f "setup.py" ]; then
                 APP_NAME=$(grep -m1 'name=' setup.py | cut -d"'" -f2 | cut -d'"' -f2)
              else
                 APP_NAME="${{ github.event.repository.name }}"
              fi
              cd ..
          else
              APP_NAME="${{ github.event.repository.name }}"
          fi
          
          # Return to bench root
          cd ..
          
          echo "Expected App Name: ${{ github.event.repository.name }}"
          echo "Actual App Name: $APP_NAME"
          
          # If names differ (package name != current folder name), rename the app directory
          if [[ -n "$APP_DIR" && "$APP_NAME" != "$APP_DIR" && -n "$APP_NAME" ]]; then
             echo "Renaming apps/$APP_DIR to apps/$APP_NAME"
             mv "apps/$APP_DIR" "apps/$APP_NAME"
             
             # Re-install editable pip package with new path
             bench pip install -e "apps/$APP_NAME"
          fi
          
          # HACK: Workaround for potential module rename issues (e.g. brain code importing frappebrain)
          # If 'brain' directory exists but code imports 'frappebrain', create a symlink alias
          if [ -d "apps/$APP_NAME/$APP_NAME" ] && [ ! -d "apps/$APP_NAME/frappebrain" ]; then
             echo "Creating alias: apps/$APP_NAME/frappebrain -> apps/$APP_NAME/$APP_NAME"
             ln -s $APP_NAME apps/$APP_NAME/frappebrain
          fi
          
          # HACK: Fix namespace packages (missing __init__.py) which cause Frappe install to fail
          # Frappe requires modules to have valid __file__ paths
          echo "Ensuring __init__.py exists in app directories..."
          find apps/$APP_NAME/$APP_NAME -type d | while read dir; do
             if [ ! -f "$dir/__init__.py" ]; then
                echo "Creating missing __init__.py in $dir"
                touch "$dir/__init__.py"
             fi
          done
          
          # HACK: Fix deprecated/incorrect API usage in brain app (frappe.utils.update_site_config -> frappe.installer.update_site_config)
          if [ -d "apps/$APP_NAME/$APP_NAME" ]; then
             echo "Patching update_site_config usage in app..."
             grep -r "frappe.utils.update_site_config" apps/$APP_NAME | cut -d: -f1 | sort | uniq | xargs -r sed -i 's/frappe.utils.update_site_config/frappe.installer.update_site_config/g'
          fi

          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          
          # Create Test Site
          if [ "${{ inputs.bootstrap }}" == "false" ]; then
             if [ "${{ inputs.db-type }}" == "mariadb" ]; then
                bench new-site test_site --db-root-password ${{ env.DB_PW }} --admin-password admin --no-mariadb-socket
             else
                bench new-site test_site --db-type postgres --db-root-password ${{ env.DB_PW }} --admin-password admin
             fi
             SITE_NAME="test_site"
          else
             # Use site created by bootstrap (defaults to rpanel.local)
             # Extract from sites folder if not found
             SITE_NAME=$(ls sites | grep .local | head -n 1)
             SITE_NAME=${SITE_NAME:-rpanel.local}
          fi
          
          echo "Using Site: $SITE_NAME"
          
          # Ensure app is in apps.txt (required for install-app)
          # Use printf to ensure valid newline handling
          echo "Current apps.txt:"
          cat sites/apps.txt
          
          if ! grep -q "^$APP_NAME$" sites/apps.txt; then
             echo "Adding $APP_NAME to apps.txt"
             # Append newline if missing, then the app name
             sed -i -e '$a\' sites/apps.txt
             echo "$APP_NAME" >> sites/apps.txt
          fi
          
          echo "Updated apps.txt:"
          cat sites/apps.txt

          # Ensure standard initialization log is clean
          true > test_output.log
          
          # Sync DocTypes before testing (Prevents DoesNotExistError)
          echo "Syncing DocTypes via Migration..."
          bench --site $SITE_NAME migrate
          
          # Install App & Run Tests
          # Use pipefail to ensure tee doesn't mask test failures
          set -o pipefail
          if [ "${{ inputs.bootstrap }}" == "false" ]; then
             bench --site $SITE_NAME install-app $APP_NAME
          fi
          bench --site $SITE_NAME run-tests --app $APP_NAME 2>&1 | tee test_output.log



      - name: Extended Platform Integration (Trick in a Trick) 🎩✨
        if: success() && github.repository_owner == 'RokctAI'
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          echo "Registry detected as RokctAI. Triggering Native Ecosystem Compilation..."
          
          # --- COPIED SETUP STEPS (Native Initialization) ---
          
          # 1. Start Database Service (PostgreSQL)
          if [ "${{ inputs.db-type }}" == "mariadb" ]; then
             echo "Starting MariaDB..."
             docker run -d --name db-service -p 3306:3306 -e MARIADB_ROOT_PASSWORD=${{ env.DB_PW }} mariadb:${{ inputs.mariadb-version }}
             timeout 60s bash -c "until docker exec db-service mysqladmin ping -p${{ env.DB_PW }} --silent; do echo 'Waiting for MariaDB...'; sleep 2; done"
          else
             echo "Starting PostgreSQL (pgvector/pgvector)..."
             docker run -d --name db-service -p 5432:5432 -e POSTGRES_PASSWORD=${{ env.DB_PW }} -e POSTGRES_USER=postgres pgvector/pgvector:pg15
             timeout 60s bash -c 'until docker exec db-service pg_isready -U postgres; do echo "Waiting for PostgreSQL..."; sleep 2; done'
             echo "Enabling pgextensions in template1..."
             docker exec db-service psql -U postgres -d template1 -c "CREATE EXTENSION IF NOT EXISTS vector;"
             docker exec db-service psql -U postgres -d template1 -c "CREATE EXTENSION IF NOT EXISTS cube;"
             docker exec db-service psql -U postgres -d template1 -c "CREATE EXTENSION IF NOT EXISTS earthdistance;"
          fi

          # 2. Setup CI Identity & Services (Git + Redis)
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token || github.token }}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token || github.token }}@github.com/".insteadOf "https://github.com/"
          
          echo "Starting Redis instances manually..."
          sudo apt-get update -qq && sudo apt-get install -y -qq redis-server
          sudo redis-server --port 11000 --daemonize yes
          sudo redis-server --port 12000 --daemonize yes
          sudo redis-server --port 13000 --daemonize yes
          
          # --------------------------------------------------

          # 3. Initialize Bench
          npm install -g yarn
          ${{ steps.setup-python.outputs.python-path }} -m pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python ${{ steps.setup-python.outputs.python-path }} frappe-bench
          cd frappe-bench
          
          if [ -f "env/bin/activate" ]; then source env/bin/activate; fi
          
          # 2. Configure Service Database connections
          if [ "${{ inputs.db-type }}" == "mariadb" ]; then
             bench set-config -g db_host 127.0.0.1
             bench new-site platform.rokct.ai --db-root-password ${{ env.DB_PW }} --admin-password admin --no-mariadb-socket
          else
             bench set-config -g db_host 127.0.0.1
             bench new-site platform.rokct.ai --db-type postgres --db-root-password ${{ env.DB_PW }} --admin-password admin
          fi
          
          echo "platform.rokct.ai" > sites/currentsite.txt
          
          # 0. Map Platform Host (Prevents Cleanup/Seeder 404 errors)
          echo "127.0.0.1 platform.rokct.ai" | sudo tee -a /etc/hosts
          
          # Configure Git for Private Repos
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          
          # 3. Natively Install the Core App (e.g. rpanel)
          bench pip install setuptools
          APP_REPO="${{ github.server_url }}/${{ github.repository }}"
          echo "Fetching Native Core Repository: $APP_REPO"
          bench get-app $APP_REPO --branch ${{ github.ref_name }} --skip-assets
          
          # Detect App Name (rpanel, etc.)
          cd apps
          APP_DIR=$(find . -maxdepth 1 -type d ! -name "." ! -name "frappe" ! -name "erpnext" -printf "%f\n" | head -n 1)
          cd ..
          
          if [ -n "$APP_DIR" ]; then
             bench --site platform.rokct.ai install-app $APP_DIR
             # Run unit tests
             bench --site platform.rokct.ai run-tests --app $APP_DIR 2>&1 | tee test_output.log
          fi
          
          # 4. Install ERPNext (Standard Dependency)
          echo "Installing ERPNext (version-16)..."
          bench get-app erpnext --branch version-16 --resolve-deps --skip-assets
          
          # 4. Install Control (The Installer)
          if [ -d "$GITHUB_WORKSPACE/control" ]; then
             echo "🔥 Using LOCAL Control Panel from workspace..."
             # We copy it into apps/control manually to ensure OUR fixes (recursion, transactions) are used
             mkdir -p apps/control
             cp -r "$GITHUB_WORKSPACE/control/." "apps/control/"
             # Ensure registration
             bench pip install -e apps/control
          else
             echo "Installing Control Panel via HTTPS (Token-based)..."
             bench get-app https://x-access-token:${GITHUB_TOKEN}@github.com/RokctAI/control.git --resolve-deps --skip-assets
          fi
          
          # --- BENCH RE-PATCH (Safety against install.sh usage) ---
          if [ -d "$GITHUB_WORKSPACE/monorepo_overrides/bench" ]; then
             echo "🔥 Re-Applying Bench Overrides (Safety)..."
             BENCH_PATH=$(${{ steps.setup-python.outputs.python-path }} -c "import bench; import os; print(os.path.dirname(bench.__file__))")
             cp -r "$GITHUB_WORKSPACE/monorepo_overrides/bench/bench/"* "$BENCH_PATH/" || true
          fi
          # --------------------------------------------------------

          # 4. Integrate into site
          # Extract site name from sites folder
          ORIG_SITE=$(ls sites | grep .local | head -n 1)
          ORIG_SITE=${ORIG_SITE:-test_site}
          
          SITE_NAME="platform.rokct.ai"
          echo "Moving $ORIG_SITE to $SITE_NAME..."
          mv "sites/$ORIG_SITE" "sites/$SITE_NAME" || true
          
          # Update current site txt
          echo "$SITE_NAME" > sites/currentsite.txt
          
          # --- MONOREPO OVERRIDES STAGING ---
          # We stage the Monorepo so that install_stack.py can find local versions of apps (rcore, etc.)
          echo "🔥 Staging Monorepo Overrides for Install Stack..."
          if [ -d "$GITHUB_WORKSPACE" ]; then
             # Create a symlink or copy to 'monorepo_overrides' at bench root
             # install_stack.py looks for 'monorepo_overrides' in BENCH_PATH
             mkdir -p monorepo_overrides
             # We copy essential apps that we want to override from workspace
             for app in rcore paas paas_customer paas_driver paas_manager paas_pos paas_webapp IoT brain control; do
                if [ -d "$GITHUB_WORKSPACE/$app" ]; then
                   echo "   - Overriding $app"
                   cp -r "$GITHUB_WORKSPACE/$app" "monorepo_overrides/"
                fi
             done
             echo "   ✅ Staged local apps into 'monorepo_overrides'."
          fi
          # ----------------------------------
          
          # Apply monorepo overrides for control BEFORE install-app runs.
          # control is excluded from install_stack's app loop, and its after_install
          # (seeders) needs files from monorepo to already be in place.
          if [ -d "monorepo_overrides/control" ]; then
             echo "🔥 Applying Monorepo Overrides for Control (Pre-Install)..."
             cp -rf monorepo_overrides/control/. apps/control/
             echo "   ✅ Control overrides applied."
          fi
          
          echo "Integrating into site: $SITE_NAME"
          
          # Installation Trigger
          # we install control. control's hooks (install_stack.py) will then fetch/override and install rcore/payments/etc.
          # install_stack.py also handles registration in apps.txt robustly.
          bench --site $SITE_NAME install-app erpnext control
          
          # 5. Verify Installation
          echo "Verifying platform bundle..."
          bench --site $SITE_NAME execute frappe.get_installed_apps
          
          # 6. Generate Golden Seed (Golden DB)
          echo "Generating Golden DB Seed..."
          bench --site $SITE_NAME backup
          # Find the backup file (usually YYYYMMDD_HHMMSS-site_name-database.sql.gz)
          # We use head -n 1 just in case, though there should be only one.
          BACKUP_FILE=$(ls sites/$SITE_NAME/private/backups/*-database.sql.gz | head -n 1)
          if [ -f "$BACKUP_FILE" ]; then
             echo "Backup found: $BACKUP_FILE"
             mkdir -p apps/seed_data
             cp "$BACKUP_FILE" "apps/seed_data/seed.sql.gz"
             echo "✅ Golden Seed created at apps/seed_data/seed.sql.gz"
          else
             echo "⚠️ Backup failed or file not found."
          fi

      - name: Archive Apps (Artifact)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frappe-apps-bundle
          path: frappe-bench/apps
          retention-days: 1

      - name: Process Annotations
        if: always()
        run: |
          if [ -f frappe-bench/test_output.log ]; then
             echo "Processing deprecation warnings for annotations..."
             # Parse for DeprecationWarning (Inspired by Frappe)
             grep -E "DeprecationWarning" frappe-bench/test_output.log | sort -u | while read -r warning; do
               file_info=$(echo "$warning" | grep -oP '^.*?:\d+:')
               if [ -n "$file_info" ]; then
                  file_path=$(echo "$file_info" | cut -d':' -f1)
                  line_number=$(echo "$file_info" | cut -d':' -f2)
                  msg=$(echo "$warning" | sed -E "s/^.*DeprecationWarning: //")
                  echo "::warning file=${file_path},line=${line_number}::DeprecationWarning: ${msg}"
               fi
             done
          fi

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ failure() && contains( github.event.pull_request.labels.*.name, 'debug-gha') }}
        with:
          limit-access-to-actor: true
