# Copyright 2024 RokctAI

name: Universal Node.js CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PIP_BREAK_SYSTEM_PACKAGES: 1

permissions: write-all
on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '24'
      run-test:
        required: false
        type: boolean
        default: true
      run-build:
        required: false
        type: boolean
        default: true
      package-manager:
        required: false
        type: string
        default: 'pnpm' # npm, yarn, pnpm
      build-command:
        required: false
        type: string
        default: 'pnpm run build'
      test-command:
        required: false
        type: string
        default: 'pnpm run test'

    secrets:
      COUNTER_API_KEY:
        required: false
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false
      MONOREPO_PAT:
        required: false
      PRODUCTION_ENV:
        required: false
      DEFAULT_ENV:
        required: false

jobs:
  telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Track Usage (CounterAPI)
        env:
          API_KEY: ${{ secrets.COUNTER_API_KEY }}
        if: env.API_KEY != ''
        run: |
          curl -X GET "https://api.counterapi.dev/v2/rokctai/usage/up" \
          -H "Authorization: Bearer $API_KEY"

  node-ci:
    needs: telemetry
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Fetch and Merge Private Repository
        shell: bash
        run: |
          if [ -f ".private_repo" ]; then
            REPO_NAME=$(tr -d '\r\n[:space:]' < .private_repo)
            if [ -n "$REPO_NAME" ]; then
              echo "Private repository configured: $REPO_NAME"
              TOKEN="${{ secrets.MONOREPO_PAT || github.token }}"
              URL="https://x-access-token:${TOKEN}@github.com/${REPO_NAME}.git"
              if git clone --depth 1 "$URL" .private-temp; then
                echo "Excluding private files from git tracking..."
                mkdir -p .git/info
                (cd .private-temp && find . -type f) | sed 's|^\./||' >> .git/info/exclude
                echo "Merging private files..."
                rm -rf .private-temp/.git .private-temp/.github
                rsync -a .private-temp/ ./
                rm -rf .private-temp
              else
                echo "::warning::Failed to clone private repository $REPO_NAME."
              fi
            fi
          fi
      - name: Compose SDK Modules (If Shell App)
        shell: bash
        env:
          MONOREPO_PAT: ${{ secrets.MONOREPO_PAT }}
        run: |
          set -euo pipefail
          # Fleet-wide safety: every gate below exits 0 so repos without the
          # composer contract are byte-identical to before this step existed.
          if [ ! -f ".rokct/config/app_type" ] || [ ! -f "package.json" ]; then
            echo "Not a composed Node shell. Skipping composition."
            exit 0
          fi
          APP_TYPE=$(tr -d '\r\n[:space:]' < .rokct/config/app_type | tr '[:upper:]' '[:lower:]')
          if [ -z "$APP_TYPE" ]; then
            echo "Empty app_type marker. Skipping composition."
            exit 0
          fi
          PROTOCOL_DIR="${RUNNER_TEMP}/The-Rokct-Protocol"
          rm -rf "$PROTOCOL_DIR"
          if ! git clone --depth 1 "https://x-access-token:${MONOREPO_PAT:-}@github.com/RokctAI/The-Rokct-Protocol.git" "$PROTOCOL_DIR" 2>/dev/null; then
            echo "::warning::Could not clone The-Rokct-Protocol. Skipping composition."
            exit 0
          fi
          if ! grep -q "def resolve_composer_config" "$PROTOCOL_DIR/core/utils/nextjs/sdk_composer.py" 2>/dev/null; then
            echo "Registry-template contract not on protocol main. Skipping composition."
            exit 0
          fi
          TEMPLATE="$PROTOCOL_DIR/core/utils/frappe/composer/${APP_TYPE}.json"
          if [ ! -f "$TEMPLATE" ] || ! python3 -c "import json,sys; t=json.load(open(sys.argv[1])); sys.exit(0 if any(s.get('enabled') for s in t.get('sdks', [])) else 1)" "$TEMPLATE"; then
            echo "app_type '${APP_TYPE}' is a plain role marker here. Skipping composition."
            exit 0
          fi
          echo "Composing shell app '${APP_TYPE}' from registry template..."
          mkdir -p .rokct
          cp "$PROTOCOL_DIR/core/utils/nextjs/sdk_installer_base.py" .rokct/sdk_installer_base.py
          export ROKCT_PROTOCOL_DIR="$PROTOCOL_DIR"
          export ROKCT_SKIP_NPM_INSTALL=1
          export ROKCT_ALLOW_UNPINNED_SDKS=1
          python3 "$PROTOCOL_DIR/core/utils/nextjs/sdk_composer.py"
          echo "ROKCT_COMPOSED=true" >> "$GITHUB_ENV"
          echo "Composition complete."

      #- name: Setup Node.js ${{ inputs.node-version }}
      #  uses: actions/setup-node@v6
      #  with:
      #    node-version: ${{ inputs.node-version }}

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9 # Matches your ecosystem's typical version

      - name: Setup Cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager == 'pnpm' && 'pnpm' || inputs.package-manager }}

      - name: Install Dependencies
        shell: bash
        run: |
          INSTALL_FLAGS=""
          if [ "${ROKCT_COMPOSED:-}" = "true" ] && [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            # A composed package.json may drift from the committed lockfile;
            # pnpm defaults to --frozen-lockfile in CI, so relax it here only.
            INSTALL_FLAGS="--no-frozen-lockfile"
            echo "Composed shell detected: installing with $INSTALL_FLAGS"
          fi
          ${{ inputs.package-manager }} install $INSTALL_FLAGS

      - name: Resolve Dynamic Client
        id: client
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          CLIENT=""
          if [[ "$REF_NAME" == build_* ]]; then
            # Extract client from branch name (e.g. build_clientname-v1 -> CLIENTNAME)
            CLIENT=$(printf '%s\n' "$REF_NAME" | cut -d'_' -f2 | cut -d'-' -f1 | tr -dc 'a-zA-Z0-9' | tr '[:lower:]' '[:upper:]')
          fi
          echo "client_upper=$CLIENT" >> "$GITHUB_OUTPUT"
          if [ -n "$CLIENT" ]; then
             echo "🔍 Detected Client: $CLIENT"
          else
             echo "ℹ️ Standard build (no client detected)"
          fi

      - name: "Decode Production Environment (Priority: Occultation > Secret)"
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_PAT }}
          CLIENT_PREFIX: ${{ steps.client.outputs.client_upper }}
          CLIENT_ENV: ${{ steps.client.outputs.client_upper != '' && secrets[format('PRODUCTION_ENV_{0}', steps.client.outputs.client_upper)] || '' }}
          DEFAULT_ENV: ${{ secrets.PRODUCTION_ENV || ''}}
        if: github.ref_name != 'develop'
        run: |
          FILE_NAME="production.env"
          if [ -n "$CLIENT_PREFIX" ]; then
             LOWER_PREFIX=$(echo "$CLIENT_PREFIX" | tr '[:upper:]' '[:lower:]')
             FILE_NAME="${LOWER_PREFIX}_production.env"
          fi

          # 1. Try Occultation
          if [ -n "$GH_TOKEN" ] && gh api repos/RokctAI/Occultation/contents/.env/"$FILE_NAME" -H "Accept: application/vnd.github.v3.raw" > .env.raw 2>/dev/null; then
             echo "✅ Successfully synced $FILE_NAME from Occultation."
          else
             # 2. Try Secrets
             echo "⚠️ Not in Occultation. Falling back to secrets..."
             ENV_CONTENT="$DEFAULT_ENV"
             if [ -n "$CLIENT_ENV" ]; then
                echo "✅ Using client-specific secret: PRODUCTION_ENV_$CLIENT_PREFIX"
                ENV_CONTENT="$CLIENT_ENV"
             fi
             
             if [ -n "$ENV_CONTENT" ]; then
                echo "$ENV_CONTENT" | base64 --decode > .env.raw
                echo "✅ Successfully decoded from secrets."
             else
                echo "ℹ️ No environment configuration found."
             fi
          fi

          if [ -f .env.raw ]; then
             # Truncate at NextJS marker
             if grep -q "##########END_NEXTJS##########" .env.raw; then
                echo "✂️ Node build: Stopping at ##########END_NEXTJS##########"
                # shellcheck disable=SC2016
                sed -i '1,/##########END_NEXTJS##########/!d' .env.raw
             fi

             # Normalize line endings
             sed -i 's/\r$//' .env.raw
             mv .env.raw .env
             echo "✅ .env ready for Node/NextJS."
          fi

      - name: Resolve Environment Variables
        if: inputs.run-build == true || inputs.run-test == true
        shell: bash
        run: |
          if [ -f ".env" ]; then
            echo ".env file detected. Interpolating internal variables..."
            set -a
            source .env
            set +a
            envsubst < .env > .env.expanded
            mv .env.expanded .env
            
            # Sanitise: Keep ONLY NEXT_PUBLIC_ variables for Next.js security
            if grep -q "^NEXT_PUBLIC_" .env; then
               grep "^NEXT_PUBLIC_" .env > .env.public
               mv .env.public .env
               echo "Sanitised .env: Only NEXT_PUBLIC_ variables retained."
            else
               echo "No NEXT_PUBLIC_ variables found to extract."
            fi
            
            echo "Interpolation & Extraction complete."
          fi

      - name: Run Tests
        if: inputs.run-test == true
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: password
          DB_DATABASE: test_db
          # Standardized connection strings for migration scripts
          POSTGRES_URL: postgres://postgres:password@localhost:5432/test_db
          POSTGRES_URL_NON_POOLING: postgres://postgres:password@localhost:5432/test_db
        run: |
          if jq -e '.scripts.test' package.json > /dev/null; then
            echo "Test script detected. Running..."
             test_cmd="${{ inputs.test-command }}"
             if ! $test_cmd; then
                echo "⚠️ Node tests failed. Checking for Jest to run flaky test recovery..."
                if [[ "$test_cmd" == *jest* || -f "jest.config.js" || -f "jest.config.ts" || -f "jest.config.json" ]]; then
                   echo "♻️ Jest project detected. Retrying tests with --retry=3 to filter flaky issues..."
                   $test_cmd -- --retry=3
                else
                   echo "❌ Genuine regression or non-Jest test framework failure."
                   exit 1
                fi
             fi
          else
            echo "No 'test' script found in package.json. Skipping tests."
          fi

      - name: Run Build
        if: inputs.run-build == true
        env:
          # Inject DB vars specifically for projects that run migrations during build (e.g., RokctAI_frontend)
          POSTGRES_URL: postgres://postgres:password@localhost:5432/test_db
          POSTGRES_URL_NON_POOLING: postgres://postgres:password@localhost:5432/test_db
        run: ${{ inputs.build-command }}
