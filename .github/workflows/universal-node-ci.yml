name: Universal Node.js CI

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '24'
      run-test:
        required: false
        type: boolean
        default: true
      run-build:
        required: false
        type: boolean
        default: true
      package-manager:
        required: false
        type: string
        default: 'pnpm' # npm, yarn, pnpm
      build-command:
        required: false
        type: string
        default: 'pnpm run build'
      test-command:
        required: false
        type: string
        default: 'pnpm run test'

    secrets:
      COUNTER_API_KEY:
        required: false

jobs:
  telemetry:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Track Usage (CounterAPI)
        env:
          API_KEY: ${{ secrets.COUNTER_API_KEY }}
        if: env.API_KEY != ''
        run: |
          curl -X GET "https://api.counterapi.dev/v2/rokctai/usage/up" \
          -H "Authorization: Bearer $API_KEY"

  node-ci:
    needs: telemetry
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 9 # Matches your ecosystem's typical version

      - name: Setup Cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager == 'pnpm' && 'pnpm' || inputs.package-manager }}

      - name: Install Dependencies
        run: ${{ inputs.package-manager }} install

      - name: Run Tests
        if: inputs.run-test == true
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: password
          DB_DATABASE: test_db
          # Standardized connection strings for migration scripts
          POSTGRES_URL: postgres://postgres:password@localhost:5432/test_db
          POSTGRES_URL_NON_POOLING: postgres://postgres:password@localhost:5432/test_db
        run: |
          if jq -e '.scripts.test' package.json > /dev/null; then
            echo "Test script detected. Running..."
            ${{ inputs.test-command }}
          else
            echo "No 'test' script found in package.json. Skipping tests."
          fi

      - name: Run Build
        if: inputs.run-build == true
        env:
          # Inject DB vars specifically for projects that run migrations during build (e.g., RokctAI_frontend)
          POSTGRES_URL: postgres://postgres:password@localhost:5432/test_db
          POSTGRES_URL_NON_POOLING: postgres://postgres:password@localhost:5432/test_db
        run: ${{ inputs.build-command }}
