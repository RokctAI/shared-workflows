name: Universal Node.js CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: write-all
on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '24'
      run-test:
        required: false
        type: boolean
        default: true
      run-build:
        required: false
        type: boolean
        default: true
      package-manager:
        required: false
        type: string
        default: 'pnpm' # npm, yarn, pnpm
      build-command:
        required: false
        type: string
        default: 'pnpm run build'
      test-command:
        required: false
        type: string
        default: 'pnpm run test'

    secrets:
      COUNTER_API_KEY:
        required: false
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

jobs:
  telemetry:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Track Usage (CounterAPI)
        env:
          API_KEY: ${{ secrets.COUNTER_API_KEY }}
        if: env.API_KEY != ''
        run: |
          curl -X GET "https://api.counterapi.dev/v2/rokctai/usage/up" \
          -H "Authorization: Bearer $API_KEY"

  node-ci:
    needs: telemetry
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 9 # Matches your ecosystem's typical version

      - name: Setup Cache
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager == 'pnpm' && 'pnpm' || inputs.package-manager }}

      - name: Install Dependencies
        run: ${{ inputs.package-manager }} install

      - name: Resolve Dynamic Client
        id: client
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          CLIENT=""
          if [[ "$REF_NAME" == build_* ]]; then
            # Extract client from branch name (e.g. build_clientname-v1 -> CLIENTNAME)
            CLIENT=$(printf '%s\n' "$REF_NAME" | cut -d'_' -f2 | cut -d'-' -f1 | tr -dc 'a-zA-Z0-9' | tr '[:lower:]' '[:upper:]')
          fi
          echo "client_upper=$CLIENT" >> $GITHUB_OUTPUT
          [ ! -z "$CLIENT" ] && echo "🔍 Detected Client: $CLIENT" || echo "ℹ️ Standard build (no client detected)"

      - name: Decode Production Environment
        env:
          CLIENT_ENV: ${{ steps.client.outputs.client_upper != '' && secrets[format('PRODUCTION_ENV_{0}', steps.client.outputs.client_upper)] || '' }}
          DEFAULT_ENV: ${{ secrets.PRODUCTION_ENV }}
        if: (env.CLIENT_ENV != '' || env.DEFAULT_ENV != '') && github.ref_name != 'develop'
        run: |
          ENV_CONTENT="$DEFAULT_ENV"
          if [ ! -z "$CLIENT_ENV" ]; then
             CLIENT_SUFFIX="${{ steps.client.outputs.client_upper }}"
             echo "✅ Using client-specific secret: PRODUCTION_ENV_${CLIENT_SUFFIX}"
             ENV_CONTENT="$CLIENT_ENV"
          fi
          
          if [ -n "$ENV_CONTENT" ]; then
             echo "$ENV_CONTENT" | base64 --decode > .env.raw
             
             # Truncate at NextJS marker
             if grep -q "##########END_NEXTJS##########" .env.raw; then
                echo "✂️ Node build: Stopping at ##########END_NEXTJS##########"
                sed -i '/##########END_NEXTJS##########/,$d' .env.raw
             fi

             # Normalize line endings
             sed -i 's/\r$//' .env.raw
             mv .env.raw .env
             echo "✅ .env ready for Node/NextJS."
          fi

      - name: Resolve Environment Variables
        if: inputs.run-build == true || inputs.run-test == true
        shell: bash
        run: |
          if [ -f ".env" ]; then
            echo ".env file detected. Interpolating internal variables..."
            set -a
            source .env
            set +a
            envsubst < .env > .env.expanded
            mv .env.expanded .env
            
            # Sanitise: Keep ONLY NEXT_PUBLIC_ variables for Next.js security
            if grep -q "^NEXT_PUBLIC_" .env; then
               grep "^NEXT_PUBLIC_" .env > .env.public
               mv .env.public .env
               echo "Sanitised .env: Only NEXT_PUBLIC_ variables retained."
            else
               echo "No NEXT_PUBLIC_ variables found to extract."
            fi
            
            echo "Interpolation & Extraction complete."
          fi

      - name: Run Tests
        if: inputs.run-test == true
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: password
          DB_DATABASE: test_db
          # Standardized connection strings for migration scripts
          POSTGRES_URL: postgres://postgres:password@localhost:5432/test_db
          POSTGRES_URL_NON_POOLING: postgres://postgres:password@localhost:5432/test_db
        run: |
          if jq -e '.scripts.test' package.json > /dev/null; then
            echo "Test script detected. Running..."
            ${{ inputs.test-command }}
          else
            echo "No 'test' script found in package.json. Skipping tests."
          fi

      - name: Run Build
        if: inputs.run-build == true
        env:
          # Inject DB vars specifically for projects that run migrations during build (e.g., RokctAI_frontend)
          POSTGRES_URL: postgres://postgres:password@localhost:5432/test_db
          POSTGRES_URL_NON_POOLING: postgres://postgres:password@localhost:5432/test_db
        run: ${{ inputs.build-command }}
