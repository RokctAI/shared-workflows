# Copyright 2024 RokctAI

name: Universal Flutter Import Healer

permissions: write-all
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PIP_BREAK_SYSTEM_PACKAGES: 1

on:
  workflow_call:
    inputs:
      flutter-channel:
        required: false
        type: string
        default: 'stable'
      flutter-version:
        required: false
        type: string
        default: ''
      java-version:
        required: false
        type: string
        default: '17'
    secrets:
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false
      GOOGLE_SERVICES_JSON:
        required: false
      MONOREPO_PAT:
        required: false

jobs:
  import-healer:
    name: 🩹 Import Healer
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          # Need full history so we can commit back
          fetch-depth: 0

      # Set identity immediately after checkout so every subsequent step
      # and subprocess (including flutter-import-healer.sh) can commit.
      # --global ensures subshells inherit it without needing $GITHUB_ENV.
      - name: Setup Bot Identity
        run: |
          git config --global user.name "RokctBOT[bot]"
          git config --global user.email "2956274+RokctBOT[bot]@users.noreply.github.com"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ inputs.java-version || '17' }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter-channel || 'stable' }}
          flutter-version: ${{ inputs.flutter-version }}
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      # Freezed/build_runner must run before we analyze so generated files exist
      - name: Generate Files (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # Write google-services.json stub if secret is missing so analyze doesn't
      # choke on a missing file that has nothing to do with imports
      - name: Stub Google Services (if secret missing)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "⚠️ GOOGLE_SERVICES_JSON not set — writing stub"
            mkdir -p android/app
            cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "stub-project",
              "storage_bucket": "stub-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.stub.app" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "stub_key" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          else
            echo "✅ GOOGLE_SERVICES_JSON present"
            mkdir -p android/app
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          fi

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true

      - name: Setup Remote URL
        run: |
          if [ -n "${{ steps.app-token.outputs.token }}" ]; then
            git remote set-url origin https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}
          else
            git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
          fi

      - name: Checkout Shared Workflows (for script)
        uses: actions/checkout@v6
        with:
          repository: RokctAI/shared-workflows
          token: ${{ steps.app-token.outputs.token || github.token }}
          path: .github/shared-workflows

      - name: Download Analyze Output (from lint job)
        uses: actions/download-artifact@v6
        with:
          name: flutter-analyze-output
          path: /tmp/analyze
        continue-on-error: true  # artifact may not exist if lint was skipped

      - name: Run Import Healer
        env:
          GIT_AUTHOR_NAME: "RokctBOT[bot]"
          GIT_AUTHOR_EMAIL: "2956274+RokctBOT[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "RokctBOT[bot]"
          GIT_COMMITTER_EMAIL: "2956274+RokctBOT[bot]@users.noreply.github.com"
          ANALYZE_OUTPUT_FILE: /tmp/analyze/flutter_analyze.txt
        run: |
          chmod +x .github/shared-workflows/scripts/flutter-import-healer.sh
          HEALER=.github/shared-workflows/scripts/flutter-import-healer.sh
          MAX_PASSES=5
          PASS=1
          # First pass uses the artifact from the lint job (if available)
          # Subsequent passes run flutter analyze fresh since imports have changed
          ANY_CHANGED=0
          while [ $PASS -le $MAX_PASSES ]; do
            echo ""
            echo "━━━ Import Healer Pass $PASS / $MAX_PASSES ━━━"
            if [ $PASS -gt 1 ]; then
              unset ANALYZE_OUTPUT_FILE
            fi
            # Run in no-commit mode — accumulate fixes, commit once at the end
            if HEALER_NO_COMMIT=1 bash $HEALER lib; then
              echo "✅ Healer complete after $PASS pass(es)."
              break
            else
              ANY_CHANGED=1
            fi
            PASS=$((PASS + 1))
          done

          if [ $PASS -gt $MAX_PASSES ]; then
            echo "⚠️ Healer reached max passes ($MAX_PASSES) — remaining issues need manual fix."
            echo "   See import-healer.log for details."
          fi

          # Single commit covering all passes
          if [ "$ANY_CHANGED" -eq 1 ]; then
            echo ""
            echo "▶ Committing all import fixes..."
            git add lib/
            git commit -m "fix: auto-heal missing imports [skip ci]"
            git push
            echo "❌ Imports fixed and committed. Pipeline will rerun against clean code."
            exit 1
          fi

      - name: Cleanup Shared Workflows Checkout
        if: always()
        run: rm -rf .github/shared-workflows

      - name: Upload Healer Log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: import-healer-log
          path: import-healer.log
          if-no-files-found: ignore