name: Universal Auto Release
on:
  workflow_call:
    inputs:
      version_file:
        description: 'Specific version file to check (optional)'
        type: string
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Version
        id: version
        uses: RokctAI/shared-workflows/.github/actions/check-version@main

      - name: Check Tag Exists
        id: check_tag
        run: |
          TAG="v${{ steps.version.outputs.version }}${{ steps.version.outputs.tag_suffix }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG does not exist. Creating..."
          fi

      - name: Create Tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          TAG="v${{ steps.version.outputs.version }}${{ steps.version.outputs.tag_suffix }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Generate Delta Zip
        if: steps.check_tag.outputs.exists == 'false'
        id: delta_zip
        run: |
          TAG="v${{ steps.version.outputs.version }}${{ steps.version.outputs.tag_suffix }}"
          
          # Find previous tag (sort by version refname)
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "$TAG" | head -n 1)
          
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found. Skipping delta zip."
            echo "zip_path=" >> $GITHUB_OUTPUT
          else
            echo "Creating delta from $PREV_TAG to $TAG"
            git diff --name-only "$PREV_TAG".."$TAG" > changed_files.txt
            zip -r update_package.zip -@ < changed_files.txt
            echo "zip_path=update_package.zip" >> $GITHUB_OUTPUT
          fi

      - name: Generate Changelog
        if: steps.check_tag.outputs.exists == 'false'
        id: changelog
        run: |
          TAG="v${{ steps.version.outputs.version }}${{ steps.version.outputs.tag_suffix }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "$TAG" | head -n 1)
          
          echo "## 🚀 Changes in $TAG" > changelog.txt
          echo "" >> changelog.txt
          
          if [ -z "$PREV_TAG" ]; then
            echo "- Initial Release" >> changelog.txt
          else
            echo "Changes since $PREV_TAG:" >> changelog.txt
            git log "$PREV_TAG"..HEAD --pretty=format:"* %s (%h)" >> changelog.txt
          fi
          
          echo "changelog_path=changelog.txt" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ steps.version.outputs.version }}${{ steps.version.outputs.tag_suffix }}"
          name: "v${{ steps.version.outputs.version }}${{ steps.version.outputs.tag_suffix }}"
          body_path: ${{ steps.changelog.outputs.changelog_path }}
          generate_release_notes: true
          files: |
            ${{ steps.delta_zip.outputs.zip_path }}
