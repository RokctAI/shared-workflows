name: Universal License Eye

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: write-all
on:
  workflow_call:
    secrets:
      COUNTER_API_KEY:
        required: false

jobs:
  telemetry:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Track Usage
        env:
          API_KEY: ${{ secrets.COUNTER_API_KEY }}
        if: env.API_KEY != ''
        run: |
          curl -X GET "https://api.counterapi.dev/v2/rokctai/usage/up" \
          -H "Authorization: Bearer $API_KEY"

  license-check:
    needs: telemetry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check License Headers
        uses: apache/skywalking-eyes/header@v0.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mode: check
          config: |
            header:
              license:
                spdx-id: MIT
                content: |
                  Copyright 2024 RokctAI
            paths:
              - '**/*.py'
              - '**/*.js'
              - '**/*.ts'
              - '**/*.dart'
            paths-ignore:
              - '**/*.json'
              - '**/*.md'
              - '**/*.yml'
              - '**/dist/**'
              - '**/node_modules/**'
