name: Universal Auto Merge

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PIP_BREAK_SYSTEM_PACKAGES: 1

permissions: write-all
on:
  workflow_call:
    inputs:
      allowed_users:
        description: 'Comma-separated list of users allowed to auto-merge'
        type: string
        default: 'Rendani Sinyage,RendaniSinyage,RokctBOT,RokctBOT[bot]'
      standardizer_bots:
        description: >-
          Comma-separated bot logins (matched case-insensitively) whose
          "Fleet Standardization" auto-std-* PRs may auto-merge when their diff
          is whitespace-only. Independent of allowed_users. Empty disables it.
        type: string
        default: 'rokctbot[bot]'
    secrets:
      COUNTER_API_KEY:
        required: false

jobs:
  telemetry:
    runs-on: ubuntu-latest
    # Counts merge-workflow usage, which means PR evaluations. The caller's
    # hourly `schedule` trigger is not usage: letting it through would spend a
    # runner every hour in every consumer repo and bury the PR-driven signal
    # under ~24 automated hits per repo per day. Same guard as `auto-merge`.
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - name: Track Usage
        env:
          API_KEY: ${{ secrets.COUNTER_API_KEY }}
        if: env.API_KEY != ''
        run: |
          curl -X GET "https://api.counterapi.dev/v2/rokctai/usage/up" \
          -H "Authorization: Bearer $API_KEY"

  auto-merge:
    needs: telemetry
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check Author
        id: check_author
        run: |
          AUTHOR="${{ github.event.pull_request.user.login }}"
          ALLOWED="${{ inputs.allowed_users }}"
          ALLOWED="${ALLOWED// /}"
          BOTS="${{ inputs.standardizer_bots }}"
          BOTS="${BOTS// /}"
          if [[ ",$ALLOWED," == *",$AUTHOR,"* ]]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$AUTHOR" ] && [[ ",${BOTS,,}," == *",${AUTHOR,,},"* ]]; then
            # Standardizer bot: authorized ONLY for the formatter lane; the
            # trivial gate below still requires a whitespace-only auto-std diff.
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check Files + Trivial Diff
        id: check_files
        run: |
          # Formatter-only lane for the fleet standardizer (universal-linter's
          # `auto-std-<branch>` PRs). Returns 0 only when ALL hold:
          #   - author is in STANDARDIZER_BOTS (case-insensitive exact login),
          #   - head branch is `auto-std-*` in this same repo (no forks),
          #   - title contains "Fleet Standardization:",
          #   - every changed file is `modified` (no adds/deletes/renames),
          #     at most 100 files, and
          #   - each file is byte-identical between base and head once all
          #     whitespace is removed, i.e. the diff only moves whitespace /
          #     line breaks (dart format, shfmt, prettier reflow). Token
          #     changes (quotes, trailing commas, ruff --fix) do NOT qualify.
          # The .github/workflows/ gate runs before this and is unaffected.
          std_format_only() {
            local num="$1" author="$2" ref="$3" head_repo="$4" title="$5"
            local base_sha="$6" head_sha="$7" bot ok=false
            local bots="${STANDARDIZER_BOTS// /}"
            IFS=',' read -ra _bots <<< "${bots,,}"
            for bot in "${_bots[@]}"; do
              [ -n "$bot" ] && [ "${author,,}" = "$bot" ] && ok=true
            done
            [ "$ok" = true ] || return 1
            [[ "$ref" == auto-std-* ]] || return 1
            [ "$head_repo" = "$GH_REPO" ] || return 1
            [[ "$title" == *"Fleet Standardization:"* ]] || return 1

            local files
            files=$(gh api --paginate "repos/${GH_REPO}/pulls/${num}/files?per_page=100" \
              --jq '.[] | [.status, .filename] | @tsv') || return 1
            [ -n "$files" ] || return 1
            [ "$(printf '%s\n' "$files" | wc -l)" -le 100 ] || return 1

            local status path a b
            while IFS=$'\t' read -r status path; do
              [ "$status" = "modified" ] || return 1
              a=$(gh api -H "Accept: application/vnd.github.raw" \
                "repos/${GH_REPO}/contents/${path}?ref=${base_sha}" | tr -d '[:space:]' | sha256sum) || return 1
              b=$(gh api -H "Accept: application/vnd.github.raw" \
                "repos/${GH_REPO}/contents/${path}?ref=${head_sha}" | tr -d '[:space:]' | sha256sum) || return 1
              [ "$a" = "$b" ] || return 1
            done <<< "$files"
            return 0
          }

          FILES=$(gh pr view "${{ github.event.pull_request.number }}" --json files --jq '.files[].path')

          if echo "$FILES" | grep -q ".github/workflows/"; then
            echo "safe=false" >> "$GITHUB_OUTPUT"
          else
            echo "safe=true" >> "$GITHUB_OUTPUT"
          fi

          # GitHub refuses to render diffs for PRs over 300 files (HTTP 406 too_large).
          # Such a PR is by definition not trivial — treat it as non-trivial, don't fail.
          if ! DIFF=$(gh pr diff "${{ github.event.pull_request.number }}"); then
            DIFF="(diff unavailable: too large to render)"
          fi

          if [ -z "$DIFF" ]; then
            echo "trivial=true" >> "$GITHUB_OUTPUT"
          elif std_format_only "$PR_NUMBER" "$PR_AUTHOR" "$PR_HEAD_REF" "$PR_HEAD_REPO" "$PR_TITLE" "$PR_BASE_SHA" "$PR_HEAD_SHA"; then
            echo "Standardizer PR with whitespace-only diff: treated as trivial."
            echo "trivial=true" >> "$GITHUB_OUTPUT"
          else
            echo "trivial=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Checked files: $FILES"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          STANDARDIZER_BOTS: ${{ inputs.standardizer_bots }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Enable Auto Merge
        if: |
          steps.check_author.outputs.authorized == 'true' &&
          steps.check_files.outputs.safe == 'true' &&
          steps.check_files.outputs.trivial == 'true'
        run: gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Second evaluation opportunity for the same PRs the fast path above judges.
  #
  # The fast path is driven by the caller's `pull_request` trigger, so a PR gets
  # exactly one merge evaluation per push. If that evaluation does not arm
  # auto-merge — the PR was not mergeable yet, `gh pr merge --auto` was refused,
  # or a gate was not satisfied at that instant — nothing re-evaluates it, and a
  # PR that turns green minutes later stays open indefinitely.
  #
  # This job runs from the caller's `schedule` trigger. Scheduled runs execute
  # from the default branch and carry no `github.event.pull_request`, so the
  # candidate PRs are enumerated from the REST API instead. `pulls` is read via
  # `gh api` rather than `gh pr list` so that `user.login` is the same string the
  # webhook payload carries for GitHub App authors (`name[bot]`), keeping the
  # author gate character-for-character identical to the fast path.
  #
  # Gating is deliberately unchanged: same author list, same
  # `.github/workflows/` file rule, same trivial-diff rule. Drafts and PRs that
  # already have auto-merge armed are skipped — both are strictly narrower than
  # the fast path and only avoid calls that could not succeed anyway.
  #
  # No loop risk: `schedule` cannot be raised by a workflow, and the only write
  # this job performs is arming GitHub's native auto-merge, which pushes nothing.
  sweep:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Re-evaluate Open Pull Requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ALLOWED_USERS: ${{ inputs.allowed_users }}
          STANDARDIZER_BOTS: ${{ inputs.standardizer_bots }}
        run: |
          ALLOWED="${ALLOWED_USERS// /}"
          BOTS="${STANDARDIZER_BOTS// /}"

          # Formatter-only lane for the fleet standardizer (universal-linter's
          # `auto-std-<branch>` PRs). Returns 0 only when ALL hold:
          #   - author is in STANDARDIZER_BOTS (case-insensitive exact login),
          #   - head branch is `auto-std-*` in this same repo (no forks),
          #   - title contains "Fleet Standardization:",
          #   - every changed file is `modified` (no adds/deletes/renames),
          #     at most 100 files, and
          #   - each file is byte-identical between base and head once all
          #     whitespace is removed, i.e. the diff only moves whitespace /
          #     line breaks (dart format, shfmt, prettier reflow). Token
          #     changes (quotes, trailing commas, ruff --fix) do NOT qualify.
          # The .github/workflows/ gate runs before this and is unaffected.
          std_format_only() {
            local num="$1" author="$2" ref="$3" head_repo="$4" title="$5"
            local base_sha="$6" head_sha="$7" bot ok=false
            local bots="${STANDARDIZER_BOTS// /}"
            IFS=',' read -ra _bots <<< "${bots,,}"
            for bot in "${_bots[@]}"; do
              [ -n "$bot" ] && [ "${author,,}" = "$bot" ] && ok=true
            done
            [ "$ok" = true ] || return 1
            [[ "$ref" == auto-std-* ]] || return 1
            [ "$head_repo" = "$GH_REPO" ] || return 1
            [[ "$title" == *"Fleet Standardization:"* ]] || return 1

            local files
            files=$(gh api --paginate "repos/${GH_REPO}/pulls/${num}/files?per_page=100" \
              --jq '.[] | [.status, .filename] | @tsv') || return 1
            [ -n "$files" ] || return 1
            [ "$(printf '%s\n' "$files" | wc -l)" -le 100 ] || return 1

            local status path a b
            while IFS=$'\t' read -r status path; do
              [ "$status" = "modified" ] || return 1
              a=$(gh api -H "Accept: application/vnd.github.raw" \
                "repos/${GH_REPO}/contents/${path}?ref=${base_sha}" | tr -d '[:space:]' | sha256sum) || return 1
              b=$(gh api -H "Accept: application/vnd.github.raw" \
                "repos/${GH_REPO}/contents/${path}?ref=${head_sha}" | tr -d '[:space:]' | sha256sum) || return 1
              [ "$a" = "$b" ] || return 1
            done <<< "$files"
            return 0
          }

          gh api --paginate "repos/${GH_REPO}/pulls?state=open&per_page=100" \
            --jq '.[] | [.number, (.draft|tostring), (.auto_merge != null|tostring), .user.login, .html_url, .head.ref, (.head.repo.full_name // ""), .base.sha, .head.sha, .title] | @tsv' \
            > open_prs.tsv

          if [ ! -s open_prs.tsv ]; then
            echo "No open pull requests to re-evaluate."
            exit 0
          fi

          while IFS=$'\t' read -r NUM DRAFT ARMED AUTHOR URL HEAD_REF HEAD_REPO BASE_SHA HEAD_SHA TITLE; do
            [ -n "$NUM" ] || continue

            if [ "$DRAFT" = "true" ]; then
              echo "PR #${NUM}: skipped (draft)"
              continue
            fi

            if [ "$ARMED" = "true" ]; then
              echo "PR #${NUM}: skipped (auto-merge already armed)"
              continue
            fi

            IS_STD_BOT=false
            if [ -n "$AUTHOR" ] && [[ ",${BOTS,,}," == *",${AUTHOR,,},"* ]]; then
              IS_STD_BOT=true
            fi

            if [ "$IS_STD_BOT" != true ] && [[ ",$ALLOWED," != *",$AUTHOR,"* ]]; then
              echo "PR #${NUM}: skipped (author '${AUTHOR}' not in allowed_users)"
              continue
            fi

            FILES=$(gh pr view "$NUM" --json files --jq '.files[].path')
            if echo "$FILES" | grep -q ".github/workflows/"; then
              echo "PR #${NUM}: skipped (touches .github/workflows/)"
              continue
            fi

            # GitHub refuses to render diffs for PRs over 300 files (HTTP 406 too_large).
            # Such a PR is by definition not trivial — treat it as non-trivial, don't fail.
            if ! DIFF=$(gh pr diff "$NUM"); then
              DIFF="(diff unavailable: too large to render)"
            fi

            if [ -n "$DIFF" ] && ! std_format_only "$NUM" "$AUTHOR" "$HEAD_REF" "$HEAD_REPO" "$TITLE" "$BASE_SHA" "$HEAD_SHA"; then
              echo "PR #${NUM}: skipped (diff not trivial)"
              continue
            fi

            echo "PR #${NUM}: all gates passed — enabling auto-merge"
            gh pr merge --auto --squash "$URL" || echo "PR #${NUM}: enabling auto-merge failed; will retry on the next sweep"
          done < open_prs.tsv
