name: Universal Auto Merge

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PIP_BREAK_SYSTEM_PACKAGES: 1

permissions: write-all
on:
  workflow_call:
    inputs:
      allowed_users:
        description: 'Comma-separated list of users allowed to auto-merge'
        type: string
        default: 'Rendani Sinyage,RendaniSinyage,RokctBOT,RokctBOT[bot]'
      standardizer_bots:
        description: >-
          Comma-separated bot logins (matched case-insensitively) whose
          PRs may auto-merge, subject to the same .github/workflows/ file gate
          as allowed_users. Independent of allowed_users. Empty disables it.
        type: string
        default: 'rokctbot[bot]'
      build_workflow:
        description: >-
          File name of the caller's build workflow under .github/workflows/
          (e.g. build.yml). After an auto-merge lands it is dispatched, because
          the merge itself starts no push-triggered run. Repositories without
          this workflow, or whose copy has no workflow_dispatch trigger, are
          skipped. Empty disables the dispatch.
        type: string
        default: 'build.yml'
      build_branches:
        description: >-
          Comma-separated branches whose auto-merged PRs get a build dispatched
          (the branches the build workflow builds on push).
        type: string
        default: 'main,develop'
    secrets:
      COUNTER_API_KEY:
        required: false

jobs:
  telemetry:
    runs-on: ubuntu-latest
    # Counts merge-workflow usage, which means PR evaluations. The caller's
    # hourly `schedule` trigger is not usage: letting it through would spend a
    # runner every hour in every consumer repo and bury the PR-driven signal
    # under ~24 automated hits per repo per day. Same guard as `auto-merge`.
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - name: Track Usage
        env:
          API_KEY: ${{ secrets.COUNTER_API_KEY }}
        if: env.API_KEY != ''
        run: |
          curl -X GET "https://api.counterapi.dev/v2/rokctai/usage/up" \
          -H "Authorization: Bearer $API_KEY"

  auto-merge:
    needs: telemetry
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      merged: ${{ steps.merge_state.outputs.merged }}
    steps:
      - name: Check Author
        id: check_author
        run: |
          AUTHOR="${{ github.event.pull_request.user.login }}"
          ALLOWED="${{ inputs.allowed_users }}"
          ALLOWED="${ALLOWED// /}"
          BOTS="${{ inputs.standardizer_bots }}"
          BOTS="${BOTS// /}"
          if [[ ",$ALLOWED," == *",$AUTHOR,"* ]]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$AUTHOR" ] && [[ ",${BOTS,,}," == *",${AUTHOR,,},"* ]]; then
            # Standardizer bot: authorized like allowed_users; the
            # .github/workflows/ file gate below still applies.
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check Files
        id: check_files
        run: |
          FILES=$(gh pr view "${{ github.event.pull_request.number }}" --json files --jq '.files[].path')

          if echo "$FILES" | grep -q ".github/workflows/"; then
            echo "safe=false" >> "$GITHUB_OUTPUT"
          else
            echo "safe=true" >> "$GITHUB_OUTPUT"
          fi

          echo "Checked files: $FILES"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Enable Auto Merge
        if: |
          steps.check_author.outputs.authorized == 'true' &&
          steps.check_files.outputs.safe == 'true'
        run: gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `gh pr merge --auto` merges on the spot when nothing is pending. Report
      # that so post-merge-build can start the build straight away instead of
      # waiting for the next scheduled sweep.
      - name: Check Merge State
        id: merge_state
        if: |
          steps.check_author.outputs.authorized == 'true' &&
          steps.check_files.outputs.safe == 'true'
        run: |
          STATE=$(gh pr view "${{ github.event.pull_request.number }}" --json state --jq .state || echo UNKNOWN)
          echo "PR state: $STATE"
          if [ "$STATE" = "MERGED" ]; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  # Second evaluation opportunity for the same PRs the fast path above judges.
  #
  # The fast path is driven by the caller's `pull_request` trigger, so a PR gets
  # exactly one merge evaluation per push. If that evaluation does not arm
  # auto-merge — the PR was not mergeable yet, `gh pr merge --auto` was refused,
  # or a gate was not satisfied at that instant — nothing re-evaluates it, and a
  # PR that turns green minutes later stays open indefinitely.
  #
  # This job runs from the caller's `schedule` trigger. Scheduled runs execute
  # from the default branch and carry no `github.event.pull_request`, so the
  # candidate PRs are enumerated from the REST API instead. `pulls` is read via
  # `gh api` rather than `gh pr list` so that `user.login` is the same string the
  # webhook payload carries for GitHub App authors (`name[bot]`), keeping the
  # author gate character-for-character identical to the fast path.
  #
  # Gating is deliberately unchanged: same author list, same
  # `.github/workflows/` file rule. Drafts and PRs that
  # already have auto-merge armed are skipped — both are strictly narrower than
  # the fast path and only avoid calls that could not succeed anyway.
  #
  # No loop risk: `schedule` cannot be raised by a workflow, and the only write
  # this job performs is arming GitHub's native auto-merge, which pushes nothing.
  sweep:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Re-evaluate Open Pull Requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ALLOWED_USERS: ${{ inputs.allowed_users }}
          STANDARDIZER_BOTS: ${{ inputs.standardizer_bots }}
        run: |
          ALLOWED="${ALLOWED_USERS// /}"
          BOTS="${STANDARDIZER_BOTS// /}"


          gh api --paginate "repos/${GH_REPO}/pulls?state=open&per_page=100" \
            --jq '.[] | [.number, (.draft|tostring), (.auto_merge != null|tostring), .user.login, .html_url] | @tsv' \
            > open_prs.tsv

          if [ ! -s open_prs.tsv ]; then
            echo "No open pull requests to re-evaluate."
            exit 0
          fi

          while IFS=$'\t' read -r NUM DRAFT ARMED AUTHOR URL; do
            [ -n "$NUM" ] || continue

            if [ "$DRAFT" = "true" ]; then
              echo "PR #${NUM}: skipped (draft)"
              continue
            fi

            if [ "$ARMED" = "true" ]; then
              echo "PR #${NUM}: skipped (auto-merge already armed)"
              continue
            fi

            IS_STD_BOT=false
            if [ -n "$AUTHOR" ] && [[ ",${BOTS,,}," == *",${AUTHOR,,},"* ]]; then
              IS_STD_BOT=true
            fi

            if [ "$IS_STD_BOT" != true ] && [[ ",$ALLOWED," != *",$AUTHOR,"* ]]; then
              echo "PR #${NUM}: skipped (author '${AUTHOR}' not in allowed_users)"
              continue
            fi

            FILES=$(gh pr view "$NUM" --json files --jq '.files[].path')
            if echo "$FILES" | grep -q ".github/workflows/"; then
              echo "PR #${NUM}: skipped (touches .github/workflows/)"
              continue
            fi

            echo "PR #${NUM}: all gates passed — enabling auto-merge"
            gh pr merge --auto --squash "$URL" || echo "PR #${NUM}: enabling auto-merge failed; will retry on the next sweep"
          done < open_prs.tsv

  # Start the build for merges that auto-merge landed.
  #
  # Auto-merge is armed with GITHUB_TOKEN, so the merge is attributed to that
  # token and GitHub starts no workflow run from the resulting push: the caller's
  # build workflow never runs on main for auto-merged PRs. workflow_dispatch is
  # the documented exception to that rule, so this job dispatches the build from
  # the base repository with the same GITHUB_TOKEN. No PAT or App token is
  # involved, so it behaves the same for outside contributors' PRs.
  #
  # It runs right after the fast path when that path merged the PR on the spot,
  # and on every scheduled sweep for merges that completed later. For each
  # branch in build_branches it looks only at the branch head, and dispatches
  # when all of these hold, which is when a normal merge would have built:
  #   - the head commit came from a merged PR, in the last 24 hours;
  #   - its message carries no [skip ci]-style marker;
  #   - it changes something other than Markdown (the build's paths-ignore);
  #   - the build workflow has no run for that commit yet (so a push build, or
  #     an earlier dispatch, is never duplicated).
  post-merge-build:
    needs: auto-merge
    runs-on: ubuntu-latest
    if: |
      always() && inputs.build_workflow != '' && (
        github.event_name == 'schedule' ||
        (github.event_name == 'pull_request' && needs.auto-merge.outputs.merged == 'true')
      )
    continue-on-error: true
    steps:
      - name: Dispatch Build For Auto-Merged Commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BUILD_WORKFLOW: ${{ inputs.build_workflow }}
          BUILD_BRANCHES: ${{ inputs.build_branches }}
        run: |
          if ! gh api "repos/${GH_REPO}/actions/workflows/${BUILD_WORKFLOW}" --jq .state > wf_state 2>/dev/null; then
            echo "No ${BUILD_WORKFLOW} in ${GH_REPO}; nothing to dispatch."
            exit 0
          fi
          if [ "$(cat wf_state)" != "active" ]; then
            echo "${BUILD_WORKFLOW} is $(cat wf_state); nothing to dispatch."
            exit 0
          fi

          CUTOFF=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          BRANCHES="${BUILD_BRANCHES// /}"

          for BRANCH in ${BRANCHES//,/ }; do
            [ -n "$BRANCH" ] || continue

            if ! gh api "repos/${GH_REPO}/commits/${BRANCH}" > head.json 2>/dev/null; then
              echo "${BRANCH}: branch not found; skipped"
              continue
            fi
            SHA=$(jq -r .sha head.json)
            DATE=$(jq -r .commit.committer.date head.json)
            MSG=$(jq -r .commit.message head.json)

            if [[ "$DATE" < "$CUTOFF" ]]; then
              echo "${BRANCH}@${SHA:0:7}: older than 24h; skipped"
              continue
            fi

            if printf '%s' "$MSG" | grep -qiE '\[(skip ci|ci skip|no ci|skip actions|actions skip)\]'; then
              echo "${BRANCH}@${SHA:0:7}: carries a skip-ci marker; skipped"
              continue
            fi

            if ! jq -r '.files[].filename' head.json | grep -qv '\.md$'; then
              echo "${BRANCH}@${SHA:0:7}: Markdown-only change; skipped"
              continue
            fi

            PR=$(gh api "repos/${GH_REPO}/commits/${SHA}/pulls" \
              --jq '[.[] | select(.merged_at != null) | .number] | first // empty' 2>/dev/null || true)
            if [ -z "$PR" ]; then
              echo "${BRANCH}@${SHA:0:7}: not a merged PR; skipped"
              continue
            fi

            RUNS=$(gh api "repos/${GH_REPO}/actions/workflows/${BUILD_WORKFLOW}/runs?head_sha=${SHA}&per_page=1" \
              --jq .total_count 2>/dev/null || echo error)
            if [ "$RUNS" != "0" ]; then
              echo "${BRANCH}@${SHA:0:7}: ${BUILD_WORKFLOW} runs for it: ${RUNS}; skipped"
              continue
            fi

            echo "${BRANCH}@${SHA:0:7}: PR #${PR} merged with no build; dispatching ${BUILD_WORKFLOW}"
            gh workflow run "$BUILD_WORKFLOW" --ref "$BRANCH" \
              || echo "${BRANCH}: dispatch refused (does ${BUILD_WORKFLOW} have a workflow_dispatch trigger?)"
          done
