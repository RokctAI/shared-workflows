name: Universal Auto Merge
on:
  workflow_call:
    inputs:
      allowed_users:
        description: 'Comma-separated list of users allowed to auto-merge'
        type: string
        default: 'Rendani Sinyage,RendaniSinyage'

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check Author
        id: check_author
        run: |
          AUTHOR="${{ github.event.pull_request.user.login }}"
          ALLOWED="${{ inputs.allowed_users }}"
          if [[ ",$ALLOWED," == *",$AUTHOR,"* ]]; then
            echo "User $AUTHOR is authorized."
            echo "authorized=true" >> $GITHUB_OUTPUT
          else
            echo "User $AUTHOR is NOT authorized."
            echo "authorized=false" >> $GITHUB_OUTPUT
          fi

      - name: Check Critical Files
        id: check_files
        run: |
          # Fetch list of changed files
          FILES=$(gh pr view ${{ github.event.pull_request.number }} --json files --jq '.files[].path')
          
          # Check for dangerous changes
          if echo "$FILES" | grep -q ".github/workflows/"; then
            echo "Critical files changed (.github/workflows). Auto-merge DISABLED."
            echo "safe=false" >> $GITHUB_OUTPUT
          else
            echo "No critical configuration files changed."
            echo "safe=true" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable Auto Merge
        # Only merge if:
        # 1. User is authorized
        # 2. No critical files (.github/workflows) are changed
        if: steps.check_author.outputs.authorized == 'true' && steps.check_files.outputs.safe == 'true'
        run: gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
