name: Installer Self-Test

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'install.sh'
      - 'install.ps1'
      - 'examples/**'
  pull_request:
    branches: [ main, develop ]

jobs:
  test-bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Bash Installer (Standard Bypass)
        run: |
          mkdir test-standard
          cd test-standard
          git init
          # Pipe "n" for No customization (Bypass)
          echo "n" | bash ../install.sh
          
          # Verification
          test -d .github/workflows
          test -f .github/dependabot.yml
          test -f version.json
          grep "project_type: 'smart'" .github/workflows/build.yml
          grep "release_strategy: 'immediate'" .github/workflows/release.yml

      - name: Run Bash Installer (Customized Flutter)
        run: |
          mkdir test-flutter
          cd test-flutter
          git init
          # y (Customize) -> 2 (Flutter) -> [Enter] (Strategy) -> [Enter] (Cron) -> [Enter] (Node) -> [Enter] (Python)
          printf "y\n2\n\n\n\n\n" | bash ../install.sh
          
          # Verification
          test -d .github/workflows
          test -f .github/dependabot.yml
          if [ -f version.json ]; then echo "Flutter should NOT have version.json"; exit 1; fi
          grep "project_type: 'flutter'" .github/workflows/build.yml

  test-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PowerShell Installer (Standard Bypass)
        shell: pwsh
        run: |
          mkdir test-standard-ps
          cd test-standard-ps
          git init
          # Pipe "n" for No customization
          echo "n" | pwsh ../install.ps1
          
          # Verification
          if (!(Test-Path .github/workflows)) { throw "Workflows dir not found" }
          if (!(Test-Path .github/dependabot.yml)) { throw "Dependabot not found" }
          $content = Get-Content .github/workflows/build.yml -Raw
          if ($content -notmatch "project_type: 'smart'") { throw "Standard patching failed" }

      - name: Run PowerShell Installer (Customized Node)
        shell: pwsh
        run: |
          mkdir test-node-ps
          cd test-node-ps
          git init
          # y (Customize) -> 4 (Node) -> 1.2.3 (Version) -> 3 (weekly-rc) -> 0 0 * * * (Cron) -> 20 (Node) -> 3.12 (Python)
          # Note: We use an array of strings to simulate multiple inputs in PWSH
          @("y", "4", "1.2.3", "3", "0 0 * * *", "20", "3.12") | pwsh ../install.ps1
          
          # Verification
          $buildWf = Get-Content .github/workflows/build.yml -Raw
          if ($buildWf -notmatch "project_type: 'node'") { throw "Node project type patching failed" }
          if ($buildWf -notmatch "default: '20'") { throw "Node version patching failed" }
          
          $releaseWf = Get-Content .github/workflows/release.yml -Raw
          if ($releaseWf -notmatch "release_strategy: 'weekly-rc'") { throw "Strategy patching failed" }
          if ($releaseWf -notmatch "cron: '0 0 \* \* \*'") { throw "Cron patching failed" }
          
          $ver = Get-Content version.json | ConvertFrom-Json
          if ($ver.version -ne "1.2.3") { throw "Version.json creation failed" }
