name: Code Quality

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: write-all
on:
  workflow_dispatch:
    inputs:
      run_verify:
        type: boolean
        default: true
        description: "Run continuous verification on Android emulator"

      backfill_ai_notes_cutoff_version:
        type: string
        default: ""
        description: "Regenerate AI release notes starting from this version (use 'all' for full history)"

  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    uses: RokctAI/shared-workflows/.github/workflows/universal-linter.yml@fed18a76a3107bcd8293a24d3e949addfdd09e84 # main
    secrets: inherit


