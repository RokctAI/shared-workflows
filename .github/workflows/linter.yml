name: Code Quality

permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    uses: RokctAI/shared-workflows/.github/workflows/universal-linter.yml@main
    secrets: inherit


