name: Universal Code Quality (Lint)

on:
  workflow_call:
    inputs:
      run-build-runner:
        required: false
        type: boolean
        default: false
        description: "Run build_runner before analyzing Flutter code"
    secrets:
      COUNTER_API_KEY:
        required: false

jobs:
  telemetry:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Track Usage
        env:
          API_KEY: ${{ secrets.COUNTER_API_KEY }}
        if: env.API_KEY != ''
        run: |
          curl -X GET "https://api.counterapi.dev/v2/rokctai/usage/up" \
          -H "Authorization: Bearer $API_KEY"

  lint-python:
    needs: telemetry
    name: 🐍 Python Lint (Flake8)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Python
        id: check_python
        run: |
          if [ -f "requirements.txt" ] || [ -f "pyproject.toml" ] || [ -f "setup.py" ] || [ -f "Pipfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Set up Python
        if: steps.check_python.outputs.exists == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Lint Tools
        if: steps.check_python.outputs.exists == 'true'
        run: |
          pip install flake8 autopep8

      - name: Auto-fix Whitespace (excluding F401)
        if: steps.check_python.outputs.exists == 'true'
        run: |
          # Run autopep8 to fix standard formatting issues (E1, E2, E3, W2, W3, etc.)
          # Exclude .github directory to avoid permission issues with workflows
          autopep8 --in-place --recursive --aggressive --aggressive --exclude .github .

      - name: Run Flake8
        if: steps.check_python.outputs.exists == 'true'
        run: |
          # Capture output to a file for issue reporting but still exit with 0 to be non-blocking
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics > flake8_output.txt 2>&1 || true
          flake8 . --count --max-complexity=10 --max-line-length=120 \
            --ignore=E501,W503,W504,W191,W291,W292,W293,W391,E261,E265,E302,E303,E305,E111,E114,E116,E117,E127,E128,E225,E226,E401,F401,F841 \
            --statistics >> flake8_output.txt 2>&1
          
          # Print for log visibility
          cat flake8_output.txt
          
          # Set output if findings exist (contains :)
          if grep -q ":" flake8_output.txt; then
             echo "findings=true" >> $GITHUB_ENV
          else
             echo "findings=false" >> $GITHUB_ENV
          fi

      - name: Create Issue on Findings
        if: env.findings == 'true' && steps.check_python.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="### 🐍 Python Lint Failure
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}
          
          #### Error Summary:
          \`\`\`
          $(head -c 2000 flake8_output.txt)
          \`\`\`
          "
          gh issue create --title "🚨 CI: Python Lint Failure" --body "$BODY" --label "CI Blocker" || echo "Issue already exists or failed to create."

      - name: Commit Auto-fixes
        if: steps.check_python.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "style: automated whitespace/lint fixes [skip ci]"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No changes to commit."
          fi

  lint-flutter:
    needs: telemetry
    name: 🐦 Flutter Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Flutter
        id: check_flutter
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Helper - Subosito Flutter
        if: steps.check_flutter.outputs.exists == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto-fix Whitespace (Flutter)
        if: steps.check_flutter.outputs.exists == 'true'
        run: |
          # Format only lib, test, and other source dirs, avoiding .github
          if [ -d "lib" ]; then dart format lib; fi
          if [ -d "test" ]; then dart format test; fi
          if [ -d "source" ]; then dart format source; fi

      - name: Run Flutter Analyze
        if: steps.check_flutter.outputs.exists == 'true'
        run: |
          flutter config --no-analytics
          flutter pub get
          # Non-blocking analysis
          flutter analyze . --no-fatal-warnings > flutter_output.txt 2>&1 || true
          
          # Set output if findings exist (contains :)
          if grep -q ":" flutter_output.txt; then
             echo "findings=true" >> $GITHUB_ENV
          else
             echo "findings=false" >> $GITHUB_ENV
          fi

      - name: Create Issue on Findings
        if: env.findings == 'true' && steps.check_flutter.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="### 🐦 Flutter Analysis Failure
          **Commit:** ${{ github.sha }}
          
          #### Output:
          \`\`\`
          $(head -c 2000 flutter_output.txt)
          \`\`\`
          "
          gh issue create --title "🚨 CI: Flutter Analysis Failure" --body "$BODY" --label "CI Blocker" || echo "Issue already exists."

      - name: Commit Auto-fixes
        if: steps.check_flutter.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "style: automated flutter formatting [skip ci]"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No changes to commit."
          fi

  lint-node:
    needs: telemetry
    name: 📦 JS/TS Lint (ESLint & Security)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Node
        id: check_node
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Setup Node
        if: steps.check_node.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Auto-fix Whitespace (Node)
        if: steps.check_node.outputs.exists == 'true'
        run: |
          if npx prettier --version > /dev/null 2>&1; then
             npx prettier --write . --ignore-path .gitignore --plugin-search-dir=. --ignore-unknown . '!**/.github/workflows/**'
          elif npm list eslint > /dev/null 2>&1; then
             npx eslint . --ext .js,.jsx,.ts,.tsx --fix --ignore-pattern ".github/workflows"
          fi

      - name: Run NPM Audit
        if: steps.check_node.outputs.exists == 'true'
        run: |
          npm audit --audit-level=high > npm_audit_output.txt 2>&1 || true
          
          # Set findings if vulnerabilities found (contains "high" or "critical")
          if grep -qEi "high|critical" npm_audit_output.txt; then
             echo "audit_findings=true" >> $GITHUB_ENV
          else
             echo "audit_findings=false" >> $GITHUB_ENV
          fi

      - name: Create Issue on Audit Findings
        if: env.audit_findings == 'true' && steps.check_node.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="### 📦 Node Security Audit Failure
          **High/Critical vulnerabilities found.**
          
          #### Audit Summary:
          \`\`\`
          $(head -c 2000 npm_audit_output.txt)
          \`\`\`
          "
          gh issue create --title "🚨 CI: Node Security Alert (High/Critical)" --body "$BODY" --label "Security" || echo "Issue already exists."

      - name: Run ESLint
        if: steps.check_node.outputs.exists == 'true'
        run: |
          if npm list eslint > /dev/null 2>&1; then
             npx eslint . --ext .js,.jsx,.ts,.tsx
          fi

      - name: Commit Auto-fixes
        if: steps.check_node.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "style: automated node formatting [skip ci]"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No changes to commit."
          fi
