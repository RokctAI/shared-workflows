          # SDK repos are private; the composer injects this token into its
          # git clone URLs (see sdk_composer.py authenticated_git_url).
          MONOREPO_PAT: ${{ secrets.MONOREPO_PAT }}
        run: |
          # Shell apps declare pubspec path dependencies into .rokct/cache/,
          # which only exist after the composer clones the SDK repos pinned in
          # composer.json. Without composing first, `flutter pub get` (and
          # therefore `flutter analyze`) can never succeed on a fresh runner.
          # Must run AFTER the Flutter setup step: the composer itself invokes
          # `flutter pub get`.
          # A compose failure (e.g. composer.json pinning a ref that no longer
          # exists) fails this step loudly - that is a real, actionable break
          # in the repo's composition, not something to paper over.
          if [ -f "composer.json" ]; then
            # The canonical composer is session-ephemeral: it is provisioned
            # under .rokct/skills/ by .rokct/initiate.py and wiped by
            # end_protocol, so it is never committed. Provision it first when
            # it is not already present.
            if [ ! -f ".rokct/skills/.rok/flutter/scripts/compose.py" ] && [ -f ".rokct/initiate.py" ]; then
              echo "Shell app detected (composer.json). Provisioning canonical composer via .rokct/initiate.py..."
              python3 .rokct/initiate.py
            fi
            if [ -f ".rokct/skills/.rok/flutter/scripts/compose.py" ]; then
              echo "Composing SDK modules via canonical skills composer..."
              python3 .rokct/skills/.rok/flutter/scripts/compose.py
            elif [ -f ".rokct/skills/flutter/scripts/compose.py" ]; then
              echo "Composing SDK modules via local skills composer..."
              python3 .rokct/skills/flutter/scripts/compose.py
            elif [ -f ".rokct/compose.py" ]; then
              # Backward compatibility for repos that still commit a root
              # composer bootstrap and have no .rokct/initiate.py.
              echo "Composing SDK modules via legacy committed .rokct/compose.py..."
              python3 .rokct/compose.py
            else
              echo "composer.json present but no composer found (no initiate.py, no skills composer, no legacy wrapper). Skipping composition."
            fi
          else
            echo "Not a composed shell app (no composer.json). Skipping composition."
          fi

      - name: Auto-fix Whitespace (Flutter)
        if: steps.check_flutter.outputs.exists == 'true'
        run: |
          # Format only lib, test, and other source dirs, avoiding .github
          if [ -d "lib" ]; then dart format lib; fi
          if [ -d "test" ]; then dart format test; fi
          if [ -d "source" ]; then dart format source; fi

      - name: Run Flutter Analyze
        if: steps.check_flutter.outputs.exists == 'true'
        run: |
          flutter config --no-analytics
          flutter pub get
          # Non-blocking analysis
          flutter analyze . --no-fatal-warnings > flutter_output.txt 2>&1 || true
          
          # Set output if findings exist (contains :)
          if grep -q ":" flutter_output.txt; then
             { echo "findings=true"; } >> "$GITHUB_ENV"
          else
             { echo "findings=false"; } >> "$GITHUB_ENV"
          fi

      - name: Report Flutter Analysis to Central Repo
        # Fleet-wide analysis health tracker, mirroring the flutter-build
        # report-build-status job: findings open (or update) ONE live issue per
        # app in RokctAI/platformstack, and the next clean analyze run closes
        # it. Replaces per-repo filing, which opened a fresh duplicate issue in
        # the app repo on every red run. Never fails the build: step-level
        # continue-on-error, and it degrades to a log line without MONOREPO_PAT.
        if: steps.check_flutter.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        uses: RokctAI/shared-workflows/.github/actions/central-report@main
        with:
          token: ${{ secrets.MONOREPO_PAT }}
          check: flutter analyze
          label: analysis-failure
          findings: ${{ env.findings }}
          output-file: flutter_output.txt

      - name: Setup Identity (Local)
        if: steps.check_flutter.outputs.exists == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.force-fix == true) && env.IS_SELF == 'true'
        uses: ./.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Identity (Shared)
        if: steps.check_flutter.outputs.exists == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.force-fix == true) && env.IS_SELF == 'false'
        uses: ./.github/shared-workflows/.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Cleanup Shared Workflows Checkout
        if: always() && env.IS_SELF == 'false'
        run: rm -rf .github/shared-workflows
        shell: bash

      - name: Commit Auto-fixes
        if: steps.check_flutter.outputs.exists == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.force-fix == true)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          # Stale rolling-branch reset for no-op runs: the fix path below rebuilds
          # a stale auto-std branch from current main, but a run that finds nothing
          # to fix would otherwise exit without touching the branch - leaving a
          # conflicted rolling PR dirty forever. Reuses the same --is-ancestor
          # guard as the fix path: a branch already based on ${{ github.sha }}
          # (e.g. pushed by a peer job of this run) is left alone; anything older
          # is stale, so its PR is closed and the branch deleted so the next run
          # with fixes recreates it cleanly from current main.
          reset_stale_rolling_branch() {
            RB_NAME="auto-std-${{ github.ref_name }}"
            git fetch origin "$RB_NAME" 2>/dev/null || return 0
            if git merge-base --is-ancestor "${{ github.sha }}" "origin/$RB_NAME" 2>/dev/null; then
              echo "ℹ️ Rolling branch $RB_NAME is already based on the current ${{ github.ref_name }} head. Leaving it alone."
              return 0
            fi
            echo "🧹 Rolling branch $RB_NAME is stale and this run produced no fixes. Resetting it."
            RB_PR=$(gh pr list --head "$RB_NAME" --json number --jq '.[0].number')
            if [ -n "$RB_PR" ]; then
                gh pr close "$RB_PR" --comment "Superseded: rolling branch $RB_NAME diverged from ${{ github.ref_name }} with no fixes pending. The next run with fixes will recreate it from current ${{ github.ref_name }}." --delete-branch || true
            fi
            git push origin --delete "$RB_NAME" 2>/dev/null || true
          }

          # Clean up temporary findings files
          rm -f ruff_output.txt flutter_output.txt npm_audit_output.txt ty_output.txt

          if [[ -n $(git status -s) ]]; then
            git restore pubspec.lock || true
            if [[ -n $(git status -s) ]]; then
              git add .
              git commit -m "style: automated flutter formatting [skip ci]"
              
              # Enforce PR-First Strategy: No direct pushes
              echo "🚀 PR-First Strategy: Consolidating fixes into maintenance branch..."
              BRANCH_NAME="auto-std-${{ github.ref_name }}"
              
              # Drain duplicate standardization PRs left over from old run-scoped branches
              gh pr list --state open --limit 500 --json number,headRefName --jq '.[] | "\(.number) \(.headRefName)"' | \
              while read -r STALE_NUM STALE_BRANCH; do
                  if [[ "$STALE_BRANCH" == "$BRANCH_NAME"-* ]]; then
                      echo "🧹 Closing stale standardization PR #$STALE_NUM ($STALE_BRANCH)"
                      gh pr close "$STALE_NUM" --comment "Superseded: fleet standardization now reuses rolling branch $BRANCH_NAME." --delete-branch || true
                  fi
              done

              # Check if PR already exists for this branch
              EXISTING_PR=$(gh pr list --head $BRANCH_NAME --json url --jq '.[0].url')
              if [ -n "$EXISTING_PR" ]; then
                  echo "ℹ️ Peer PR already exists: $EXISTING_PR. Updating existing branch."
                  # --is-ancestor guard: same-run peer jobs share ${{ github.sha }} as their base, so they
                  # stack on each other's fixes; a stale previous-day branch fails the check and is rebuilt
                  # from current main instead of rebasing today's work onto it. The rebase --abort closes
                  # the old hole of force-pushing a mid-rebase HEAD.
                  git fetch origin "$BRANCH_NAME" || true
                  if git merge-base --is-ancestor "${{ github.sha }}" "origin/$BRANCH_NAME" 2>/dev/null; then
                      git pull origin "$BRANCH_NAME" --rebase || { git rebase --abort 2>/dev/null || true; }
                  fi
                  git push -f origin HEAD:"$BRANCH_NAME"
                  exit 0
              fi

              git checkout -b $BRANCH_NAME
              if git push -f -u origin $BRANCH_NAME 2>&1 | tee push_error.log; then
                  gh pr create --title "🔄 Fleet Standardization: Config & Style" --body "Automated maintenance generated by universal-linter during run ${{ github.run_id }}.\n\nContains: Flutter Dart Formatting." --head $BRANCH_NAME --base "${{ github.ref_name }}" || echo "PR already exists."
                  echo "✅ Maintenance PR opened. Status set to Success to keep CI green."
                  exit 0
              else
                  if grep -qi "workflows" push_error.log && grep -qi "permission" push_error.log; then
                     {
                       echo "### 🚨 Action Required: GitHub App Permissions"
                       echo "The Fleet Standardizer attempted to update your workflow files but failed due to missing permissions."
                       echo "- **Error**: $(grep -i "permission" push_error.log | head -n 1)"
                       echo "- **Fix**: Go to your GitHub App settings > **Permissions & events** > **Repository permissions** > Set **Workflows** to **Read & Write**."
                     } >> "$GITHUB_STEP_SUMMARY"
                     exit 0 # Non-blocking for permission issues
                  fi
                  echo "❌ Failed to push branch for PR."
                  exit 1
              fi
            else
              echo "Only pubspec.lock changed. Skipping commit."
              reset_stale_rolling_branch
            fi
          else
            echo "No changes to commit."
            reset_stale_rolling_branch
          fi

  audit-data-leaks:
    name: 🔍 Data Leak Audit (Excel/CSV)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ inputs.project_type == 'frappe' && 'debian:bookworm' || '' }}
      options: --user root
    steps:
      - name: System Essentials
        if: inputs.project_type == 'frappe'
        run: apt-get update && apt-get install -y git sudo && git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Scan for Unverified Data Exports
        run: |
          # Policy: Excel/CSV files should not be committed to the repo, 
          # especially on non-stable branches.
          LEAKS=$(find . -type f -name "*.xlsx" -o -name "*.xls" -o -name "*.csv" | grep -v "node_modules" || true)
          if [ -n "$LEAKS" ]; then
             {
               echo "### ⚠️ Potential Data Leak Detected"
               echo "The following unverified data files were found in the repository:"
               echo "\`\`\`"
               echo "$LEAKS"
               echo "\`\`\`"
               echo "💡 **Policy**: Fleet standards prohibit committing Excel/CSV exports to the source tree. Use stable release artifacts for data distribution."
             } >> "$GITHUB_STEP_SUMMARY"
             
             if [[ "${{ github.ref_name }}" != "main" ]]; then
                echo "❌ Unverified data found on non-stable branch."
                # We don't fail yet, just warn loudly in summary
             fi
          fi

  lint-node:
    needs: telemetry
    name: 📦 JS/TS Lint (ESLint & Security)
    permissions: write-all
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ${{ inputs.project_type == 'frappe' && 'debian:bookworm' || '' }}
      options: --user root
    env:
      IS_SELF: ''
      audit_findings: ''
    steps:
      - name: System Essentials
        if: inputs.project_type == 'frappe'
        run: apt-get update && apt-get install -y git sudo curl && git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Setup Bot Identity
        run: |
          git config --global user.name "RokctBOT[bot]"
          git config --global user.email "2956274+RokctBOT[bot]@users.noreply.github.com"

      - name: Setup Fleet Standardizer
        run: |
          if [ "${{ github.repository }}" = "RokctAI/shared-workflows" ]; then
            { echo "IS_SELF=true"; } >> "$GITHUB_ENV"
          else
            { echo "IS_SELF=false"; } >> "$GITHUB_ENV"
          fi

      - name: Checkout Shared Workflows
        if: env.IS_SELF == 'false'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: RokctAI/shared-workflows
          token: ${{ github.token }}
          path: .github/shared-workflows

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || inputs.force-fix == true)
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true



      - name: Check for Node
        id: check_node
        run: |
          if [ -f "package.json" ]; then
            { echo "exists=true"; } >> "$GITHUB_OUTPUT"
          else
            { echo "exists=false"; } >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Setup Node
        if: steps.check_node.outputs.exists == 'true'
        run: |
          if [ "${{ inputs.project_type }}" = "frappe" ]; then
             curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
             apt-get install -y nodejs
          else
             sudo apt-get update && sudo apt-get install -y nodejs npm
          fi

      - name: Auto-fix Whitespace (Node)
        if: steps.check_node.outputs.exists == 'true'
        run: |
          if npx prettier --version > /dev/null 2>&1; then
             npx prettier --write . --ignore-path .gitignore --plugin-search-dir=. --ignore-unknown . '!**/.github/**' '!**/*.md' '!**/*.svg' '!**/*.html' '!**/package-lock.json' '!**/*.env*' '!**/*production.env' '!**/*.env.local'
          elif npm list eslint > /dev/null 2>&1; then
             npx eslint . --ext .js,.jsx,.ts,.tsx --fix --ignore-pattern ".github/workflows"
          fi

      - name: Run NPM Audit
        if: steps.check_node.outputs.exists == 'true'
        run: |
          npm audit --audit-level=high > npm_audit_output.txt 2>&1 || true
          
          # Set findings if vulnerabilities found (contains "high" or "critical")
          if grep -qEi "high|critical" npm_audit_output.txt; then
             { echo "audit_findings=true"; } >> "$GITHUB_ENV"
          else
             { echo "audit_findings=false"; } >> "$GITHUB_ENV"
          fi

      - name: Report NPM Audit to Central Repo
        # Same title key as universal-security.yml's npm audit report, so both
        # workflows track (and close) the SAME central issue for this check.
        if: steps.check_node.outputs.exists == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        uses: RokctAI/shared-workflows/.github/actions/central-report@main
        with:
          token: ${{ secrets.MONOREPO_PAT }}
          check: npm audit
          label: npm-audit-failure
          findings: ${{ env.audit_findings }}
          output-file: npm_audit_output.txt

      - name: Run ESLint
        if: steps.check_node.outputs.exists == 'true'
        run: |
          if npm list eslint > /dev/null 2>&1; then
             npx eslint . --ext .js,.jsx,.ts,.tsx
          fi

      - name: Check Node License Compatibility
        if: steps.check_node.outputs.exists == 'true'
        run: |
          npm install -g license-checker
          npx license-checker --production --json > licenses.json
          if grep -qiE "GPL|AGPL" licenses.json; then
             echo "❌ Prohibited license detected in Node dependencies!"
             grep -iE "GPL|AGPL" licenses.json | head -n 20
             exit 1
          fi

      - name: Setup Identity (Local)
        if: steps.check_node.outputs.exists == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.force-fix == true) && env.IS_SELF == 'true'
        uses: ./.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Identity (Shared)
        if: steps.check_node.outputs.exists == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.force-fix == true) && env.IS_SELF == 'false'
        uses: ./.github/shared-workflows/.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Cleanup Shared Workflows Checkout
        if: always() && env.IS_SELF == 'false'
        run: rm -rf .github/shared-workflows
        shell: bash

      - name: Commit Auto-fixes
        if: steps.check_node.outputs.exists == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.force-fix == true)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          # Stale rolling-branch reset for no-op runs: the fix path below rebuilds
          # a stale auto-std branch from current main, but a run that finds nothing
          # to fix would otherwise exit without touching the branch - leaving a
          # conflicted rolling PR dirty forever. Reuses the same --is-ancestor
          # guard as the fix path: a branch already based on ${{ github.sha }}
          # (e.g. pushed by a peer job of this run) is left alone; anything older
          # is stale, so its PR is closed and the branch deleted so the next run
          # with fixes recreates it cleanly from current main.
          reset_stale_rolling_branch() {
            RB_NAME="auto-std-${{ github.ref_name }}"
            git fetch origin "$RB_NAME" 2>/dev/null || return 0
            if git merge-base --is-ancestor "${{ github.sha }}" "origin/$RB_NAME" 2>/dev/null; then
              echo "ℹ️ Rolling branch $RB_NAME is already based on the current ${{ github.ref_name }} head. Leaving it alone."
              return 0
            fi
            echo "🧹 Rolling branch $RB_NAME is stale and this run produced no fixes. Resetting it."
            RB_PR=$(gh pr list --head "$RB_NAME" --json number --jq '.[0].number')
            if [ -n "$RB_PR" ]; then
                gh pr close "$RB_PR" --comment "Superseded: rolling branch $RB_NAME diverged from ${{ github.ref_name }} with no fixes pending. The next run with fixes will recreate it from current ${{ github.ref_name }}." --delete-branch || true
            fi
            git push origin --delete "$RB_NAME" 2>/dev/null || true
          }

          # Clean up temporary findings files
          rm -f ruff_output.txt flutter_output.txt npm_audit_output.txt ty_output.txt

          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "style: automated node formatting [skip ci]"
            
            # Enforce PR-First Strategy: No direct pushes
            echo "🚀 PR-First Strategy: Consolidating fixes into maintenance branch..."
            BRANCH_NAME="auto-std-${{ github.ref_name }}"
            
            # Drain duplicate standardization PRs left over from old run-scoped branches
            gh pr list --state open --limit 500 --json number,headRefName --jq '.[] | "\(.number) \(.headRefName)"' | \
            while read -r STALE_NUM STALE_BRANCH; do
                if [[ "$STALE_BRANCH" == "$BRANCH_NAME"-* ]]; then
                    echo "🧹 Closing stale standardization PR #$STALE_NUM ($STALE_BRANCH)"
                    gh pr close "$STALE_NUM" --comment "Superseded: fleet standardization now reuses rolling branch $BRANCH_NAME." --delete-branch || true
                fi
            done

            # Check if PR already exists for this branch
            EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --json url --jq '.[0].url')
            if [ -n "$EXISTING_PR" ]; then
                echo "ℹ️ Peer PR already exists: $EXISTING_PR. Updating existing branch."
                # --is-ancestor guard: same-run peer jobs share ${{ github.sha }} as their base, so they
                # stack on each other's fixes; a stale previous-day branch fails the check and is rebuilt
                # from current main instead of rebasing today's work onto it. The rebase --abort closes
                # the old hole of force-pushing a mid-rebase HEAD.
                git fetch origin "$BRANCH_NAME" || true
                if git merge-base --is-ancestor "${{ github.sha }}" "origin/$BRANCH_NAME" 2>/dev/null; then
                    git pull origin "$BRANCH_NAME" --rebase || { git rebase --abort 2>/dev/null || true; }
                fi
                git push -f origin HEAD:"$BRANCH_NAME"
                exit 0
            fi

            git checkout -b "$BRANCH_NAME"
            if git push -f -u origin "$BRANCH_NAME" 2>&1 | tee push_error.log; then
                gh pr create --title "🔄 Fleet Standardization: Config & Style" --body "Automated maintenance generated by universal-linter during run ${{ github.run_id }}.\n\nContains: Node/JS Prettier/ESLint fixes." --head "$BRANCH_NAME" --base "${{ github.ref_name }}" || echo "PR already exists."
                echo "✅ Maintenance PR opened. Status set to Success to keep CI green."
                exit 0
            else
                if grep -qi "workflows" push_error.log && grep -qi "permission" push_error.log; then
                   {
                     echo "### 🚨 Action Required: GitHub App Permissions"
                     echo "The Fleet Standardizer attempted to update your workflow files but failed due to missing permissions."
                     echo "- **Error**: $(grep -i "permission" push_error.log | head -n 1)"
                     echo "- **Fix**: Go to your GitHub App settings > **Permissions & events** > **Repository permissions** > Set **Workflows** to **Read & Write**."
                   } >> "$GITHUB_STEP_SUMMARY"
                   exit 0 # Non-blocking for permission issues
                fi
                echo "❌ Failed to push branch for PR."
                exit 1
            fi
          else
            echo "No changes to commit."
            reset_stale_rolling_branch
          fi

  lint-markdown:
    needs: telemetry
    name: 📝 Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install markdownlint
        run: npm install -g markdownlint-cli2
      - name: Run markdownlint
        run: npx markdownlint-cli2 '**/*.md' '!node_modules' '!.git' '!build' '!dist' '!out-bash' '!out-ps'

  lint-dockerfile:
    needs: telemetry
    name: 🐳 Dockerfile Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Find Dockerfiles
        id: files
        run: |
          DOCKERFILES=$(find . -name "Dockerfile*" -not -path "*/node_modules/*" -not -path "*/.git/*" || true)
          if [ -n "$DOCKERFILES" ]; then
             echo "exists=true" >> "$GITHUB_OUTPUT"
          else
             echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run Hadolint
        if: steps.files.outputs.exists == 'true'
        run: |
          sudo wget -O /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint
          find . -name "Dockerfile*" -not -path "*/node_modules/*" -not -path "*/.git/*" -print0 | xargs -0 hadolint

  lint-todos:
    needs: telemetry
    name: 📋 TODO/FIXME Checker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check for TODO/FIXME comments
        run: |
          TODOS=$(grep -r -n -i -E "TODO|FIXME|HACK" --include="*.{py,js,ts,jsx,tsx,java,cs,go,rs,sh,ps1,yml,yaml,json,md}" --exclude-dir={.git,node_modules,__pycache__,env,venv,dist,build,.github} . || true)
          if [ -n "$TODOS" ]; then
            echo "❌ Found unresolved TODO/FIXME/HACK comments in the codebase:"
            echo "$TODOS"
            exit 1
          else
            echo "✅ No unresolved TODO/FIXME/HACK comments found."
          fi

  lint-issue-templates:
    needs: telemetry
    name: 📋 Issue Template Validator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate Issue Template Syntax
        run: |
          if [ -d ".github/ISSUE_TEMPLATE" ]; then
            for template in .github/ISSUE_TEMPLATE/*.md; do
              if [ -f "$template" ]; then
                echo "Checking $template..."
                FIRST_LINE=$(head -n 1 "$template" | xargs)
                if [ "$FIRST_LINE" != "---" ]; then
                  echo "::error::Issue template $template does not start with ---"
                  exit 1
                fi
                if [ "$(grep -c "^---$" "$template")" -lt 2 ]; then
                  echo "::error::Issue template $template is missing closing --- for frontmatter"
                  exit 1
                fi
              fi
            done
            echo "✅ All issue templates are valid."
          else
            echo "No issue templates folder found. Skipping."
          fi

  validate-readme-version:
    needs: telemetry
    name: 📖 README Version Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: write-all
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.MONOREPO_PAT || github.token }}

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true

      - name: Checkout Shared Workflows
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: RokctAI/shared-workflows
          token: ${{ secrets.MONOREPO_PAT || github.token }}
          path: .github/shared-workflows

      - name: Run Auto-Update Badge & Version
        run: |
          if [ -f "version.json" ]; then
             python3 .github/shared-workflows/scripts/update_readme_badges.py
          fi

      - name: Cleanup Shared Workflows Checkout
        if: always()
        run: rm -rf .github/shared-workflows
        shell: bash

      - name: Commit & Push README changes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.MONOREPO_PAT || github.token }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -f "version.json" ]; then
            if ! git diff --exit-code README.md; then
              echo "📝 README.md is out of sync. Committing auto-update..."
              
              # Set up Git identity if not set
              if [ -z "$(git config user.name)" ]; then
                git config user.name "RokctBOT[bot]"
                git config user.email "2956274+RokctBOT[bot]@users.noreply.github.com"
              fi

              git add README.md
              git commit -m "docs: auto-update README badges and version references [skip ci]"
              
              BRANCH_NAME="${HEAD_REF:-$REF_NAME}"
              echo "Pushing to $BRANCH_NAME..."
              if git push origin HEAD:"$BRANCH_NAME"; then
                echo "✅ README.md auto-updated and successfully pushed."
              else
                echo "❌ Failed to push updated README.md to branch."
                exit 1
              fi
            else
              echo "✅ README.md is already up to date."
            fi
          else
            echo "No version.json found. Skipping."
          fi

