    name: 🔍 Data Leak Audit (Excel/CSV)
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.project_type == 'frappe' && 'debian:bookworm' || '' }}
      options: --user root
    steps:
      - name: System Essentials
        if: inputs.project_type == 'frappe'
        run: apt-get update && apt-get install -y sudo git

      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Scan for Unverified Data Exports
        run: |
          # Policy: Excel/CSV files should not be committed to the repo, 
          # especially on non-stable branches.
          LEAKS=$(find . -type f -name "*.xlsx" -o -name "*.xls" -o -name "*.csv" | grep -v "node_modules" || true)
          if [ -n "$LEAKS" ]; then
             {
               echo "### ⚠️ Potential Data Leak Detected"
               echo "The following unverified data files were found in the repository:"
               echo "\`\`\`"
               echo "$LEAKS"
               echo "\`\`\`"
               echo "💡 **Policy**: Fleet standards prohibit committing Excel/CSV exports to the source tree. Use stable release artifacts for data distribution."
             } >> "$GITHUB_STEP_SUMMARY"
             
             if [[ "${{ github.ref_name }}" != "main" ]]; then
                echo "❌ Unverified data found on non-stable branch."
                # We don't fail yet, just warn loudly in summary
             fi
          fi

