                git pull origin "$BRANCH_NAME" --rebase || echo "Pull failed, forcing push..."
                git push -f origin HEAD:"$BRANCH_NAME"
                exit 0
            fi

            git checkout -b "$BRANCH_NAME"
            if git push -u origin "$BRANCH_NAME" 2>&1 | tee push_error.log; then
                gh pr create --title "🔄 Fleet Standardization: Config & Style" --body "Automated maintenance generated by universal-linter during run ${{ github.run_id }}.\n\nContains: Node/JS Prettier/ESLint fixes." --head "$BRANCH_NAME" --base "${{ github.ref_name }}" || echo "PR already exists."
                echo "✅ Maintenance PR opened. Status set to Success to keep CI green."
                exit 0
            else
                if grep -qi "workflows" push_error.log && grep -qi "permission" push_error.log; then
                   echo "### 🚨 Action Required: GitHub App Permissions" >> $GITHUB_STEP_SUMMARY
                   echo "The Fleet Standardizer attempted to update your workflow files but failed due to missing permissions." >> $GITHUB_STEP_SUMMARY
                   echo "- **Error**: $(grep -i "permission" push_error.log | head -n 1)" >> $GITHUB_STEP_SUMMARY
                   echo "- **Fix**: Go to your GitHub App settings > **Permissions & events** > **Repository permissions** > Set **Workflows** to **Read & Write**." >> $GITHUB_STEP_SUMMARY
                   exit 0 # Non-blocking for permission issues
                fi
                echo "❌ Failed to push branch for PR."
                exit 1
            fi
          fi