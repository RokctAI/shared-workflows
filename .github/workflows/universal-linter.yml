# Copyright 2024 RokctAI

name: Universal Code Quality (Lint)

permissions: write-all
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PIP_BREAK_SYSTEM_PACKAGES: 1

on:
  workflow_call:
    inputs:
      project_type:
        required: false
        type: string
        default: 'smart'
        description: "Project type: 'frappe', 'node', or 'flutter'"
      copyright-text:
        required: false
        type: string
        description: "Standard copyright text to prepend to Python files (e.g., 'Rokct Intelligence'). The year is added automatically."
      run-build-runner:
        required: false
        type: boolean
        default: false
        description: "Run build_runner before analyzing Flutter code"
      flutter-channel:
        required: false
        type: string
        default: 'stable'
        description: "Flutter channel to use (default: stable)"
      flutter-version:
        required: false
        type: string
        # Pinned: Flutter 3.47.0 + analyzer <8 (freezed 2.x) hangs build_runner; remove once SDKs move to freezed 3.x / analyzer 8.
        default: '3.44.9'
        description: "Specific Flutter version to use (e.g. '3.24.5')"
      force-fix:
        required: false
        type: boolean
        default: false
        description: "Force auto-fix and commit even on PR/Push (used for daily cleanup and stable releases)"
    secrets:
      MONOREPO_PAT:
        required: false
      COUNTER_API_KEY:
        required: false
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      run_verify:
        type: boolean
        default: true
        description: "Run continuous verification on Android emulator"

      backfill_ai_notes_cutoff_version:
        type: string
        default: ""
        description: "Regenerate AI release notes starting from this version (use 'all' for full history)"


jobs:
  standardize:
    name: 🔄 Fleet Standardizer (Auto-Fix)
    permissions: write-all
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ${{ inputs.project_type == 'frappe' && 'debian:bookworm' || '' }}
      options: --user root
    env:
      IS_SELF: ''
      ENGINE_PATH: ''
    steps:
      - name: System Essentials
        if: inputs.project_type == 'frappe'
        run: apt-get update --fix-missing || (sleep 2 && apt-get update) && apt-get install -y --fix-missing git sudo curl python3 && git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Setup Bot Identity
        run: |
          git config --global user.name "RokctBOT[bot]"
          git config --global user.email "2956274+RokctBOT[bot]@users.noreply.github.com"

      - name: Setup Fleet Standardizer
        run: |
          if [ "${{ github.repository }}" = "RokctAI/shared-workflows" ]; then
            {
              echo "ENGINE_PATH=scripts/standardize_fleet.py"
              echo "README_ENGINE_PATH=scripts/update_readme_badges.py"
              echo "AUDIT_ENGINE_PATH=scripts/audit_inputs_and_drift.py"
              echo "IS_SELF=true"
            } >> "$GITHUB_ENV"
          else
            {
              echo "ENGINE_PATH=.github/shared-workflows/scripts/standardize_fleet.py"
              echo "README_ENGINE_PATH=.github/shared-workflows/scripts/update_readme_badges.py"
              echo "AUDIT_ENGINE_PATH=.github/shared-workflows/scripts/audit_inputs_and_drift.py"
              echo "IS_SELF=false"
            } >> "$GITHUB_ENV"
          fi

      - name: Checkout Shared Workflows
        if: env.IS_SELF == 'false'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: RokctAI/shared-workflows
          token: ${{ github.token }}
          path: .github/shared-workflows

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true # Fallback to GITHUB_TOKEN if App not configured

      - name: Run Standardizer Engine
        env:
          BOT_NAME: ${{ github.repository_owner == 'RokctAI' && 'RokctBOT' || github.repository_owner }}
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" || "${{ inputs.force-fix }}" == "true" ]]; then
            python3 ${{ env.ENGINE_PATH }}
            python3 ${{ env.README_ENGINE_PATH }}
            python3 ${{ env.AUDIT_ENGINE_PATH }}
          else
            python3 ${{ env.ENGINE_PATH }} --check || echo "⚠️ Repository standardization check failed (minor). Proceeding anyway."
            python3 ${{ env.README_ENGINE_PATH }} --check || echo "⚠️ README badges check failed. Proceeding anyway."
            python3 ${{ env.AUDIT_ENGINE_PATH }} || echo "⚠️ Workflow inputs and version drift audit failed (minor). Proceeding anyway."
          fi

      - name: Setup Identity (Local)
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.force-fix == true) && env.IS_SELF == 'true'
        uses: ./.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Identity (Shared)
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.force-fix == true) && env.IS_SELF == 'false'
        uses: ./.github/shared-workflows/.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Cleanup Temporary Files
        if: always() && env.IS_SELF == 'false'
        run: rm -rf .github/shared-workflows

      - name: Commit & Push Changes
        if: always() && steps.app-token.outputs.token != '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.force-fix == true)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          # Stale rolling-branch reset for no-op runs: the fix path below rebuilds
          # a stale auto-std branch from current main, but a run that finds nothing
          # to fix would otherwise exit without touching the branch - leaving a
          # conflicted rolling PR dirty forever. Reuses the same --is-ancestor
          # guard as the fix path: a branch already based on ${{ github.sha }}
          # (e.g. pushed by a peer job of this run) is left alone; anything older
          # is stale, so its PR is closed and the branch deleted so the next run
          # with fixes recreates it cleanly from current main.
          reset_stale_rolling_branch() {
            RB_NAME="auto-std-${{ github.ref_name }}"
            git fetch origin "$RB_NAME" 2>/dev/null || return 0
            if git merge-base --is-ancestor "${{ github.sha }}" "origin/$RB_NAME" 2>/dev/null; then
              echo "ℹ️ Rolling branch $RB_NAME is already based on the current ${{ github.ref_name }} head. Leaving it alone."
              return 0
            fi
            echo "🧹 Rolling branch $RB_NAME is stale and this run produced no fixes. Resetting it."
            RB_PR=$(gh pr list --head "$RB_NAME" --json number --jq '.[0].number')
            if [ -n "$RB_PR" ]; then
                gh pr close "$RB_PR" --comment "Superseded: rolling branch $RB_NAME diverged from ${{ github.ref_name }} with no fixes pending. The next run with fixes will recreate it from current ${{ github.ref_name }}." --delete-branch || true
            fi
            git push origin --delete "$RB_NAME" 2>/dev/null || true
          }

          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "chore: automated fleet standardization [skip ci]"
            
            # Enforce PR-First Strategy: No direct pushes to protected or main branches for bot
            echo "🚀 PR-First Strategy: Creating maintenance branch for standardization..."
            BRANCH_NAME="auto-std-${{ github.ref_name }}"
            
            # Drain duplicate standardization PRs left over from old run-scoped branches
            gh pr list --state open --limit 500 --json number,headRefName --jq '.[] | "\(.number) \(.headRefName)"' | \
            while read -r STALE_NUM STALE_BRANCH; do
                if [[ "$STALE_BRANCH" == "$BRANCH_NAME"-* ]]; then
                    echo "🧹 Closing stale standardization PR #$STALE_NUM ($STALE_BRANCH)"
                    gh pr close "$STALE_NUM" --comment "Superseded: fleet standardization now reuses rolling branch $BRANCH_NAME." --delete-branch || true
                fi
            done

            # Check if PR already exists for this branch
            EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --json url --jq '.[0].url')
            if [ -n "$EXISTING_PR" ]; then
                echo "ℹ️ Peer PR already exists: $EXISTING_PR. Updating existing branch."
                git checkout -b "$BRANCH_NAME" || git checkout "$BRANCH_NAME"
                if git push -f origin "$BRANCH_NAME" 2>&1 | tee push_error.log; then
                    echo "✅ Existing standardization branch updated."
                    exit 0
                else
                    if grep -qi "workflows" push_error.log && grep -qi "permission" push_error.log; then
                       {
                         echo "### 🚨 Action Required: GitHub App Permissions"
                         echo "The Fleet Standardizer attempted to update your workflow files but failed due to missing permissions."
                         echo "- **Error**: $(grep -i "permission" push_error.log | head -n 1)"
                         echo "- **Fix**: Go to your GitHub App settings > **Permissions & events** > **Repository permissions** > Set **Workflows** to **Read & Write**."
                         echo "⚠️ CI is proceeding but your repository is out of sync with fleet standards."
                       } >> "$GITHUB_STEP_SUMMARY"
                       exit 0 # Non-blocking for permission issues
                    fi
                    echo "❌ Failed to push updates to existing branch."
                    exit 1
                fi
            fi

            git checkout -b "$BRANCH_NAME"
            if git push -f -u origin "$BRANCH_NAME" 2>&1 | tee push_error.log; then
                gh pr create --title "🔄 Fleet Standardization: Config & Submodules" --body "Automated maintenance generated by universal-linter during run ${{ github.run_id }}.\n\nNote: This PR was created via the PR-First strategy. It will auto-merge if CI passes and auto-merge is enabled." --head "$BRANCH_NAME" --base "${{ github.ref_name }}" || echo "PR creation failed (check if already exists)."
                echo "✅ Maintenance PR opened. Status set to Success to keep CI green. Please merge manually or rely on auto-merge."
                exit 0
            else
                if grep -qi "workflows" push_error.log && grep -qi "permission" push_error.log; then
                   {
                     echo "### 🚨 Action Required: GitHub App Permissions"
                     echo "The Fleet Standardizer attempted to update your workflow files but failed due to missing permissions."
                     echo "- **Error**: $(grep -i "permission" push_error.log | head -n 1)"
                     echo "- **Fix**: Go to your GitHub App settings > **Permissions & events** > **Repository permissions** > Set **Workflows** to **Read & Write**."
                     echo "⚠️ CI is proceeding but your repository is out of sync with fleet standards."
                   } >> "$GITHUB_STEP_SUMMARY"
                   exit 0 # Non-blocking for permission issues
                fi
                echo "❌ Failed to push branch for PR."
                exit 1
            fi
          else
            echo "🙌 Repository is already standardized."
            reset_stale_rolling_branch
          fi


  telemetry:
    needs: standardize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ inputs.project_type == 'frappe' && 'debian:bookworm' || '' }}
      options: --user root
    continue-on-error: true
    steps:
      - name: System Essentials
        if: inputs.project_type == 'frappe'
        run: apt-get update --fix-missing || (sleep 2 && apt-get update) && apt-get install -y --fix-missing git curl && git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Track Usage
        env:
          API_KEY: ${{ secrets.COUNTER_API_KEY }}
        if: env.API_KEY != ''
        run: |
          curl -X GET "https://api.counterapi.dev/v2/rokctai/usage/up" \
          -H "Authorization: Bearer $API_KEY"

  lint-yaml:
    needs: telemetry
    name: 📝 YAML Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ inputs.project_type == 'frappe' && 'debian:bookworm' || '' }}
      options: --user root
    steps:
      - name: System Essentials
        if: inputs.project_type == 'frappe'
        run: apt-get update && apt-get install -y git sudo curl && git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Setup Bot Identity
        run: |
          git config --global user.name "RokctBOT[bot]"
          git config --global user.email "2956274+RokctBOT[bot]@users.noreply.github.com"

      - name: Install actionlint
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.6.24/actionlint_1.6.24_linux_amd64.tar.gz | tar xz -C /usr/local/bin

      - name: Lint GitHub Workflows
        run: |
          echo "Linting workflow YAMLs..."
          actionlint .github/workflows/*.yml

      - name: Lint Example YAMLs
        run: |
          echo "Linting example YAMLs..."
          if [ -d "examples/workflows" ]; then
            find examples/workflows -name "*.yml" -exec actionlint {} +
          else
            echo "No examples directory found, skipping."
          fi

  lint-python:
    needs: telemetry
    name: 🐍 Python Lint (Ruff & ty)
    permissions: write-all
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ inputs.project_type == 'frappe' && 'debian:bookworm' || '' }}
      options: --user root
    env:
      IS_SELF: ''
      findings: ''
    steps:
      - name: System Essentials
        if: inputs.project_type == 'frappe'
        run: apt-get update --fix-missing || (sleep 2 && apt-get update) && apt-get install -y --fix-missing git sudo curl python3 python3-pip && git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Setup Bot Identity
        run: |
          git config --global user.name "RokctBOT[bot]"
          git config --global user.email "2956274+RokctBOT[bot]@users.noreply.github.com"

      - name: Setup Fleet Standardizer
        run: |
          if [ "${{ github.repository }}" = "RokctAI/shared-workflows" ]; then
            { echo "IS_SELF=true"; } >> "$GITHUB_ENV"
          else
            { echo "IS_SELF=false"; } >> "$GITHUB_ENV"
          fi

      - name: Checkout Shared Workflows
        if: env.IS_SELF == 'false'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: RokctAI/shared-workflows
          token: ${{ github.token }}
          path: .github/shared-workflows

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true



      - name: Check for Python
        id: check_python
        run: |
          if [ -f "requirements.txt" ] || [ -f "pyproject.toml" ] || [ -f "setup.py" ] || [ -f "Pipfile" ]; then
            { echo "exists=true"; } >> "$GITHUB_OUTPUT"
          else
            { echo "exists=false"; } >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Set up Python
        if: steps.check_python.outputs.exists == 'true'
        run: |
          if [ "${{ inputs.project_type }}" = "frappe" ]; then
            apt-get update && apt-get install -y python3 python3-pip
          else
            # We cannot easily use actions/setup-python in a conditional container
            # If we are in ubuntu Host, we use the action. 
            # But the container logic here is job-level.
            # So if project_type != frappe, it runs on ubuntu-latest and we can use the action.
            echo "Installing python via apt-get for container parity if needed..."
            sudo apt-get update --fix-missing || (sleep 2 && sudo apt-get update)
            sudo apt-get install -y --fix-missing python3 python3-pip
          fi

      - name: Install Lint Tools
        if: steps.check_python.outputs.exists == 'true'
        run: |
          pip install ruff ty

      - name: Auto-fix Whitespace (Ruff Format)
        if: steps.check_python.outputs.exists == 'true'
        run: |
          # ruff format replaces autopep8 — faster, same PEP8 rules
          ruff format . --exclude ".github,.git,node_modules,env,venv,.venv,__pycache__"

      - name: Auto-Inject Frappe Copyright
        if: steps.check_python.outputs.exists == 'true' && inputs.copyright-text != ''
        env:
          COPYRIGHT_INPUT: ${{ inputs.copyright-text }}
        run: |
          # The caller workflow provides the entity name/format. 
          # The universal linter adds the dynamic year.
          CURRENT_YEAR=$(date +%Y)
          
          # We construct the final header by taking the user's input and injecting the year
          # Assuming the input looks something like: "Copyright (c) {YEAR}, Rokct Intelligence (pty) Ltd."
          # If they just provided the name, we build the standard Frappe string.
          # We will default to standard Frappe format:
          HEADER="# Copyright (c) $CURRENT_YEAR, $COPYRIGHT_INPUT\n# For license information, please see license.txt\n"
          
          echo "Using copyright template:"
          echo -e "$HEADER"
          
          # Find all python files, explicitly ignoring __init__.py and common excluded folders
          find . -name "*.py" -not -name "__init__.py" \
               -not -path "*/\.*" \
               -not -path "*/node_modules/*" \
               -not -path "*/env/*" \
               -not -path "*/venv/*" \
               -not -path "*/tests/*" | while read -r file; do
             
             # Check if file already has a copyright header (case-insensitive check for 'Copyright' in first 5 lines)
             if ! head -n 5 "$file" | grep -qi "Copyright"; then
                  echo "Adding copyright to $file"
                  # Escape the header for sed
                  # Use awk to prepend the header block cleanly
                  awk -v header="$HEADER" 'BEGIN{print header; print ""} {print}' "$file" > tmpfile && mv tmpfile "$file"
             fi
          done

      - name: Run Ruff (Lint)
        if: steps.check_python.outputs.exists == 'true'
        run: |
          # ruff check replaces flake8 — same rules, 10-100x faster
          ruff check . \
            --select=E9,F63,F7,F82,E,W,C90,F \
            --ignore=E501,W503,W504,F401,F841 \
            --exclude ".github,.git,node_modules,env,venv,.venv,__pycache__" \
            --output-format=concise > ruff_output.txt 2>&1 || true

          cat ruff_output.txt

          if grep -q ":" ruff_output.txt; then
             { echo "findings=true"; } >> "$GITHUB_ENV"
          else
             { echo "findings=false"; } >> "$GITHUB_ENV"
          fi

      - name: Run ty (Type Check)
        if: steps.check_python.outputs.exists == 'true'
        run: |
          # ty catches type errors from AI-generated code before they cause runtime bugs
          ty check . \
            --exclude .github \
            --exclude .git \
            --exclude node_modules \
            --exclude env \
            --exclude venv \
            --exclude .venv \
            --exclude __pycache__ \
            > ty_output.txt 2>&1 || true

          cat ty_output.txt

          if grep -qi "error" ty_output.txt; then
             { echo "ty_findings=true"; } >> "$GITHUB_ENV"
          else
             { echo "ty_findings=false"; } >> "$GITHUB_ENV"
          fi

      - name: Report Ruff Lint to Central Repo
        # One deduped, auto-closing issue per repo in RokctAI/platformstack
        # instead of a fresh per-repo issue on every red run.
        if: steps.check_python.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        uses: RokctAI/shared-workflows/.github/actions/central-report@main
        with:
          token: ${{ secrets.MONOREPO_PAT }}
          check: ruff lint
          label: lint-failure
          findings: ${{ env.findings }}
          output-file: ruff_output.txt

      - name: Report Python Type Check to Central Repo
        if: steps.check_python.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        uses: RokctAI/shared-workflows/.github/actions/central-report@main
        with:
          token: ${{ secrets.MONOREPO_PAT }}
          check: python type check
          label: type-check-failure
          findings: ${{ env.ty_findings }}
          output-file: ty_output.txt

      - name: Check Python License Compatibility
        if: steps.check_python.outputs.exists == 'true'
        run: |
          pip install pip-licenses
          pip-licenses --from=mixed --format=csv --output-file=licenses.csv
          if grep -qiE "GPL|AGPL" licenses.csv; then
             FINDINGS=$(grep -iE "GPL|AGPL" licenses.csv | grep -vi "LGPL" | grep -viE "cloud-init|ufw|python-apt|python-debian|pyparted|mercurial|sos|systemd-python|ubuntu-pro-client|ssh-import-id|launchpadlib|lazr.restfulclient|lazr.uri|wadllib|PyGObject|chardet|dbus-python" || true)
             if [ -n "$FINDINGS" ]; then
                echo "❌ Prohibited GPL/AGPL license detected in Python dependencies!"
                echo "$FINDINGS"
                exit 1
             else
                echo "✅ No prohibited GPL/AGPL dependencies found (system packages skipped)."
             fi
          fi

      - name: Setup Identity (Local)
        if: steps.check_python.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.IS_SELF == 'true'
        uses: ./.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Identity (Shared)
        if: steps.check_python.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.IS_SELF == 'false'
        uses: ./.github/shared-workflows/.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Cleanup Shared Workflows Checkout
        if: always() && env.IS_SELF == 'false'
        run: rm -rf .github/shared-workflows
        shell: bash

      - name: Commit Auto-fixes
        if: steps.check_python.outputs.exists == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.force-fix == true)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          # Stale rolling-branch reset for no-op runs: the fix path below rebuilds
          # a stale auto-std branch from current main, but a run that finds nothing
          # to fix would otherwise exit without touching the branch - leaving a
          # conflicted rolling PR dirty forever. Reuses the same --is-ancestor
          # guard as the fix path: a branch already based on ${{ github.sha }}
          # (e.g. pushed by a peer job of this run) is left alone; anything older
          # is stale, so its PR is closed and the branch deleted so the next run
          # with fixes recreates it cleanly from current main.
          reset_stale_rolling_branch() {
            RB_NAME="auto-std-${{ github.ref_name }}"
            git fetch origin "$RB_NAME" 2>/dev/null || return 0
            if git merge-base --is-ancestor "${{ github.sha }}" "origin/$RB_NAME" 2>/dev/null; then
              echo "ℹ️ Rolling branch $RB_NAME is already based on the current ${{ github.ref_name }} head. Leaving it alone."
              return 0
            fi
            echo "🧹 Rolling branch $RB_NAME is stale and this run produced no fixes. Resetting it."
            RB_PR=$(gh pr list --head "$RB_NAME" --json number --jq '.[0].number')
            if [ -n "$RB_PR" ]; then
                gh pr close "$RB_PR" --comment "Superseded: rolling branch $RB_NAME diverged from ${{ github.ref_name }} with no fixes pending. The next run with fixes will recreate it from current ${{ github.ref_name }}." --delete-branch || true
            fi
            git push origin --delete "$RB_NAME" 2>/dev/null || true
          }

          # Clean up temporary findings files so they are not included in status check or commit
          rm -f ruff_output.txt flutter_output.txt npm_audit_output.txt ty_output.txt
          
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "style: automated python whitespace/lint fixes [skip ci]"
            
            # Enforce PR-First Strategy: No direct pushes
            echo "🚀 PR-First Strategy: Consolidating fixes into maintenance branch..."
            BRANCH_NAME="auto-std-${{ github.ref_name }}"
            
            # Drain duplicate standardization PRs left over from old run-scoped branches
            gh pr list --state open --limit 500 --json number,headRefName --jq '.[] | "\(.number) \(.headRefName)"' | \
            while read -r STALE_NUM STALE_BRANCH; do
