name: Universal Code Quality (Lint)

on:
  workflow_call:
    inputs:
      copyright-text:
        required: false
        type: string
        description: "Standard copyright text to prepend to Python files (e.g., 'Rokct Intelligence'). The year is added automatically."
      run-build-runner:
        required: false
        type: boolean
        default: false
        description: "Run build_runner before analyzing Flutter code"
    secrets:
      COUNTER_API_KEY:
        required: false

jobs:
  telemetry:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Track Usage
        env:
          API_KEY: ${{ secrets.COUNTER_API_KEY }}
        if: env.API_KEY != ''
        run: |
          curl -X GET "https://api.counterapi.dev/v2/rokctai/usage/up" \
          -H "Authorization: Bearer $API_KEY"

  lint-python:
    needs: telemetry
    name: 🐍 Python Lint (Flake8)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Python
        id: check_python
        run: |
          if [ -f "requirements.txt" ] || [ -f "pyproject.toml" ] || [ -f "setup.py" ] || [ -f "Pipfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Set up Python
        if: steps.check_python.outputs.exists == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Lint Tools
        if: steps.check_python.outputs.exists == 'true'
        run: |
          pip install flake8 autopep8

      - name: Auto-fix Whitespace (excluding F401)
        if: steps.check_python.outputs.exists == 'true'
        run: |
          # Run autopep8 to fix standard formatting issues (E1, E2, E3, W2, W3, etc.)
          # Exclude .github directory, virtual environments, caches, and minified files
          autopep8 --in-place --recursive --aggressive --aggressive --exclude .github,.git,node_modules,env,venv,.venv,__pycache__,*.min.js .

      - name: Auto-Inject Frappe Copyright
        if: steps.check_python.outputs.exists == 'true' && inputs.copyright-text != ''
        env:
          COPYRIGHT_INPUT: ${{ inputs.copyright-text }}
        run: |
          # The caller workflow provides the entity name/format. 
          # The universal linter adds the dynamic year.
          CURRENT_YEAR=$(date +%Y)
          
          # We construct the final header by taking the user's input and injecting the year
          # Assuming the input looks something like: "Copyright (c) {YEAR}, Rokct Intelligence (pty) Ltd."
          # If they just provided the name, we build the standard Frappe string.
          # We will default to standard Frappe format:
          HEADER="# Copyright (c) ${CURRENT_YEAR}, ${COPYRIGHT_INPUT}\n# For license information, please see license.txt\n"
          
          echo "Using copyright template:"
          echo -e "$HEADER"
          
          # Find all python files, explicitly ignoring __init__.py and common excluded folders
          find . -name "*.py" -not -name "__init__.py" \
               -not -path "*/\.*" \
               -not -path "*/node_modules/*" \
               -not -path "*/env/*" \
               -not -path "*/venv/*" \
               -not -path "*/tests/*" | while read -r file; do
             
             # Check if file already has a copyright header (case-insensitive check for 'Copyright' in first 5 lines)
             if ! head -n 5 "$file" | grep -qi "Copyright"; then
                 echo "Adding copyright to $file"
                 # Escape the header for sed
                 ESCAPED_HEADER=$(echo "$HEADER" | sed 's/\\/\\\\/g' | sed 's/\//\\\//g' | sed 's/$/\\n/g' )
                 # Use awk to prepend the header block cleanly
                 awk -v header="$HEADER" 'BEGIN{print header; print ""} {print}' "$file" > tmpfile && mv tmpfile "$file"
             fi
          done

      - name: Run Flake8
        if: steps.check_python.outputs.exists == 'true'
        run: |
          # Capture output to a file for issue reporting but still exit with 0 to be non-blocking
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics > flake8_output.txt 2>&1 || true
          flake8 . --count --max-complexity=10 --max-line-length=120 \
            --ignore=E501,W503,W504,W191,W291,W292,W293,W391,E261,E265,E302,E303,E305,E111,E114,E116,E117,E127,E128,E225,E226,E401,F401,F841 \
            --statistics >> flake8_output.txt 2>&1
          
          # Print for log visibility
          cat flake8_output.txt
          
          # Set output if findings exist (contains :)
          if grep -q ":" flake8_output.txt; then
             echo "findings=true" >> $GITHUB_ENV
          else
             echo "findings=false" >> $GITHUB_ENV
          fi

      - name: Create Issue on Findings
        if: env.findings == 'true' && steps.check_python.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="### 🐍 Python Lint Failure
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}
          
          #### Error Summary:
          \`\`\`
          $(head -c 2000 flake8_output.txt)
          \`\`\`
          "
          gh issue create --title "🚨 CI: Python Lint Failure" --body "$BODY" --label "CI Blocker" || echo "Issue already exists or failed to create."

      - name: Setup Identity
        if: steps.check_python.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: RokctAI/shared-workflows/.github/actions/setup-identity@main

      - name: Commit Auto-fixes
        if: steps.check_python.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          # Clean up temporary findings files so they are not included in status check or commit
          rm -f flake8_output.txt flutter_output.txt npm_audit_output.txt
          
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "style: automated whitespace/lint fixes [skip ci]"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No changes to commit."
          fi

  lint-shell:
    needs: telemetry
    name: 🐚 Shell Script Format (shfmt)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Format Shell Scripts
        run: |
          # Use dockerized shfmt for zero-dependency alpine formatting
          # We check if there are any .sh files first to save time
          if find . -name "*.sh" | grep -q .; then
             docker run --rm -v $(pwd):/mnt mvdan/shfmt:latest -w -i 2 /mnt
          else
             echo "No shell scripts found. Skipping."
          fi

      - name: Setup Identity
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: RokctAI/shared-workflows/.github/actions/setup-identity@main

      - name: Commit Auto-fixes
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "style: automated shell script formatting [skip ci]"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No changes to commit."
          fi

  lint-flutter:
    needs: telemetry
    name: 🐦 Flutter Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Flutter
        id: check_flutter
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Helper - Subosito Flutter
        if: steps.check_flutter.outputs.exists == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto-fix Whitespace (Flutter)
        if: steps.check_flutter.outputs.exists == 'true'
        run: |
          # Format only lib, test, and other source dirs, avoiding .github
          if [ -d "lib" ]; then dart format lib; fi
          if [ -d "test" ]; then dart format test; fi
          if [ -d "source" ]; then dart format source; fi

      - name: Run Flutter Analyze
        if: steps.check_flutter.outputs.exists == 'true'
        run: |
          flutter config --no-analytics
          flutter pub get
          # Non-blocking analysis
          flutter analyze . --no-fatal-warnings > flutter_output.txt 2>&1 || true
          
          # Set output if findings exist (contains :)
          if grep -q ":" flutter_output.txt; then
             echo "findings=true" >> $GITHUB_ENV
          else
             echo "findings=false" >> $GITHUB_ENV
          fi

      - name: Create Issue on Findings
        if: env.findings == 'true' && steps.check_flutter.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="### 🐦 Flutter Analysis Failure
          **Commit:** ${{ github.sha }}
          
          #### Output:
          \`\`\`
          $(head -c 2000 flutter_output.txt)
          \`\`\`
          "
          gh issue create --title "🚨 CI: Flutter Analysis Failure" --body "$BODY" --label "CI Blocker" || echo "Issue already exists."

      - name: Setup Identity
        if: steps.check_flutter.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: RokctAI/shared-workflows/.github/actions/setup-identity@main

      - name: Commit Auto-fixes
        if: steps.check_flutter.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          # Clean up temporary findings files so they are not included in status check or commit
          rm -f flake8_output.txt flutter_output.txt npm_audit_output.txt

          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "style: automated flutter formatting [skip ci]"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No changes to commit."
          fi

  lint-node:
    needs: telemetry
    name: 📦 JS/TS Lint (ESLint & Security)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Node
        id: check_node
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Setup Node
        if: steps.check_node.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Auto-fix Whitespace (Node)
        if: steps.check_node.outputs.exists == 'true'
        run: |
          if npx prettier --version > /dev/null 2>&1; then
             npx prettier --write . --ignore-path .gitignore --plugin-search-dir=. --ignore-unknown . '!**/.github/workflows/**' '!**/*.md' '!**/*.svg' '!**/*.html' '!**/package-lock.json' '!**/*.env*' '!**/*production.env' '!**/*.env.local'
          elif npm list eslint > /dev/null 2>&1; then
             npx eslint . --ext .js,.jsx,.ts,.tsx --fix --ignore-pattern ".github/workflows"
          fi

      - name: Run NPM Audit
        if: steps.check_node.outputs.exists == 'true'
        run: |
          npm audit --audit-level=high > npm_audit_output.txt 2>&1 || true
          
          # Set findings if vulnerabilities found (contains "high" or "critical")
          if grep -qEi "high|critical" npm_audit_output.txt; then
             echo "audit_findings=true" >> $GITHUB_ENV
          else
             echo "audit_findings=false" >> $GITHUB_ENV
          fi

      - name: Create Issue on Audit Findings
        if: env.audit_findings == 'true' && steps.check_node.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="### 📦 Node Security Audit Failure
          **High/Critical vulnerabilities found.**
          
          #### Audit Summary:
          \`\`\`
          $(head -c 2000 npm_audit_output.txt)
          \`\`\`
          "
          gh issue create --title "🚨 CI: Node Security Alert (High/Critical)" --body "$BODY" --label "Security" || echo "Issue already exists."

      - name: Run ESLint
        if: steps.check_node.outputs.exists == 'true'
        run: |
          if npm list eslint > /dev/null 2>&1; then
             npx eslint . --ext .js,.jsx,.ts,.tsx
          fi

      - name: Setup Identity
        if: steps.check_node.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: RokctAI/shared-workflows/.github/actions/setup-identity@main

      - name: Commit Auto-fixes
        if: steps.check_node.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          # Clean up temporary findings files so they are not included in status check or commit
          rm -f flake8_output.txt flutter_output.txt npm_audit_output.txt

          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "style: automated node formatting [skip ci]"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No changes to commit."
          fi
