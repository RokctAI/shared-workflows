          apt-get update --fix-missing || (sleep 2 && apt-get update)
          apt-get install -y --fix-missing git sudo curl docker.io
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Install Docker CLI if not present via docker.io
          if ! command -v docker >/dev/null; then curl -fsSL https://get.docker.com | sh; fi
          # Install shfmt binary directly to avoid nested docker mount issues
          curl -sSLo /usr/local/bin/shfmt https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          chmod +x /usr/local/bin/shfmt

      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
