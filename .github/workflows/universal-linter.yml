name: Universal Code Quality (Lint)

on:
  workflow_call:
    inputs:
      run-build-runner:
        required: false
        type: boolean
        default: false
        description: "Run build_runner before analyzing Flutter code"
    secrets:
      COUNTER_API_KEY:
        required: false

jobs:
  telemetry:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Track Usage
        env:
          API_KEY: ${{ secrets.COUNTER_API_KEY }}
        if: env.API_KEY != ''
        run: |
          curl -X GET "https://api.counterapi.dev/v2/rokctai/usage/up" \
          -H "Authorization: Bearer $API_KEY"

  lint-python:
    needs: telemetry
    name: 🐍 Python Lint (Flake8)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Python
        id: check_python
        run: |
          if [ -f "requirements.txt" ] || [ -f "pyproject.toml" ] || [ -f "setup.py" ] || [ -f "Pipfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Set up Python
        if: steps.check_python.outputs.exists == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Lint Tools
        if: steps.check_python.outputs.exists == 'true'
        run: |
          pip install flake8 autopep8

      - name: Auto-fix Whitespace (excluding F401)
        if: steps.check_python.outputs.exists == 'true'
        run: |
          # Run autopep8 to fix standard formatting issues (E1, E2, E3, W2, W3, etc.)
          # This naturally excludes F401 (unused imports) as requested.
          autopep8 --in-place --recursive --aggressive --aggressive .

      - name: Run Flake8
        if: steps.check_python.outputs.exists == 'true'
        run: |
          # Pass 1: Critical syntax errors (always block)
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Pass 2: Code quality errors (block on real errors, ignore style/unused warnings)
          # IGNORED:
          #   E501: line too long | W503/W504: line break around operator
          #   W191: tabs | W291-W293: trailing/blank whitespace | W391: blank line at EOF
          #   E261/E265: comment spacing | E302/E303/E305: blank lines between defs
          #   E111/E114/E116/E117: indentation | E127/E128: continuation indent
          #   E225/E226: operator spacing | E401: multiple imports | F401: unused import
          #   F841: unused variable (Keeping for context)
          # BLOCKING (Real Errors):
          #   E722: bare except | F541: broken f-string | F811: redefinition | C901: too complex
          flake8 . --count --max-complexity=10 --max-line-length=120 \
            --ignore=E501,W503,W504,W191,W291,W292,W293,W391,E261,E265,E302,E303,E305,E111,E114,E116,E117,E127,E128,E225,E226,E401,F401,F841 \
            --statistics

      - name: Commit Auto-fixes
        if: steps.check_python.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "style: automated whitespace/lint fixes [skip ci]"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No changes to commit."
          fi

  lint-flutter:
    needs: telemetry
    name: 🐦 Flutter Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Flutter
        id: check_flutter
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Helper - Subosito Flutter
        if: steps.check_flutter.outputs.exists == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto-fix Whitespace (Flutter)
        if: steps.check_flutter.outputs.exists == 'true'
        run: |
          dart format .

      - name: Run Build Runner
        if: inputs.run-build-runner == true && steps.check_flutter.outputs.exists == 'true'
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Run Flutter Analyze
        if: steps.check_flutter.outputs.exists == 'true'
        run: |
          # Use fatal-infos to be strict, but we use no-fatal-warnings for legacy compatibility
          flutter config --no-analytics
          flutter pub get
          flutter analyze . --no-fatal-warnings

      - name: Commit Auto-fixes
        if: steps.check_flutter.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "style: automated flutter formatting [skip ci]"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No changes to commit."
          fi

  lint-node:
    needs: telemetry
    name: 📦 JS/TS Lint (ESLint)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Node
        id: check_node
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Setup Node
        if: steps.check_node.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Auto-fix Whitespace (Node)
        if: steps.check_node.outputs.exists == 'true'
        run: |
          # Use Prettier for global whitespace fixes if available, fallback to eslint fix
          if npx prettier --version > /dev/null 2>&1; then
             npx prettier --write .
          elif npm list eslint > /dev/null 2>&1; then
             npx eslint . --ext .js,.jsx,.ts,.tsx --fix
          else
             echo "No formatter (prettier/eslint) found. Skipping auto-fix."
          fi

      - name: Run ESLint
        if: steps.check_node.outputs.exists == 'true'
        # Errors will fail the build
        run: |
          if npm list eslint > /dev/null 2>&1; then
             npx eslint . --ext .js,.jsx,.ts,.tsx
          else
             echo "ESLint not installed in package.json. Skipping."
          fi

      - name: Commit Auto-fixes
        if: steps.check_node.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "style: automated node formatting [skip ci]"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No changes to commit."
          fi
