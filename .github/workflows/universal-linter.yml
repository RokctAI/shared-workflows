name: Universal Code Quality (Lint)

permissions: write-all
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
    inputs:
      copyright-text:
        required: false
        type: string
        description: "Standard copyright text to prepend to Python files (e.g., 'Rokct Intelligence'). The year is added automatically."
      run-build-runner:
        required: false
        type: boolean
        default: false
        description: "Run build_runner before analyzing Flutter code"
      flutter-channel:
        required: false
        type: string
        default: 'stable'
        description: "Flutter channel to use (default: stable)"
      flutter-version:
        required: false
        type: string
        default: ''
        description: "Specific Flutter version to use (e.g. '3.24.5')"
      force-fix:
        required: false
        type: boolean
        default: false
        description: "Force auto-fix and commit even on PR/Push (used for daily cleanup and stable releases)"
    secrets:
      MONOREPO_PAT:
        required: false
      COUNTER_API_KEY:
        required: false
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      backfill_ai_notes_cutoff_version:
        type: string
        default: ""
        description: "Regenerate AI release notes starting from this version (use 'all' for full history)"


jobs:
  standardize:
    name: 🔄 Fleet Standardizer (Auto-Fix)
    permissions: write-all
    runs-on: ubuntu-latest
    env:
      IS_SELF: ''
      ENGINE_PATH: ''
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Fleet Standardizer
        run: |
          if [ "${{ github.repository }}" == "RokctAI/shared-workflows" ]; then
            echo "ENGINE_PATH=scripts/standardize_fleet.py" >> $GITHUB_ENV
            echo "IS_SELF=true" >> $GITHUB_ENV
          else
            echo "ENGINE_PATH=.github/shared-workflows/scripts/standardize_fleet.py" >> $GITHUB_ENV
            echo "IS_SELF=false" >> $GITHUB_ENV
          fi

      - name: Checkout Shared Workflows
        if: env.IS_SELF == 'false'
        uses: actions/checkout@v6
        with:
          repository: RokctAI/shared-workflows
          token: ${{ github.token }}
          path: .github/shared-workflows

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true # Fallback to GITHUB_TOKEN if App not configured

      - name: Run Standardizer Engine
        env:
          BOT_NAME: ${{ github.repository_owner == 'RokctAI' && 'rokct-maintainer' || github.repository_owner }}
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" || "${{ inputs.force-fix }}" == "true" ]]; then
            python3 ${{ env.ENGINE_PATH }}
          else
            python3 ${{ env.ENGINE_PATH }} --check || echo "⚠️ Repository standardization check failed (minor). Proceeding anyway."
          fi

      - name: Setup Identity (Local)
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.force-fix == true) && env.IS_SELF == 'true'
        uses: ./.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Identity (Shared)
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.force-fix == true) && env.IS_SELF == 'false'
        uses: ./.github/shared-workflows/.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Cleanup Temporary Files
        if: always() && env.IS_SELF == 'false'
        run: rm -rf .github/shared-workflows

      - name: Commit & Push Changes
        if: always() && steps.app-token.outputs.token != '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.force-fix == true)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "chore: automated fleet standardization [skip ci]"
            
            # Enforce PR-First Strategy: No direct pushes to protected or main branches for bot
            echo "🚀 PR-First Strategy: Creating maintenance branch for standardization..."
            BRANCH_NAME="auto-std-${{ github.ref_name }}-${{ github.run_id }}"
            
            # Check if PR already exists for this branch
            EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --json url --jq '.[0].url')
            if [ -n "$EXISTING_PR" ]; then
                echo "ℹ️ Peer PR already exists: $EXISTING_PR. Updating existing branch."
                git checkout -b "$BRANCH_NAME" || git checkout "$BRANCH_NAME"
                git push -f origin "$BRANCH_NAME"
                exit 0
            fi

            git checkout -b "$BRANCH_NAME"
            if git push -u origin "$BRANCH_NAME" 2>&1 | tee push_error.log; then
                gh pr create --title "🔄 Fleet Standardization: Config & Submodules" --body "Automated maintenance generated by universal-linter during run ${{ github.run_id }}.\n\nNote: This PR was created via the PR-First strategy. It will auto-merge if CI passes and auto-merge is enabled." --head "$BRANCH_NAME" --base "${{ github.ref_name }}" || echo "PR creation failed (check if already exists)."
                echo "✅ Maintenance PR opened. Status set to Success to keep CI green. Please merge manually or rely on auto-merge."
                exit 0
            else
                if grep -qi "workflows" push_error.log && grep -qi "permission" push_error.log; then
                   echo "### 🚨 Action Required: GitHub App Permissions" >> $GITHUB_STEP_SUMMARY
                   echo "The Fleet Standardizer attempted to update your workflow files but failed due to missing permissions." >> $GITHUB_STEP_SUMMARY
                   echo "- **Error**: $(grep -i "permission" push_error.log | head -n 1)" >> $GITHUB_STEP_SUMMARY
                   echo "- **Fix**: Go to your GitHub App settings > **Permissions & events** > **Repository permissions** > Set **Workflows** to **Read & Write**." >> $GITHUB_STEP_SUMMARY
                   echo "⚠️ CI is proceeding but your repository is out of sync with fleet standards." >> $GITHUB_STEP_SUMMARY
                   exit 0 # Non-blocking for permission issues
                fi
                echo "❌ Failed to push branch for PR."
                exit 1
            fi
          else
            echo "🙌 Repository is already standardized."
          fi


  telemetry:
    needs: standardize
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Track Usage
        env:
          API_KEY: ${{ secrets.COUNTER_API_KEY }}
        if: env.API_KEY != ''
        run: |
          curl -X GET "https://api.counterapi.dev/v2/rokctai/usage/up" \
          -H "Authorization: Bearer $API_KEY"

  lint-python:
    needs: telemetry
    name: 🐍 Python Lint (Flake8 & AutoPEP8)
    permissions: write-all
    runs-on: ubuntu-latest
    env:
      IS_SELF: ''
      findings: ''
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Fleet Standardizer
        run: |
          if [ "${{ github.repository }}" == "RokctAI/shared-workflows" ]; then
            echo "IS_SELF=true" >> $GITHUB_ENV
          else
            echo "IS_SELF=false" >> $GITHUB_ENV
          fi

      - name: Checkout Shared Workflows
        if: env.IS_SELF == 'false'
        uses: actions/checkout@v6
        with:
          repository: RokctAI/shared-workflows
          token: ${{ github.token }}
          path: .github/shared-workflows

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true



      - name: Check for Python
        id: check_python
        run: |
          if [ -f "requirements.txt" ] || [ -f "pyproject.toml" ] || [ -f "setup.py" ] || [ -f "Pipfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Set up Python
        if: steps.check_python.outputs.exists == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Lint Tools
        if: steps.check_python.outputs.exists == 'true'
        run: |
          pip install flake8 autopep8

      - name: Auto-fix Whitespace (excluding F401)
        if: steps.check_python.outputs.exists == 'true'
        run: |
          # Run autopep8 to fix standard formatting issues (E1, E2, E3, W2, W3, etc.)
          # Exclude .github directory, virtual environments, caches, and minified files
          autopep8 --in-place --recursive --aggressive --aggressive --exclude .github,.git,node_modules,env,venv,.venv,__pycache__,*.min.js .

      - name: Auto-Inject Frappe Copyright
        if: steps.check_python.outputs.exists == 'true' && inputs.copyright-text != ''
        env:
          COPYRIGHT_INPUT: ${{ inputs.copyright-text }}
        run: |
          # The caller workflow provides the entity name/format. 
          # The universal linter adds the dynamic year.
          CURRENT_YEAR=$(date +%Y)
          
          # We construct the final header by taking the user's input and injecting the year
          # Assuming the input looks something like: "Copyright (c) {YEAR}, Rokct Intelligence (pty) Ltd."
          # If they just provided the name, we build the standard Frappe string.
          # We will default to standard Frappe format:
          HEADER="# Copyright (c) ${CURRENT_YEAR}, ${COPYRIGHT_INPUT}\n# For license information, please see license.txt\n"
          
          echo "Using copyright template:"
          echo -e "$HEADER"
          
          # Find all python files, explicitly ignoring __init__.py and common excluded folders
          find . -name "*.py" -not -name "__init__.py" \
               -not -path "*/\.*" \
               -not -path "*/node_modules/*" \
               -not -path "*/env/*" \
               -not -path "*/venv/*" \
               -not -path "*/tests/*" | while read -r file; do
             
             # Check if file already has a copyright header (case-insensitive check for 'Copyright' in first 5 lines)
             if ! head -n 5 "$file" | grep -qi "Copyright"; then
                  echo "Adding copyright to $file"
                  # Escape the header for sed
                  ESCAPED_HEADER=$(echo "$HEADER" | sed 's/\\/\\\\/g' | sed 's/\//\\\//g' | sed 's/$/\\n/g' )
                  # Use awk to prepend the header block cleanly
                  awk -v header="$HEADER" 'BEGIN{print header; print ""} {print}' "$file" > tmpfile && mv tmpfile "$file"
             fi
          done

      - name: Run Flake8
        if: steps.check_python.outputs.exists == 'true'
        run: |
          # Capture output to a file for issue reporting but still exit with 0 to be non-blocking
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics > flake8_output.txt 2>&1 || true
          flake8 . --count --max-complexity=10 --max-line-length=120 \
            --ignore=E501,W503,W504,W191,W291,W292,W293,W391,E261,E265,E302,E303,E305,E111,E114,E116,E117,E127,E128,E225,E226,E401,F401,F841 \
            --statistics >> flake8_output.txt 2>&1 || true
          
          # Print for log visibility
          cat flake8_output.txt
          
          # Set output if findings exist (contains :)
          if grep -q ":" flake8_output.txt; then
             echo "findings=true" >> $GITHUB_ENV
          else
             echo "findings=false" >> $GITHUB_ENV
          fi

      - name: Create Issue on Findings
        if: env.findings == 'true' && steps.check_python.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          BODY="### 🐍 Python Lint Failure
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}
          
          #### Error Summary:
          \`\`\`
          $(head -c 2000 flake8_output.txt)
          \`\`\`
          "
          gh issue create --title "🚨 CI: Python Lint Failure" --body "$BODY" --label "CI Blocker" || echo "Issue already exists or failed to create."

      - name: Setup Identity (Local)
        if: steps.check_python.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.IS_SELF == 'true'
        uses: ./.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Identity (Shared)
        if: steps.check_python.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.IS_SELF == 'false'
        uses: ./.github/shared-workflows/.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Cleanup Shared Workflows Checkout
        if: always() && env.IS_SELF == 'false'
        run: rm -rf .github/shared-workflows
        shell: bash

      - name: Commit Auto-fixes
        if: steps.check_python.outputs.exists == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.force-fix == true)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          # Clean up temporary findings files so they are not included in status check or commit
          rm -f flake8_output.txt flutter_output.txt npm_audit_output.txt
          
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "style: automated python whitespace/lint fixes [skip ci]"
            
            # Enforce PR-First Strategy: No direct pushes
            echo "🚀 PR-First Strategy: Consolidating fixes into maintenance branch..."
            BRANCH_NAME="auto-std-${{ github.ref_name }}-${{ github.run_id }}"
            
            # Check if PR already exists for this branch
            EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --json url --jq '.[0].url')
            if [ -n "$EXISTING_PR" ]; then
                echo "ℹ️ Peer PR already exists: $EXISTING_PR. Updating existing branch."
                git pull origin "$BRANCH_NAME" --rebase || echo "Pull failed, forcing push..."
                git push -f origin HEAD:"$BRANCH_NAME"
                exit 0
            fi

            git checkout -b "$BRANCH_NAME"
            if git push -u origin "$BRANCH_NAME" 2>&1 | tee push_error.log; then
                gh pr create --title "🔄 Fleet Standardization: Config & Style" --body "Automated maintenance generated by universal-linter during run ${{ github.run_id }}.\n\nContains: Python Lint Repairs." --head "$BRANCH_NAME" --base "${{ github.ref_name }}" || echo "PR already exists."
                echo "✅ Maintenance PR opened. Status set to Success to keep CI green."
                exit 0
            else
                if grep -qi "workflows" push_error.log && grep -qi "permission" push_error.log; then
                   echo "### 🚨 Action Required: GitHub App Permissions" >> $GITHUB_STEP_SUMMARY
                   echo "The Fleet Standardizer attempted to update your workflow files but failed due to missing permissions." >> $GITHUB_STEP_SUMMARY
                   echo "- **Error**: $(grep -i "permission" push_error.log | head -n 1)" >> $GITHUB_STEP_SUMMARY
                   echo "- **Fix**: Go to your GitHub App settings > **Permissions & events** > **Repository permissions** > Set **Workflows** to **Read & Write**." >> $GITHUB_STEP_SUMMARY
                   exit 0 # Non-blocking for permission issues
                fi
                echo "❌ Failed to push branch for PR."
                exit 1
            fi
          else
            echo "No changes to commit."
          fi

      - name: Verify Python Formatting
        if: steps.check_python.outputs.exists == 'true' && github.event_name == 'pull_request'
        run: |
          rm -f flake8_output.txt flutter_output.txt npm_audit_output.txt
          if [[ -n $(git status -s) ]]; then
            echo "❌ Python code is NOT formatted correctly. Please run autopep8 locally."
            git status -s
            exit 1
          else
            echo "✅ Python code is properly formatted."
          fi

  lint-shell:
    needs: telemetry
    name: 🐚 Shell Script Lint (ShellCheck)
    permissions: write-all
    runs-on: ubuntu-latest
    env:
      IS_SELF: ''
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Fleet Standardizer
        run: |
          if [ "${{ github.repository }}" == "RokctAI/shared-workflows" ]; then
            echo "IS_SELF=true" >> $GITHUB_ENV
          else
            echo "IS_SELF=false" >> $GITHUB_ENV
          fi

      - name: Checkout Shared Workflows
        if: env.IS_SELF == 'false'
        uses: actions/checkout@v6
        with:
          repository: RokctAI/shared-workflows
          token: ${{ github.token }}
          path: .github/shared-workflows

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true



      - name: Format Shell Scripts
        run: |
          # Use dockerized shfmt for zero-dependency alpine formatting
          # Find all .sh files, explicitly excluding Flutter's native build directories
          # because they contain auto-generated scripts we shouldn't touch
          # We also exclude node_modules and .git
          
          # We format the find output directly into a string that docker can use as arguments relative to /mnt
          FILES_TO_FORMAT=$(find . -name "*.sh" -not -path "*/\.git/*" -not -path "*/\.github/*" -not -path "*/node_modules/*" -not -path "*/ios/*" -not -path "*/macos/*" -not -path "*/android/*" -not -path "*/windows/*" -not -path "*/linux/*" | sed "s|^\./|/mnt/|")
          
          if [ -n "$FILES_TO_FORMAT" ]; then
             echo "Found shell scripts to format:"
             echo "$FILES_TO_FORMAT"
             
             # -w: write
             # -i 2: indent 2 spaces
             # -ln bash: force bash parser (prevents posix 'function' keyword errors like in Flutter's extract_dart_defines.sh)
             # xargs is used here to pass the list of files to the docker container
             echo "$FILES_TO_FORMAT" | xargs docker run --rm -v $(pwd):/mnt mvdan/shfmt:latest -w -i 2 -ln bash
          else
             echo "No target shell scripts found. Skipping."
          fi

      - name: Setup Identity (Local)
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.force-fix == true) && env.IS_SELF == 'true'
        uses: ./.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Identity (Shared)
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.force-fix == true) && env.IS_SELF == 'false'
        uses: ./.github/shared-workflows/.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Cleanup Shared Workflows Checkout
        if: always() && env.IS_SELF == 'false'
        run: rm -rf .github/shared-workflows
        shell: bash

      - name: Commit Auto-fixes
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || inputs.force-fix == true)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "style: automated shell script formatting [skip ci]"
            
            # Enforce PR-First Strategy: No direct pushes
            echo "🚀 PR-First Strategy: Consolidating fixes into maintenance branch..."
            BRANCH_NAME="auto-std-${{ github.ref_name }}-${{ github.run_id }}"
            
            # Check if PR already exists for this branch
            EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --json url --jq '.[0].url')
            if [ -n "$EXISTING_PR" ]; then
                echo "ℹ️ Peer PR already exists: $EXISTING_PR. Updating existing branch."
                git pull origin "$BRANCH_NAME" --rebase || echo "Pull failed, forcing push..."
                git push -f origin HEAD:"$BRANCH_NAME"
                exit 0
            fi

            git checkout -b "$BRANCH_NAME"
            if git push -u origin "$BRANCH_NAME" 2>&1 | tee push_error.log; then
                gh pr create --title "🔄 Fleet Standardization: Config & Style" --body "Automated maintenance generated by universal-linter during run ${{ github.run_id }}.\n\nContains: Shell Script Formatting." --head "$BRANCH_NAME" --base "${{ github.ref_name }}" || echo "PR already exists."
                echo "✅ Maintenance PR opened. Status set to Success to keep CI green."
                exit 0
            else
                if grep -qi "workflows" push_error.log && grep -qi "permission" push_error.log; then
                   echo "### 🚨 Action Required: GitHub App Permissions" >> $GITHUB_STEP_SUMMARY
                   echo "The Fleet Standardizer attempted to update your workflow files but failed due to missing permissions." >> $GITHUB_STEP_SUMMARY
                   echo "- **Error**: $(grep -i "permission" push_error.log | head -n 1)" >> $GITHUB_STEP_SUMMARY
                   echo "- **Fix**: Go to your GitHub App settings > **Permissions & events** > **Repository permissions** > Set **Workflows** to **Read & Write**." >> $GITHUB_STEP_SUMMARY
                   exit 0 # Non-blocking for permission issues
                fi
                echo "❌ Failed to push branch for PR."
                exit 1
            fi
          fi

      - name: Verify Shell Formatting
        if: github.event_name == 'pull_request'
        run: |
          if [[ -n $(git status -s) ]]; then
            echo "❌ Shell scripts are NOT formatted correctly. Please run shfmt locally."
            git status -s
            exit 1
          else
            echo "✅ Shell scripts are properly formatted."
          fi

  lint-powershell:
    needs: telemetry
    name: 🐚 PowerShell Script Format (PSScriptAnalyzer)
    permissions: write-all
    runs-on: ubuntu-latest
    env:
      IS_SELF: ''
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Fleet Standardizer
        run: |
          if [ "${{ github.repository }}" == "RokctAI/shared-workflows" ]; then
            echo "IS_SELF=true" >> $GITHUB_ENV
          else
            echo "IS_SELF=false" >> $GITHUB_ENV
          fi

      - name: Checkout Shared Workflows
        if: env.IS_SELF == 'false'
        uses: actions/checkout@v6
        with:
          repository: RokctAI/shared-workflows
          token: ${{ github.token }}
          path: .github/shared-workflows

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || inputs.force-fix == true)
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true



      - name: Format PowerShell Scripts
        shell: pwsh
        run: |
          # 1. Check if there are any .ps1 files we actually need to format
          # (excluding node_modules, venv, and other common CI/hidden folders)
          $psFiles = Get-ChildItem -Path . -Filter "*.ps1" -Recurse -File | Where-Object { 
              $_.FullName -notmatch "\\node_modules\\" -and 
              $_.FullName -notmatch "\\venv\\" -and 
              $_.FullName -notmatch "\\env\\" -and
              $_.FullName -notmatch "\\.venv\\" -and
              $_.FullName -notmatch "\\\.git\\" -and $_.FullName -notmatch "\\\.github\\" 
          }
          
          if ($psFiles.Count -eq 0) {
              Write-Host "No PowerShell scripts found. Skipping."
              exit 0
          }
          
          # 2. Install the formatter module automatically ONLY if not already present
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
              Write-Host "PSScriptAnalyzer not found. Installing..."
              Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -AllowClobber -ErrorAction SilentlyContinue
          } else {
              Write-Host "PSScriptAnalyzer already installed."
          }
          
          # 3. Format each file and overwrite
          foreach ($file in $psFiles) {
              Write-Host "Formatting $($file.FullName)"
              $formattedContent = Invoke-Formatter -ScriptDefinition (Get-Content $file.FullName -Raw)
              # Save using UTF8 without BOM for Linux/cross-platform compatibility
              $Utf8NoBomEncoding = New-Object System.Text.UTF8Encoding $False
              [System.IO.File]::WriteAllText($file.FullName, $formattedContent, $Utf8NoBomEncoding)
          }

      - name: Setup Identity (Local)
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && env.IS_SELF == 'true'
        uses: ./.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Identity (Shared)
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && env.IS_SELF == 'false'
        uses: ./.github/shared-workflows/.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Cleanup Shared Workflows Checkout
        if: always() && env.IS_SELF == 'false'
        run: rm -rf .github/shared-workflows
        shell: bash

      - name: Commit Auto-fixes
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || inputs.force-fix == true)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "style: automated powershell script formatting [skip ci]"
            
            # Enforce PR-First Strategy: No direct pushes
            echo "🚀 PR-First Strategy: Consolidating fixes into maintenance branch..."
            BRANCH_NAME="auto-std-${{ github.ref_name }}-${{ github.run_id }}"
            
            # Check if PR already exists for this branch
            EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --json url --jq '.[0].url')
            if [ -n "$EXISTING_PR" ]; then
                echo "ℹ️ Peer PR already exists: $EXISTING_PR. Updating existing branch."
                git pull origin "$BRANCH_NAME" --rebase || echo "Pull failed, forcing push..."
                git push -f origin HEAD:"$BRANCH_NAME"
                exit 0
            fi

            git checkout -b "$BRANCH_NAME"
            if git push -u origin "$BRANCH_NAME" 2>&1 | tee push_error.log; then
                gh pr create --title "🔄 Fleet Standardization: Config & Style" --body "Automated maintenance generated by universal-linter during run ${{ github.run_id }}.\n\nContains: PowerShell Script Formatting." --head "$BRANCH_NAME" --base "${{ github.ref_name }}" || echo "PR already exists."
                echo "✅ Maintenance PR opened. Status set to Success to keep CI green."
                exit 0
            else
                if grep -qi "workflows" push_error.log && grep -qi "permission" push_error.log; then
                   echo "### 🚨 Action Required: GitHub App Permissions" >> $GITHUB_STEP_SUMMARY
                   echo "The Fleet Standardizer attempted to update your workflow files but failed due to missing permissions." >> $GITHUB_STEP_SUMMARY
                   echo "- **Error**: $(grep -i "permission" push_error.log | head -n 1)" >> $GITHUB_STEP_SUMMARY
                   echo "- **Fix**: Go to your GitHub App settings > **Permissions & events** > **Repository permissions** > Set **Workflows** to **Read & Write**." >> $GITHUB_STEP_SUMMARY
                   exit 0 # Non-blocking for permission issues
                fi
                echo "❌ Failed to push branch for PR."
                exit 1
            fi
          fi

      - name: Verify PowerShell Formatting
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          if ($(git status -s).Length -gt 0) {
              Write-Error "❌ PowerShell scripts are NOT formatted correctly. Please run Invoke-Formatter locally."
              git status -s
              exit 1
          } else {
              Write-Host "✅ PowerShell scripts are properly formatted."
          }

  lint-flutter:
    needs: telemetry
    name: 🐦 Flutter Analyze
    permissions: write-all
    runs-on: ubuntu-latest
    env:
      IS_SELF: ''
      findings: ''
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Fleet Standardizer
        run: |
          if [ "${{ github.repository }}" == "RokctAI/shared-workflows" ]; then
            echo "IS_SELF=true" >> $GITHUB_ENV
          else
            echo "IS_SELF=false" >> $GITHUB_ENV
          fi

      - name: Checkout Shared Workflows
        if: env.IS_SELF == 'false'
        uses: actions/checkout@v6
        with:
          repository: RokctAI/shared-workflows
          token: ${{ github.token }}
          path: .github/shared-workflows

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || inputs.force-fix == true)
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true



      - name: Check for Flutter
        id: check_flutter
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Helper - Subosito Flutter
        if: steps.check_flutter.outputs.exists == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter-channel }}
          flutter-version: ${{ inputs.flutter-version }}
          cache: true

      - name: Auto-fix Whitespace (Flutter)
        if: steps.check_flutter.outputs.exists == 'true'
        run: |
          # Format only lib, test, and other source dirs, avoiding .github
          if [ -d "lib" ]; then dart format lib; fi
          if [ -d "test" ]; then dart format test; fi
          if [ -d "source" ]; then dart format source; fi

      - name: Run Flutter Analyze
        if: steps.check_flutter.outputs.exists == 'true'
        run: |
          flutter config --no-analytics
          flutter pub get
          # Non-blocking analysis
          flutter analyze . --no-fatal-warnings > flutter_output.txt 2>&1 || true
          
          # Set output if findings exist (contains :)
          if grep -q ":" flutter_output.txt; then
             echo "findings=true" >> $GITHUB_ENV
          else
             echo "findings=false" >> $GITHUB_ENV
          fi

      - name: Create Issue on Findings
        if: env.findings == 'true' && steps.check_flutter.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          BODY="### 🐦 Flutter Analysis Failure
          **Commit:** ${{ github.sha }}
          
          #### Output:
          \`\`\`
          $(head -c 2000 flutter_output.txt)
          \`\`\`
          "
          gh issue create --title "🚨 CI: Flutter Analysis Failure" --body "$BODY" --label "CI Blocker" || echo "Issue already exists."

      - name: Setup Identity (Local)
        if: steps.check_flutter.outputs.exists == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.force-fix == true) && env.IS_SELF == 'true'
        uses: ./.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Identity (Shared)
        if: steps.check_flutter.outputs.exists == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.force-fix == true) && env.IS_SELF == 'false'
        uses: ./.github/shared-workflows/.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Cleanup Shared Workflows Checkout
        if: always() && env.IS_SELF == 'false'
        run: rm -rf .github/shared-workflows
        shell: bash

      - name: Commit Auto-fixes
        if: steps.check_flutter.outputs.exists == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.force-fix == true)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          # Clean up temporary findings files
          rm -f flake8_output.txt flutter_output.txt npm_audit_output.txt

          if [[ -n $(git status -s) ]]; then
            git restore pubspec.lock || true
            if [[ -n $(git status -s) ]]; then
              git add .
              git commit -m "style: automated flutter formatting [skip ci]"
              
              # Enforce PR-First Strategy: No direct pushes
              echo "🚀 PR-First Strategy: Consolidating fixes into maintenance branch..."
              BRANCH_NAME="auto-std-${{ github.ref_name }}-${{ github.run_id }}"
              
              # Check if PR already exists for this branch
              EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --json url --jq '.[0].url')
              if [ -n "$EXISTING_PR" ]; then
                  echo "ℹ️ Peer PR already exists: $EXISTING_PR. Updating existing branch."
                  git pull origin "$BRANCH_NAME" --rebase || echo "Pull failed, forcing push..."
                  git push -f origin HEAD:"$BRANCH_NAME"
                  exit 0
              fi

              git checkout -b "$BRANCH_NAME"
              if git push -u origin "$BRANCH_NAME" 2>&1 | tee push_error.log; then
                  gh pr create --title "🔄 Fleet Standardization: Config & Style" --body "Automated maintenance generated by universal-linter during run ${{ github.run_id }}.\n\nContains: Flutter Dart Formatting." --head "$BRANCH_NAME" --base "${{ github.ref_name }}" || echo "PR already exists."
                  echo "✅ Maintenance PR opened. Status set to Success to keep CI green."
                  exit 0
              else
                  if grep -qi "workflows" push_error.log && grep -qi "permission" push_error.log; then
                     echo "### 🚨 Action Required: GitHub App Permissions" >> $GITHUB_STEP_SUMMARY
                     echo "The Fleet Standardizer attempted to update your workflow files but failed due to missing permissions." >> $GITHUB_STEP_SUMMARY
                     echo "- **Error**: $(grep -i "permission" push_error.log | head -n 1)" >> $GITHUB_STEP_SUMMARY
                     echo "- **Fix**: Go to your GitHub App settings > **Permissions & events** > **Repository permissions** > Set **Workflows** to **Read & Write**." >> $GITHUB_STEP_SUMMARY
                     exit 0 # Non-blocking for permission issues
                  fi
                  echo "❌ Failed to push branch for PR."
                  exit 1
              fi
            else
              echo "Only pubspec.lock changed. Skipping commit."
            fi
          else
            echo "No changes to commit."
          fi

  audit-data-leaks:
    name: 🔍 Data Leak Audit (Excel/CSV)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Scan for Unverified Data Exports
        run: |
          # Policy: Excel/CSV files should not be committed to the repo, 
          # especially on non-stable branches.
          LEAKS=$(find . -type f -name "*.xlsx" -o -name "*.xls" -o -name "*.csv" | grep -v "node_modules" || true)
          if [ -n "$LEAKS" ]; then
             echo "### ⚠️ Potential Data Leak Detected" >> $GITHUB_STEP_SUMMARY
             echo "The following unverified data files were found in the repository:" >> $GITHUB_STEP_SUMMARY
             echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
             echo "$LEAKS" >> $GITHUB_STEP_SUMMARY
             echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
             echo "💡 **Policy**: Fleet standards prohibit committing Excel/CSV exports to the source tree. Use stable release artifacts for data distribution." >> $GITHUB_STEP_SUMMARY
             
             if [[ "${{ github.ref_name }}" != "main" ]]; then
                echo "❌ Unverified data found on non-stable branch."
                # We don't fail yet, just warn loudly in summary
             fi
          fi

  lint-node:
    needs: telemetry
    name: 📦 JS/TS Lint (ESLint & Security)
    permissions: write-all
    runs-on: ubuntu-latest
    env:
      IS_SELF: ''
      audit_findings: ''
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Fleet Standardizer
        run: |
          if [ "${{ github.repository }}" == "RokctAI/shared-workflows" ]; then
            echo "IS_SELF=true" >> $GITHUB_ENV
          else
            echo "IS_SELF=false" >> $GITHUB_ENV
          fi

      - name: Checkout Shared Workflows
        if: env.IS_SELF == 'false'
        uses: actions/checkout@v6
        with:
          repository: RokctAI/shared-workflows
          token: ${{ github.token }}
          path: .github/shared-workflows

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || inputs.force-fix == true)
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true



      - name: Check for Node
        id: check_node
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Setup Node
        if: steps.check_node.outputs.exists == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Auto-fix Whitespace (Node)
        if: steps.check_node.outputs.exists == 'true'
        run: |
          if npx prettier --version > /dev/null 2>&1; then
             npx prettier --write . --ignore-path .gitignore --plugin-search-dir=. --ignore-unknown . '!**/.github/**' '!**/*.md' '!**/*.svg' '!**/*.html' '!**/package-lock.json' '!**/*.env*' '!**/*production.env' '!**/*.env.local'
          elif npm list eslint > /dev/null 2>&1; then
             npx eslint . --ext .js,.jsx,.ts,.tsx --fix --ignore-pattern ".github/workflows"
          fi

      - name: Run NPM Audit
        if: steps.check_node.outputs.exists == 'true'
        run: |
          npm audit --audit-level=high > npm_audit_output.txt 2>&1 || true
          
          # Set findings if vulnerabilities found (contains "high" or "critical")
          if grep -qEi "high|critical" npm_audit_output.txt; then
             echo "audit_findings=true" >> $GITHUB_ENV
          else
             echo "audit_findings=false" >> $GITHUB_ENV
          fi

      - name: Create Issue on Audit Findings
        if: env.audit_findings == 'true' && steps.check_node.outputs.exists == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          BODY="### 📦 Node Security Audit Failure
          **High/Critical vulnerabilities found.**
          
          #### Audit Summary:
          \`\`\`
          $(head -c 2000 npm_audit_output.txt)
          \`\`\`
          "
          gh issue create --title "🚨 CI: Node Security Alert (High/Critical)" --body "$BODY" --label "Security" || echo "Issue already exists."

      - name: Run ESLint
        if: steps.check_node.outputs.exists == 'true'
        run: |
          if npm list eslint > /dev/null 2>&1; then
             npx eslint . --ext .js,.jsx,.ts,.tsx
          fi

      - name: Setup Identity (Local)
        if: steps.check_node.outputs.exists == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.force-fix == true) && env.IS_SELF == 'true'
        uses: ./.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Identity (Shared)
        if: steps.check_node.outputs.exists == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.force-fix == true) && env.IS_SELF == 'false'
        uses: ./.github/shared-workflows/.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Cleanup Shared Workflows Checkout
        if: always() && env.IS_SELF == 'false'
        run: rm -rf .github/shared-workflows
        shell: bash

      - name: Commit Auto-fixes
        if: steps.check_node.outputs.exists == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.force-fix == true)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          # Clean up temporary findings files
          rm -f flake8_output.txt flutter_output.txt npm_audit_output.txt

          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "style: automated node formatting [skip ci]"
            
            # Enforce PR-First Strategy: No direct pushes
            echo "🚀 PR-First Strategy: Consolidating fixes into maintenance branch..."
            BRANCH_NAME="auto-std-${{ github.ref_name }}-${{ github.run_id }}"
            
            # Check if PR already exists for this branch
            EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --json url --jq '.[0].url')
            if [ -n "$EXISTING_PR" ]; then
