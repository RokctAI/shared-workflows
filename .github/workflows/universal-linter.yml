        run: |
          git config --global user.name "RokctBOT[bot]"
          git config --global user.email "2956274+RokctBOT[bot]@users.noreply.github.com"

      - name: Setup Fleet Standardizer
        run: |
          if [ "${{ github.repository }}" = "RokctAI/shared-workflows" ]; then
            { echo "IS_SELF=true"; } >> "$GITHUB_ENV"
          else
            { echo "IS_SELF=false"; } >> "$GITHUB_ENV"
          fi

      - name: Checkout Shared Workflows
        if: env.IS_SELF == 'false'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: RokctAI/shared-workflows
          token: ${{ github.token }}
          path: .github/shared-workflows

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true



      - name: Format Shell Scripts
        run: |
          # Use dockerized shfmt for zero-dependency alpine formatting
          # Find all .sh files, explicitly excluding Flutter's native build directories
          # because they contain auto-generated scripts we shouldn't touch
          # We also exclude node_modules and .git
          FILES_TO_FORMAT=$(find . -name "*.sh" -not -path "*/\.git/*" -not -path "*/\.github/*" -not -path "*/node_modules/*" -not -path "*/ios/*" -not -path "*/macos/*" -not -path "*/android/*" -not -path "*/windows/*" -not -path "*/linux/*")
          
          if [ -n "$FILES_TO_FORMAT" ]; then
             echo "Found shell scripts to format:"
             echo "$FILES_TO_FORMAT"
             
             # Install shfmt if not present (for non-frappe ubuntu host)
             if ! command -v shfmt >/dev/null; then
                curl -sSLo /usr/local/bin/shfmt https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
                chmod +x /usr/local/bin/shfmt
             fi

             # -w: write
             # -i 2: indent 2 spaces
             # -ln bash: force bash parser
             echo "$FILES_TO_FORMAT" | xargs shfmt -w -i 2 -ln bash
