name: Universal Code Quality (Lint)

on:
  workflow_call:
    inputs:
      copyright-text:
        required: false
        type: string
        description: "Standard copyright text to prepend to Python files (e.g., 'Rokct Intelligence'). The year is added automatically."
      run-build-runner:
        required: false
        type: boolean
        default: false
        description: "Run build_runner before analyzing Flutter code"
      flutter-channel:
        required: false
        type: string
        default: 'stable'
        description: "Flutter channel to use (default: stable)"
      flutter-version:
        required: false
        type: string
        default: ''
        description: "Specific Flutter version to use (e.g. '3.24.5')"
    secrets:
      COUNTER_API_KEY:
        required: false

jobs:
  standardize:
    name: 🔄 Fleet Standardizer (Auto-Fix)
    runs-on: ubuntu-latest
    env:
      IS_SELF: ''
      ENGINE_PATH: ''
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Fleet Standardizer
        run: |
          if [ "${{ github.repository }}" == "RokctAI/shared-workflows" ]; then
            echo "ENGINE_PATH=scripts/standardize_fleet.py" >> $GITHUB_ENV
            echo "IS_SELF=true" >> $GITHUB_ENV
          else
            echo "ENGINE_PATH=.github/shared-workflows/scripts/standardize_fleet.py" >> $GITHUB_ENV
            echo "IS_SELF=false" >> $GITHUB_ENV
          fi

      - name: Checkout Shared Workflows
        if: env.IS_SELF == 'false'
        uses: actions/checkout@v4
        with:
          repository: RokctAI/shared-workflows
          token: ${{ github.token }}
          path: .github/shared-workflows

      - name: Run Standardizer Engine
        run: python3 ${{ env.ENGINE_PATH }}

      - name: Setup Identity (Local)
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.IS_SELF == 'true'
        uses: ./.github/actions/setup-identity
        with:
          token: ${{ secrets.MONOREPO_PAT }}

      - name: Setup Identity (Shared)
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.IS_SELF == 'false'
        uses: ./.github/shared-workflows/.github/actions/setup-identity
        with:
          token: ${{ secrets.MONOREPO_PAT }}

      - name: Cleanup Temporary Files
        if: always() && env.IS_SELF == 'false'
        run: rm -rf .github/shared-workflows

      - name: Commit & Push Changes
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_PAT || github.token }}
        run: |
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "chore: automated fleet standardization [skip ci]"
            
            # Attempt direct push, then PR, then warn but don't fail
            if ! git push origin HEAD:${{ github.ref }}; then
              echo "⚠️ Direct push failed (likely permission issues with workflow files). Attempting PR..."
              BRANCH_NAME="auto-standardize-${{ github.run_id }}"
              git checkout -b "$BRANCH_NAME"
              if git push -u origin "$BRANCH_NAME"; then
                 gh pr create --title "🔄 Fleet Standardization: Config & Submodules" --body "Automated maintenance generated by universal-linter during run ${{ github.run_id }}." --head "$BRANCH_NAME" --base "${{ github.ref_name }}" || echo "Failed to create PR (maybe one already exists?)."
              else
                 echo "❌ Push failed even for branch creation. This usually means the GITHUB_TOKEN lacks 'workflows' permission and no MONOREPO_PAT was found."
                 echo "To fix this, go to Repo Settings -> Actions -> General and set Workflow permissions to 'Read and write'."
                 # Non-fatal: Don't exit 1 here unless it's a critical breakage
              fi
            fi
          else
            echo "No changes needed."
          fi


  telemetry:
    needs: standardize
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Track Usage
        env:
          API_KEY: ${{ secrets.COUNTER_API_KEY }}
        if: env.API_KEY != ''
        run: |
          curl -X GET "https://api.counterapi.dev/v2/rokctai/usage/up" \
          -H "Authorization: Bearer $API_KEY"

  lint-python:
    needs: telemetry
    name: 🐍 Python Lint (Flake8 & AutoPEP8)
    runs-on: ubuntu-latest
    env:
      IS_SELF: ''
      findings: ''
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Fleet Standardizer
        run: |
          if [ "${{ github.repository }}" == "RokctAI/shared-workflows" ]; then
            echo "IS_SELF=true" >> $GITHUB_ENV
          else
            echo "IS_SELF=false" >> $GITHUB_ENV
          fi

      - name: Checkout Shared Workflows
        if: env.IS_SELF == 'false'
        uses: actions/checkout@v4
        with:
          repository: RokctAI/shared-workflows
          token: ${{ github.token }}
          path: .github/shared-workflows



      - name: Check for Python
        id: check_python
        run: |
          if [ -f "requirements.txt" ] || [ -f "pyproject.toml" ] || [ -f "setup.py" ] || [ -f "Pipfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Set up Python
        if: steps.check_python.outputs.exists == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Lint Tools
        if: steps.check_python.outputs.exists == 'true'
        run: |
          pip install flake8 autopep8

      - name: Auto-fix Whitespace (excluding F401)
        if: steps.check_python.outputs.exists == 'true'
        run: |
          # Run autopep8 to fix standard formatting issues (E1, E2, E3, W2, W3, etc.)
          # Exclude .github directory, virtual environments, caches, and minified files
          autopep8 --in-place --recursive --aggressive --aggressive --exclude .github,.git,node_modules,env,venv,.venv,__pycache__,*.min.js .

      - name: Auto-Inject Frappe Copyright
        if: steps.check_python.outputs.exists == 'true' && inputs.copyright-text != ''
        env:
          COPYRIGHT_INPUT: ${{ inputs.copyright-text }}
        run: |
          # The caller workflow provides the entity name/format. 
          # The universal linter adds the dynamic year.
          CURRENT_YEAR=$(date +%Y)
          
          # We construct the final header by taking the user's input and injecting the year
          # Assuming the input looks something like: "Copyright (c) {YEAR}, Rokct Intelligence (pty) Ltd."
          # If they just provided the name, we build the standard Frappe string.
          # We will default to standard Frappe format:
          HEADER="# Copyright (c) ${CURRENT_YEAR}, ${COPYRIGHT_INPUT}\n# For license information, please see license.txt\n"
          
          echo "Using copyright template:"
          echo -e "$HEADER"
          
          # Find all python files, explicitly ignoring __init__.py and common excluded folders
          find . -name "*.py" -not -name "__init__.py" \
               -not -path "*/\.*" \
               -not -path "*/node_modules/*" \
               -not -path "*/env/*" \
               -not -path "*/venv/*" \
               -not -path "*/tests/*" | while read -r file; do
             
             # Check if file already has a copyright header (case-insensitive check for 'Copyright' in first 5 lines)
             if ! head -n 5 "$file" | grep -qi "Copyright"; then
                 echo "Adding copyright to $file"
                 # Escape the header for sed
                 ESCAPED_HEADER=$(echo "$HEADER" | sed 's/\\/\\\\/g' | sed 's/\//\\\//g' | sed 's/$/\\n/g' )
                 # Use awk to prepend the header block cleanly
                 awk -v header="$HEADER" 'BEGIN{print header; print ""} {print}' "$file" > tmpfile && mv tmpfile "$file"
             fi
          done

      - name: Run Flake8
        if: steps.check_python.outputs.exists == 'true'
        run: |
          # Capture output to a file for issue reporting but still exit with 0 to be non-blocking
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics > flake8_output.txt 2>&1 || true
          flake8 . --count --max-complexity=10 --max-line-length=120 \
            --ignore=E501,W503,W504,W191,W291,W292,W293,W391,E261,E265,E302,E303,E305,E111,E114,E116,E117,E127,E128,E225,E226,E401,F401,F841 \
            --statistics >> flake8_output.txt 2>&1
          
          # Print for log visibility
          cat flake8_output.txt
          
          # Set output if findings exist (contains :)
          if grep -q ":" flake8_output.txt; then
             echo "findings=true" >> $GITHUB_ENV
          else
             echo "findings=false" >> $GITHUB_ENV
          fi

      - name: Create Issue on Findings
        if: env.findings == 'true' && steps.check_python.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          BODY="### 🐍 Python Lint Failure
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}
          
          #### Error Summary:
          \`\`\`
          $(head -c 2000 flake8_output.txt)
          \`\`\`
          "
          gh issue create --title "🚨 CI: Python Lint Failure" --body "$BODY" --label "CI Blocker" || echo "Issue already exists or failed to create."

      - name: Setup Identity (Local)
        if: steps.check_python.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.IS_SELF == 'true'
        uses: ./.github/actions/setup-identity
        with:
          token: ${{ secrets.MONOREPO_PAT }}

      - name: Setup Identity (Shared)
        if: steps.check_python.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.IS_SELF == 'false'
        uses: ./.github/shared-workflows/.github/actions/setup-identity
        with:
          token: ${{ secrets.MONOREPO_PAT }}

      - name: Cleanup Shared Workflows Checkout
        if: always() && env.IS_SELF == 'false'
        run: rm -rf .github/shared-workflows
        shell: bash

      - name: Commit Auto-fixes
        if: steps.check_python.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_PAT || github.token }}
        run: |
          # Clean up temporary findings files so they are not included in status check or commit
          rm -f flake8_output.txt flutter_output.txt npm_audit_output.txt
          
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "style: automated whitespace/lint fixes [skip ci]"
            
            # Try to push directly (works on feature branches)
            if ! git push origin HEAD:${{ github.ref }}; then
              echo "⚠️ Direct push failed (likely a protected branch or missing permissions). Attempting PR..."
              BRANCH_NAME="auto-fix-python-${{ github.run_id }}"
              git checkout -b "$BRANCH_NAME"
              if git push -u origin "$BRANCH_NAME"; then
                 gh pr create --title "🎨 Auto-format Python (Flake8/AutoPEP8)" --body "Automated formatting generated by universal-linter during run ${{ github.run_id }}." --head "$BRANCH_NAME" --base "${{ github.ref_name }}" || echo "Failed to create PR (maybe one already exists?)."
              else
                 echo "❌ Push failed even for branch creation. Please ensure the GITHUB_TOKEN has 'contents: write' and 'pull-requests: write' permissions in Repo Settings -> Actions -> General."
              fi
            fi
          else
            echo "No changes to commit."
          fi

  lint-shell:
    needs: telemetry
    name: 🐚 Shell Script Lint (ShellCheck)
    runs-on: ubuntu-latest
    env:
      IS_SELF: ''
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Fleet Standardizer
        run: |
          if [ "${{ github.repository }}" == "RokctAI/shared-workflows" ]; then
            echo "IS_SELF=true" >> $GITHUB_ENV
          else
            echo "IS_SELF=false" >> $GITHUB_ENV
          fi

      - name: Checkout Shared Workflows
        if: env.IS_SELF == 'false'
        uses: actions/checkout@v4
        with:
          repository: RokctAI/shared-workflows
          token: ${{ github.token }}
          path: .github/shared-workflows



      - name: Format Shell Scripts
        run: |
          # Use dockerized shfmt for zero-dependency alpine formatting
          # Find all .sh files, explicitly excluding Flutter's native build directories
          # because they contain auto-generated scripts we shouldn't touch
          # We also exclude node_modules and .git
          
          # We format the find output directly into a string that docker can use as arguments relative to /mnt
          FILES_TO_FORMAT=$(find . -name "*.sh" -not -path "*/\.git/*" -not -path "*/\.github/*" -not -path "*/node_modules/*" -not -path "*/ios/*" -not -path "*/macos/*" -not -path "*/android/*" -not -path "*/windows/*" -not -path "*/linux/*" | sed "s|^\./|/mnt/|")
          
          if [ -n "$FILES_TO_FORMAT" ]; then
             echo "Found shell scripts to format:"
             echo "$FILES_TO_FORMAT"
             
             # -w: write
             # -i 2: indent 2 spaces
             # -ln bash: force bash parser (prevents posix 'function' keyword errors like in Flutter's extract_dart_defines.sh)
             # xargs is used here to pass the list of files to the docker container
             echo "$FILES_TO_FORMAT" | xargs docker run --rm -v $(pwd):/mnt mvdan/shfmt:latest -w -i 2 -ln bash
          else
             echo "No target shell scripts found. Skipping."
          fi

      - name: Setup Identity (Local)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.IS_SELF == 'true'
        uses: ./.github/actions/setup-identity
        with:
          token: ${{ secrets.MONOREPO_PAT }}

      - name: Setup Identity (Shared)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.IS_SELF == 'false'
        uses: ./.github/shared-workflows/.github/actions/setup-identity
        with:
          token: ${{ secrets.MONOREPO_PAT }}

      - name: Cleanup Shared Workflows Checkout
        if: always() && env.IS_SELF == 'false'
        run: rm -rf .github/shared-workflows
        shell: bash

      - name: Commit Auto-fixes
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_PAT || github.token }}
        run: |
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "style: automated shell script formatting [skip ci]"
            
            if ! git push origin HEAD:${{ github.ref }}; then
              echo "⚠️ Direct push failed. Attempting PR..."
              BRANCH_NAME="auto-fix-shell-${{ github.run_id }}"
              git checkout -b "$BRANCH_NAME"
              if git push -u origin "$BRANCH_NAME"; then
                 gh pr create --title "🐚 Auto-format Shell Scripts (shfmt)" --body "Automated formatting generated by universal-linter during run ${{ github.run_id }}." --head "$BRANCH_NAME" --base "${{ github.ref_name }}" || echo "Failed to create PR."
              else
                 echo "❌ Push failed. Ensure the GITHUB_TOKEN has write permissions."
              fi
            fi
          else
            echo "No changes to commit."
          fi

  lint-powershell:
    needs: telemetry
    name: 🐚 PowerShell Script Format (PSScriptAnalyzer)
    runs-on: ubuntu-latest
    env:
      IS_SELF: ''
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Fleet Standardizer
        run: |
          if [ "${{ github.repository }}" == "RokctAI/shared-workflows" ]; then
            echo "IS_SELF=true" >> $GITHUB_ENV
          else
            echo "IS_SELF=false" >> $GITHUB_ENV
          fi

      - name: Checkout Shared Workflows
        if: env.IS_SELF == 'false'
        uses: actions/checkout@v4
        with:
          repository: RokctAI/shared-workflows
          token: ${{ github.token }}
          path: .github/shared-workflows



      - name: Format PowerShell Scripts
        shell: pwsh
        run: |
          # 1. Check if there are any .ps1 files we actually need to format
          # (excluding node_modules, venv, and other common CI/hidden folders)
          $psFiles = Get-ChildItem -Path . -Filter "*.ps1" -Recurse -File | Where-Object { 
              $_.FullName -notmatch "\\node_modules\\" -and 
              $_.FullName -notmatch "\\venv\\" -and 
              $_.FullName -notmatch "\\env\\" -and
              $_.FullName -notmatch "\\.venv\\" -and
              $_.FullName -notmatch "\\\.git\\" -and $_.FullName -notmatch "\\\.github\\" 
          }
          
          if ($psFiles.Count -eq 0) {
              Write-Host "No PowerShell scripts found. Skipping."
              exit 0
          }
          
          # 2. Install the formatter module automatically ONLY if not already present
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
              Write-Host "PSScriptAnalyzer not found. Installing..."
              Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -AllowClobber -ErrorAction SilentlyContinue
          } else {
              Write-Host "PSScriptAnalyzer already installed."
          }
          
          # 3. Format each file and overwrite
          foreach ($file in $psFiles) {
              Write-Host "Formatting $($file.FullName)"
              $formattedContent = Invoke-Formatter -ScriptDefinition (Get-Content $file.FullName -Raw)
              # Save using UTF8 without BOM for Linux/cross-platform compatibility
              $Utf8NoBomEncoding = New-Object System.Text.UTF8Encoding $False
              [System.IO.File]::WriteAllText($file.FullName, $formattedContent, $Utf8NoBomEncoding)
          }

      - name: Setup Identity (Local)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.IS_SELF == 'true'
        uses: ./.github/actions/setup-identity
        with:
          token: ${{ secrets.MONOREPO_PAT }}

      - name: Setup Identity (Shared)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.IS_SELF == 'false'
        uses: ./.github/shared-workflows/.github/actions/setup-identity
        with:
          token: ${{ secrets.MONOREPO_PAT }}

      - name: Cleanup Shared Workflows Checkout
        if: always() && env.IS_SELF == 'false'
        run: rm -rf .github/shared-workflows
        shell: bash

      - name: Commit Auto-fixes
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_PAT || github.token }}
        run: |
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "style: automated powershell script formatting [skip ci]"
            
            if ! git push origin HEAD:${{ github.ref }}; then
              echo "⚠️ Direct push failed. Attempting PR..."
              BRANCH_NAME="auto-fix-powershell-${{ github.run_id }}"
              git checkout -b "$BRANCH_NAME"
              if git push -u origin "$BRANCH_NAME"; then
                 gh pr create --title "🐚 Auto-format PowerShell Scripts" --body "Automated formatting generated by universal-linter during run ${{ github.run_id }}." --head "$BRANCH_NAME" --base "${{ github.ref_name }}" || echo "Failed to create PR."
              else
                 echo "❌ Push failed. Ensure the GITHUB_TOKEN has write permissions."
              fi
            fi
          else
            echo "No changes to commit."
          fi

  lint-flutter:
    needs: telemetry
    name: 🐦 Flutter Analyze
    runs-on: ubuntu-latest
    env:
      IS_SELF: ''
      findings: ''
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Fleet Standardizer
        run: |
          if [ "${{ github.repository }}" == "RokctAI/shared-workflows" ]; then
            echo "IS_SELF=true" >> $GITHUB_ENV
          else
            echo "IS_SELF=false" >> $GITHUB_ENV
          fi

      - name: Checkout Shared Workflows
        if: env.IS_SELF == 'false'
        uses: actions/checkout@v4
        with:
          repository: RokctAI/shared-workflows
          token: ${{ github.token }}
          path: .github/shared-workflows



      - name: Check for Flutter
        id: check_flutter
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Helper - Subosito Flutter
        if: steps.check_flutter.outputs.exists == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter-channel }}
          flutter-version: ${{ inputs.flutter-version }}
          cache: true

      - name: Auto-fix Whitespace (Flutter)
        if: steps.check_flutter.outputs.exists == 'true'
        run: |
          # Format only lib, test, and other source dirs, avoiding .github
          if [ -d "lib" ]; then dart format lib; fi
          if [ -d "test" ]; then dart format test; fi
          if [ -d "source" ]; then dart format source; fi

      - name: Run Flutter Analyze
        if: steps.check_flutter.outputs.exists == 'true'
        run: |
          flutter config --no-analytics
          flutter pub get
          # Non-blocking analysis
          flutter analyze . --no-fatal-warnings > flutter_output.txt 2>&1 || true
          
          # Set output if findings exist (contains :)
          if grep -q ":" flutter_output.txt; then
             echo "findings=true" >> $GITHUB_ENV
          else
             echo "findings=false" >> $GITHUB_ENV
          fi

      - name: Create Issue on Findings
        if: env.findings == 'true' && steps.check_flutter.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          BODY="### 🐦 Flutter Analysis Failure
          **Commit:** ${{ github.sha }}
          
          #### Output:
          \`\`\`
          $(head -c 2000 flutter_output.txt)
          \`\`\`
          "
          gh issue create --title "🚨 CI: Flutter Analysis Failure" --body "$BODY" --label "CI Blocker" || echo "Issue already exists."

      - name: Setup Identity (Local)
        if: steps.check_flutter.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.IS_SELF == 'true'
        uses: ./.github/actions/setup-identity
        with:
          token: ${{ secrets.MONOREPO_PAT }}

      - name: Setup Identity (Shared)
        if: steps.check_flutter.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.IS_SELF == 'false'
        uses: ./.github/shared-workflows/.github/actions/setup-identity
        with:
          token: ${{ secrets.MONOREPO_PAT }}

      - name: Cleanup Shared Workflows Checkout
        if: always() && env.IS_SELF == 'false'
        run: rm -rf .github/shared-workflows
        shell: bash

      - name: Commit Auto-fixes
        if: steps.check_flutter.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_PAT || github.token }}
        run: |
          # Clean up temporary findings files so they are not included in status check or commit
          rm -f flake8_output.txt flutter_output.txt npm_audit_output.txt

          if [[ -n $(git status -s) ]]; then
            git restore pubspec.lock || true
            if [[ -n $(git status -s) ]]; then
              git add .
              git commit -m "style: automated flutter formatting [skip ci]"
              
              if ! git push origin HEAD:${{ github.ref }}; then
                echo "⚠️ Direct push failed. Attempting PR..."
                BRANCH_NAME="auto-fix-flutter-${{ github.run_id }}"
                git checkout -b "$BRANCH_NAME"
                if git push -u origin "$BRANCH_NAME"; then
                   gh pr create --title "🎨 Auto-format Flutter Code" --body "Automated formatting generated by universal-linter during run ${{ github.run_id }}." --head "$BRANCH_NAME" --base "${{ github.ref_name }}" || echo "Failed to create PR."
                else
                   echo "❌ Push failed. Ensure the GITHUB_TOKEN has write permissions."
                fi
              fi
            else
              echo "Only pubspec.lock changed. Skipping commit."
            fi
          else
            echo "No changes to commit."
          fi

  lint-node:
    needs: telemetry
    name: 📦 JS/TS Lint (ESLint & Security)
    runs-on: ubuntu-latest
    env:
      IS_SELF: ''
      audit_findings: ''
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Fleet Standardizer
        run: |
          if [ "${{ github.repository }}" == "RokctAI/shared-workflows" ]; then
            echo "IS_SELF=true" >> $GITHUB_ENV
          else
            echo "IS_SELF=false" >> $GITHUB_ENV
          fi

      - name: Checkout Shared Workflows
        if: env.IS_SELF == 'false'
        uses: actions/checkout@v4
        with:
          repository: RokctAI/shared-workflows
          token: ${{ github.token }}
          path: .github/shared-workflows



      - name: Check for Node
        id: check_node
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Setup Node
        if: steps.check_node.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Auto-fix Whitespace (Node)
        if: steps.check_node.outputs.exists == 'true'
        run: |
          if npx prettier --version > /dev/null 2>&1; then
             npx prettier --write . --ignore-path .gitignore --plugin-search-dir=. --ignore-unknown . '!**/.github/**' '!**/*.md' '!**/*.svg' '!**/*.html' '!**/package-lock.json' '!**/*.env*' '!**/*production.env' '!**/*.env.local'
          elif npm list eslint > /dev/null 2>&1; then
             npx eslint . --ext .js,.jsx,.ts,.tsx --fix --ignore-pattern ".github/workflows"
          fi

      - name: Run NPM Audit
        if: steps.check_node.outputs.exists == 'true'
        run: |
          npm audit --audit-level=high > npm_audit_output.txt 2>&1 || true
          
          # Set findings if vulnerabilities found (contains "high" or "critical")
          if grep -qEi "high|critical" npm_audit_output.txt; then
             echo "audit_findings=true" >> $GITHUB_ENV
          else
             echo "audit_findings=false" >> $GITHUB_ENV
          fi

      - name: Create Issue on Audit Findings
        if: env.audit_findings == 'true' && steps.check_node.outputs.exists == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          BODY="### 📦 Node Security Audit Failure
          **High/Critical vulnerabilities found.**
          
          #### Audit Summary:
          \`\`\`
          $(head -c 2000 npm_audit_output.txt)
          \`\`\`
          "
          gh issue create --title "🚨 CI: Node Security Alert (High/Critical)" --body "$BODY" --label "Security" || echo "Issue already exists."

      - name: Run ESLint
        if: steps.check_node.outputs.exists == 'true'
        run: |
          if npm list eslint > /dev/null 2>&1; then
             npx eslint . --ext .js,.jsx,.ts,.tsx
          fi

      - name: Setup Identity (Local)
        if: steps.check_node.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.IS_SELF == 'true'
        uses: ./.github/actions/setup-identity
        with:
          token: ${{ secrets.MONOREPO_PAT }}

      - name: Setup Identity (Shared)
        if: steps.check_node.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.IS_SELF == 'false'
        uses: ./.github/shared-workflows/.github/actions/setup-identity
        with:
          token: ${{ secrets.MONOREPO_PAT }}

      - name: Cleanup Shared Workflows Checkout
        if: always() && env.IS_SELF == 'false'
        run: rm -rf .github/shared-workflows
        shell: bash

      - name: Commit Auto-fixes
        if: steps.check_node.outputs.exists == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_PAT || github.token }}
        run: |
          # Clean up temporary findings files so they are not included in status check or commit
          rm -f flake8_output.txt flutter_output.txt npm_audit_output.txt

          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "style: automated node formatting [skip ci]"
            
            if ! git push origin HEAD:${{ github.ref }}; then
              echo "⚠️ Direct push failed. Attempting PR..."
              BRANCH_NAME="auto-fix-node-${{ github.run_id }}"
              git checkout -b "$BRANCH_NAME"
              if git push -u origin "$BRANCH_NAME"; then
                 gh pr create --title "🎨 Auto-format Node Code (Prettier/ESLint)" --body "Automated formatting generated by universal-linter during run ${{ github.run_id }}." --head "$BRANCH_NAME" --base "${{ github.ref_name }}" || echo "Failed to create PR."
              else
                 echo "❌ Push failed. Ensure the GITHUB_TOKEN has write permissions."
              fi
            fi
          else
            echo "No changes to commit."
          fi