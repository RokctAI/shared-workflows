# Copyright 2024 RokctAI
# Universal Upgrade & Integration Test
# Validates Blue/Green handover from previous version to current version

name: Universal Upgrade Test

on:
  workflow_call:
    inputs:
      current_version:
        required: true
        type: string
        description: "The version just built and pushed (e.g. 2.0.6)"
      registry:
        required: false
        type: string
        default: "ghcr.io/rokctai/monorepo"
      app_name:
        required: false
        type: string
        default: "rpanel"
      min_legacy_version:
        required: false
        type: string
        default: ""
        description: "Minimum version that has a healthy entrypoint. If prev_version is older, skip Phase 1."
    secrets:
      MONOREPO_PAT:
        required: false

jobs:
  upgrade-test:
    if: github.repository == 'RokctAI/PlatformStack'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.MONOREPO_PAT || github.token }}

      - name: Detect Previous Version
        id: prev
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_PAT || github.token }}
        run: |
          # Fetch tags from GitHub Container Registry (GHCR) using GH CLI
          # The package name in GHCR for our monorepo artifacts
          PKG_NAME="${{ inputs.app_name }}-control"
          ORG_NAME=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          echo "Fetching tags for package: $ORG_NAME/monorepo/$PKG_NAME"
          
          # Use GH API to fetch versions for the container package
          # Note: We use the 'orgs' or 'users' endpoint based on owner type.
          # For RokctAI it is an org.
          TAGS=$(gh api -H "Accept: application/vnd.github+json" \
            "/orgs/$ORG_NAME/packages/container/monorepo%2F$PKG_NAME/versions" \
            --jq '.[] | .metadata.container.tags[]' 2>/dev/null | grep -v 'latest' | sort -V -r || echo "")

          if [ -z "$TAGS" ]; then
             echo "No tags found via GH API, trying fallback user endpoint..."
             TAGS=$(gh api -H "Accept: application/vnd.github+json" \
               "/users/$ORG_NAME/packages/container/monorepo%2F$PKG_NAME/versions" \
               --jq '.[] | .metadata.container.tags[]' 2>/dev/null | grep -v 'latest' | sort -V -r || echo "")
          fi

          if [ -z "$TAGS" ]; then
             echo "Failed to fetch tags from GHCR. Falling back to latest."
             PREV_VERSION="latest"
          else
             # Find the highest version that is NOT the current version we just built
             PREV_VERSION=$(echo "$TAGS" | grep -v "^${{ inputs.current_version }}$" | head -n 1)
             
             if [ -z "$PREV_VERSION" ]; then
                PREV_VERSION="latest"
             fi
          fi
          
          # Check against the minimum legacy version floor
          MIN_FLOOR="${{ inputs.min_legacy_version }}"
          SKIP_PHASE1="false"
          if [ -n "$MIN_FLOOR" ] && [ "$PREV_VERSION" != "latest" ]; then
            # Use sort -V to compare semantic versions
            LOWEST=$(printf "%s\n%s" "$PREV_VERSION" "$MIN_FLOOR" | sort -V | head -n 1)
            if [ "$LOWEST" != "$MIN_FLOOR" ] && [ "$PREV_VERSION" != "$MIN_FLOOR" ]; then
              echo "⚠️ Previous version $PREV_VERSION is below the minimum floor $MIN_FLOOR. Skipping Phase 1."
              SKIP_PHASE1="true"
            fi
          fi
          
          echo "prev_version=$PREV_VERSION" >> "$GITHUB_OUTPUT"
          echo "skip_phase1=$SKIP_PHASE1" >> "$GITHUB_OUTPUT"
          echo "🚀 Previous Version detected: $PREV_VERSION (skip_phase1=$SKIP_PHASE1)"

      - name: "🔴 Phase 1: Deploy Legacy (Red)"
        if: steps.prev.outputs.skip_phase1 != 'true'
        run: |
          PREV="${{ steps.prev.outputs.prev_version }}"
          REGISTRY="${{ inputs.registry }}"
          APP_IMAGE="$REGISTRY/${{ inputs.app_name }}-control:$PREV"

          echo "Deploying version $PREV..."

          # Guard: verify the previous app image actually exists in GHCR before attempting pull.
          # If the tag was never pushed (first ever build) or was rolled back/deleted, skip Phase 1
          # gracefully rather than letting 'docker compose up' fail with 'manifest unknown'.
          if ! docker manifest inspect "$APP_IMAGE" >/dev/null 2>&1; then
            echo "⚠️ Image $APP_IMAGE not found in registry (tag may have been rolled back or never pushed)."
            echo "Skipping Phase 1 — no stable legacy baseline available."
            exit 0
          fi

          # Pin app + tenant images to the previous version tag for the legacy baseline test.
          sed -i "s|$REGISTRY/${{ inputs.app_name }}-control:latest|$REGISTRY/${{ inputs.app_name }}-control:$PREV|g" docker-compose.yml
          sed -i "s|$REGISTRY/${{ inputs.app_name }}-tenant:latest|$REGISTRY/${{ inputs.app_name }}-tenant:$PREV|g" docker-compose.yml
          # Pin the gravity syncer image too (it ships with the same release tag).
          sed -i "s|$REGISTRY/gravity:latest|$REGISTRY/gravity:$PREV|g" docker-compose.yml
          # Leave rpanel-db on :latest — the rollback job explicitly excludes the DB image
          # so rpanel-db:latest is always guaranteed to exist in GHCR.

          docker compose up -d

          # Phase 1a: Wait for the container to be in 'running' state (not just 'created')
          echo "Waiting for app container to start..."
          # shellcheck disable=SC2016
          timeout 60s bash -c 'until [ "$(docker compose ps -q app | xargs docker inspect -f {{.State.Running}} 2>/dev/null)" = "true" ]; do sleep 2; done'

          # Phase 1b: Wait for bench to be ready (site created + DB connected)
          # 'bench list-apps' only succeeds once the site is fully set up
          echo "Waiting for legacy app to finish site setup..."

          # Wait with timeout AND stream logs simultaneously
          APP_CONTAINER=$(docker compose ps -q app)
          docker logs -f "$APP_CONTAINER" &
          LOGS_PID=$!

          # Wait for healthy with timeout.
          # Cold boot requires: DB init + bench new-site + installing 5 Frappe apps.
          # This reliably takes 10-15 minutes on a clean volume — set floor at 900s.
          TIMEOUT=900
          ELAPSED=0

          # Phase 1b-pre: Wait for web port to open before polling bench list-apps.
          # This gives an early signal that the app process is alive and avoids
          # hammering bench exec before the container is ready.
          echo "Waiting for web port 8000 to open..."
          timeout 300s bash -c 'until docker compose exec -T app bash -c "echo > /dev/tcp/127.0.0.1/8000" 2>/dev/null; do sleep 5; done' || true

          while [ $ELAPSED -lt $TIMEOUT ]; do
            # Site name might be platform.rokct.ai or rpanel.local depending on build context
            # Detect which one exists in the sites folder
            DETECTED_SITE=$(docker compose exec -T app ls /home/frappe/frappe-bench/sites 2>/dev/null | grep -E "platform.rokct.ai|rpanel.local" | head -n 1 || echo "platform.rokct.ai")

            if docker compose exec -T app /home/frappe/frappe-bench/env/bin/bench --site "$DETECTED_SITE" list-apps > /dev/null 2>&1; then
              echo "✅ Legacy version is healthy on site: $DETECTED_SITE"
              echo "SITE_NAME=$DETECTED_SITE" >> "$GITHUB_ENV"
              break
            fi
            sleep 15
            ELAPSED=$((ELAPSED + 15))
          done

          # Kill background log follower
          kill $LOGS_PID 2>/dev/null || true

          # Always dump last 200 lines regardless of outcome
          echo "=== app final logs ==="
          docker logs "$APP_CONTAINER" --tail 200

          # Dump container state
          echo "=== Container state ==="
          docker inspect "$APP_CONTAINER" --format '{{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}'

          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "❌ Timeout: Legacy app never finished site setup."
            exit 1
          fi

      - name: "🟢 Phase 2: Upgrade to Current (Green)"
        run: |
          echo "Triggering SELF-UPGRADE from the Hub..."
          
          # In the CI, we want to upgrade to the images we just built.
          # The images are already tagged as 'latest' on GHCR by the previous job.
          # We tell the Hub to perform an immediate upgrade.
          docker compose exec -T app /home/frappe/frappe-bench/env/bin/bench --site "${SITE_NAME:-platform.rokct.ai}" update-ecosystem --immediate
          
          # Run Migrations (just in case, though the script should handle it)
          echo "Ensuring Migrations are complete..."
          docker compose exec -T app /home/frappe/frappe-bench/env/bin/bench --site "${SITE_NAME:-platform.rokct.ai}" migrate
          
          # Wait for health
          echo "Waiting for upgraded app to boot..."
          # shellcheck disable=SC2016
          timeout 120s bash -c 'until docker compose exec -T app /home/frappe/frappe-bench/env/bin/bench --site "${SITE_NAME:-platform.rokct.ai}" db-ping; do sleep 5; done'
          echo "✅ Self-upgrade successful and healthy."
 
      - name: "🛰️ Phase 3: Spoke Validation (Real Tenant Provisioning)"
        run: |
          echo "Testing REAL Tenant Provisioning via Control Hub..."
          
          # Map the test domains to localhost
          echo "127.0.0.1 ${SITE_NAME:-platform.rokct.ai} juvo.tenant.rokct.ai" | sudo tee -a /etc/hosts
          
          # Run the debug provisioning script inside the Hub container
          # This script runs everything synchronously and prints tracebacks on failure
          docker compose exec -T app /home/frappe/frappe-bench/env/bin/bench --site "${SITE_NAME:-platform.rokct.ai}" execute control.control.scripts.debug_provisioning.trigger_provisioning_for_debug --args "['juvo']"
          
          echo "✅ Real-world provisioning verified via Control Hub."

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.tenant.yml down -v
          docker compose down -v
