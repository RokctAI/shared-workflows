# Copyright 2024 RokctAI
# Universal Upgrade & Integration Test
# Validates Blue/Green handover from previous version to current version

name: Universal Upgrade Test

on:
  workflow_call:
    inputs:
      current_version:
        required: true
        type: string
        description: "The version just built and pushed (e.g. 2.0.6)"
      registry:
        required: false
        type: string
        default: "ghcr.io/rokctai/monorepo"
      app_name:
        required: false
        type: string
        default: "rpanel"
    secrets:
      MONOREPO_PAT:
        required: false

jobs:
  upgrade-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.MONOREPO_PAT || github.token }}

      - name: Detect Previous Version
        id: prev
        run: |
          # Fetch tags from GitHub Container Registry (GHCR)
          REPO_LOWER=$(echo "${{ github.repository_owner }}/monorepo/${{ inputs.app_name }}-control" | tr '[:upper:]' '[:lower:]')
          
          # Authenticate and get token
          TOKEN=$(curl -s -u "${{ github.actor }}:${{ secrets.MONOREPO_PAT || github.token }}" "https://ghcr.io/token?scope=repository:${REPO_LOWER}:pull" | jq -r .token)
          
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
             echo "Failed to authenticate with GHCR or repo not found. Falling back to latest."
             PREV_VERSION="latest"
          else
             # Fetch all tags, remove 'latest', sort by version descending
             TAGS=$(curl -s -H "Authorization: Bearer $TOKEN" "https://ghcr.io/v2/${REPO_LOWER}/tags/list" | jq -r '.tags[]?' | grep -v 'latest' | sort -V -r || echo "")
             
             # Find the highest version that is NOT the current version we just built
             PREV_VERSION=$(echo "$TAGS" | grep -v "^${{ inputs.current_version }}$" | head -n 1)
             
             if [ -z "$PREV_VERSION" ]; then
                PREV_VERSION="latest"
             fi
          fi
          
          echo "prev_version=$PREV_VERSION" >> "$GITHUB_OUTPUT"
          echo "🚀 Previous Version detected: $PREV_VERSION"

      - name: "🔴 Phase 1: Deploy Legacy (Red)"
        run: |
          echo "Deploying version ${{ steps.prev.outputs.prev_version }}..."
          
          # Update compose file to use previous version
          sed -i "s|:latest|:${{ steps.prev.outputs.prev_version }}|g" docker-compose.yml
          
          docker compose up -d
          
          # Wait for health
          echo "Waiting for legacy app to boot..."
          timeout 120s bash -c 'until docker compose exec -T app bench --site platform.rokct.ai db-ping; do sleep 5; done'
          echo "✅ Legacy version is healthy."

      - name: "🟢 Phase 2: Upgrade to Current (Green)"
        run: |
          echo "Triggering SELF-UPGRADE from the Hub..."
          
          # In the CI, we want to upgrade to the images we just built.
          # The images are already tagged as 'latest' on GHCR by the previous job.
          # We tell the Hub to perform an immediate upgrade.
          docker compose exec -T app bench --site platform.rokct.ai update-ecosystem --immediate
          
          # Run Migrations (just in case, though the script should handle it)
          echo "Ensuring Migrations are complete..."
          docker compose exec -T app bench --site platform.rokct.ai migrate
          
          # Wait for health
          echo "Waiting for upgraded app to boot..."
          timeout 120s bash -c 'until docker compose exec -T app bench --site platform.rokct.ai db-ping; do sleep 5; done'
          echo "✅ Self-upgrade successful and healthy."

      - name: "🛰️ Phase 3: Spoke Validation (Real Tenant Provisioning)"
        run: |
          echo "Testing REAL Tenant Provisioning via Control Hub..."
          
          # Map the test domains to localhost
          echo "127.0.0.1 platform.rokct.ai juvo.tenant.rokct.ai" | sudo tee -a /etc/hosts
          
          # Run the debug provisioning script inside the Hub container
          # This script runs everything synchronously and prints tracebacks on failure
          docker compose exec -T app bench --site platform.rokct.ai execute control.control.scripts.debug_provisioning.trigger_provisioning_for_debug --args "['juvo']"
          
          echo "✅ Real-world provisioning verified via Control Hub."

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.tenant.yml down -v
          docker compose down -v
