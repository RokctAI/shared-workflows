# Universal Upgrade & Integration Test
# Validates Blue/Green handover from previous version to current version

name: Universal Upgrade Test

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
    inputs:
      current_version:
        required: true
        type: string
        description: "The version just built and pushed (e.g. 2.0.6)"
      registry:
        required: false
        type: string
        default: "ghcr.io/rokctai/occultation"
      app_name:
        required: false
        type: string
        default: "rpanel"
      min_legacy_version:
        required: false
        type: string
        default: ""
        description: "Minimum version that has a healthy entrypoint. If prev_version is older, skip Phase 1."
      pre_deploy_command:
        required: false
        type: string
        default: ""
        description: "Optional shell command run (in platform/) before any docker compose up, e.g. to create external networks."
      engine:
        required: false
        type: string
        default: "frappe"
        description: "'pulsar' runs the Pulsar blue-green job (upgrade-test-pulsar) instead of the legacy bench job."
      compose_file:
        required: false
        type: string
        default: "docker-compose.pulsar.yml"
        description: "Pulsar job only: compose file in platform/ holding the postgres and hub services."
      hub_package:
        required: false
        type: string
        default: "pulsar-hub"
        description: "Pulsar job only: GHCR package (under occultation/) of the hub image."
      hub_site:
        required: false
        type: string
        default: "hub.localhost"
        description: "Pulsar job only: the site the hub creates and migrates."
    secrets:
      MONOREPO_PAT:
        required: false

jobs:
  upgrade-test:
    if: github.repository == 'RokctAI/PlatformStack' && inputs.engine != 'pulsar'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Pre-deploy Command
        if: inputs.pre_deploy_command != ''
        env:
          PRE_DEPLOY_COMMAND: ${{ inputs.pre_deploy_command }}
        run: bash -c "$PRE_DEPLOY_COMMAND"

      - name: Log in to Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.MONOREPO_PAT || github.token }}

      - name: Detect Previous Version
        id: prev
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_PAT || github.token }}
        run: |
          # Fetch tags from GitHub Container Registry (GHCR) using GH CLI
          # The package name in GHCR for our occultation artifacts
          PKG_NAME="${{ inputs.app_name }}-control"
          ORG_NAME=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          echo "Fetching tags for package: $ORG_NAME/occultation/$PKG_NAME"
          
          # Use GH API to fetch versions for the container package
          # Note: We use the 'orgs' or 'users' endpoint based on owner type.
          # For RokctAI it is an org.
          TAGS=$(gh api -H "Accept: application/vnd.github+json" \
            "/orgs/$ORG_NAME/packages/container/occultation%2F$PKG_NAME/versions" \
            --jq '.[] | .metadata.container.tags[]' 2>/dev/null | grep -v 'latest' | sort -V -r || echo "")

          if [ -z "$TAGS" ]; then
             echo "No tags found via GH API, trying fallback user endpoint..."
             TAGS=$(gh api -H "Accept: application/vnd.github+json" \
               "/users/$ORG_NAME/packages/container/occultation%2F$PKG_NAME/versions" \
               --jq '.[] | .metadata.container.tags[]' 2>/dev/null | grep -v 'latest' | sort -V -r || echo "")
          fi

          if [ -z "$TAGS" ]; then
             echo "Failed to fetch tags from GHCR. Falling back to latest."
             PREV_VERSION="latest"
          else
             # Find the highest version that is NOT the current version we just built
             PREV_VERSION=$(echo "$TAGS" | grep -v "^${{ inputs.current_version }}$" | head -n 1)
             
             if [ -z "$PREV_VERSION" ]; then
                PREV_VERSION="latest"
             fi
          fi
          
          # Check against the minimum legacy version floor
          MIN_FLOOR="${{ inputs.min_legacy_version }}"
          SKIP_PHASE1="false"
          if [ -n "$MIN_FLOOR" ] && [ "$PREV_VERSION" != "latest" ]; then
            # Use sort -V to compare semantic versions
            LOWEST=$(printf "%s\n%s" "$PREV_VERSION" "$MIN_FLOOR" | sort -V | head -n 1)
            if [ "$LOWEST" != "$MIN_FLOOR" ] && [ "$PREV_VERSION" != "$MIN_FLOOR" ]; then
              echo "⚠️ Previous version $PREV_VERSION is below the minimum floor $MIN_FLOOR. Skipping Phase 1."
              SKIP_PHASE1="true"
            fi
          fi
          
          echo "prev_version=$PREV_VERSION" >> "$GITHUB_OUTPUT"
          echo "skip_phase1=$SKIP_PHASE1" >> "$GITHUB_OUTPUT"
          echo "🚀 Previous Version detected: $PREV_VERSION (skip_phase1=$SKIP_PHASE1)"

      - name: "🔴 Phase 1: Deploy Legacy (Red)"
        if: steps.prev.outputs.skip_phase1 != 'true'
        run: |
          PREV="${{ steps.prev.outputs.prev_version }}"
          REGISTRY="${{ inputs.registry }}"
          APP_IMAGE="$REGISTRY/${{ inputs.app_name }}-control:$PREV"

          echo "Deploying version $PREV..."

          # Guard: verify the previous app image actually exists in GHCR before attempting pull.
          # If the tag was never pushed (first ever build) or was rolled back/deleted, skip Phase 1
          # gracefully rather than letting 'docker compose up' fail with 'manifest unknown'.
          if ! docker manifest inspect "$APP_IMAGE" >/dev/null 2>&1; then
            echo "⚠️ Image $APP_IMAGE not found in registry (tag may have been rolled back or never pushed)."
            echo "Skipping Phase 1 — no stable legacy baseline available."
            exit 0
          fi

          # Pin app + tenant images to the previous version tag for the legacy baseline test.
          sed -i "s|$REGISTRY/${{ inputs.app_name }}-control:latest|$REGISTRY/${{ inputs.app_name }}-control:$PREV|g" docker-compose.yml
          sed -i "s|$REGISTRY/${{ inputs.app_name }}-tenant:latest|$REGISTRY/${{ inputs.app_name }}-tenant:$PREV|g" docker-compose.yml
          # gravity and rpanel-db are left on :latest — gravity is a background syncer
          # with no role in the upgrade test, and its versioned tag may not exist if a
          # prior gravity build failed. rpanel-db is stable infrastructure.

          docker compose up -d

          # Phase 1a: Wait for the container to be in 'running' state (not just 'created')
          echo "Waiting for app container to start..."
          # shellcheck disable=SC2016
          timeout 60s bash -c 'until [ "$(docker compose ps -q app | xargs docker inspect -f {{.State.Running}} 2>/dev/null)" = "true" ]; do sleep 2; done'

          # Phase 1b: Wait for bench to be ready (site created + DB connected)
          # 'bench list-apps' only succeeds once the site is fully set up
          echo "Waiting for legacy app to finish site setup..."

          # Wait with timeout AND stream logs simultaneously
          APP_CONTAINER=$(docker compose ps -q app)
          docker logs -f "$APP_CONTAINER" &
          LOGS_PID=$!

          # Wait for healthy with timeout.
          # The image has a pre-baked site_config.json but the CI postgres container
          # has no actual database — bench list-apps would fail indefinitely waiting
          # for DB. Instead, check that the Frappe web process is responding on :8000,
          # which is sufficient to confirm the legacy app is alive and upgradeable.
          TIMEOUT=300
          ELAPSED=0

          echo "Waiting for Frappe web process on port 8000..."
          while [ $ELAPSED -lt $TIMEOUT ]; do
            # Run curl inside a bash -c to avoid docker compose exec -T output-doubling.
            # Take last 3 chars in case of any extra whitespace/CRLF, then check
            # it matches a healthy HTTP code (2xx, 3xx or 4xx). A 5xx is a broken app, never a pass.
            HTTP_CODE=$(docker compose exec -T app bash -c \
              "curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8000 2>/dev/null" \
              2>/dev/null | tr -d '[:space:]' | tail -c 3)

            if echo "$HTTP_CODE" | grep -qE '^[2-4][0-9][0-9]$'; then
              DETECTED_SITE=$(docker compose exec -T app bash -c \
                "ls /home/frappe/frappe-bench/sites" 2>/dev/null \
                | grep -E "platform.rokct.ai|rpanel.local" | head -n 1 || echo "platform.rokct.ai")
              echo "✅ Legacy app responding (HTTP $HTTP_CODE) on site: $DETECTED_SITE"
              echo "SITE_NAME=$DETECTED_SITE" >> "$GITHUB_ENV"
              break
            fi
            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done

          # Kill background log follower
          kill $LOGS_PID 2>/dev/null || true

          # Always dump last 200 lines regardless of outcome
          echo "=== app final logs ==="
          docker logs "$APP_CONTAINER" --tail 200

          # Dump container state
          echo "=== Container state ==="
          docker inspect "$APP_CONTAINER" --format '{{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}'

          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "❌ Timeout: Legacy app never answered without a 5xx (last HTTP ${HTTP_CODE:-none})."
            exit 1
          fi

      - name: "🟢 Phase 2: Upgrade to Current (Green)"
        run: |
          echo "Pulling latest images (simulating production upgrade)..."

          # Restore docker-compose.yml back to :latest tags to allow upgrading to the current version.
          git checkout docker-compose.yml

          # In production, update-ecosystem does: docker compose pull + docker compose up -d.
          # We do the same here directly — the :latest tags were just pushed by docker-release.
          docker compose pull
          docker compose up -d

          echo "Waiting for upgraded app to respond on port 8000..."
          TIMEOUT=120
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            HTTP_CODE=$(docker compose exec -T app bash -c \
              "curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8000 2>/dev/null" \
              2>/dev/null | tr -d '[:space:]' | tail -c 3)
            if echo "$HTTP_CODE" | grep -qE '^[2-4][0-9][0-9]$'; then
              echo "✅ Upgraded app responding (HTTP $HTTP_CODE) — upgrade successful."
              break
            fi
            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done
          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "❌ Upgraded app did not answer without a 5xx within ${TIMEOUT}s (last HTTP ${HTTP_CODE:-none})."
            docker compose logs app --tail 100
            exit 1
          fi
 
      - name: "🛰️ Phase 3: Spoke Validation (Real Tenant Provisioning)"
        run: |
          echo "Testing REAL Tenant Provisioning via Control Hub..."
          SITE="${SITE_NAME:-platform.rokct.ai}"

          echo "127.0.0.1 $SITE juvo.tenant.rokct.ai" | sudo tee -a /etc/hosts

          docker compose exec -T app bash -c \
            "bench --site '$SITE' execute control.control.scripts.debug_provisioning.trigger_provisioning_for_debug --args \"['juvo']\""

          echo "✅ Real-world provisioning verified via Control Hub."

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.tenant.yml down -v
          docker compose down -v

  # Pulsar engine (no bench, no Frappe). Real blue-green:
  #   red   = previous Pulsar hub release, serving, with a marker user written to its site
  #   green = the release just built, started NEXT TO red on the same data, after Pulsar's own
  #           migrations (`migrate <site> --engine pulsar`) ran with the green image
  #   swap  = red stops, green alone serves; the marker must still log in
  #   rollback = green stops, red (previous image) starts again on the migrated data and must serve
  # Any 5xx (or no answer) at any step fails the job. Only 2xx counts as healthy for ping/login.
  upgrade-test-pulsar:
    if: github.repository == 'RokctAI/PlatformStack' && inputs.engine == 'pulsar'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    env:
      COMPOSE_PROJECT_NAME: pulsarupg
      COMPOSE_FILE: ${{ inputs.compose_file }}
      SITE: ${{ inputs.hub_site }}
      PULSAR_HUB_SITE: ${{ inputs.hub_site }}
      NEW_IMAGE: ${{ inputs.registry }}/${{ inputs.hub_package }}:${{ inputs.current_version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Pre-deploy Command
        if: inputs.pre_deploy_command != ''
        env:
          PRE_DEPLOY_COMMAND: ${{ inputs.pre_deploy_command }}
        run: bash -c "$PRE_DEPLOY_COMMAND"

      - name: Log in to Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.MONOREPO_PAT || github.token }}

      - name: Throwaway credentials
        run: |
          # Fresh random values for this run only, masked before use. Never a real secret.
          for v in PULSAR_DB_ROOT_PASSWORD PULSAR_HUB_ADMIN_PASSWORD PULSAR_TENANT_ADMIN_PASSWORD MARKER_PASSWORD; do
            val="$(openssl rand -hex 24)"
            echo "::add-mask::$val"
            echo "$v=$val" >> "$GITHUB_ENV"
          done

      - name: Helpers
        run: |
          cat > "$RUNNER_TEMP/pulsar_lib.sh" <<'LIB'
          # http_code <container> <path> [curl args...]: HTTP code from inside the compose network.
          http_code() {
            local c="$1" p="$2"; shift 2
            docker run --rm --network "container:$c" curlimages/curl:8.10.1 \
              -s -o /dev/null -w '%{http_code}' --max-time 5 -H "Host: $SITE" "$@" "http://127.0.0.1:8000$p" 2>/dev/null || echo 000
          }
          # wait_2xx <container> <label> [timeout]: ping must return 2xx. A 5xx fails at once.
          wait_2xx() {
            local c="$1" label="$2" t="${3:-300}" e=0 code=000
            while [ "$e" -lt "$t" ]; do
              code="$(http_code "$c" /api/method/ping)"
              case "$code" in
                2??) echo "✅ $label: ping HTTP $code"; return 0 ;;
                5??) echo "❌ $label: ping HTTP $code (server error)"; docker logs "$c" --tail 200; return 1 ;;
              esac
              sleep 5; e=$((e + 5))
            done
            echo "❌ $label: no 2xx within ${t}s (last HTTP $code)"; docker logs "$c" --tail 200; return 1
          }
          # marker_login <container> <label>: the marker user written on red must log in (2xx).
          marker_login() {
            local code
            code="$(http_code "$1" /api/method/login -X POST \
              --data-urlencode "usr=ci-upgrade-marker" --data-urlencode "pwd=$MARKER_PASSWORD")"
            case "$code" in
              2??) echo "✅ $2: marker user logs in (HTTP $code)" ;;
              *) echo "❌ $2: marker login HTTP $code"; docker logs "$1" --tail 100; return 1 ;;
            esac
          }
          # no_frappe <image>: a Pulsar image carries no bench and no frappe package.
          no_frappe() {
            if docker run --rm --entrypoint sh "$1" -c \
              'test -d /home/frappe/frappe-bench || command -v bench >/dev/null 2>&1 || python -c "import frappe" 2>/dev/null'; then
              echo "❌ $1 still carries Frappe/bench"; return 1
            fi
            echo "✅ $1 has no Frappe"
          }
          LIB

      - name: Detect Previous Pulsar Release
        id: prev
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_PAT || github.token }}
          PKG: ${{ inputs.hub_package }}
          REGISTRY: ${{ inputs.registry }}
          CURRENT: ${{ inputs.current_version }}
        run: |
          ORG="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          TAGS="$(gh api "/orgs/$ORG/packages/container/occultation%2F$PKG/versions?per_page=100" \
            --jq '.[] | .metadata.container.tags[]' 2>/dev/null | grep -vx latest | grep -vx "$CURRENT" | sort -V -r || true)"
          PREV=""
          # The newest earlier tag that is a Pulsar image (label rokct.engine=pulsar). Older tags are
          # bench images and cannot be a red baseline for a Pulsar upgrade.
          for t in $(echo "$TAGS" | head -n 10); do
            docker pull -q "$REGISTRY/$PKG:$t" >/dev/null 2>&1 || continue
            if [ "$(docker image inspect -f '{{ index .Config.Labels "rokct.engine" }}' "$REGISTRY/$PKG:$t")" = pulsar ]; then
              PREV="$t"; break
            fi
          done
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous Pulsar release: ${PREV:-none (first Pulsar release)}"

      - name: Images are Pulsar
        run: |
          . "$RUNNER_TEMP/pulsar_lib.sh"
          docker pull -q "$NEW_IMAGE"
          [ "$(docker image inspect -f '{{ index .Config.Labels "rokct.engine" }}' "$NEW_IMAGE")" = pulsar ] \
            || { echo "❌ $NEW_IMAGE is not labelled rokct.engine=pulsar"; exit 1; }
          no_frappe "$NEW_IMAGE"

      - name: "🔴 Red: previous release serving"
        id: red
        env:
          PREV: ${{ steps.prev.outputs.prev }}
          REGISTRY: ${{ inputs.registry }}
          PKG: ${{ inputs.hub_package }}
        run: |
          . "$RUNNER_TEMP/pulsar_lib.sh"
          # First Pulsar release: there is no earlier Pulsar image, so red is the new image itself.
          # The swap and rollback mechanics are still exercised; the summary says so.
          RED_IMAGE="${PREV:+$REGISTRY/$PKG:$PREV}"
          RED_IMAGE="${RED_IMAGE:-$NEW_IMAGE}"
          echo "red_image=$RED_IMAGE" >> "$GITHUB_OUTPUT"
          echo "RED_IMAGE=$RED_IMAGE" >> "$GITHUB_ENV"
          PULSAR_HUB_IMAGE="$RED_IMAGE" docker compose up -d postgres hub
          RED="$(docker compose ps -q hub)"
          echo "RED=$RED" >> "$GITHUB_ENV"
          wait_2xx "$RED" "red ($RED_IMAGE)" 600
          printf '%s\n' "$MARKER_PASSWORD" | docker exec -i -e IGNITION_SITE="$SITE" "$RED" \
            pulsar-entrypoint user ci-upgrade-marker --password-stdin
          marker_login "$RED" red
          # Safety copy of every database before green touches the schema.
          docker compose exec -T postgres pg_dumpall -U postgres > "$RUNNER_TEMP/red.sql"
          echo "red dump: $(wc -c < "$RUNNER_TEMP/red.sql") bytes"

      - name: "🟢 Green: migrate with the new release, start beside red"
        run: |
          . "$RUNNER_TEMP/pulsar_lib.sh"
          NET="$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' "$RED")"
          VOL="$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/srv/pulsar"}}{{.Name}}{{end}}{{end}}' "$RED")"
          echo "NET=$NET" >> "$GITHUB_ENV"; echo "VOL=$VOL" >> "$GITHUB_ENV"
          common=(--network "$NET" -v "$VOL:/srv/pulsar"
            -e IGNITION_DB_HOST=postgres -e IGNITION_DB_PORT=5432 -e IGNITION_DB_ROOT_USER=postgres
            -e IGNITION_DB_ROOT_PASSWORD="$PULSAR_DB_ROOT_PASSWORD" -e IGNITION_ADMIN_PASSWORD="$PULSAR_HUB_ADMIN_PASSWORD")
          # Pulsar's own schema + data migrations, run by the green image while red still serves.
          docker run --rm "${common[@]}" "$NEW_IMAGE" migrate "$SITE" --engine pulsar
          # Migrations are idempotent: a second run must also succeed.
          docker run --rm "${common[@]}" "$NEW_IMAGE" migrate "$SITE" --engine pulsar
          docker run -d --name pulsar-green "${common[@]}" "$NEW_IMAGE" serve
          wait_2xx pulsar-green "green ($NEW_IMAGE) beside red" 300
          wait_2xx "$RED" "red still serving during green start" 30
          marker_login pulsar-green green

      - name: "🔁 Swap: red out, green alone"
        run: |
          . "$RUNNER_TEMP/pulsar_lib.sh"
          docker compose stop hub
          wait_2xx pulsar-green "green after swap" 60
          marker_login pulsar-green "green after swap"
          for p in /api/method/ping /api/method/login; do
            c="$(http_code pulsar-green "$p")"
            case "$c" in 5??|000) echo "❌ green $p HTTP $c"; exit 1 ;; esac
          done

      - name: "⏪ Rollback: previous release on migrated data"
        run: |
          . "$RUNNER_TEMP/pulsar_lib.sh"
          docker rm -f pulsar-green >/dev/null
          PULSAR_HUB_IMAGE="$RED_IMAGE" docker compose up -d --no-deps hub
          RB="$(docker compose ps -q hub)"
          if wait_2xx "$RB" "rollback ($RED_IMAGE) on migrated data" 300 && marker_login "$RB" rollback; then
            echo "✅ Rollback serves without a restore."
          else
            echo "⚠️ Rollback image does not serve the migrated schema; restoring the red dump and retrying."
            docker compose stop hub
            docker compose exec -T postgres psql -q -U postgres -d postgres < "$RUNNER_TEMP/red.sql" >/dev/null
            PULSAR_HUB_IMAGE="$RED_IMAGE" docker compose up -d --no-deps hub
            RB="$(docker compose ps -q hub)"
            wait_2xx "$RB" "rollback after restore" 300
            marker_login "$RB" "rollback after restore"
            echo "❌ Rollback needed a database restore: the migration is not backward compatible."
            exit 1
          fi

      - name: Summary
        if: always()
        env:
          PREV: ${{ steps.prev.outputs.prev }}
        run: |
          {
            echo "### Pulsar blue-green upgrade test"
            echo "- red: ${RED_IMAGE:-n/a}${PREV:+ (previous release $PREV)}"
            [ -z "$PREV" ] && echo "- ⚠️ first Pulsar release: red was the new image, so this run proves swap/rollback mechanics, not a version upgrade"
            echo "- green: $NEW_IMAGE"
            echo "- migrations: \`migrate $SITE --engine pulsar\` (twice)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: |
          docker rm -f pulsar-green >/dev/null 2>&1 || true
          docker compose down -v || true
