name: Universal ToDo to Issue

on:
  workflow_call:

jobs:
  todo:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: TODO to Issue
        uses: alstr/todo-to-issue-action@v5
        with:
          CLOSE_ISSUES: "true"
          AUTO_ASSIGN: "true"
