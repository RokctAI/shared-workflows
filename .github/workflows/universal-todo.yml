name: Universal ToDo to Issue

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: write-all

on:
  workflow_call:
    secrets:
      GH_TOKEN:
        required: false
      COUNTER_API_KEY:
        required: false

jobs:
  telemetry:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Track Usage
        env:
          API_KEY: ${{ secrets.COUNTER_API_KEY }}
        if: env.API_KEY != ''
        run: |
          curl -X GET "https://api.counterapi.dev/v2/rokctai/usage/up" \
          -H "Authorization: Bearer $API_KEY"

  todo:
    needs: telemetry
    runs-on: ubuntu-latest
    concurrency:
      group: todo-${{ github.repository }}-${{ github.ref }}
    steps:
      - name: TODO to Issue
        uses: alstr/todo-to-issue-action@v5
        with:
          CLOSE_ISSUES: "true"
          AUTO_ASSIGN: "true"
          INSERT_ISSUE_URLS: "true"
