name: Universal ToDo to Issue

on:
  workflow_call:
    secrets:
      GH_TOKEN:
        required: false

jobs:
  todo:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: TODO to Issue
        uses: alstr/todo-to-issue-action@v5
        with:
          CLOSE_ISSUES: "true"
          AUTO_ASSIGN: "true"
