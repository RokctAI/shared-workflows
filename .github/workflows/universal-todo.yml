name: Universal ToDo to Issue

permissions:
  contents: write
  issues: write

on:
  workflow_call:
    secrets:
      GH_TOKEN:
        required: false
      COUNTER_API_KEY:
        required: false

jobs:
  telemetry:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Track Usage
        env:
          API_KEY: ${{ secrets.COUNTER_API_KEY }}
        if: env.API_KEY != ''
        run: |
          curl -X GET "https://api.counterapi.dev/v2/rokctai/usage/up" \
          -H "Authorization: Bearer $API_KEY"

  todo:
    needs: telemetry
    runs-on: ubuntu-latest
    concurrency:
      group: todo-${{ github.repository }}-${{ github.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: TODO to Issue
        uses: alstr/todo-to-issue-action@3bd536e14a2cbceeab1fadef96bea5f725ed4270
        with:
          CLOSE_ISSUES: "true"
          AUTO_ASSIGN: "true"
          INSERT_ISSUE_URLS: "true"
          TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
