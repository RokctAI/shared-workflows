          if [ -f ".private_repo" ]; then
            REPO_NAME=$(tr -d '\r\n[:space:]' < .private_repo)
            if [ -n "$REPO_NAME" ]; then
              echo "Private repository configured: $REPO_NAME"
              TOKEN="${{ secrets.MONOREPO_PAT || github.token }}"
              URL="https://x-access-token:${TOKEN}@github.com/${REPO_NAME}.git"
              if git clone --depth 1 "$URL" .private-temp; then
                echo "Excluding private files from git tracking..."
                mkdir -p .git/info
                (cd .private-temp && find . -type f) | sed 's|^\./||' >> .git/info/exclude
                echo "Merging private files..."
                rm -rf .private-temp/.git .private-temp/.github
                rsync -a .private-temp/ ./
                rm -rf .private-temp
              else
                echo "::warning::Failed to clone private repository $REPO_NAME."
              fi
            fi
          fi
      - name: Initiate Protocol
        shell: bash
        run: |
          if [ -f ".rokct/initiate.py" ]; then
            python .rokct/initiate.py
          else
            curl -sSL https://raw.githubusercontent.com/RokctAI/The-Rokct-Protocol/main/profiles/web/initiate.py -o initiate_temp.py
            python initiate_temp.py
            rm initiate_temp.py
          fi
      - name: Select Composer Manifest (If App Shell)
        shell: bash
        run: |
          if [ -f ".rokct/config/app_type" ]; then
            APP_TYPE=$(tr -d '\r\n[:space:]' < .rokct/config/app_type)
            echo "🔧 App shell detected (app_type=$APP_TYPE). Selecting composer manifest..."
            curl -sSL "https://raw.githubusercontent.com/RokctAI/The-Rokct-Protocol/main/core/utils/flutter/composer/${APP_TYPE}.json" -o composer.json.tmp
            if [ -s composer.json.tmp ] && python3 -c "import json; json.load(open('composer.json.tmp'))" 2>/dev/null; then
              mv composer.json.tmp composer.json
              echo "✅ composer.json set from composer/${APP_TYPE}.json (overwritten)"
            else
              echo "::error::No composer manifest found for app_type='${APP_TYPE}' at core/utils/flutter/composer/${APP_TYPE}.json"
              rm -f composer.json.tmp
              exit 1
            fi
          else
            echo "ℹ️ No .rokct/config/app_type - not an app shell. Skipping composer manifest selection."
          fi
      - name: Setup Flutter
        # Must run BEFORE the compose step: the composer itself invokes
        # `flutter pub get` inside the SDK caches it clones.
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ inputs.flutter-channel }}
          flutter-version: ${{ inputs.flutter-version }}
          cache: true

      - name: Compose Flutter SDK Modules (If Shell App)
        shell: bash
        run: |
          if [ -f "composer.json" ]; then
            echo "🚀 Shell app detected (composer.json found). Composing before build - this job builds from its own fresh checkout and cannot assume compose-app's git push already landed (e.g. when lib/ is gitignored, nothing was ever pushed)."
            # The Initiate Protocol step is supposed to land the canonical
            # composer at this path, but it is session-ephemeral (provisioned
            # under .rokct/skills/, wiped by end_protocol, never committed)
            # and not every initiate.py provisions it. Bootstrap it when
            # missing, then fall back the same way the linter does
            # (universal-linter.yml "Compose SDK Modules (If Shell App)").
            if [ ! -f ".rokct/skills/.rok/flutter/scripts/compose.py" ] && [ -f ".rokct/initiate.py" ]; then
              echo "Canonical composer missing. Provisioning via .rokct/initiate.py..."
              python .rokct/initiate.py
            fi
            if [ -f ".rokct/skills/.rok/flutter/scripts/compose.py" ]; then
              echo "Composing SDK modules via canonical skills composer..."
              python .rokct/skills/.rok/flutter/scripts/compose.py
            elif [ -f ".rokct/skills/flutter/scripts/compose.py" ]; then
              echo "Composing SDK modules via local skills composer..."
              python .rokct/skills/flutter/scripts/compose.py
            elif [ -f ".rokct/compose.py" ]; then
              # Backward compatibility for repos that still commit a root
              # composer bootstrap and have no .rokct/initiate.py.
              echo "Composing SDK modules via legacy committed .rokct/compose.py..."
              python .rokct/compose.py
            else
              echo "::error::composer.json present but no composer found (no initiate.py, no skills composer, no legacy wrapper)."
              exit 1
            fi
          else
            echo "ℹ️ Not a shell app (no composer.json). Building lib/ as-is."
          fi
      - name: Resolve Dynamic Client
        id: client
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          CLIENT=""
          if [[ "$REF_NAME" == build_* ]]; then
            CLIENT=$(printf '%s\n' "$REF_NAME" | cut -d'_' -f2 | cut -d'-' -f1 | tr -dc 'a-zA-Z0-9' | tr '[:lower:]' '[:upper:]')
          fi
          echo "client_upper=$CLIENT" >> "$GITHUB_OUTPUT"
          [ -n "$CLIENT" ] && echo "🔍 Detected Client: $CLIENT" || echo "ℹ️ Standard build (no client detected)"

      # --- Fetch GoogleService-Info.plist from Occultation (Smart Mandatory) ---
      - name: "Fetch/Decode GoogleService-Info.plist (Priority: Local > Occultation > Secret)"
        if: github.ref_name != 'develop'
        env:
          GH_TOKEN: ${{ env.MONOREPO_PAT }}
          CLIENT_PREFIX: ${{ steps.client.outputs.client_upper }}
          CLIENT_PLIST: "${{ steps.client.outputs.client_upper != '' && secrets[format('IOS_GOOGLE_SERVICE_INFO_PLIST_{0}', steps.client.outputs.client_upper)] || '' }}"
          DEFAULT_PLIST: "${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}"
        run: |
          if [ -f ios/Runner/GoogleService-Info.plist ]; then
             echo "✅ ios/Runner/GoogleService-Info.plist already exists. Skipping."
          else
             FILE_NAME="GoogleService-Info.plist"
             [ -n "$CLIENT_PREFIX" ] && FILE_NAME="$(echo "$CLIENT_PREFIX" | tr '[:upper:]' '[:lower:]')_GoogleService-Info.plist"

             # 1. Try Occultation
             if [ -n "$GH_TOKEN" ] && gh api repos/RokctAI/Occultation/contents/.env/"$FILE_NAME" -H "Accept: application/vnd.github.v3.raw" > ios/Runner/GoogleService-Info.plist 2>/dev/null; then
                echo "✅ Successfully synced $FILE_NAME from Occultation."
             else
                # 2. Try Secrets
                echo "⚠️ Not in Occultation. Falling back to secrets..."
                PLIST_CONTENT="$DEFAULT_PLIST"
                if [ -n "$CLIENT_PLIST" ]; then
                   echo "✅ Using client-specific secret: IOS_GOOGLE_SERVICE_INFO_PLIST_$CLIENT_PREFIX"
                   PLIST_CONTENT="$CLIENT_PLIST"
                fi

                if [ -n "$PLIST_CONTENT" ]; then
                   echo "$PLIST_CONTENT" | base64 --decode > ios/Runner/GoogleService-Info.plist
                   echo "✅ Successfully decoded from secrets."
                else
                   echo "ℹ️ No Google configuration found."
                fi
             fi
          fi
        continue-on-error: false

      # --- Fetch Environment from Occultation ---
      - name: Fetch Production Environment from Occultation (Dynamic Resolution)
        if: env.MONOREPO_PAT != '' && github.ref_name != 'develop'
        env:
          GH_TOKEN: ${{ env.MONOREPO_PAT }}
          CLIENT_PREFIX: ${{ steps.client.outputs.client_upper }}
        run: |
          mkdir -p .env
          FILE_NAME="production.env"
          if [ -n "$CLIENT_PREFIX" ]; then
             LOWER_PREFIX=$(echo "$CLIENT_PREFIX" | tr '[:upper:]' '[:lower:]')
             FILE_NAME="${LOWER_PREFIX}_production.env"
          fi
          echo "🔍 Fetching $FILE_NAME from RokctAI/Occultation..."
          gh api repos/RokctAI/Occultation/contents/.env/"$FILE_NAME" -H "Accept: application/vnd.github.v3.raw" > .env/production.env

          # Truncate at Flutter marker
          if grep -q "##########END_FLUTTER##########" .env/production.env; then
             echo "✂️ Truncating .env at ##########END_FLUTTER##########"
             sed -i '1,/##########END_FLUTTER##########/!d' .env/production.env
          fi

          # Normalize line endings
          sed -i 's/\r$//' .env/production.env

          # FIX: Strip comment lines and blank lines — dart-define-from-file does not support # comments
          sed -i '/^[[:space:]]*#/d; /^[[:space:]]*$/d' .env/production.env

          echo "✅ .env/production.env ready for Flutter."
          echo "📋 Keys loaded: $(wc -l < .env/production.env)"
        continue-on-error: false

      # --- Inject Google Maps key into iOS source ---
      # GMSServices.provideAPIKey() takes a Swift string literal, so --dart-define
      # cannot reach it the way it reaches Android's resValue in app/build.gradle.
      # Without this step every IPA ships whatever placeholder is committed in
      # AppDelegate.swift and the map renders blank (no tiles, roads or labels).
      - name: Inject Google Maps API Key (iOS)
        run: |
          APP_DELEGATE="ios/Runner/AppDelegate.swift"

          if [ ! -f "$APP_DELEGATE" ]; then
            echo "ℹ️ $APP_DELEGATE not found. Skipping Maps key injection."
            exit 0
          fi

          if ! grep -q "GMSServices.provideAPIKey" "$APP_DELEGATE"; then
            echo "ℹ️ No GMSServices.provideAPIKey call found. App does not use Google Maps. Skipping."
            exit 0
          fi

          if [ ! -f ".env/production.env" ]; then
            echo "::warning::No .env/production.env available — Google Maps key cannot be injected. iOS maps will render blank."
            exit 0
          fi

          MAPS_KEY=$(grep -m1 '^GOOGLE_MAPS_API_KEY=' .env/production.env | cut -d'=' -f2-)

          if [ -z "$MAPS_KEY" ]; then
            echo "::warning::GOOGLE_MAPS_API_KEY missing or empty in .env/production.env. iOS maps will render blank."
            exit 0
          fi

          # Guard the sed replacement: a key with shell/sed metacharacters would corrupt the source.
          if ! printf '%s' "$MAPS_KEY" | grep -Eq '^[A-Za-z0-9_-]+$'; then
            echo "::error::GOOGLE_MAPS_API_KEY contains unexpected characters. Refusing to patch $APP_DELEGATE."
            exit 1
          fi

          # BSD sed on macos-latest requires an explicit -i suffix.
          sed -i.bak -E "s|GMSServices\.provideAPIKey\(\"[^\"]*\"\)|GMSServices.provideAPIKey(\"$MAPS_KEY\")|" "$APP_DELEGATE"
          rm -f "$APP_DELEGATE.bak"

          # Verify without echoing the key itself.
          if ! grep -q "GMSServices.provideAPIKey(\"$MAPS_KEY\")" "$APP_DELEGATE"; then
            echo "::error::Maps key injection failed — provideAPIKey call was not rewritten."
            exit 1
          fi

          echo "✅ Google Maps API key injected into $APP_DELEGATE (${#MAPS_KEY} chars)."

      - name: Install Apple Certificate and Profile
        if: env.IOS_P12_BASE64 != ''
        env:
          P12_BASE64: ${{ env.IOS_P12_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ env.IOS_MOBILEPROVISION_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ env.IOS_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$P12_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$KEYCHAIN_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Get Dependencies
        id: build_process
        run: |
          {
            flutter pub get &&
            dart run build_runner build --delete-conflicting-outputs
          } > build_log.txt 2>&1 || echo "build_failed=true" >> "$GITHUB_ENV"
        continue-on-error: true

      - name: Parse build logs and create error_log.md
        if: env.build_failed == 'true'
        run: |
          python3 -c "
          import re
          import sys
          import os

          try:
              with open('build_log.txt', 'r') as f:
                  log = f.read()
          except FileNotFoundError:
              sys.exit(0)

          errors = {}
          pattern = r'E \w+ on (lib/.*?):\s*((?:(?!E \w+ on |Failed to build).)*)'

          matches = re.findall(pattern, log, re.DOTALL)
          for filepath, details in matches:
              errors[filepath] = details.strip()

          with open('error_log.md', 'w') as md:
              md.write('# 🍎 iOS/MacOS Build Errors\n\n')
              md.write('The following syntax errors were found during the build process:\n\n')

              if not errors:
                  md.write('Could not parse specific file errors from the log. Please review the raw logs.\n')
              else:
                  for filepath, details in errors.items():
                      md.write(f'## \`{filepath}\`\n')
                      for line in details.split('\n'):
                          line = line.strip()
                          if line:
                              md.write(f'- {line}\n')
                      md.write('\n')
          "

      - name: Generate App Token
        id: app-token
        if: env.build_failed == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true

      - name: Checkout Shared Workflows
        if: env.build_failed == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: RokctAI/shared-workflows
          token: ${{ github.token }}
          path: .github/shared-workflows

      - name: Setup Bot Identity
        if: env.build_failed == 'true'
        uses: ./.github/shared-workflows/.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
        continue-on-error: true

      - name: Cleanup Shared Workflows Checkout
        if: always()
        run: rm -rf .github/shared-workflows

      - name: Commit & Surface Build Errors (PR-First)
        if: env.build_failed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          if [[ -z "$(git config user.name)" ]]; then
            git config user.name "RokctBOT[bot]"
            git config user.email "2956274+RokctBOT[bot]@users.noreply.github.com"
          fi

          BRANCH_NAME="fix/build-errors-ios-${{ github.run_id }}-${{ github.run_attempt }}"
          git checkout -B "$BRANCH_NAME"
          git add error_log.md
          if git commit -m "fix: report ios build errors [skip ci]"; then
            if git push -u origin "$BRANCH_NAME" --force 2>&1 | tee push_error.log; then
              gh pr create --title "🚨 Build Failure: iOS Errors Found (Run ${{ github.run_id }})" \
                           --body "Automated report for failed iOS build in run ${{ github.run_id }}. Review the attached error_log.md for specific syntax or build_runner issues." \
                           --head "$BRANCH_NAME" --base "${{ github.ref_name }}" || echo "PR already exists or update failed."
            else
              echo "❌ Failed to push branch for error reporting."
              echo "💡 TIP: Ensure your GitHub App has 'Workflows: Read & Write' permissions."
            fi
          fi

      - name: Upload Error Log as Artifact
        if: env.build_failed == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-macos-build-error-log
          path: error_log.md

      - name: Fail job if build failed
        if: env.build_failed == 'true'
        run: |
          echo "Build failed. Check the ios-macos-build-error-log artifact or the opened PR for details."
          exit 1

      # Helper for iOS Pods
      - name: Install Cocoapods
        run: |
           (
             cd ios || exit 1
             pod install
           )

      - name: Build IPA
        run: |
          BUILD_ARGS=(--release)
          if [ -f .env/production.env ]; then
            BUILD_ARGS+=(--dart-define-from-file=.env/production.env)
            echo "✅ Using --dart-define-from-file=.env/production.env"
          fi
          if [ -z "$IOS_P12_BASE64" ]; then
            echo "⚠️ No Signing Certs found. Building unsigned (for testing only)..."
            BUILD_ARGS+=(--no-codesign)
          fi
          flutter build ios "${BUILD_ARGS[@]}"

      - name: Enable MacOS Config
        run: flutter config --enable-macos-desktop

      - name: Build MacOS
        run: |
          BUILD_ARGS=(--release)
          if [ -f .env/production.env ]; then
            BUILD_ARGS+=(--dart-define-from-file=.env/production.env)
            echo "✅ Using --dart-define-from-file=.env/production.env"
          fi
          flutter build macos "${BUILD_ARGS[@]}"

      - name: Zip MacOS App
        run: |
          (
            cd build/macos/Build/Products/Release || exit 1
            zip -r ../../../../../macos-app.zip ./*.app
          )

      - name: Upload MacOS Artifact
        if: inputs.upload-artifact == true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-release-build
          path: macos-app.zip

  # -----------------------------
  # Central Build Status Reporting
  # -----------------------------
  # Fleet-wide mainline health tracker: on failure this opens (or updates) ONE
  # live issue per app+platform in RokctAI/platformstack; the next green build
  # of the same platform closes it. PR builds are excluded on purpose - a PR
  # failure is the author's problem, this tracker is for mainline health.
  # This job must never be able to fail the build: continue-on-error at the
  # job level, and it degrades to a log line when MONOREPO_PAT is unavailable.
  report-build-status:
    name: 📣 Central Build Report
    needs: [compose-app, build-android, build-windows, build-ios]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: write-all
    continue-on-error: true
    env:
      GH_TOKEN: ${{ secrets.MONOREPO_PAT }}
      CENTRAL_REPO: RokctAI/platformstack
    steps:
      - name: Resolve Platform Outcome
        id: outcome
        env:
          BUILD_TYPE: ${{ inputs.build-type }}
          COMPOSE_RESULT: ${{ needs.compose-app.result }}
          ANDROID_RESULT: ${{ needs.build-android.result }}
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
          IOS_RESULT: ${{ needs.build-ios.result }}
        run: |
          # universal-pipeline.yml invokes this reusable workflow once per leg
          # (an android leg with build-type apk/appbundle/all/develop, and a
          # separate windows leg with build-type 'windows'), so each invocation
          # reports ONLY the platform it was asked to build. The build jobs are
          # job-level gated on build-type, so in each invocation the
          # non-requested platforms' results come through as 'skipped' here.
          case "$BUILD_TYPE" in
            windows)
              PLATFORM="windows"
              RESULT="$WINDOWS_RESULT"
              ARTIFACT="windows-build-error-log"
              ;;
            ios)
              PLATFORM="ios"
              RESULT="$IOS_RESULT"
              ARTIFACT="ios-macos-build-error-log"
              ;;
            *)
              PLATFORM="android"
              RESULT="$ANDROID_RESULT"
              ARTIFACT="android-build-error-log"
              ;;
          esac

          COMPOSE_FAILED="false"
          ACTION="none"
          if [ "$RESULT" = "failure" ]; then
            ACTION="report-failure"
          elif [ "$RESULT" = "success" ]; then
            ACTION="report-success"
          elif [ "$RESULT" = "skipped" ] && [ "$COMPOSE_RESULT" = "failure" ]; then
            # compose-app failing skips the build jobs; that is still a failed
            # build of this invocation's platform as far as the fleet is concerned.
            ACTION="report-failure"
            COMPOSE_FAILED="true"
          fi

          {
            echo "platform=$PLATFORM"
            echo "action=$ACTION"
            echo "artifact=$ARTIFACT"
            echo "compose_failed=$COMPOSE_FAILED"
          } >> "$GITHUB_OUTPUT"
          echo "ℹ️ Platform: $PLATFORM | Build result: $RESULT | Compose: $COMPOSE_RESULT | Action: $ACTION"

      - name: Download Error Log Artifact
        if: steps.outcome.outputs.action == 'report-failure'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ steps.outcome.outputs.artifact }}
          path: central-report/error-log
        # The artifact only exists when the dependency stage produced
        # error_log.md - later-stage failures upload nothing. Never fatal.
        continue-on-error: true

      - name: Report Build Status to Central Repo
        if: steps.outcome.outputs.action != 'none'
        env:
          ACTION: ${{ steps.outcome.outputs.action }}
          PLATFORM: ${{ steps.outcome.outputs.platform }}
          COMPOSE_FAILED: ${{ steps.outcome.outputs.compose_failed }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "ℹ️ MONOREPO_PAT not available - skipping central build reporting."
            exit 0
          fi

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          TITLE="${REPO_NAME}: ${PLATFORM} build failed"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          NOW_UTC="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          # Real dedupe: exact-title match among OPEN build-failure issues,
          # not gh's fuzzy --search.
          find_open_issue() {
            gh issue list -R "$CENTRAL_REPO" --state open --label "build-failure" \
              --json number,title --limit 100 2>/dev/null \
              | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)][0].number // empty'
          }

          if [ "$ACTION" = "report-failure" ]; then
            # Ensure labels exist (no-op when already present)
            gh label create "build-failure" -R "$CENTRAL_REPO" \
              --color "B60205" --description "Automated report: an app build is failing on mainline" \
              2>/dev/null || true
            gh label create "app:${REPO_NAME}" -R "$CENTRAL_REPO" \
              --color "1D76DB" --description "Build reports for ${REPO_NAME}" \
              2>/dev/null || true

            EXISTING="$(find_open_issue || true)"
            if [ -n "$EXISTING" ]; then
              echo "ℹ️ Open issue #$EXISTING already tracks '$TITLE'. Adding a comment instead of a duplicate."
              {
                echo "Still failing: new **${PLATFORM}** build failure on \`${GITHUB_REF_NAME}\`."
                echo ""
                echo "- **Run:** ${RUN_URL}"
                echo "- **Commit:** \`${GITHUB_SHA}\`"
                echo "- **Time:** ${NOW_UTC}"
                echo ""
                echo "---"
                echo "_Generated by [Claude Code](https://claude.ai/code)_"
              } > central_comment_body.md
              gh issue comment "$EXISTING" -R "$CENTRAL_REPO" --body-file central_comment_body.md \
                || echo "⚠️ Failed to comment on issue #$EXISTING."
            else
              {
                echo "## 🚨 ${TITLE}"
                echo ""
                echo "| | |"
                echo "|---|---|"
                echo "| **Repository** | \`${GITHUB_REPOSITORY}\` |"
                echo "| **Platform** | \`${PLATFORM}\` |"
                echo "| **Failing run** | ${RUN_URL} |"
                echo "| **Branch** | \`${GITHUB_REF_NAME}\` |"
                echo "| **Commit** | \`${GITHUB_SHA}\` |"
                echo "| **Event** | \`${GITHUB_EVENT_NAME}\` |"
                echo "| **Failed at** | ${NOW_UTC} |"
                if [ "$COMPOSE_FAILED" = "true" ]; then
                  echo ""
                  echo "> ⚠️ The SDK compose step (\`compose-app\`) failed before the ${PLATFORM} build could start."
                fi
                if [ -f "central-report/error-log/error_log.md" ]; then
                  echo ""
                  echo "### Error log (last 60 lines)"
                  echo ""
                  echo '````'
                  tail -n 60 "central-report/error-log/error_log.md"
                  echo '````'
                fi
                echo ""
                echo "This issue stays open until the next successful ${PLATFORM} build of ${REPO_NAME}, which will close it automatically."
                echo ""
                echo "---"
                echo "_Generated by [Claude Code](https://claude.ai/code)_"
              } > central_issue_body.md
              gh issue create -R "$CENTRAL_REPO" --title "$TITLE" \
                --label "build-failure" --label "app:${REPO_NAME}" \
                --body-file central_issue_body.md \
                || gh issue create -R "$CENTRAL_REPO" --title "$TITLE" \
                     --body-file central_issue_body.md \
                || echo "⚠️ Failed to open central build-failure issue."
            fi
          else
            EXISTING="$(find_open_issue || true)"
            if [ -n "$EXISTING" ]; then
              echo "✅ Build recovered - closing central issue #$EXISTING."
              {
                echo "✅ Recovered: **${PLATFORM}** build of \`${REPO_NAME}\` is green again."
                echo ""
                echo "- **Run:** ${RUN_URL}"
                echo "- **Branch:** \`${GITHUB_REF_NAME}\`"
                echo "- **Commit:** \`${GITHUB_SHA}\`"
                echo "- **Time:** ${NOW_UTC}"
                echo ""
                echo "---"
                echo "_Generated by [Claude Code](https://claude.ai/code)_"
              } > central_close_body.md
              gh issue close "$EXISTING" -R "$CENTRAL_REPO" --comment "$(cat central_close_body.md)" \
                || echo "⚠️ Failed to close issue #$EXISTING."
            else
              echo "ℹ️ Build succeeded and no open central issue to close. Nothing to do."
            fi
          fi
