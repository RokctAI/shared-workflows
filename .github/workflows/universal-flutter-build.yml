# Copyright 2024 RokctAI

name: Universal Flutter Build

permissions: write-all
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
    inputs:
      build-type:
        required: false
        type: string
        default: "apk"
        description: "Build type: apk, appbundle, windows, or ios"
      upload-artifact:
        required: false
        type: boolean
        default: true
        description: "Upload build artifact to GitHub"
      flutter-channel:
        required: false
        type: string
        default: 'stable'
      flutter-version:
        required: false
        type: string
        default: ''
      java-version:
        required: false
        type: string
        default: '17'
      app-type:
        required: false
        type: string
        description: "App role: customer, driver, manager, pos"
    secrets:
      KEY_JKS:
        required: false
      KEY_PASSWORD:
        required: false
      ALIAS_PASSWORD:
        required: false
      GOOGLE_SERVICES_JSON:
        required: false
      # iOS Secrets
      IOS_P12_BASE64:
        required: false
      IOS_MOBILEPROVISION_BASE64:
        required: false
      IOS_CERTIFICATE_PASSWORD:
        required: false
      IOS_GOOGLE_SERVICE_INFO_PLIST:
        required: false
      COUNTER_API_KEY:
        required: false
      PRODUCTION_ENV:
        required: false
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false
      MONOREPO_PAT:
        required: false

jobs:
  telemetry:
    name: 📡 Usage Tracking
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Track Usage
        env:
          API_KEY: ${{ secrets.COUNTER_API_KEY }}
        # FIX: Removed the ${{ }} wrapping which was causing the parsing error
        if: env.API_KEY != ''
        run: |
           curl -X GET "https://api.counterapi.dev/v2/rokctai/usage/up" \
           -H "Authorization: Bearer $API_KEY"

  build-android:
    needs: telemetry
    name: 🤖 Android Build
    runs-on: ubuntu-latest
    permissions: write-all
    env:
      KEY_JKS: ${{ secrets.KEY_JKS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      ALIAS_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      MONOREPO_PAT: ${{ secrets.MONOREPO_PAT }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Resolve Dynamic Client
        id: client
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          CLIENT=""
          if [[ "$REF_NAME" == build_* ]]; then
            # Extract client from branch name (e.g. build_clientname-v1 -> CLIENTNAME)
            CLIENT=$(printf '%s\n' "$REF_NAME" | cut -d'_' -f2 | cut -d'-' -f1 | tr -dc 'a-zA-Z0-9' | tr '[:lower:]' '[:upper:]')
          fi
          echo "client_upper=$CLIENT" >> "$GITHUB_OUTPUT"
          if [ -n "$CLIENT" ]; then
            echo "🔍 Detected Client: $CLIENT"
          else
            echo "ℹ️ Standard build (no client detected)"
          fi
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ inputs.java-version || '17' }}

      - name: Helper - Subosito Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter-channel }}
          flutter-version: ${{ inputs.flutter-version }}
          cache: true

      - name: Get Dependencies
        id: build_process
        run: |
          {
            flutter pub get &&
            dart run build_runner build --delete-conflicting-outputs
          } > build_log.txt 2>&1 || echo "build_failed=true" >> "$GITHUB_ENV"
        continue-on-error: true

      - name: Parse build logs and create error_log.md
        if: env.build_failed == 'true'
        run: |
          python3 -c "
          import re
          import sys
          import os

          try:
              with open('build_log.txt', 'r') as f:
                  log = f.read()
          except FileNotFoundError:
              sys.exit(0)

          errors = {}
          pattern = r'E \w+ on (lib/.*?):\s*((?:(?!E \w+ on |Failed to build).)*)'
          
          matches = re.findall(pattern, log, re.DOTALL)
          for filepath, details in matches:
              errors[filepath] = details.strip()

          with open('error_log.md', 'w') as md:
              md.write('# 🤖 Android Build Errors\n\n')
              md.write('The following syntax errors were found during the build process:\n\n')
              
              if not errors:
                  md.write('Could not parse specific file errors from the log. Please review the raw logs.\n')
              else:
                  for filepath, details in errors.items():
                      md.write(f'## \`{filepath}\`\n')
                      for line in details.split('\n'):
                          line = line.strip()
                          if line:
                              md.write(f'- {line}\n')
                      md.write('\n')
          "

      - name: Generate App Token
        id: app-token
        if: env.build_failed == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true

      - name: Checkout Shared Workflows
        if: env.build_failed == 'true'
        uses: actions/checkout@v6
        with:
          repository: RokctAI/shared-workflows
          token: ${{ github.token }}
          path: .github/shared-workflows

      - name: Setup Bot Identity
        if: env.build_failed == 'true'
        uses: ./.github/shared-workflows/.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
        continue-on-error: true

      - name: Cleanup Shared Workflows Checkout
        if: always()
        run: rm -rf .github/shared-workflows
        shell: bash

      - name: Commit & Surface Build Errors (PR-First)
        if: env.build_failed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          if [[ -z "$(git config user.name)" ]]; then
            git config user.name "rokct-maintainer[bot]"
            git config user.email "2956274+rokct-maintainer[bot]@users.noreply.github.com"
          fi

          BRANCH_NAME="fix/build-errors-android-${{ github.run_id }}-${{ github.run_attempt }}"
          git checkout -B "$BRANCH_NAME"
          git add error_log.md
          if git commit -m "fix: report android build errors [skip ci]"; then
            if git push -u origin "$BRANCH_NAME" --force 2>&1 | tee push_error.log; then
              gh pr create --title "🚨 Build Failure: Android Errors Found (Run ${{ github.run_id }})" \
                           --body "Automated report for failed Android build in run ${{ github.run_id }}. Review the attached error_log.md for specific syntax or build_runner issues." \
                           --head "$BRANCH_NAME" --base "${{ github.ref_name }}" || echo "PR already exists or update failed."
            else
              echo "❌ Failed to push branch for error reporting."
              echo "💡 TIP: Ensure your GitHub App has 'Workflows: Read & Write' permissions."
            fi
          fi

      - name: Upload Error Log as Artifact
        if: env.build_failed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: android-build-error-log
          path: error_log.md

      - name: Fail job if build failed
        if: env.build_failed == 'true'
        run: |
          echo "Build failed. Check the android-build-error-log artifact or the opened PR for details."
          exit 1

      # --- Fetch Google Services JSON from Monorepo (Smart Mandatory) ---
      - name: "Fetch/Decode Google Services JSON (Priority: Local > Monorepo > Secret)"
        if: github.ref_name != 'develop'
        env:
          GH_TOKEN: ${{ env.MONOREPO_PAT }}
          CLIENT_PREFIX: ${{ steps.client.outputs.client_upper }}
          CLIENT_JSON: "${{ steps.client.outputs.client_upper != '' && secrets[format('GOOGLE_SERVICES_JSON_{0}', steps.client.outputs.client_upper)] || '' }}"
          DEFAULT_JSON: "${{ secrets.GOOGLE_SERVICES_JSON }}"
        run: |
          if [ -f android/app/google-services.json ]; then
             echo "✅ android/app/google-services.json already exists. Skipping."
          else
             FILE_NAME="google-services.json"
             [ -n "$CLIENT_PREFIX" ] && FILE_NAME="$(echo "$CLIENT_PREFIX" | tr '[:upper:]' '[:lower:]')_google-services.json"
             
             # 1. Try Monorepo
             if [ -n "$GH_TOKEN" ] && gh api /repos/RokctAI/Monorepo/contents/.env/"$FILE_NAME" -H "Accept: application/vnd.github.v3.raw" > android/app/google-services.json 2>/dev/null; then
                echo "✅ Successfully synced $FILE_NAME from Monorepo."
             else
                # 2. Try Secrets
                echo "⚠️ Not in Monorepo. Falling back to secrets..."
                JSON_CONTENT="$DEFAULT_JSON"
                if [ -n "$CLIENT_JSON" ]; then
                   echo "✅ Using client-specific secret: GOOGLE_SERVICES_JSON_$CLIENT_PREFIX"
                   JSON_CONTENT="$CLIENT_JSON"
                fi
                
                if [ -n "$JSON_CONTENT" ]; then
                   echo "$JSON_CONTENT" | base64 --decode > android/app/google-services.json
                   echo "✅ Successfully decoded from secrets."
                else
                   echo "ℹ️ No Google Services configuration found."
                fi
             fi
          fi
        continue-on-error: false

      # --- Fetch Environment from Monorepo (Smart Mandatory) ---
      - name: Fetch Production Environment from Monorepo (Skip on develop)
        if: env.MONOREPO_PAT != '' && github.ref_name != 'develop'
        env:
          GH_TOKEN: ${{ env.MONOREPO_PAT }}
          CLIENT_PREFIX: ${{ steps.client.outputs.client_upper }}
        run: |
          # Clean start (matches original RM check)
          mkdir -p .env
          FILE_NAME="production.env"

          if [ -n "$CLIENT_PREFIX" ]; then
             LOWER_PREFIX=$(echo "$CLIENT_PREFIX" | tr '[:upper:]' '[:lower:]')
             FILE_NAME="${LOWER_PREFIX}_production.env"
          fi
  
          echo "🔍 Fetching \"$FILE_NAME\" from RokctAI/Monorepo..."
          gh api "/repos/RokctAI/Monorepo/contents/.env/$FILE_NAME" -H "Accept: application/vnd.github.v3.raw" > ".env/production.env"
          echo "✅ .env/production.env written."
  
          # Truncate at Flutter marker
          if grep -q "##########END_FLUTTER##########" ".env/production.env"; then
             echo "✂️ Truncating .env at ##########END_FLUTTER##########"
             sed -i '1,/##########END_FLUTTER##########/!d' ".env/production.env"
          fi
  
          # Normalize line endings
          sed -i 's/\r$//' ".env/production.env"
          echo "✅ .env/production.env ready for Flutter."
        continue-on-error: false

      # Dynamic Source Rename (Skip on develop)
      - name: Dynamic Source Rename
        if: github.ref_name != 'develop'
        run: |
          # 1. Load Environment Variables
          if [ -f ".env/production.env" ]; then
            echo "📝 Loading .env/production.env for source transformation..."
            # Normalize line endings (CRLF -> LF) to prevent Bash errors
            sed -i 's/\r$//' ".env/production.env"
            set -a
            source ".env/production.env"
            set +a
            echo "✅ Environment variables loaded."

            # Debug critical keys
            if [ -n "$CUSTOMER_ANDROID_PACKAGE_NAME" ]; then
              echo "✔️ CUSTOMER_ANDROID_PACKAGE_NAME is defined."
            else
              echo "❌ CUSTOMER_ANDROID_PACKAGE_NAME is MISSING."
            fi
          else
            echo "⚠️ No .env/production.env found. Skipping rename."
            exit 0
          fi

          # 2. Construct Target Package Variable Name
          APP_TYPE="${{ inputs.app-type }}"
          if [ -z "$APP_TYPE" ]; then
            echo "⚠️ No 'app-type' input provided. Skipping rename."
            exit 0
          fi

          APP_TYPE_UPPER=$(echo "$APP_TYPE" | tr '[:lower:]' '[:upper:]')
          ENV_VAR_NAME="${APP_TYPE_UPPER}_ANDROID_PACKAGE_NAME"
          TARGET_PACKAGE="${!ENV_VAR_NAME}"

          echo "🔧 App Type: $APP_TYPE"
          echo "🔑 Looking for: $ENV_VAR_NAME"
          echo "🎯 Target Package: $TARGET_PACKAGE"
          echo "📊 Current .env package settings:"
          grep "_ANDROID_PACKAGE_NAME" ".env/production.env" || echo "No package settings found in .env"

          # 2b. Validate against google-services.json
          GS_JSON="android/app/google-services.json"
          if [ -f "$GS_JSON" ]; then
            echo "🔍 Validating $TARGET_PACKAGE against $GS_JSON..."
            if ! grep -q "\"package_name\": \"$TARGET_PACKAGE\"" "$GS_JSON"; then
              echo "❌ CRITICAL ERROR: Package '$TARGET_PACKAGE' NOT found in google-services.json!"
              echo "📄 Clients found in JSON:"
              grep "\"package_name\":" "$GS_JSON" | sed 's/.*: "\(.*\)".*/  - \1/'
              exit 1
            else
              echo "✅ Package match confirmed in google-services.json."
            fi
          fi

          if [ -z "$TARGET_PACKAGE" ]; then
            echo "❌ Error: $ENV_VAR_NAME is not set in production.env!"
            exit 1
          fi

          BASE_DIR="android/app/src/main/kotlin"
          TARGET_PATH=$(echo "$TARGET_PACKAGE" | tr '.' '/')

          # 3. Check if Target Exists (Idempotent)
          if [ -d "$BASE_DIR/$TARGET_PATH" ]; then
            echo "✅ Target directory $TARGET_PATH already exists. Skipping move."
          else
            echo "🔄 Target not found. Detecting current vendor source..."
            
            GRADLE_FILE="android/app/build.gradle"
            if [ ! -f "$GRADLE_FILE" ]; then
              echo "❌ Error: No build.gradle found to detect namespace!"
              exit 1
            fi

            VENDOR_PACKAGE=$(grep 'namespace' "$GRADLE_FILE" | head -n 1 | sed "s/.*namespace *['\"]\([^'\"]*\)['\"].*/\1/")

            if [ -z "$VENDOR_PACKAGE" ]; then
              echo "❌ Error: Could not extract namespace from $GRADLE_FILE"
              exit 1
            fi

            VENDOR_PATH=$(echo "$VENDOR_PACKAGE" | tr '.' '/')

            echo "📦 Initializing source transformation..."
            if [ "$VENDOR_PACKAGE" = "$TARGET_PACKAGE" ]; then
              echo "✅ Source matches target. Nothing to do."
              exit 0
            fi

            echo "🚀 Applying directory structure..."
            mkdir -p "$BASE_DIR/$TARGET_PATH"

            if [ -d "$BASE_DIR/$VENDOR_PATH" ]; then
              mv "$BASE_DIR/$VENDOR_PATH"/* "$BASE_DIR/$TARGET_PATH/"
            else
              echo "❌ Error: Source directory $BASE_DIR/$VENDOR_PATH does not exist!"
              exit 1
            fi
          fi

          # 4. Update MainActivity.kt package
          MAIN_ACTIVITY="$BASE_DIR/$TARGET_PATH/MainActivity.kt"
          if [ -f "$MAIN_ACTIVITY" ]; then
            if ! grep -q "package $TARGET_PACKAGE" "$MAIN_ACTIVITY"; then
              echo "✏️ Updating MainActivity.kt package declaration..."
              sed -i "s|^package .*|package $TARGET_PACKAGE|" "$MAIN_ACTIVITY"
            else
              echo "✅ MainActivity.kt is correct."
            fi
          fi

          # 5. Update build.gradle namespace & applicationId
          if [ -f "$GRADLE_FILE" ]; then
            if ! grep -q "applicationId \"$TARGET_PACKAGE\"" "$GRADLE_FILE"; then
              echo "✏️ Updating $GRADLE_FILE..."
              sed -i "s|applicationId [\"'][^\"']*[\"']|applicationId \"$TARGET_PACKAGE\"|" "$GRADLE_FILE"
              sed -i "s|namespace [\"'][^\"']*[\"']|namespace \"$TARGET_PACKAGE\"|" "$GRADLE_FILE"
            else
              echo "✅ $GRADLE_FILE is correct."
            fi
          fi

      # Decode Keystore if secret provided (Optional robust signing)
      - name: Decode Keystore
        if: env.KEY_JKS != ''
        run: |
          if [ -f "android/key.properties" ]; then
            echo "✅ android/key.properties already exists. Skipping keystore setup."
          else
            echo "🔑 Decoding Keystore..."
            # Ensure target directory exists
            mkdir -p android/app
            echo "$KEY_JKS" | base64 --decode > "android/app/key.jks"

            echo "📝 Creating key.properties..."
            {
              echo "storePassword=$KEY_PASSWORD"
              echo "keyPassword=$ALIAS_PASSWORD"
              echo "keyAlias=upload"
              echo "storeFile=key.jks"
            } > "android/key.properties"
          fi

      - name: Build APK
        if: inputs.build-type == 'apk'
        run: |
          BUILD_ARGS=(--release)
          if [ -f .env/production.env ]; then
            BUILD_ARGS+=(--dart-define-from-file=.env/production.env)
          fi
          flutter build apk "${BUILD_ARGS[@]}"

      - name: Build AppBundle
        if: inputs.build-type == 'appbundle'
        run: |
          BUILD_ARGS=(--release)
          if [ -f .env/production.env ]; then
            BUILD_ARGS+=(--dart-define-from-file=.env/production.env)
          fi
          flutter build appbundle "${BUILD_ARGS[@]}"

      - name: Upload Artifact (APK)
        if: inputs.upload-artifact == true && inputs.build-type == 'apk'
        uses: actions/upload-artifact@v6
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Artifact (AAB)
        if: inputs.upload-artifact == true && inputs.build-type == 'appbundle'
        uses: actions/upload-artifact@v6
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

  build-windows:
    name: 🪟 Windows Build
    runs-on: windows-latest
    if: inputs.build-type == 'windows'
    permissions: write-all
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter-channel }}
          flutter-version: ${{ inputs.flutter-version }}
          cache: true

      - name: Get Dependencies
        id: build_process
        shell: bash
        run: |
          {
            flutter pub get &&
            dart run build_runner build --delete-conflicting-outputs
          } > build_log.txt 2>&1 || echo "build_failed=true" >> "$GITHUB_ENV"
        continue-on-error: true

      - name: Parse build logs and create error_log.md
        if: env.build_failed == 'true'
        shell: bash
        run: |
          python3 -c "
          import re
          import sys
          import os

          try:
              with open('build_log.txt', 'r') as f:
                  log = f.read()
          except FileNotFoundError:
              sys.exit(0)

          errors = {}
          pattern = r'E \w+ on (lib/.*?):\s*((?:(?!E \w+ on |Failed to build).)*)'
          
          matches = re.findall(pattern, log, re.DOTALL)
          for filepath, details in matches:
              errors[filepath] = details.strip()

          with open('error_log.md', 'w') as md:
              md.write('# 🪟 Windows Build Errors\n\n')
              md.write('The following syntax errors were found during the build process:\n\n')
              
              if not errors:
                  md.write('Could not parse specific file errors from the log. Please review the raw logs.\n')
              else:
                  for filepath, details in errors.items():
                      md.write(f'## \`{filepath}\`\n')
                      for line in details.split('\n'):
                          line = line.strip()
                          if line:
                              md.write(f'- {line}\n')
                      md.write('\n')
          "

      - name: Generate App Token
        id: app-token
        if: env.build_failed == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true

      - name: Checkout Shared Workflows
        if: env.build_failed == 'true'
        uses: actions/checkout@v6
        with:
          repository: RokctAI/shared-workflows
          token: ${{ github.token }}
          path: .github/shared-workflows

      - name: Setup Bot Identity
        if: env.build_failed == 'true'
        uses: ./.github/shared-workflows/.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
        continue-on-error: true

      - name: Cleanup Shared Workflows Checkout
        if: always()
        run: rm -rf .github/shared-workflows
        shell: bash

      - name: Commit & Surface Build Errors (PR-First)
        if: env.build_failed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          if [[ -z "$(git config user.name)" ]]; then
            git config user.name "rokct-maintainer[bot]"
            git config user.email "2956274+rokct-maintainer[bot]@users.noreply.github.com"
          fi

          BRANCH_NAME="fix/build-errors-windows-${{ github.run_id }}-${{ github.run_attempt }}"
          git checkout -B "$BRANCH_NAME"
          git add error_log.md
          if git commit -m "fix: report windows build errors [skip ci]"; then
            if git push -u origin "$BRANCH_NAME" --force; then
              gh pr create --title "🚨 Build Failure: Windows Errors Found (Run ${{ github.run_id }})" \
                           --body "Automated report for failed Windows build in run ${{ github.run_id }}. Review the attached error_log.md for specific syntax or build_runner issues." \
                           --head "$BRANCH_NAME" --base "${{ github.ref_name }}" || echo "PR already exists or update failed."
            else
              echo "❌ Failed to push branch for error reporting."
              echo "💡 TIP: Ensure your GitHub App has 'Workflows: Read & Write' permissions."
            fi
          fi

      - name: Upload Error Log as Artifact
        if: env.build_failed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: windows-build-error-log
          path: error_log.md

      - name: Fail job if build failed
        if: env.build_failed == 'true'
        run: |
          echo "Build failed. Check the windows-build-error-log artifact or the opened PR for details."
          exit 1

      - name: Build Windows
        run: |
          flutter build windows --release
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath flutter-windows-app.zip

      - name: Upload Artifact (Windows)
        if: inputs.upload-artifact == true
        uses: actions/upload-artifact@v6
        with:
          name: windows-release-build
          path: flutter-windows-app.zip

  build-ios:
    name: 🍎 iOS Build
    runs-on: macos-latest
    if: inputs.build-type == 'ios'
    permissions: write-all
    env:
      IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
      IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}
      MONOREPO_PAT: ${{ secrets.MONOREPO_PAT }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Resolve Dynamic Client
        id: client
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          CLIENT=""
          if [[ "$REF_NAME" == build_* ]]; then
            # Extract client from branch name (e.g. build_clientname-v1 -> CLIENTNAME)
            CLIENT=$(printf '%s\n' "$REF_NAME" | cut -d'_' -f2 | cut -d'-' -f1 | tr -dc 'a-zA-Z0-9' | tr '[:lower:]' '[:upper:]')
          fi
          echo "client_upper=$CLIENT" >> "$GITHUB_OUTPUT"
          [ -n "$CLIENT" ] && echo "🔍 Detected Client: $CLIENT" || echo "ℹ️ Standard build (no client detected)"

      # --- Fetch GoogleService-Info.plist from Monorepo (Smart Mandatory) ---
      - name: "Fetch/Decode GoogleService-Info.plist (Priority: Local > Monorepo > Secret)"
        if: github.ref_name != 'develop'
        env:
          GH_TOKEN: ${{ env.MONOREPO_PAT }}
          CLIENT_PREFIX: ${{ steps.client.outputs.client_upper }}
          CLIENT_PLIST: "${{ steps.client.outputs.client_upper != '' && secrets[format('IOS_GOOGLE_SERVICE_INFO_PLIST_{0}', steps.client.outputs.client_upper)] || '' }}"
          DEFAULT_PLIST: "${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}"
        run: |
          if [ -f ios/Runner/GoogleService-Info.plist ]; then
             echo "✅ ios/Runner/GoogleService-Info.plist already exists. Skipping."
          else
             FILE_NAME="GoogleService-Info.plist"
             [ -n "$CLIENT_PREFIX" ] && FILE_NAME="$(echo "$CLIENT_PREFIX" | tr '[:upper:]' '[:lower:]')_GoogleService-Info.plist"
             
             # 1. Try Monorepo
             if [ -n "$GH_TOKEN" ] && gh api /repos/RokctAI/Monorepo/contents/.env/"$FILE_NAME" -H "Accept: application/vnd.github.v3.raw" > ios/Runner/GoogleService-Info.plist 2>/dev/null; then
                echo "✅ Successfully synced $FILE_NAME from Monorepo."
             else
                # 2. Try Secrets
                echo "⚠️ Not in Monorepo. Falling back to secrets..."
                PLIST_CONTENT="$DEFAULT_PLIST"
                if [ -n "$CLIENT_PLIST" ]; then
                   echo "✅ Using client-specific secret: IOS_GOOGLE_SERVICE_INFO_PLIST_$CLIENT_PREFIX"
                   PLIST_CONTENT="$CLIENT_PLIST"
                fi
                
                if [ -n "$PLIST_CONTENT" ]; then
                   echo "$PLIST_CONTENT" | base64 --decode > ios/Runner/GoogleService-Info.plist
                   echo "✅ Successfully decoded from secrets."
                else
                   echo "ℹ️ No Google configuration found."
                fi
             fi
          fi
        continue-on-error: false

      # --- Fetch Environment from Monorepo (Smart Mandatory) ---
      - name: Fetch Production Environment from Monorepo (Dynamic Resolution)
        if: env.MONOREPO_PAT != '' && github.ref_name != 'develop'
        env:
          GH_TOKEN: ${{ env.MONOREPO_PAT }}
          CLIENT_PREFIX: ${{ steps.client.outputs.client_upper }}
        run: |
          mkdir -p .env
          FILE_NAME="production.env"
          if [ -n "$CLIENT_PREFIX" ]; then
             LOWER_PREFIX=$(echo "$CLIENT_PREFIX" | tr '[:upper:]' '[:lower:]')
             FILE_NAME="${LOWER_PREFIX}_production.env"
          fi
          echo "🔍 Fetching $FILE_NAME from RokctAI/Monorepo..."
          gh api /repos/RokctAI/Monorepo/contents/.env/"$FILE_NAME" -H "Accept: application/vnd.github.v3.raw" > .env/production.env
          
          # Truncate at Flutter marker
          if grep -q "##########END_FLUTTER##########" .env/production.env; then
             echo "✂️ Truncating .env at ##########END_FLUTTER##########"
             sed -i '1,/##########END_FLUTTER##########/!d' .env/production.env
          fi
          
          # Normalize line endings
          sed -i 's/\r$//' .env/production.env
        continue-on-error: false

      - name: Install Apple Certificate and Profile
        if: env.IOS_P12_BASE64 != ''
        # We can map env vars to new names or use them directly. 
        # The script below uses specific names (P12_BASE64, etc.), so we map them at step level from job level env.
        env:
          P12_BASE64: ${{ env.IOS_P12_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ env.IOS_MOBILEPROVISION_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ env.IOS_CERTIFICATE_PASSWORD }}
        run: |
          # Create variables
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          # Import certificate and provision profile from secrets
          echo -n "$P12_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate to keychain
          security import "$CERTIFICATE_PATH" -P "$KEYCHAIN_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Apply Provisioning Profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter-channel }}
          flutter-version: ${{ inputs.flutter-version }}
          cache: true

      - name: Get Dependencies
        id: build_process
        run: |
          {
            flutter pub get &&
            dart run build_runner build --delete-conflicting-outputs
          } > build_log.txt 2>&1 || echo "build_failed=true" >> "$GITHUB_ENV"
        continue-on-error: true

      - name: Parse build logs and create error_log.md
        if: env.build_failed == 'true'
        run: |
          python3 -c "
          import re
          import sys
          import os

          try:
              with open('build_log.txt', 'r') as f:
                  log = f.read()
          except FileNotFoundError:
              sys.exit(0)

          errors = {}
          pattern = r'E \w+ on (lib/.*?):\s*((?:(?!E \w+ on |Failed to build).)*)'
          
          matches = re.findall(pattern, log, re.DOTALL)
          for filepath, details in matches:
              errors[filepath] = details.strip()

          with open('error_log.md', 'w') as md:
              md.write('# 🍎 iOS/MacOS Build Errors\n\n')
              md.write('The following syntax errors were found during the build process:\n\n')
              
              if not errors:
                  md.write('Could not parse specific file errors from the log. Please review the raw logs.\n')
              else:
                  for filepath, details in errors.items():
                      md.write(f'## \`{filepath}\`\n')
                      for line in details.split('\n'):
                          line = line.strip()
                          if line:
                              md.write(f'- {line}\n')
                      md.write('\n')
          "

      - name: Generate App Token
        id: app-token
        if: env.build_failed == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true

      - name: Checkout Shared Workflows
        if: env.build_failed == 'true'
        uses: actions/checkout@v6
        with:
          repository: RokctAI/shared-workflows
          token: ${{ github.token }}
          path: .github/shared-workflows

      - name: Setup Bot Identity
        if: env.build_failed == 'true'
        uses: ./.github/shared-workflows/.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
        continue-on-error: true

      - name: Cleanup Shared Workflows Checkout
        if: always()
        run: rm -rf .github/shared-workflows

      - name: Commit & Surface Build Errors (PR-First)
        if: env.build_failed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          if [[ -z "$(git config user.name)" ]]; then
            git config user.name "rokct-maintainer[bot]"
            git config user.email "2956274+rokct-maintainer[bot]@users.noreply.github.com"
          fi

          BRANCH_NAME="fix/build-errors-ios-${{ github.run_id }}-${{ github.run_attempt }}"
          git checkout -B "$BRANCH_NAME"
          git add error_log.md
          if git commit -m "fix: report ios build errors [skip ci]"; then
            if git push -u origin "$BRANCH_NAME" --force 2>&1 | tee push_error.log; then
              gh pr create --title "🚨 Build Failure: iOS Errors Found (Run ${{ github.run_id }})" \
                           --body "Automated report for failed iOS build in run ${{ github.run_id }}. Review the attached error_log.md for specific syntax or build_runner issues." \
                           --head "$BRANCH_NAME" --base "${{ github.ref_name }}" || echo "PR already exists or update failed."
            else
              echo "❌ Failed to push branch for error reporting."
              echo "💡 TIP: Ensure your GitHub App has 'Workflows: Read & Write' permissions."
            fi
          fi

      - name: Upload Error Log as Artifact
        if: env.build_failed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ios-macos-build-error-log
          path: error_log.md

      - name: Fail job if build failed
        if: env.build_failed == 'true'
        run: |
          echo "Build failed. Check the ios-macos-build-error-log artifact or the opened PR for details."
          exit 1

      # Helper for iOS Pods
      - name: Install Cocoapods
        run: |
           (
             cd ios || exit 1
             pod install
           )

      - name: Build IPA (No Codesign stub if secrets missing)
        run: |
          if [ -z "$IOS_P12_BASE64" ]; then
            echo "⚠️ No Signing Certs found. Building unsigned (for testing only)..."
            flutter build ios --release --no-codesign
          fi
      - name: Enable MacOS Config
        run: flutter config --enable-macos-desktop

      - name: Build MacOS
        run: flutter build macos --release

      - name: Zip MacOS App
        run: |
          (
            cd build/macos/Build/Products/Release || exit 1
            zip -r ../../../../../macos-app.zip ./*.app
          )

      - name: Upload MacOS Artifact
        if: inputs.upload-artifact == true
        uses: actions/upload-artifact@v6
        with:
          name: macos-release-build
          path: macos-app.zip