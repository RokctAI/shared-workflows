name: Universal Flutter Build

on:
  workflow_call:
    inputs:
      build-type:
        required: false
        type: string
        default: "apk"
        description: "Build type: apk, appbundle, windows, or ios"
      upload-artifact:
        required: false
        type: boolean
        default: true
        description: "Upload build artifact to GitHub"
      flutter-channel:
        required: false
        type: string
        default: 'stable'
      java-version:
        required: false
        type: string
        default: '17'
      app-type:
        required: false
        type: string
        description: "App role: customer, driver, manager, pos"
    secrets:
      KEY_JKS:
        required: false
      KEY_PASSWORD:
        required: false
      ALIAS_PASSWORD:
        required: false
      GOOGLE_SERVICES_JSON:
        required: false
      # iOS Secrets
      IOS_P12_BASE64:
        required: false
      IOS_MOBILEPROVISION_BASE64:
        required: false
      IOS_CERTIFICATE_PASSWORD:
        required: false
      IOS_GOOGLE_SERVICE_INFO_PLIST:
        required: false
      COUNTER_API_KEY:
        required: false
      PRODUCTION_ENV:
        required: false

jobs:
  telemetry:
    name: 📡 Usage Tracking
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Track Usage
        env:
          API_KEY: ${{ secrets.COUNTER_API_KEY }}
        if: ${{ env.API_KEY != '' }}
        run: |
           curl -X GET "https://api.counterapi.dev/v2/rokctai/usage/up" \
           -H "Authorization: Bearer $API_KEY"

  build-android:
    needs: telemetry
    name: 🤖 Android Build
    runs-on: ubuntu-latest
    env:
      KEY_JKS: ${{ secrets.KEY_JKS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      ALIAS_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Dynamic Client
        id: client
        run: |
          BRANCH="${{ github.ref_name }}"
          CLIENT=""
          if [[ "$BRANCH" == build_* ]]; then
            # Extract client: build_wrapzo-v1 -> WRAPZO
            CLIENT=$(echo "$BRANCH" | cut -d'_' -f2 | cut -d'-' -f1 | tr '[:lower:]' '[:upper:]')
          fi
          echo "client_upper=$CLIENT" >> $GITHUB_OUTPUT
          [ ! -z "$CLIENT" ] && echo "🔍 Detected Client: $CLIENT" || echo "ℹ️ Standard build (no client detected)"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ inputs.java-version || '17' }}

      - name: Helper - Subosito Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter-channel }}
          cache: true

      - name: Get Dependencies
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      # Decode Google Services JSON if provided (Dynamic Resolution)
      - name: Decode Google Services JSON
        env:
          CLIENT_JSON: ${{ steps.client.outputs.client_upper != '' && secrets[format('GOOGLE_SERVICES_JSON_{0}', steps.client.outputs.client_upper)] || '' }}
          DEFAULT_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: env.CLIENT_JSON != '' || env.DEFAULT_JSON != ''
        run: |
          if [ -f android/app/google-services.json ]; then
             echo "✅ android/app/google-services.json already exists. Skipping decode."
          else
             echo "🔑 Decoding Google Services JSON..."
             JSON_CONTENT="$DEFAULT_JSON"
             if [ ! -z "$CLIENT_JSON" ]; then
                CLIENT_SUFFIX="${{ steps.client.outputs.client_upper }}"
                echo "✅ Using client-specific secret: GOOGLE_SERVICES_JSON_${CLIENT_SUFFIX}"
                JSON_CONTENT="$CLIENT_JSON"
             fi
             echo "$JSON_CONTENT" | base64 --decode > android/app/google-services.json
          fi

      # Decode Production Environment (Skip on develop)
      - name: Decode Production Environment
        env:
          CLIENT_ENV: ${{ steps.client.outputs.client_upper != '' && secrets[format('PRODUCTION_ENV_{0}', steps.client.outputs.client_upper)] || '' }}
          DEFAULT_ENV: ${{ secrets.PRODUCTION_ENV }}
        if: (env.CLIENT_ENV != '' || env.DEFAULT_ENV != '') && github.ref_name != 'develop'
        run: |
          ENV_CONTENT="$DEFAULT_ENV"
          if [ ! -z "$CLIENT_ENV" ]; then
             CLIENT_SUFFIX="${{ steps.client.outputs.client_upper }}"
             echo "✅ Using client-specific secret: PRODUCTION_ENV_${CLIENT_SUFFIX}"
             ENV_CONTENT="$CLIENT_ENV"
          fi
          mkdir -p .env
          echo "$ENV_CONTENT" | base64 --decode > .env/production.env

      # Dynamic Source Rename (Skip on develop)
      - name: Dynamic Source Rename
        if: github.ref_name != 'develop'
        run: |
          # 1. Load Environment Variables
          if [ -f .env/production.env ]; then
             echo "Loading .env/production.env..."
             # Normalize line endings (CRLF -> LF) to prevent Bash errors
             sed -i 's/\r$//' .env/production.env
             set -a
             source .env/production.env
             set +a
          else
             echo "⚠️ No .env/production.env found. Skipping rename."
             exit 0
          fi

          # 2. Construct Target Package Variable Name
          APP_TYPE="${{ inputs.app-type }}"
          if [ -z "$APP_TYPE" ]; then
             echo "⚠️ No 'app-type' input provided. Skipping rename."
             exit 0
          fi

          # Construct environment variable name (e.g. SHOPPER -> SHOPPER_ANDROID_PACKAGE_NAME)
          APP_TYPE_UPPER=$(echo "$APP_TYPE" | tr '[:lower:]' '[:upper:]')
          ENV_VAR_NAME="${APP_TYPE_UPPER}_ANDROID_PACKAGE_NAME"
          
          # Indirect reference to get value
          TARGET_PACKAGE="${!ENV_VAR_NAME}"
          
          echo "🔧 App Type: $APP_TYPE"
          echo "🔑 Looking for: $ENV_VAR_NAME"
          echo "🎯 Target Package: $TARGET_PACKAGE"

          if [ -z "$TARGET_PACKAGE" ]; then
             echo "❌ Error: $ENV_VAR_NAME is not set in production.env!"
             exit 1
          fi

          BASE_DIR="android/app/src/main/kotlin"
          TARGET_PATH=$(echo "$TARGET_PACKAGE" | sed 's/\./\//g')
          
          # 3. Check if Target Exists (Idempotent)
          if [ -d "$BASE_DIR/$TARGET_PATH" ]; then
             echo "✅ Target directory $TARGET_PATH already exists. Skipping move."
             # We assume if dir exists, files are likely updated, but we could double check files if paranoid.
             # For now, we trust the directory presence.
          else
             echo "🔄 Target not found. Detecting current vendor source..."
             
             # 4. Auto-Detect Current Vendor Source (from AndroidManifest.xml)
             # We check debug first, then main, as debug is often where the dev/vendor package is set
             MANIFEST_FILE="android/app/src/debug/AndroidManifest.xml"
             if [ ! -f "$MANIFEST_FILE" ]; then
                 MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
             fi

             if [ ! -f "$MANIFEST_FILE" ]; then
                 echo "❌ Error: No AndroidManifest.xml found to detect package!"
                 exit 1
             fi

             # Extract package="..." value
             # grep -oP 'package="\K[^"]+' is great but -P (Perl) might not be on all minimal images.
             # using sed instead
             VENDOR_PACKAGE=$(grep 'package=' "$MANIFEST_FILE" | head -n 1 | sed 's/.*package="\([^"]*\)".*/\1/')
             
             if [ -z "$VENDOR_PACKAGE" ]; then
                 echo "❌ Error: Could not extract package from $MANIFEST_FILE"
                 exit 1
             fi

             # Convert package to path
             VENDOR_PATH=$(echo "$VENDOR_PACKAGE" | tr '.' '/')

             echo "📦 Initializing source transformation..."

             if [ "$VENDOR_PACKAGE" == "$TARGET_PACKAGE" ]; then
                 echo "✅ Source matches target. Nothing to do."
                 exit 0
             fi

             # 5. Move Directories
             echo "🚀 Applying directory structure..."
             mkdir -p "$BASE_DIR/$TARGET_PATH"
             
             if [ -d "$BASE_DIR/$VENDOR_PATH" ]; then
                 mv "$BASE_DIR/$VENDOR_PATH"/* "$BASE_DIR/$TARGET_PATH"/
                 
                 # Optional: Remove empty vendor dirs if they are empty
                 # rmdir -p "$BASE_DIR/$VENDOR_PATH" 2>/dev/null || true
             else
                 echo "❌ Error: Source directory $BASE_DIR/$VENDOR_PATH does not exist!"
                 exit 1
             fi

          # 6. Update File Content (MainActivity & Manifests)
          # We check the file at the TARGET location now
          MAIN_ACTIVITY="$BASE_DIR/$TARGET_PATH/MainActivity.kt"
          
          if [ -f "$MAIN_ACTIVITY" ]; then
             # Check if we need to update package declaration
             if ! grep -q "package $TARGET_PACKAGE" "$MAIN_ACTIVITY"; then
                 echo "✏️ Updating MainActivity.kt package declaration..."
                 # We simply replace the line starting with 'package '
                 sed -i "s/^package .*/package $TARGET_PACKAGE/" "$MAIN_ACTIVITY"
             else
                 echo "✅ MainActivity.kt is correct."
             fi
          fi

          # Update Manifests
          for manifest in android/app/src/debug/AndroidManifest.xml android/app/src/profile/AndroidManifest.xml; do
             if [ -f "$manifest" ]; then
                if ! grep -q "package=\"$TARGET_PACKAGE\"" "$manifest"; then
                   echo "✏️ Updating $manifest..."
                   # Replace any package="..." attribute
                   sed -i "s/package=\"[^\"]*\"/package=\"$TARGET_PACKAGE\"/" "$manifest"
                else
                   echo "✅ $manifest is correct."
                fi
             fi
          done

      # Decode Keystore if secret provided (Optional robust signing)
      - name: Decode Keystore
        if: env.KEY_JKS != ''
        run: |
          if [ -f android/key.properties ]; then
             echo "✅ android/key.properties already exists. Skipping keystore setup."
          else
             echo "🔑 Decoding Keystore..."
             echo "$KEY_JKS" | base64 --decode > android/app/key.jks
             
             echo "📝 Creating key.properties..."
             echo "storePassword=$KEY_PASSWORD" > android/key.properties
             echo "keyPassword=$ALIAS_PASSWORD" >> android/key.properties
             echo "keyAlias=upload" >> android/key.properties
             echo "storeFile=key.jks" >> android/key.properties
          fi

      - name: Build APK
        if: inputs.build-type == 'apk'
        run: flutter build apk --release

      - name: Build AppBundle
        if: inputs.build-type == 'appbundle'
        run: flutter build appbundle --release

      - name: Upload Artifact (APK)
        if: inputs.upload-artifact == true && inputs.build-type == 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Artifact (AAB)
        if: inputs.upload-artifact == true && inputs.build-type == 'appbundle'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

  build-windows:
    name: 🪟 Windows Build
    runs-on: windows-latest
    if: inputs.build-type == 'windows'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter-channel }}
          cache: true

      - name: Get Dependencies
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows
        run: |
          flutter build windows --release
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath flutter-windows-app.zip

      - name: Upload Artifact (Windows)
        if: inputs.upload-artifact == true
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-build
          path: flutter-windows-app.zip

  build-ios:
    name: 🍎 iOS Build
    runs-on: macos-latest
    if: inputs.build-type == 'ios'
    env:
      IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
      IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Dynamic Client
        id: client
        run: |
          BRANCH="${{ github.ref_name }}"
          CLIENT=""
          if [[ "$BRANCH" == build_* ]]; then
            # Extract client: build_wrapzo-v1 -> WRAPZO
            CLIENT=$(echo "$BRANCH" | cut -d'_' -f2 | cut -d'-' -f1 | tr '[:lower:]' '[:upper:]')
          fi
          echo "client_upper=$CLIENT" >> $GITHUB_OUTPUT
          [ ! -z "$CLIENT" ] && echo "🔍 Detected Client: $CLIENT" || echo "ℹ️ Standard build (no client detected)"

      # Decode GoogleService-Info.plist if provided (Dynamic Resolution)
      - name: Decode GoogleService-Info.plist
        env:
          CLIENT_PLIST: ${{ steps.client.outputs.client_upper != '' && secrets[format('IOS_GOOGLE_SERVICE_INFO_PLIST_{0}', steps.client.outputs.client_upper)] || '' }}
          DEFAULT_PLIST: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}
        if: env.CLIENT_PLIST != '' || env.DEFAULT_PLIST != ''
        run: |
           PLIST_CONTENT="$DEFAULT_PLIST"
           if [ ! -z "$CLIENT_PLIST" ]; then
              CLIENT_SUFFIX="${{ steps.client.outputs.client_upper }}"
              echo "✅ Using client-specific secret: IOS_GOOGLE_SERVICE_INFO_PLIST_${CLIENT_SUFFIX}"
              PLIST_CONTENT="$CLIENT_PLIST"
           fi
           echo "$PLIST_CONTENT" | base64 --decode > ios/Runner/GoogleService-Info.plist

      # Decode Production Environment if provided (Dynamic Resolution)
      - name: Decode Production Environment
        env:
          CLIENT_ENV: ${{ steps.client.outputs.client_upper != '' && secrets[format('PRODUCTION_ENV_{0}', steps.client.outputs.client_upper)] || '' }}
          DEFAULT_ENV: ${{ secrets.PRODUCTION_ENV }}
        if: env.CLIENT_ENV != '' || env.DEFAULT_ENV != ''
        run: |
          ENV_CONTENT="$DEFAULT_ENV"
          if [ ! -z "$CLIENT_ENV" ]; then
             CLIENT_SUFFIX="${{ steps.client.outputs.client_upper }}"
             echo "✅ Using client-specific secret: PRODUCTION_ENV_${CLIENT_SUFFIX}"
             ENV_CONTENT="$CLIENT_ENV"
          fi
          mkdir -p .env
          echo "$ENV_CONTENT" | base64 --decode > .env/production.env

      - name: Install Apple Certificate and Profile
        if: env.IOS_P12_BASE64 != ''
        # We can map env vars to new names or use them directly. 
        # The script below uses specific names (P12_BASE64, etc.), so we map them at step level from job level env.
        env:
          P12_BASE64: ${{ env.IOS_P12_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ env.IOS_MOBILEPROVISION_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ env.IOS_CERTIFICATE_PASSWORD }}
        run: |
          # Create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Import certificate and provision profile from secrets
          echo -n "$P12_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "$KEYCHAIN_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # Apply Provisioning Profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter-channel }}
          cache: true

      - name: Get Dependencies
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      # Helper for iOS Pods
      - name: Install Cocoapods
        run: |
           cd ios
           pod install
           cd ..

      - name: Build IPA (No Codesign stub if secrets missing)
        run: |
           if [ -z "$IOS_P12_BASE64" ]; then
              echo "⚠️ No Signing Certs found. Building unsigned (for testing only)..."
              flutter build ios --release --no-codesign
      - name: Enable MacOS Config
        run: flutter config --enable-macos-desktop

      - name: Build MacOS
        run: flutter build macos --release

      - name: Zip MacOS App
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../macos-app.zip *.app

      - name: Upload MacOS Artifact
        if: inputs.upload-artifact == true
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-build
          path: macos-app.zip
