# Copyright 2024 RokctAI

name: Universal Flutter Build

permissions: write-all
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PIP_BREAK_SYSTEM_PACKAGES: 1

on:
  workflow_call:
    outputs:
      package_name:
        description: "The Android package name (applicationId)"
        value: ${{ jobs.build-android.outputs.package_name }}
    inputs:
      build-type:
        required: false
        type: string
        default: "apk"
        description: "Build type: apk, appbundle, all (apk + appbundle), develop (debug apk + appbundle), windows, ios, or macos"
      upload-artifact:
        required: false
        type: boolean
        default: true
        description: "Upload build artifact to GitHub"
      flutter-channel:
        required: false
        type: string
        default: 'stable'
      flutter-version:
        required: false
        type: string
        # Pinned: Flutter 3.47.0 + analyzer <8 (freezed 2.x) hangs build_runner; remove once SDKs move to freezed 3.x / analyzer 8.
        default: '3.44.9'
      java-version:
        required: false
        type: string
        default: '17'
      app-type:
        required: false
        type: string
        description: "App role: customer, driver, manager, pos"
    secrets:
      KEY_JKS:
        required: false
      KEY_PASSWORD:
        required: false
      ALIAS_PASSWORD:
        required: false
      GOOGLE_SERVICES_JSON:
        required: false
      # iOS Secrets
      IOS_P12_BASE64:
        required: false
      IOS_MOBILEPROVISION_BASE64:
        required: false
      IOS_CERTIFICATE_PASSWORD:
        required: false
      IOS_GOOGLE_SERVICE_INFO_PLIST:
        required: false
      COUNTER_API_KEY:
        required: false
      PRODUCTION_ENV:
        required: false
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false
      MONOREPO_PAT:
        required: false

jobs:
  telemetry:
    name: 📡 Usage Tracking
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Track Usage
        env:
          API_KEY: ${{ secrets.COUNTER_API_KEY }}
        if: env.API_KEY != ''
        run: |
           curl -X GET "https://api.counterapi.dev/v2/rokctai/usage/up" \
           -H "Authorization: Bearer $API_KEY"

  compose-app:
    name: 🎨 Compose SDK Modules
    runs-on: ubuntu-latest
    permissions: write-all
    # A hung SDK compose (network stall during clone/fetch) has squatted
    # runners for hours; kill the job instead of blocking the queue.
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Initiate Protocol
        shell: bash
        run: |
          if [ -f ".rokct/initiate.py" ]; then
            echo "🚀 Running local initiate.py..."
            python .rokct/initiate.py
          else
            echo "🌐 Fetching web initiate.py from remote protocol..."
            curl -sSL https://raw.githubusercontent.com/RokctAI/The-Rokct-Protocol/main/profiles/web/initiate.py -o initiate_temp.py
            python initiate_temp.py
            rm initiate_temp.py
          fi

      - name: Select Composer Manifest (If App Shell)
        shell: bash
        run: |
          if [ -f ".rokct/config/app_type" ]; then
            APP_TYPE=$(tr -d '\r\n[:space:]' < .rokct/config/app_type)
            echo "🔧 App shell detected (app_type=$APP_TYPE). Selecting composer manifest..."
            curl -sSL "https://raw.githubusercontent.com/RokctAI/The-Rokct-Protocol/main/core/utils/flutter/composer/${APP_TYPE}.json" -o composer.json.tmp
            if [ -s composer.json.tmp ] && python3 -c "import json; json.load(open('composer.json.tmp'))" 2>/dev/null; then
              mv composer.json.tmp composer.json
              echo "✅ composer.json set from composer/${APP_TYPE}.json (overwritten)"
            else
              echo "::error::No composer manifest found for app_type='${APP_TYPE}' at core/utils/flutter/composer/${APP_TYPE}.json"
              rm -f composer.json.tmp
              exit 1
            fi
          else
            echo "ℹ️ No .rokct/config/app_type - not an app shell. Skipping composer manifest selection."
          fi

      - name: Helper - Subosito Flutter
        # Must run BEFORE the compose step: the composer itself invokes
        # `flutter pub get` inside the SDK caches it clones.
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ inputs.flutter-channel }}
          flutter-version: ${{ inputs.flutter-version }}
          cache: true

      - name: Compose Flutter SDK Modules (If Shell App)
        shell: bash
        env:
          # SDK repos are private; the composer injects this token into its
          # git clone URLs (see sdk_composer.py authenticated_git_url).
          MONOREPO_PAT: ${{ secrets.MONOREPO_PAT }}
        run: |
          if [ -f "composer.json" ]; then
            echo "🚀 Shell app detected (composer.json found). Composing Flutter SDK modules..."

            # The Initiate Protocol step is supposed to land the canonical
            # composer at this path, but it is session-ephemeral (provisioned
            # under .rokct/skills/, wiped by end_protocol, never committed)
            # and not every initiate.py provisions it. Bootstrap it when
            # missing, then fall back the same way the linter does
            # (universal-linter.yml "Compose SDK Modules (If Shell App)").
            if [ ! -f ".rokct/skills/.rok/flutter/scripts/compose.py" ] && [ -f ".rokct/initiate.py" ]; then
              echo "Canonical composer missing. Provisioning via .rokct/initiate.py..."
              python .rokct/initiate.py
            fi
            if [ -f ".rokct/skills/.rok/flutter/scripts/compose.py" ]; then
              echo "Composing SDK modules via canonical skills composer..."
              COMPOSER=".rokct/skills/.rok/flutter/scripts/compose.py"
            elif [ -f ".rokct/skills/flutter/scripts/compose.py" ]; then
              echo "Composing SDK modules via local skills composer..."
              COMPOSER=".rokct/skills/flutter/scripts/compose.py"
            elif [ -f ".rokct/compose.py" ]; then
              # Backward compatibility for repos that still commit a root
              # composer bootstrap and have no .rokct/initiate.py.
              echo "Composing SDK modules via legacy committed .rokct/compose.py..."
              COMPOSER=".rokct/compose.py"
            else
              echo "::error::composer.json present but no composer found (no initiate.py, no skills composer, no legacy wrapper)."
              exit 1
            fi

            set +e
            python "$COMPOSER"
            COMPOSE_EXIT=$?
            set -e

            # Commit whatever compose produced (including .rokct/agent/logs/*_install_error.log
            # on failure) regardless of exit code, so a CI failure doesn't also destroy the
            # evidence needed to diagnose it - only the ephemeral runner ever had that log.
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            if [ "$COMPOSE_EXIT" -ne 0 ]; then
              git commit -m "🤖 [CI] Compose Flutter SDK modules FAILED - persisting logs [skip ci]" || echo "No changes to commit"
            else
              git commit -m "🤖 [CI] Compose Flutter SDK modules [skip ci]" || echo "No changes to commit"
            fi

            # Two workflows (e.g. Build (Smart) and Auto Release) can trigger on
            # the same push, compose in parallel, and race to push the identical
            # commit-back; the loser used to die with
            # "! [rejected] HEAD -> main (fetch first)". Rebase onto the remote
            # head first: an identical compose commit that already landed is
            # dropped by the rebase (nothing left to push), while unrelated new
            # remote commits just become the new base for ours.
            git fetch origin "$GITHUB_REF"
            if ! git rebase FETCH_HEAD; then
              git rebase --abort
              echo "::error::Compose commit-back conflicts with new commits on $GITHUB_REF - manual recompose needed."
              exit 1
            fi
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
              echo "ℹ️ Nothing new to push - identical compose result already on $GITHUB_REF (concurrent run won the race). Skipping push."
            else
              git push origin HEAD:${{ github.ref }}
            fi

            exit $COMPOSE_EXIT
          else
            echo "ℹ️ Not a shell app (no composer.json). Skipping composition."
          fi

  build-android:
    needs: [telemetry, compose-app]
    name: 🤖 Android Build

    runs-on: ubuntu-latest

    # Only spawn for build-types whose build steps this job actually runs
    # (see the step-level gates on Build APK / Build Debug APK / Build
    # AppBundle). Without this gate, every 'windows'/'ios' invocation of this
    # workflow still spawned a full Android job that composed the SDK for
    # ~10 minutes and then skipped every build step, producing nothing
    # (e.g. paas_manager run 31684759025, job 94403799142).
    if: inputs.build-type == 'apk' || inputs.build-type == 'appbundle' || inputs.build-type == 'all' || inputs.build-type == 'develop'
    permissions: write-all
    outputs:
      package_name: ${{ steps.package.outputs.package_name }}
    env:
      KEY_JKS: ${{ secrets.KEY_JKS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      ALIAS_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      MONOREPO_PAT: ${{ secrets.MONOREPO_PAT }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Fetch and Merge Private Repository
        shell: bash
        run: |
          if [ -f ".private_repo" ]; then
            REPO_NAME=$(tr -d '\r\n[:space:]' < .private_repo)
            if [ -n "$REPO_NAME" ]; then
              echo "Private repository configured: $REPO_NAME"
              TOKEN="${{ secrets.MONOREPO_PAT || github.token }}"
              URL="https://x-access-token:${TOKEN}@github.com/${REPO_NAME}.git"
              if git clone --depth 1 "$URL" .private-temp; then
                echo "Excluding private files from git tracking..."
                mkdir -p .git/info
                (cd .private-temp && find . -type f) | sed 's|^\./||' >> .git/info/exclude
                echo "Merging private files..."
                rm -rf .private-temp/.git .private-temp/.github
                rsync -a .private-temp/ ./
                rm -rf .private-temp
              else
                echo "::warning::Failed to clone private repository $REPO_NAME."
              fi
            fi
          fi
      - name: Initiate Protocol
        shell: bash
        run: |
          if [ -f ".rokct/initiate.py" ]; then
            python .rokct/initiate.py
          else
            curl -sSL https://raw.githubusercontent.com/RokctAI/The-Rokct-Protocol/main/profiles/web/initiate.py -o initiate_temp.py
            python initiate_temp.py
            rm initiate_temp.py
          fi
      - name: Select Composer Manifest (If App Shell)
        shell: bash
        run: |
          if [ -f ".rokct/config/app_type" ]; then
            APP_TYPE=$(tr -d '\r\n[:space:]' < .rokct/config/app_type)
            echo "🔧 App shell detected (app_type=$APP_TYPE). Selecting composer manifest..."
            curl -sSL "https://raw.githubusercontent.com/RokctAI/The-Rokct-Protocol/main/core/utils/flutter/composer/${APP_TYPE}.json" -o composer.json.tmp
            if [ -s composer.json.tmp ] && python3 -c "import json; json.load(open('composer.json.tmp'))" 2>/dev/null; then
              mv composer.json.tmp composer.json
              echo "✅ composer.json set from composer/${APP_TYPE}.json (overwritten)"
            else
              echo "::error::No composer manifest found for app_type='${APP_TYPE}' at core/utils/flutter/composer/${APP_TYPE}.json"
              rm -f composer.json.tmp
              exit 1
            fi
          else
            echo "ℹ️ No .rokct/config/app_type - not an app shell. Skipping composer manifest selection."
          fi
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'zulu'
          java-version: ${{ inputs.java-version || '17' }}

      - name: Helper - Subosito Flutter
        # Must run BEFORE the compose step: the composer itself invokes
        # `flutter pub get` inside the SDK caches it clones.
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ inputs.flutter-channel }}
          flutter-version: ${{ inputs.flutter-version }}
          cache: true

      - name: Compose Flutter SDK Modules (If Shell App)
        shell: bash
        run: |
          if [ -f "composer.json" ]; then
            echo "🚀 Shell app detected (composer.json found). Composing before build - this job builds from its own fresh checkout and cannot assume compose-app's git push already landed (e.g. when lib/ is gitignored, nothing was ever pushed)."
            # The Initiate Protocol step is supposed to land the canonical
            # composer at this path, but it is session-ephemeral (provisioned
            # under .rokct/skills/, wiped by end_protocol, never committed)
            # and not every initiate.py provisions it. Bootstrap it when
            # missing, then fall back the same way the linter does
            # (universal-linter.yml "Compose SDK Modules (If Shell App)").
            if [ ! -f ".rokct/skills/.rok/flutter/scripts/compose.py" ] && [ -f ".rokct/initiate.py" ]; then
              echo "Canonical composer missing. Provisioning via .rokct/initiate.py..."
              python .rokct/initiate.py
            fi
            if [ -f ".rokct/skills/.rok/flutter/scripts/compose.py" ]; then
              echo "Composing SDK modules via canonical skills composer..."
              python .rokct/skills/.rok/flutter/scripts/compose.py
            elif [ -f ".rokct/skills/flutter/scripts/compose.py" ]; then
              echo "Composing SDK modules via local skills composer..."
              python .rokct/skills/flutter/scripts/compose.py
            elif [ -f ".rokct/compose.py" ]; then
              # Backward compatibility for repos that still commit a root
              # composer bootstrap and have no .rokct/initiate.py.
              echo "Composing SDK modules via legacy committed .rokct/compose.py..."
              python .rokct/compose.py
            else
              echo "::error::composer.json present but no composer found (no initiate.py, no skills composer, no legacy wrapper)."
              exit 1
            fi
          else
            echo "ℹ️ Not a shell app (no composer.json). Building lib/ as-is."
          fi
      - name: Resolve Dynamic Client
        id: client
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          CLIENT=""
          if [[ "$REF_NAME" == build_* ]]; then
            # Extract client from branch name (e.g. build_clientname-v1 -> CLIENTNAME)
            CLIENT=$(printf '%s\n' "$REF_NAME" | cut -d'_' -f2 | cut -d'-' -f1 | tr -dc 'a-zA-Z0-9' | tr '[:lower:]' '[:upper:]')
          fi
          echo "client_upper=$CLIENT" >> "$GITHUB_OUTPUT"
          if [ -n "$CLIENT" ]; then
            echo "🔍 Detected Client: $CLIENT"
          else
            echo "ℹ️ Standard build (no client detected)"
          fi

      - name: Get Dependencies
        id: build_process
        run: |
          {
            flutter pub get &&
            dart run build_runner build --delete-conflicting-outputs
          } > build_log.txt 2>&1 || echo "build_failed=true" >> "$GITHUB_ENV"
        continue-on-error: true

      - name: Parse build logs and create error_log.md
        if: env.build_failed == 'true'
        run: |
          python3 -c "
          import re
          import sys
          import os

          try:
              with open('build_log.txt', 'r') as f:
                  log = f.read()
          except FileNotFoundError:
              sys.exit(0)

          errors = {}
          pattern = r'E \w+ on (lib/.*?):\s*((?:(?!E \w+ on |Failed to build).)*)'

          matches = re.findall(pattern, log, re.DOTALL)
          for filepath, details in matches:
              errors[filepath] = details.strip()

          with open('error_log.md', 'w') as md:
              md.write('# 🤖 Android Build Errors\n\n')
              md.write('The following syntax errors were found during the build process:\n\n')

              if not errors:
                  md.write('Could not parse specific file errors from the log. Please review the raw logs.\n')
              else:
                  for filepath, details in errors.items():
                      md.write(f'## \`{filepath}\`\n')
                      for line in details.split('\n'):
                          line = line.strip()
                          if line:
                              md.write(f'- {line}\n')
                      md.write('\n')
          "

      - name: Generate App Token
        id: app-token
        if: env.build_failed == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true

      - name: Checkout Shared Workflows
        if: env.build_failed == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: RokctAI/shared-workflows
          token: ${{ github.token }}
          path: .github/shared-workflows

      - name: Setup Bot Identity
        if: env.build_failed == 'true'
        uses: ./.github/shared-workflows/.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
        continue-on-error: true

      - name: Cleanup Shared Workflows Checkout
        if: always()
        run: rm -rf .github/shared-workflows
        shell: bash

      - name: Commit & Surface Build Errors (PR-First)
        if: env.build_failed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          if [[ -z "$(git config user.name)" ]]; then
            git config user.name "RokctBOT[bot]"
            git config user.email "2956274+RokctBOT[bot]@users.noreply.github.com"
          fi

          BRANCH_NAME="fix/build-errors-android-${{ github.run_id }}-${{ github.run_attempt }}"
          git checkout -B "$BRANCH_NAME"
          git add error_log.md
          if git commit -m "fix: report android build errors [skip ci]"; then
            if git push -u origin "$BRANCH_NAME" --force 2>&1 | tee push_error.log; then
              gh pr create --title "🚨 Build Failure: Android Errors Found (Run ${{ github.run_id }})" \
                           --body "Automated report for failed Android build in run ${{ github.run_id }}. Review the attached error_log.md for specific syntax or build_runner issues." \
                           --head "$BRANCH_NAME" --base "${{ github.ref_name }}" || echo "PR already exists or update failed."
            else
              echo "❌ Failed to push branch for error reporting."
              echo "💡 TIP: Ensure your GitHub App has 'Workflows: Read & Write' permissions."
            fi
          fi

      - name: Upload Error Log as Artifact
        if: env.build_failed == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-build-error-log
          path: error_log.md

      - name: Fail job if build failed
        if: env.build_failed == 'true'
        run: |
          echo "Build failed. Check the android-build-error-log artifact or the opened PR for details."
          exit 1

      # --- Fetch Google Services JSON from Occultation (Smart Mandatory) ---
      - name: "Fetch/Decode Google Services JSON (Priority: Local > Occultation > Secret)"
        if: github.ref_name != 'develop'
        env:
          GH_TOKEN: ${{ env.MONOREPO_PAT }}
          CLIENT_PREFIX: ${{ steps.client.outputs.client_upper }}
          CLIENT_JSON: "${{ steps.client.outputs.client_upper != '' && secrets[format('GOOGLE_SERVICES_JSON_{0}', steps.client.outputs.client_upper)] || '' }}"
          DEFAULT_JSON: "${{ secrets.GOOGLE_SERVICES_JSON }}"
        run: |
          if [ -f android/app/google-services.json ]; then
             echo "✅ android/app/google-services.json already exists. Skipping."
          else
             FILE_NAME="google-services.json"
             [ -n "$CLIENT_PREFIX" ] && FILE_NAME="$(echo "$CLIENT_PREFIX" | tr '[:upper:]' '[:lower:]')_google-services.json"

             # 1. Try Occultation
             if [ -n "$GH_TOKEN" ] && gh api repos/RokctAI/Occultation/contents/.env/"$FILE_NAME" -H "Accept: application/vnd.github.v3.raw" > android/app/google-services.json 2>/dev/null; then
                echo "✅ Successfully synced $FILE_NAME from Occultation."
             else
                # 2. Try Secrets
                echo "⚠️ Not in Occultation. Falling back to secrets..."
                JSON_CONTENT="$DEFAULT_JSON"
                if [ -n "$CLIENT_JSON" ]; then
                   echo "✅ Using client-specific secret: GOOGLE_SERVICES_JSON_$CLIENT_PREFIX"
                   JSON_CONTENT="$CLIENT_JSON"
                fi

                if [ -n "$JSON_CONTENT" ]; then
                   echo "$JSON_CONTENT" | base64 --decode > android/app/google-services.json
                   echo "✅ Successfully decoded from secrets."
                else
                   echo "ℹ️ No Google Services configuration found."
                fi
             fi
          fi
        continue-on-error: false

      # --- Fetch Environment from Occultation (Smart Mandatory) ---
      - name: Fetch Production Environment from Occultation (Skip on develop)
        if: env.MONOREPO_PAT != '' && github.ref_name != 'develop'
        env:
          GH_TOKEN: ${{ env.MONOREPO_PAT }}
          CLIENT_PREFIX: ${{ steps.client.outputs.client_upper }}
        run: |
          mkdir -p .env
          FILE_NAME="production.env"

          if [ -n "$CLIENT_PREFIX" ]; then
             LOWER_PREFIX=$(echo "$CLIENT_PREFIX" | tr '[:upper:]' '[:lower:]')
             FILE_NAME="${LOWER_PREFIX}_production.env"
          fi

          echo "🔍 Fetching $FILE_NAME from RokctAI/Occultation..."
          gh api "repos/RokctAI/Occultation/contents/.env/$FILE_NAME" -H "Accept: application/vnd.github.v3.raw" > ".env/production.env"
          echo "✅ .env/production.env written."

          # Truncate at Flutter marker
          if grep -q "##########END_FLUTTER##########" ".env/production.env"; then
             echo "✂️ Truncating .env at ##########END_FLUTTER##########"
             sed -i '1,/##########END_FLUTTER##########/!d' ".env/production.env"
          fi

          # Normalize line endings
          sed -i 's/\r$//' ".env/production.env"

          # FIX: Strip comment lines and blank lines — dart-define-from-file does not support # comments
          sed -i '/^[[:space:]]*#/d; /^[[:space:]]*$/d' ".env/production.env"

          echo "✅ .env/production.env ready for Flutter."
          echo "📋 Keys loaded: $(wc -l < .env/production.env)"
        continue-on-error: false

      - name: .env Diagnostics
        run: |
           echo "Total lines: $(wc -l < .env/production.env)"
           echo "Lines with comments: $(grep -c '^#' .env/production.env || echo 0)"
           echo "Blank lines: $(grep -c '^$' .env/production.env || echo 0)"
           echo "Lines without = : $(grep -cv '=' .env/production.env || echo 0)"
           echo "Keys only:"
           cut -d'=' -f1 .env/production.env

       # Dynamic Source Rename (Skip on develop)
      - name: Dynamic Source Rename
        if: github.ref_name != 'develop'
        run: |
          # 1. Load Environment Variables
          if [ -f ".env/production.env" ]; then
            echo "📝 Loading .env/production.env for source transformation..."
            sed -i 's/\r$//' ".env/production.env"
            set -a
            source ".env/production.env"
            set +a
            echo "✅ Environment variables loaded."

            # Debug critical keys
            if [ -n "$CUSTOMER_ANDROID_PACKAGE_NAME" ]; then
              echo "✔️ CUSTOMER_ANDROID_PACKAGE_NAME is defined."
            else
              echo "❌ CUSTOMER_ANDROID_PACKAGE_NAME is MISSING."
            fi
          else
            echo "⚠️ No .env/production.env found. Skipping rename."
            exit 0
          fi

          # 2. Construct Target Package Variable Name
          APP_TYPE="${{ inputs.app-type }}"
          if [ -z "$APP_TYPE" ]; then
            echo "⚠️ No 'app-type' input provided. Skipping rename."
            exit 0
          fi

          APP_TYPE_UPPER=$(echo "$APP_TYPE" | tr '[:lower:]' '[:upper:]')
          ENV_VAR_NAME="${APP_TYPE_UPPER}_ANDROID_PACKAGE_NAME"
          TARGET_PACKAGE="${!ENV_VAR_NAME}"

          echo "🔧 App Type: $APP_TYPE"
          echo "🔑 Looking for: $ENV_VAR_NAME"
          echo "🎯 Target Package: $TARGET_PACKAGE"
          echo "📊 Current .env package settings:"
          grep "_ANDROID_PACKAGE_NAME" ".env/production.env" || echo "No package settings found in .env"

          # 2b. Validate against google-services.json
          GS_JSON="android/app/google-services.json"
          if [ -f "$GS_JSON" ]; then
            echo "🔍 Validating $TARGET_PACKAGE against $GS_JSON..."
            if ! grep -q "\"package_name\": \"$TARGET_PACKAGE\"" "$GS_JSON"; then
              echo "❌ CRITICAL ERROR: Package '$TARGET_PACKAGE' NOT found in google-services.json!"
              echo "📄 Clients found in JSON:"
              grep "\"package_name\":" "$GS_JSON" | sed 's/.*: "\(.*\)".*/  - \1/'
              exit 1
            else
              echo "✅ Package match confirmed in google-services.json."
            fi
          fi

          if [ -z "$TARGET_PACKAGE" ]; then
            echo "❌ Error: $ENV_VAR_NAME is not set in production.env!"
            exit 1
          fi

          BASE_DIR="android/app/src/main/kotlin"
          TARGET_PATH=$(echo "$TARGET_PACKAGE" | tr '.' '/')

          # 3. Check if Target Exists (Idempotent)
          if [ -d "$BASE_DIR/$TARGET_PATH" ]; then
            echo "✅ Target directory $TARGET_PATH already exists. Skipping move."
          else
            echo "🔄 Target not found. Detecting current vendor source..."

            GRADLE_FILE="android/app/build.gradle"
            if [ ! -f "$GRADLE_FILE" ]; then
              echo "❌ Error: No build.gradle found to detect namespace!"
              exit 1
            fi

            VENDOR_PACKAGE=$(grep 'namespace' "$GRADLE_FILE" | head -n 1 | sed "s/.*namespace *['\" ]*\([^'\" ]*\)['\" ]*.*/\1/")

            if [ -z "$VENDOR_PACKAGE" ]; then
              echo "❌ Error: Could not extract namespace from $GRADLE_FILE"
              exit 1
            fi

            VENDOR_PATH=$(echo "$VENDOR_PACKAGE" | tr '.' '/')

            echo "📦 Initializing source transformation..."
            if [ "$VENDOR_PACKAGE" = "$TARGET_PACKAGE" ]; then
              echo "✅ Source matches target. Nothing to do."
              exit 0
            fi

            echo "🚀 Applying directory structure..."
            mkdir -p "$BASE_DIR/$TARGET_PATH"

            if [ -d "$BASE_DIR/$VENDOR_PATH" ]; then
              mv "$BASE_DIR/$VENDOR_PATH"/* "$BASE_DIR/$TARGET_PATH/"
            else
              echo "❌ Error: Source directory $BASE_DIR/$VENDOR_PATH does not exist!"
              exit 1
            fi
          fi

          # 4. Update MainActivity.kt package
          MAIN_ACTIVITY="$BASE_DIR/$TARGET_PATH/MainActivity.kt"
          if [ -f "$MAIN_ACTIVITY" ]; then
            if ! grep -q "package $TARGET_PACKAGE" "$MAIN_ACTIVITY"; then
              echo "✏️ Updating MainActivity.kt package declaration..."
              sed -i "s|^package .*|package $TARGET_PACKAGE|" "$MAIN_ACTIVITY"
            else
              echo "✅ MainActivity.kt is correct."
            fi
          fi

          # 5. Update build.gradle namespace & applicationId
          if [ -f "$GRADLE_FILE" ]; then
            if ! grep -q "applicationId \"$TARGET_PACKAGE\"" "$GRADLE_FILE"; then
              echo "✏️ Updating $GRADLE_FILE..."
              sed -i "s|applicationId [\"'][^\"']*[\"']|applicationId \"$TARGET_PACKAGE\"|" "$GRADLE_FILE"
              sed -i "s|namespace [\"'][^\"']*[\"']|namespace \"$TARGET_PACKAGE\"|" "$GRADLE_FILE"
            else
              echo "✅ $GRADLE_FILE is correct."
            fi
          fi

      # Decode Keystore if secret provided (Optional robust signing)
      - name: Decode Keystore
        if: env.KEY_JKS != ''
        run: |
          if [ -f "android/key.properties" ]; then
            echo "✅ android/key.properties already exists. Skipping keystore setup."
          else
            echo "🔑 Decoding Keystore..."
            mkdir -p android/app
            echo "$KEY_JKS" | base64 --decode > "android/app/key.jks"

            echo "📝 Creating key.properties..."
            {
              echo "storePassword=$KEY_PASSWORD"
              echo "keyPassword=$ALIAS_PASSWORD"
              echo "keyAlias=upload"
              echo "storeFile=key.jks"
            } > "android/key.properties"
          fi

      - name: Build APK
        if: inputs.build-type == 'apk' || inputs.build-type == 'all'
        run: |
            BUILD_ARGS=(--release)
            if [ -f .env/production.env ]; then
              BUILD_ARGS+=(--dart-define-from-file=.env/production.env)
            fi
            flutter build apk "${BUILD_ARGS[@]}"

      # develop never builds a release APK - the AAB stands in for it there
      - name: Build Debug APK
        if: inputs.build-type == 'apk' || inputs.build-type == 'all' || inputs.build-type == 'develop'
        run: |
            if [ -f .env/production.env ]; then
              flutter build apk --debug --dart-define-from-file=.env/production.env
            else
              flutter build apk --debug
            fi

      - name: Extract Package Name
        id: package
        run: |
          PACKAGE=""

          # Prefer the applicationId baked into the APK we just built.
          # build.gradle may set applicationId from a Groovy expression (e.g.
          # `applicationId dartDefines.CUSTOMER_ANDROID_PACKAGE_NAME`); a text
          # grep hands that expression to verify verbatim and `adb shell
          # monkey` then aborts with "No activities found to run".
          for APK in build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/app-release.apk; do
            if [ -f "$APK" ]; then
              AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt 2>/dev/null | sort -V | tail -n 1)
              if [ -n "$AAPT" ]; then
                PACKAGE=$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
                echo "📦 Read applicationId from $(basename "$APK") via aapt: $PACKAGE"
              fi
              break
            fi
          done

          # Fallback for builds without an APK on disk: static parse of
          # build.gradle (only trustworthy when applicationId is a literal).
          if [ -z "$PACKAGE" ]; then
            GRADLE_FILE="android/app/build.gradle"
            if [ -f "$GRADLE_FILE" ]; then
              PACKAGE=$(grep 'applicationId' "$GRADLE_FILE" | head -n 1 | sed "s/.*applicationId *['\" ]*\([^'\" ]*\)['\" ]*.*/\1/")
            fi
          fi

          # A leftover gradle expression is not a package name; resolve the
          # dart-define key from the same env file the build consumed.
          case "$PACKAGE" in
            *dartDefines.*)
              KEY="${PACKAGE##*dartDefines.}"
              if [ -f .env/production.env ]; then
                PACKAGE=$(sed -n "s/^${KEY}=//p" .env/production.env | head -n 1 | tr -d "\"'")
                echo "📦 Resolved $KEY from .env/production.env: $PACKAGE"
              else
                echo "::warning::applicationId is the unresolved gradle expression '$PACKAGE' and no .env/production.env is present to resolve it."
              fi
              ;;
          esac

          echo "package_name=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "Detected Package Name: $PACKAGE"

      - name: Build AppBundle
        if: inputs.build-type == 'appbundle' || inputs.build-type == 'all' || inputs.build-type == 'develop'
        run: |
            BUILD_ARGS=(--release)
            if [ -f .env/production.env ]; then
              BUILD_ARGS+=(--dart-define-from-file=.env/production.env)
            fi
            flutter build appbundle "${BUILD_ARGS[@]}"

      - name: Upload Artifact (APK)
        if: inputs.upload-artifact == true && (inputs.build-type == 'apk' || inputs.build-type == 'all' || inputs.build-type == 'develop')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: flutter-apks
          # develop builds no release APK, so only list the paths its build steps produced
          path: |
            ${{ inputs.build-type != 'develop' && 'build/app/outputs/flutter-apk/app-release.apk' || '' }}
            build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Artifact (AAB)
        if: inputs.upload-artifact == true && (inputs.build-type == 'appbundle' || inputs.build-type == 'all' || inputs.build-type == 'develop')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

  build-windows:
    name: 🪟 Windows Build
    needs: [telemetry, compose-app]
    runs-on: windows-latest

    if: inputs.build-type == 'windows'
    permissions: write-all
    env:
      MONOREPO_PAT: ${{ secrets.MONOREPO_PAT }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Fetch and Merge Private Repository
        shell: bash
        run: |
          if [ -f ".private_repo" ]; then
            REPO_NAME=$(tr -d '\r\n[:space:]' < .private_repo)
            if [ -n "$REPO_NAME" ]; then
              echo "Private repository configured: $REPO_NAME"
              TOKEN="${{ secrets.MONOREPO_PAT || github.token }}"
              URL="https://x-access-token:${TOKEN}@github.com/${REPO_NAME}.git"
              if git clone --depth 1 "$URL" .private-temp; then
                echo "Excluding private files from git tracking..."
                mkdir -p .git/info
                (cd .private-temp && find . -type f) | sed 's|^\./||' >> .git/info/exclude
                echo "Merging private files..."
                rm -rf .private-temp/.git .private-temp/.github
                rsync -a .private-temp/ ./
                rm -rf .private-temp
              else
                echo "::warning::Failed to clone private repository $REPO_NAME."
              fi
            fi
          fi
      - name: Initiate Protocol
        shell: bash
        run: |
          if [ -f ".rokct/initiate.py" ]; then
            python .rokct/initiate.py
          else
            curl -sSL https://raw.githubusercontent.com/RokctAI/The-Rokct-Protocol/main/profiles/web/initiate.py -o initiate_temp.py
            python initiate_temp.py
            rm initiate_temp.py
          fi
      - name: Select Composer Manifest (If App Shell)
        shell: bash
        run: |
          if [ -f ".rokct/config/app_type" ]; then
            APP_TYPE=$(tr -d '\r\n[:space:]' < .rokct/config/app_type)
            echo "🔧 App shell detected (app_type=$APP_TYPE). Selecting composer manifest..."
            curl -sSL "https://raw.githubusercontent.com/RokctAI/The-Rokct-Protocol/main/core/utils/flutter/composer/${APP_TYPE}.json" -o composer.json.tmp
            if [ -s composer.json.tmp ] && python3 -c "import json; json.load(open('composer.json.tmp'))" 2>/dev/null; then
              mv composer.json.tmp composer.json
              echo "✅ composer.json set from composer/${APP_TYPE}.json (overwritten)"
            else
              echo "::error::No composer manifest found for app_type='${APP_TYPE}' at core/utils/flutter/composer/${APP_TYPE}.json"
              rm -f composer.json.tmp
              exit 1
            fi
          else
            echo "ℹ️ No .rokct/config/app_type - not an app shell. Skipping composer manifest selection."
          fi
      - name: Setup Flutter
        # Must run BEFORE the compose step: the composer itself invokes
        # `flutter pub get` inside the SDK caches it clones.
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ inputs.flutter-channel }}
          flutter-version: ${{ inputs.flutter-version }}
          cache: true

      - name: Compose Flutter SDK Modules (If Shell App)
        shell: bash
        env:
          # SDK repos are private; the composer injects this token into its
          # git clone URLs (see sdk_composer.py authenticated_git_url).
          MONOREPO_PAT: ${{ secrets.MONOREPO_PAT }}
        run: |
          if [ -f "composer.json" ]; then
            echo "🚀 Shell app detected (composer.json found). Composing before build - this job builds from its own fresh checkout and cannot assume compose-app's git push already landed (e.g. when lib/ is gitignored, nothing was ever pushed)."
            # The Initiate Protocol step is supposed to land the composer
            # wrapper at this path, but on Windows initiate.py builds its
            # GitHub zip-extraction prefix with os.path.join, which yields
            # backslashes ("core\skills") that match no forward-slash zip
            # entries - it logs "Fetched 0 files from core\skills" and no
            # skill files land (see paas_manager run 31495498371). Provision
            # core/skills directly with git, which uses POSIX paths under
            # Git Bash on every OS.
            if [ ! -f ".rokct/skills/.rok/flutter/scripts/compose.py" ]; then
              echo "Skills composer missing after Initiate Protocol. Provisioning core/skills directly from The-Rokct-Protocol..."
              CLONE_URL="https://github.com/RokctAI/The-Rokct-Protocol.git"
              if [ -n "${MONOREPO_PAT:-}" ]; then
                CLONE_URL="https://x-access-token:${MONOREPO_PAT}@github.com/RokctAI/The-Rokct-Protocol.git"
              fi
              git clone --depth 1 "$CLONE_URL" .rokct-protocol-temp
              mkdir -p .rokct/skills
              cp -R .rokct-protocol-temp/core/skills/. .rokct/skills/
              rm -rf .rokct-protocol-temp
            fi
            python .rokct/skills/.rok/flutter/scripts/compose.py
          else
            echo "ℹ️ Not a shell app (no composer.json). Building lib/ as-is."
          fi
      - name: Get Dependencies
        id: build_process
        shell: bash
        run: |
          {
            flutter pub get &&
            dart run build_runner build --delete-conflicting-outputs
          } > build_log.txt 2>&1 || echo "build_failed=true" >> "$GITHUB_ENV"
        continue-on-error: true

      - name: Parse build logs and create error_log.md
        if: env.build_failed == 'true'
        shell: bash
        run: |
          python3 -c "
          import re
          import sys
          import os

          try:
              with open('build_log.txt', 'r') as f:
                  log = f.read()
          except FileNotFoundError:
              sys.exit(0)

          errors = {}
          pattern = r'E \w+ on (lib/.*?):\s*((?:(?!E \w+ on |Failed to build).)*)'

          matches = re.findall(pattern, log, re.DOTALL)
          for filepath, details in matches:
              errors[filepath] = details.strip()

          with open('error_log.md', 'w') as md:
              md.write('# 🪟 Windows Build Errors\n\n')
              md.write('The following syntax errors were found during the build process:\n\n')

              if not errors:
                  md.write('Could not parse specific file errors from the log. Please review the raw logs.\n')
              else:
                  for filepath, details in errors.items():
                      md.write(f'## \`{filepath}\`\n')
                      for line in details.split('\n'):
                          line = line.strip()
                          if line:
                              md.write(f'- {line}\n')
                      md.write('\n')
          "

      - name: Generate App Token
        id: app-token
        if: env.build_failed == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true

      - name: Checkout Shared Workflows
        if: env.build_failed == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: RokctAI/shared-workflows
          token: ${{ github.token }}
          path: .github/shared-workflows

      - name: Setup Bot Identity
        if: env.build_failed == 'true'
        uses: ./.github/shared-workflows/.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}
        continue-on-error: true

      - name: Cleanup Shared Workflows Checkout
        if: always()
        run: rm -rf .github/shared-workflows
        shell: bash

      - name: Commit & Surface Build Errors (PR-First)
        if: env.build_failed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          if [[ -z "$(git config user.name)" ]]; then
            git config user.name "RokctBOT[bot]"
            git config user.email "2956274+RokctBOT[bot]@users.noreply.github.com"
          fi

          BRANCH_NAME="fix/build-errors-windows-${{ github.run_id }}-${{ github.run_attempt }}"
          git checkout -B "$BRANCH_NAME"
          git add error_log.md
          if git commit -m "fix: report windows build errors [skip ci]"; then
            if git push -u origin "$BRANCH_NAME" --force; then
              gh pr create --title "🚨 Build Failure: Windows Errors Found (Run ${{ github.run_id }})" \
                           --body "Automated report for failed Windows build in run ${{ github.run_id }}. Review the attached error_log.md for specific syntax or build_runner issues." \
                           --head "$BRANCH_NAME" --base "${{ github.ref_name }}" || echo "PR already exists or update failed."
            else
              echo "❌ Failed to push branch for error reporting."
              echo "💡 TIP: Ensure your GitHub App has 'Workflows: Read & Write' permissions."
            fi
          fi

      - name: Upload Error Log as Artifact
        if: env.build_failed == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-build-error-log
          path: error_log.md

      - name: Fail job if build failed
        if: env.build_failed == 'true'
        run: |
          echo "Build failed. Check the windows-build-error-log artifact or the opened PR for details."
          exit 1

      # --- Fetch Environment from Occultation ---
      - name: Fetch Production Environment from Occultation
        if: env.MONOREPO_PAT != '' && github.ref_name != 'develop'
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_PAT }}
        shell: bash
        run: |
          mkdir -p .env
          echo "🔍 Fetching production.env from RokctAI/Occultation..."
          gh api "repos/RokctAI/Occultation/contents/.env/production.env" -H "Accept: application/vnd.github.v3.raw" > ".env/production.env"

          # Truncate at Flutter marker
          if grep -q "##########END_FLUTTER##########" ".env/production.env"; then
            echo "✂️ Truncating .env at ##########END_FLUTTER##########"
            sed -i '1,/##########END_FLUTTER##########/!d' ".env/production.env"
          fi

          # Normalize line endings
          sed -i 's/\r$//' ".env/production.env"

          # FIX: Strip comment lines and blank lines — dart-define-from-file does not support # comments
          sed -i '/^[[:space:]]*#/d; /^[[:space:]]*$/d' ".env/production.env"

          echo "✅ .env/production.env ready for Flutter."
          echo "📋 Keys loaded: $(wc -l < .env/production.env)"
        continue-on-error: false

      - name: Build Windows
        shell: bash
        env:
          # The Firebase C++ SDK that the firebase plugins extract into
          # build/windows declares cmake_minimum_required < 3.5, which CMake
          # 4.x (shipped on windows-latest) refuses to configure. This floor
          # lets CMake apply 3.5-era policies and proceed.
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          # MSVC 14.5x (VS 18 on windows-latest) turned the
          # <experimental/coroutine> include into a hard STL1011 static-assert,
          # which kills audioplayers_windows and permission_handler_windows.
          # The assert's own message names this define as the opt-out.
          #
          # Deliver it via CXXFLAGS, NOT the MSVC `CL` env var. CL prepends
          # its contents to every cl.exe invocation, including the
          # try-compiles CMake's Visual Studio generator runs to identify the
          # compiler; with CL set, configure died in ~11s with "No
          # CMAKE_CXX_COMPILER could be found" (supacharge run 31614213384)
          # on the exact same runner image (windows-2025-vs2026
          # 20260803.193.1) where the CL-less run 31599643182 configured fine
          # and reached the plugin compiles. CXXFLAGS instead seeds
          # CMAKE_CXX_FLAGS at first configure: CMake applies it to every
          # target in the project (plugins included) but not to compiler
          # identification, so detection passes and the define still reaches
          # the plugin compiles. The -D spelling (cl accepts -D and /D alike)
          # also keeps Git Bash's MSYS path mangling away from the value's
          # leading slash.
          CXXFLAGS: "-D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
        run: |
          BUILD_ARGS=(build windows --release)
          if [ -f .env/production.env ]; then
            BUILD_ARGS+=(--dart-define-from-file=.env/production.env)
            echo "✅ Using --dart-define-from-file=.env/production.env"
          fi
          flutter "${BUILD_ARGS[@]}"

      - name: Zip Windows App
        shell: pwsh
        run: |
          # Bundle the complete MSVC runtime family from the redist's *.CRT
          # dir into the zip: on machines without the VC++ redistributable
          # the exe otherwise dies in the loader before main() - instant
          # silent exit, no window, no error. The whole directory ships
          # (not a hand-picked subset) because the CRT DLLs are version-
          # coupled: mixing a new msvcp140.dll with older system companions
          # (msvcp140_1/_2, concrt140, ...) crashes with an access
          # violation at startup. Missing redist on the runner only warns;
          # the zip still ships.
          try {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $vs = & $vswhere -latest -property installationPath
            # Pick the NEWEST redist version: the runner image carries several
            # MSVC redist versions side by side, and the binaries are compiled
            # with the image's newest MSVC toolset, so the bundled runtime
            # must be >= that toolset version. An unsorted Select-Object
            # -First 1 returns the OLDEST version dir (14.29 sorts first),
            # which ships a too-old msvcp140.dll that crashes the app at
            # startup. The version dir sits two levels above the *.CRT dir
            # (...\MSVC\<version>\x64\*.CRT), so extract it from the full
            # path for the sort key.
            $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\*.CRT" -Directory -ErrorAction SilentlyContinue |
              Sort-Object { [version]($_.FullName -replace '.*\\MSVC\\([0-9.]+)\\.*','$1') } -Descending |
              Select-Object -First 1
            if ($crt) {
              Copy-Item "$($crt.FullName)\*.dll" build\windows\x64\runner\Release\ -ErrorAction Continue
              Write-Output "Bundled MSVC CRT from: $($crt.FullName)"
            } else {
              Write-Output "::warning::MSVC CRT redist not found under $vs; runtime DLLs not bundled."
            }
          } catch {
            Write-Output "::warning::Could not bundle MSVC runtime DLLs: $_"
          }
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath flutter-windows-app.zip

      - name: Upload Artifact (Windows)
        if: inputs.upload-artifact == true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-release-build
          path: flutter-windows-app.zip

  build-ios:
    name: 🍎 iOS Build
    needs: [telemetry, compose-app]
    runs-on: macos-latest

    if: inputs.build-type == 'ios' || inputs.build-type == 'macos'
    permissions: write-all
    env:
      IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
      IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}
      MONOREPO_PAT: ${{ secrets.MONOREPO_PAT }}
    steps:
      - name: Checkout Code
