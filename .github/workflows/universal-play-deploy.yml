#
# Universal Play Store Deploy
#
# Reusable workflow that publishes a Flutter app's Android App Bundle to the
# Google Play Developer API. App-agnostic — a specific app repo owns the
# actual triggers (weekly cron + workflow_dispatch) and calls this workflow
# with `uses: RokctAI/shared-workflows/.github/workflows/universal-play-deploy.yml@main`,
# matching the pattern already used for universal-release.yml (see
# datafy/.github/workflows/release.yml).
#
# Hard rules enforced here (not just documented — actually checked):
#   1. Only ever deploys from the `main` branch (checked explicitly, not just
#      inferred from trigger).
#   2. At most one release per ISO week, even across repeated manual
#      dispatches. State is tracked in a committed marker file
#      (.github/.play-store-release-state.json), not just relied on cron.
#   3. No-ops cleanly if there is nothing new to ship (no version bump / no
#      new commits since the last recorded deploy).

name: Universal Play Store Deploy

permissions: write-all
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PIP_BREAK_SYSTEM_PACKAGES: 1

on:
  workflow_call:
    inputs:
      version_file:
        required: false
        type: string
        default: "pubspec.yaml"
        description: "Path to the file holding the app version (pubspec.yaml 'version: X.Y.Z+N')"
      package_name:
        required: false
        type: string
        default: ""
        description: "Android applicationId. If empty, it is auto-detected from android/app/build.gradle"
      track:
        required: false
        type: string
        default: "internal"
        description: "Play Console track to publish to: internal, alpha, beta, or production"
      release_status:
        required: false
        type: string
        default: "completed"
        description: "Release status passed to the Play Developer API: draft, inProgress, halted, or completed"
      app-type:
        required: false
        type: string
        description: "App role: customer, driver, manager, pos (used to resolve env/package the same way universal-flutter-build does)"
      flutter-channel:
        required: false
        type: string
        default: 'stable'
      flutter-version:
        required: false
        type: string
        # Pinned: Flutter 3.47.0 + analyzer <8 (freezed 2.x) hangs build_runner; remove once SDKs move to freezed 3.x / analyzer 8.
        default: '3.44.9'
      java-version:
        required: false
        type: string
        default: '17'
      state_file:
        required: false
        type: string
        default: ".github/.play-store-release-state.json"
        description: "Path to the committed marker file used for weekly-limit + no-op tracking"
    secrets:
      # Deploy credentials resolve with a per-secret fallback chain. A GitHub
      # Actions secret always wins. For the two JSON credentials the next stop
      # is a dedicated JSON file in RokctAI/Occultation .env/ (fetched with
      # MONOREPO_PAT), and only then the legacy base64 key in
      # .env/production.env:
      #   PLAY_STORE_SERVICE_ACCOUNT_JSON -> .env/play_store_service_account.json
      #   GOOGLE_SERVICES_JSON            -> .env/google-services.json
      # KEY_JKS / KEY_PASSWORD / ALIAS_PASSWORD still resolve secret-first,
      # then from the same-named key in .env/production.env. Fetched files
      # never leave the deploy job; JSON credentials are written straight to
      # 0600 temp files (never echoed, deleted before the job ends) and
      # env-file values are masked before use.
      PLAY_STORE_SERVICE_ACCOUNT_JSON:
        required: false
        description: "Base64-encoded (or raw) Google Play service account JSON key with Release Manager access. If unset, fetched from RokctAI/Occultation .env/play_store_service_account.json, falling back to the legacy base64 PLAY_STORE_SERVICE_ACCOUNT_JSON key in .env/production.env (both require MONOREPO_PAT)"
      KEY_JKS:
        required: false
      KEY_PASSWORD:
        required: false
      ALIAS_PASSWORD:
        required: false
      GOOGLE_SERVICES_JSON:
        required: false
      MONOREPO_PAT:
        required: false
      PRODUCTION_ENV:
        required: false
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

jobs:
  # --- 1. THE GATE: branch check + weekly-limit + "is there anything new" check ---
  gate:
    name: 🚦 Release Gate
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      reason: ${{ steps.decide.outputs.reason }}
      version: ${{ steps.decide.outputs.version }}
      package_name: ${{ steps.decide.outputs.package_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      # Hard gate: never deploy from anything but main, regardless of how
      # this workflow was invoked (schedule, workflow_dispatch, whatever the
      # caller wires up).
      - name: Verify Branch Is Main
        id: branch_check
        run: |
          BRANCH="${{ github.ref_name }}"
          echo "🔍 Triggered on branch: $BRANCH"
          if [ "$BRANCH" != "main" ]; then
            echo "❌ Play Store deploys only run from 'main'. Refusing to proceed on '$BRANCH'."
            echo "on_main=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ On main. Continuing."
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve Current Version
        id: current_version
        run: |
          FILE="${{ inputs.version_file }}"
          if [ ! -f "$FILE" ]; then
            echo "❌ Version file not found: $FILE"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$FILE" == *.yaml ]] || [[ "$FILE" == *.yml ]]; then
            VERSION=$(grep -m1 -E '^version:' "$FILE" | awk '{print $2}' | tr -d '"' | tr -d "'")
          elif [[ "$FILE" == *.json ]]; then
            VERSION=$(jq -r .version "$FILE")
          else
            VERSION=$(cat "$FILE")
          fi

          echo "📦 Current version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve Package Name
        id: pkg
        run: |
          PKG="${{ inputs.package_name }}"
          if [ -z "$PKG" ] && [ -f "android/app/build.gradle" ]; then
            PKG=$(grep 'applicationId' android/app/build.gradle | head -n 1 | sed "s/.*applicationId *['\" ]*\([^'\" ]*\)['\" ]*.*/\1/")
          fi
          echo "📦 Package: $PKG"
          echo "package_name=$PKG" >> "$GITHUB_OUTPUT"

      - name: Read Release State Marker
        id: state
        run: |
          STATE_FILE="${{ inputs.state_file }}"
          if [ -f "$STATE_FILE" ]; then
            echo "📖 Found existing state marker: $STATE_FILE"
            cat "$STATE_FILE"
            LAST_VERSION=$(jq -r '.last_version // ""' "$STATE_FILE")
            LAST_WEEK=$(jq -r '.last_release_iso_week // ""' "$STATE_FILE")
            LAST_SHA=$(jq -r '.last_release_sha // ""' "$STATE_FILE")
          else
            echo "📖 No prior state marker found. Treating as first-ever deploy."
            LAST_VERSION=""
            LAST_WEEK=""
            LAST_SHA=""
          fi
          {
            echo "last_version=$LAST_VERSION"
            echo "last_week=$LAST_WEEK"
            echo "last_sha=$LAST_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Decide
        id: decide
        run: |
          VERSION="${{ steps.current_version.outputs.version }}"
          PACKAGE="${{ steps.pkg.outputs.package_name }}"
          CURRENT_WEEK=$(date -u +%G-W%V)
          CURRENT_SHA="${{ github.sha }}"

          LAST_VERSION="${{ steps.state.outputs.last_version }}"
          LAST_WEEK="${{ steps.state.outputs.last_week }}"
          LAST_SHA="${{ steps.state.outputs.last_sha }}"

          echo "🔍 Current ISO week: $CURRENT_WEEK (last release week recorded: ${LAST_WEEK:-none})"
          echo "🔍 Current version: $VERSION (last released version: ${LAST_VERSION:-none})"
          echo "🔍 Current SHA: $CURRENT_SHA (last released SHA: ${LAST_SHA:-none})"

          PROCEED=true
          REASON=""

          # --- Rule: hard branch gate ---
          if [ "${{ steps.branch_check.outputs.on_main }}" != "true" ]; then
            PROCEED=false
            REASON="not-on-main"
          fi

          # --- Rule: version file must resolve ---
          if [ -z "$VERSION" ]; then
            PROCEED=false
            REASON="no-version-resolved"
          fi

          # --- Rule: at most one release per ISO week, no matter how many
          # times this is triggered (manual dispatch cannot bypass it) ---
          if [ "$PROCEED" = "true" ] && [ -n "$LAST_WEEK" ] && [ "$LAST_WEEK" = "$CURRENT_WEEK" ]; then
            PROCEED=false
            REASON="already-released-this-week"
          fi

          # --- Rule: nothing new to ship — same version already released,
          # or HEAD hasn't moved since the last release ---
          if [ "$PROCEED" = "true" ] && [ -n "$LAST_VERSION" ] && [ "$LAST_VERSION" = "$VERSION" ]; then
            PROCEED=false
            REASON="version-unchanged-since-last-release"
          fi

          if [ "$PROCEED" = "true" ] && [ -n "$LAST_SHA" ] && [ "$LAST_SHA" = "$CURRENT_SHA" ]; then
            PROCEED=false
            REASON="no-new-commits-since-last-release"
          fi

          {
            echo "proceed=$PROCEED"
            echo "reason=$REASON"
            echo "version=$VERSION"
            echo "package_name=$PACKAGE"
          } >> "$GITHUB_OUTPUT"

          if [ "$PROCEED" = "true" ]; then
            echo "✅ Gate passed. Proceeding to build + deploy."
          else
            echo "⏭️ No-op ($REASON). Skipping build + deploy cleanly."
          fi

  # --- 2. BUILD + DEPLOY (only when the gate passes) ---
  deploy:
    name: 🚀 Build & Publish to Play Store
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    env:
      MONOREPO_PAT: ${{ secrets.MONOREPO_PAT }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Resolve deploy credentials with a per-secret fallback to the central
      # Occultation repo. Precedence:
      #   - JSON credentials (PLAY_STORE_SERVICE_ACCOUNT_JSON,
      #     GOOGLE_SERVICES_JSON): GitHub Actions secret -> dedicated JSON
      #     file in RokctAI/Occultation .env/ (play_store_service_account.json
      #     / google-services.json, fetched raw with MONOREPO_PAT) -> legacy
      #     base64 key in .env/production.env. The resolved JSON is written
      #     straight to a 0600 file under RUNNER_TEMP and only its PATH is
      #     exported (as <KEY>_FILE) — multi-line JSON cannot be add-masked
      #     line-safely, so the content is never echoed and never placed in
      #     GITHUB_ENV. These files hold private-key material and are removed
      #     by the always() cleanup step at the end of the job.
      #   - KEY_JKS / KEY_PASSWORD / ALIAS_PASSWORD: GitHub Actions secret ->
      #     same-named key in .env/production.env, masked before any use and
      #     exported only via GITHUB_ENV within this job.
      # Fetched files never leave this job (no job outputs, no artifacts).
      - name: Resolve Deploy Credentials
        env:
          SECRET_PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          SECRET_KEY_JKS: ${{ secrets.KEY_JKS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SECRET_ALIAS_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}
          SECRET_GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GH_TOKEN: ${{ secrets.MONOREPO_PAT }}
        run: |
          umask 077
          ENV_TMP="$RUNNER_TEMP/occultation-secrets.env"
          trap 'rm -f "$ENV_TMP"' EXIT

          fetch_env_file() {
            if [ -f "$ENV_TMP" ]; then
              return 0
            fi
            if [ -z "$GH_TOKEN" ]; then
              return 1
            fi
            if ! gh api "repos/RokctAI/Occultation/contents/.env/production.env" \
                 -H "Accept: application/vnd.github.v3.raw" > "$ENV_TMP" 2>/dev/null; then
              rm -f "$ENV_TMP"
              return 1
            fi
            sed -i 's/\r$//' "$ENV_TMP"
          }

          read_env_value() {
            { grep -m1 "^${1}=" "$ENV_TMP" || true; } | cut -d= -f2- \
              | sed -e 's/^"\(.*\)"$/\1/' -e "s/^'\(.*\)'\$/\1/"
          }

          # Fetch a raw file from Occultation straight to disk. The content is
          # never captured in a shell variable and never echoed.
          fetch_occultation_file() {
            local src="$1" dest="$2"
            if [ -z "$GH_TOKEN" ]; then
              return 1
            fi
            rm -f "$dest"
            if ! gh api "repos/RokctAI/Occultation/contents/${src}" \
                 -H "Accept: application/vnd.github.v3.raw" > "$dest" 2>/dev/null; then
              rm -f "$dest"
              return 1
            fi
          }

          # Write $1 (raw JSON or base64-encoded JSON) to file $2. Returns
          # non-zero (with $2 removed) if neither form yields valid JSON.
          write_json_value() {
            local value="$1" dest="$2"
            if printf '%s' "$value" | jq -e . >/dev/null 2>&1; then
              printf '%s' "$value" > "$dest"
            else
              printf '%s' "$value" | base64 --decode > "$dest" 2>/dev/null || true
            fi
            if ! jq -e . "$dest" >/dev/null 2>&1; then
              rm -f "$dest"
              return 1
            fi
          }

          # resolve_json KEY occultation-file dest-file
          # Secret -> dedicated Occultation JSON file -> legacy production.env
          # key. On success exports <KEY>_FILE=dest via GITHUB_ENV.
          resolve_json() {
            local key="$1" occ_file="$2" dest="$3" secret_var="SECRET_$1" value source=""
            value="${!secret_var}"
            if [ -n "$value" ]; then
              # Actions secrets are auto-masked by the runner already.
              if ! write_json_value "$value" "$dest"; then
                echo "::error::${key} GitHub Actions secret is set but is neither valid JSON nor base64-encoded JSON."
                exit 1
              fi
              source="github-secret"
            elif fetch_occultation_file "$occ_file" "$dest"; then
              if ! jq -e . "$dest" >/dev/null 2>&1; then
                rm -f "$dest"
                echo "::error::RokctAI/Occultation ${occ_file} was fetched but does not parse as JSON. Fix or remove that file."
                exit 1
              fi
              source="occultation-file ${occ_file}"
            elif fetch_env_file; then
              value="$(read_env_value "$key")"
              if [ -n "$value" ]; then
                # Single line by construction (grep -m1) — safe to mask as-is,
                # whether base64 or compact JSON.
                echo "::add-mask::$value"
                if ! write_json_value "$value" "$dest"; then
                  echo "::error::${key} from RokctAI/Occultation .env/production.env is neither valid JSON nor base64-encoded JSON. Prefer dropping the raw JSON file at ${occ_file} instead."
                  exit 1
                fi
                source="occultation-env (legacy)"
              fi
            fi
            if [ -n "$source" ]; then
              chmod 600 "$dest"
              echo "${key}_FILE=$dest" >> "$GITHUB_ENV"
              eval "RESOLVED_${key}=1"
              echo "🔑 $key resolved from $source."
            else
              echo "ℹ️ $key not available from GitHub secrets, RokctAI/Occultation ${occ_file}, or the legacy ${key}= key in .env/production.env."
            fi
          }

          resolve() {
            local key="$1" secret_var="SECRET_$1" value source
            value="${!secret_var}"
            source="github-secret"
            if [ -z "$value" ]; then
              if fetch_env_file; then
                value="$(read_env_value "$key")"
                source="occultation-env"
              fi
            fi
            if [ -n "$value" ]; then
              # Mask before the value can appear anywhere (GITHUB_ENV included).
              while IFS= read -r line; do
                if [ -n "$line" ]; then
                  echo "::add-mask::$line"
                fi
              done <<< "$value"
              {
                echo "${key}<<__ROKCT_SECRET_EOF__"
                echo "$value"
                echo "__ROKCT_SECRET_EOF__"
              } >> "$GITHUB_ENV"
              eval "RESOLVED_${key}=1"
              echo "🔑 $key resolved from $source."
            else
              echo "ℹ️ $key not available from GitHub secrets or Occultation production.env."
            fi
          }

          resolve_json PLAY_STORE_SERVICE_ACCOUNT_JSON ".env/play_store_service_account.json" "$RUNNER_TEMP/play-store-service-account.json"
          resolve_json GOOGLE_SERVICES_JSON ".env/google-services.json" "$RUNNER_TEMP/google-services.json"
          resolve KEY_JKS
          resolve KEY_PASSWORD
          resolve ALIAS_PASSWORD

          if [ -z "${RESOLVED_PLAY_STORE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::PLAY_STORE_SERVICE_ACCOUNT_JSON is not available. Set it as a GitHub Actions secret on the calling repo, or drop the service account JSON file at RokctAI/Occultation .env/play_store_service_account.json (or, legacy, a base64 PLAY_STORE_SERVICE_ACCOUNT_JSON= key in .env/production.env) and pass MONOREPO_PAT."
            exit 1
          fi

      - name: Fetch and Merge Private Repository
        shell: bash
        run: |
          if [ -f ".private_repo" ]; then
            REPO_NAME=$(tr -d '\r\n[:space:]' < .private_repo)
            if [ -n "$REPO_NAME" ]; then
              TOKEN="${{ secrets.MONOREPO_PAT || github.token }}"
              URL="https://x-access-token:${TOKEN}@github.com/${REPO_NAME}.git"
              if git clone --depth 1 "$URL" .private-temp; then
                mkdir -p .git/info
                (cd .private-temp && find . -type f) | sed 's|^\./||' >> .git/info/exclude
                rm -rf .private-temp/.git .private-temp/.github
                rsync -a .private-temp/ ./
                rm -rf .private-temp
              else
                echo "::warning::Failed to clone private repository $REPO_NAME."
              fi
            fi
          fi

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'zulu'
          java-version: ${{ inputs.java-version || '17' }}

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ inputs.flutter-channel }}
          flutter-version: ${{ inputs.flutter-version }}
          cache: true

      - name: Install Google Services JSON
        if: env.GOOGLE_SERVICES_JSON_FILE != ''
        run: |
          # GOOGLE_SERVICES_JSON_FILE is the already-validated JSON file
          # produced by the Resolve Deploy Credentials step.
          if [ -d "android" ] && [ ! -f "android/app/google-services.json" ]; then
            mkdir -p android/app
            install -m 600 "$GOOGLE_SERVICES_JSON_FILE" android/app/google-services.json
            echo "✅ google-services.json installed."
          fi

      - name: Decode Keystore
        if: env.KEY_JKS != ''
        run: |
          if [ ! -f "android/key.properties" ]; then
            mkdir -p android/app
            echo "$KEY_JKS" | base64 --decode > android/app/key.jks
            {
              echo "storePassword=$KEY_PASSWORD"
              echo "keyPassword=$ALIAS_PASSWORD"
              echo "keyAlias=upload"
              echo "storeFile=key.jks"
            } > android/key.properties
            echo "✅ Signing config generated from secrets."
          fi

      - name: Fetch Production Environment from Occultation
        if: env.MONOREPO_PAT != ''
        env:
          GH_TOKEN: ${{ env.MONOREPO_PAT }}
        run: |
          mkdir -p .env
          if gh api "repos/RokctAI/Occultation/contents/.env/production.env" -H "Accept: application/vnd.github.v3.raw" > ".env/production.env" 2>/dev/null; then
            if grep -q "##########END_FLUTTER##########" ".env/production.env"; then
              sed -i '1,/##########END_FLUTTER##########/!d' ".env/production.env"
            fi
            sed -i 's/\r$//' ".env/production.env"
            sed -i '/^[[:space:]]*#/d; /^[[:space:]]*$/d' ".env/production.env"
            echo "✅ .env/production.env ready."
          else
            echo "ℹ️ No production.env found in Occultation. Continuing without it."
            rm -f .env/production.env
          fi

      - name: Get Dependencies
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Android AppBundle
        id: build_aab
        run: |
          BUILD_ARGS=(--release)
          if [ -f .env/production.env ]; then
            BUILD_ARGS+=(--dart-define-from-file=.env/production.env)
          fi
          flutter build appbundle "${BUILD_ARGS[@]}"

          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "❌ AAB build failed or file not found."
            exit 1
          fi
          echo "aab_path=$AAB_PATH" >> "$GITHUB_OUTPUT"

      - name: Locate Play Store Service Account Key
        id: play_key
        run: |
          # PLAY_STORE_SERVICE_ACCOUNT_JSON_FILE was written (and validated as
          # JSON) by the Resolve Deploy Credentials step. Sanity-check it is
          # still there and still JSON without ever printing its content.
          KEY_PATH="$PLAY_STORE_SERVICE_ACCOUNT_JSON_FILE"
          if [ -z "$KEY_PATH" ] || ! jq -e . "$KEY_PATH" >/dev/null 2>&1; then
            echo "::error::Resolved Play Store service account key file is missing or not valid JSON (expected at \$RUNNER_TEMP/play-store-service-account.json)."
            exit 1
          fi
          echo "key_path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      # r0adkll/upload-google-play wraps the Google Play Developer API — this
      # is the standard, actively-maintained GitHub Action for this and
      # matches how this workspace already consumes third-party marketplace
      # actions for platform-specific steps (subosito/flutter-action,
      # actions/create-github-app-token) rather than shelling out to a
      # Ruby/fastlane toolchain that nothing else in this repo uses.
      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJson: ${{ steps.play_key.outputs.key_path }}
          packageName: ${{ needs.gate.outputs.package_name }}
          releaseFiles: ${{ steps.build_aab.outputs.aab_path }}
          track: ${{ inputs.track }}
          status: ${{ inputs.release_status }}
          # Release notes from the repo: marketing/store/whatsnew/ holds one
          # whatsnew-<BCP-47 locale> file per language (e.g. whatsnew-en-US,
          # no extension — the action's required naming). The empty string
          # when the directory is absent is fine: the action skips release
          # notes when the input has no value.
          whatsNewDirectory: ${{ hashFiles('marketing/store/whatsnew/*') != '' && 'marketing/store/whatsnew' || '' }}

      # The action above only ships the AAB. Store LISTING assets rendered
      # by the tour pipeline into the caller's checkout (this job's Checkout
      # Code step checks out the calling app repo, marketing/ included) are
      # pushed through the Google Play Edits API directly — Python +
      # google-api-python-client, matching this repo's tooling; still no
      # fastlane, for the same reason as above. The script maps
      # marketing/tour/store/ portrait stills -> phoneScreenshots (max 8,
      # skips logged; marketing/store/screenshots.txt optionally picks and
      # orders them), a 1024x500 image -> featureGraphic, a 512x512 image
      # -> icon, marketing/store/listing/<locale>/*.txt -> the listing's
      # title/short/full description text, and marketing/store/video.txt
      # (a YouTube URL — Play accepts no video file uploads) -> the
      # listing's promo-video field, and exits 0 cleanly when nothing
      # valid is found. The hashFiles gate skips the sparse checkout +
      # pip install entirely for apps that ship no marketing assets, so
      # their deploys run exactly as before.
      - name: Checkout Listing Assets Script
        if: hashFiles('marketing/tour/store/**', 'marketing/store/video.txt', 'marketing/store/listing/**') != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: RokctAI/shared-workflows
          token: ${{ github.token }}
          path: .github/shared-workflows
          sparse-checkout: scripts/play

      - name: Push Store Listing Assets
        if: hashFiles('marketing/tour/store/**', 'marketing/store/video.txt', 'marketing/store/listing/**') != ''
        env:
          PACKAGE_NAME: ${{ needs.gate.outputs.package_name }}
          PLAY_STORE_SERVICE_ACCOUNT_JSON_FILE: ${{ steps.play_key.outputs.key_path }}
        run: |
          python3 -m pip install --quiet google-api-python-client google-auth Pillow
          python3 .github/shared-workflows/scripts/play/upload_listing_assets.py \
            --app-dir . --language en-US
          rm -rf .github/shared-workflows

      - name: Cleanup Resolved Credential Files
        if: always()
        # Remove every credential file the resolve step may have written
        # (both hold private-key / API-key material).
        run: |
          rm -f "$RUNNER_TEMP/play-store-service-account.json" \
                "$RUNNER_TEMP/google-services.json"

  # --- 3. RECORD STATE (only after a successful publish) ---
  record-state:
    name: 📝 Record Release State
    needs: [gate, deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true

      - name: Determine Context
        run: |
          if [ "${{ github.repository }}" = "RokctAI/shared-workflows" ]; then
            echo "IS_SELF=true" >> "$GITHUB_ENV"
          else
            echo "IS_SELF=false" >> "$GITHUB_ENV"
          fi

      - name: Checkout Shared Workflows Actions
        if: env.IS_SELF == 'false'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: RokctAI/shared-workflows
          token: ${{ github.token }}
          path: .github/shared-workflows

      - name: Setup Identity (Local)
        if: env.IS_SELF == 'true'
        uses: ./.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Identity (Shared)
        if: env.IS_SELF == 'false'
        uses: ./.github/shared-workflows/.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Cleanup Shared Workflows Checkout
        if: always() && env.IS_SELF == 'false'
        run: rm -rf .github/shared-workflows

      - name: Write & Commit State Marker (PR-First)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          STATE_FILE="${{ inputs.state_file }}"
          mkdir -p "$(dirname "$STATE_FILE")"

          jq -n \
            --arg version "${{ needs.gate.outputs.version }}" \
            --arg package "${{ needs.gate.outputs.package_name }}" \
            --arg week "$(date -u +%G-W%V)" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sha "${{ github.sha }}" \
            --arg track "${{ inputs.track }}" \
            '{last_version: $version, package_name: $package, last_release_iso_week: $week, last_release_date: $date, last_release_sha: $sha, track: $track}' \
            > "$STATE_FILE"

          echo "📄 State marker written:"
          cat "$STATE_FILE"

          if [[ -z "$(git status -s "$STATE_FILE")" ]]; then
            echo "⏭️ No change to commit."
            exit 0
          fi

          BRANCH_NAME="play-store-release-state-${{ github.run_id }}"
          git checkout -b "$BRANCH_NAME"
          git add "$STATE_FILE"
          git commit -m "chore(play-store): record release ${{ needs.gate.outputs.version }} [skip ci]"

          if git push -u origin "$BRANCH_NAME"; then
            gh pr create --title "🚀 Play Store: recorded release ${{ needs.gate.outputs.version }}" \
              --body "Automated marker update after publishing ${{ needs.gate.outputs.version }} to the '${{ inputs.track }}' track. Merge to keep the weekly-limit and no-op checks accurate." \
              --head "$BRANCH_NAME" --base "${{ github.ref_name }}" || echo "PR already exists."
          else
            echo "⚠️ Could not push state marker branch."
          fi
