#
# Universal Play Store Deploy
#
# Reusable workflow that publishes a Flutter app's Android App Bundle to the
# Google Play Developer API. App-agnostic — a specific app repo owns the
# actual triggers (weekly cron + workflow_dispatch) and calls this workflow
# with `uses: RokctAI/shared-workflows/.github/workflows/universal-play-deploy.yml@main`,
# matching the pattern already used for universal-release.yml (see
# datafy/.github/workflows/release.yml).
#
# Hard rules enforced here (not just documented — actually checked):
#   1. Only ever deploys from the `main` branch (checked explicitly, not just
#      inferred from trigger).
#   2. At most one release per ISO week, even across repeated manual
#      dispatches. State is tracked in a committed marker file
#      (.github/.play-store-release-state.json), not just relied on cron.
#   3. No-ops cleanly if there is nothing new to ship (no version bump / no
#      new commits since the last recorded deploy).
#   4. REFUSES to deploy when that marker is missing, unreadable, or
#      incomplete. Every rule in 2 and 3 is written as "last value is set AND
#      matches", so an absent marker leaves all of them inert and the gate
#      would pass anything. An unknown state is not permission: it is refused
#      (red, with the file named), and the one deploy that legitimately has no
#      marker is authorised deliberately via the `allow_first_release` input.
#      That first deploy also REPLACES every listing image Play serves, which
#      for an app whose screenshots were set by hand in Play Console is the
#      only copy of them.

name: Universal Play Store Deploy

permissions: write-all
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PIP_BREAK_SYSTEM_PACKAGES: 1

on:
  workflow_call:
    inputs:
      version_file:
        required: false
        type: string
        default: "version.json"
        description: 'Path to the file holding the app version. version.json ({"version": "X.Y.Z"}) is the source of truth for what ships - pubspec.yaml version: is not, and is no longer read by default.'
      package_name:
        required: false
        type: string
        default: ""
        description: "Android applicationId. If empty, it is auto-detected from android/app/build.gradle"
      track:
        required: false
        type: string
        default: "internal"
        description: "Play Console track to publish to: internal, alpha, beta, or production"
      release_status:
        required: false
        type: string
        default: "completed"
        description: "Release status passed to the Play Developer API: draft, inProgress, halted, or completed"
      app-type:
        required: false
        type: string
        description: "App role: customer, driver, manager, pos (used to resolve env/package the same way universal-flutter-build does)"
      flutter-channel:
        required: false
        type: string
        default: 'stable'
      flutter-version:
        required: false
        type: string
        # Pinned: Flutter 3.47.0 + analyzer <8 (freezed 2.x) hangs build_runner; remove once SDKs move to freezed 3.x / analyzer 8.
        default: '3.44.9'
      java-version:
        required: false
        type: string
        default: '17'
      state_file:
        required: false
        type: string
        default: ".github/.play-store-release-state.json"
        description: "Path to the committed marker file used for weekly-limit + no-op tracking"
      allow_first_release:
        required: false
        type: boolean
        default: false
        description: >-
          Authorise ONE deploy with no usable release-state marker. Without it a
          missing or unreadable marker REFUSES the deploy instead of being read as
          'first-ever release'. Set it deliberately, for one run: that run also
          replaces every listing image Play currently serves for this app with
          whatever is in the repo, which destroys screenshots set by hand in Play
          Console.
    secrets:
      # Deploy credentials resolve with a per-secret fallback chain. A GitHub
      # Actions secret always wins. For the two JSON credentials the next stop
      # is a dedicated JSON file in RokctAI/Occultation .env/ (fetched with
      # MONOREPO_PAT), and only then the legacy base64 key in
      # .env/production.env:
      #   PLAY_STORE_SERVICE_ACCOUNT_JSON -> .env/play_store_service_account.json
      #   GOOGLE_SERVICES_JSON            -> .env/google-services.json
      # KEY_JKS / KEY_PASSWORD / ALIAS_PASSWORD still resolve secret-first,
      # then from the same-named key in .env/production.env. Fetched files
      # never leave the deploy job; JSON credentials are written straight to
      # 0600 temp files (never echoed, deleted before the job ends) and
      # env-file values are masked before use.
      PLAY_STORE_SERVICE_ACCOUNT_JSON:
        required: false
        description: "Base64-encoded (or raw) Google Play service account JSON key with Release Manager access. If unset, fetched from RokctAI/Occultation .env/play_store_service_account.json, falling back to the legacy base64 PLAY_STORE_SERVICE_ACCOUNT_JSON key in .env/production.env (both require MONOREPO_PAT)"
      KEY_JKS:
        required: false
      KEY_PASSWORD:
        required: false
      ALIAS_PASSWORD:
        required: false
      GOOGLE_SERVICES_JSON:
        required: false
      MONOREPO_PAT:
        required: false
      PRODUCTION_ENV:
        required: false
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

jobs:
  # --- 1. THE GATE: branch check + weekly-limit + "is there anything new" check ---
  gate:
    name: 🚦 Release Gate
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      upload_aab: ${{ steps.decide.outputs.upload_aab }}
      reason: ${{ steps.decide.outputs.reason }}
      version: ${{ steps.decide.outputs.version }}
      package_name: ${{ steps.decide.outputs.package_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      # Hard gate: never deploy from anything but main, regardless of how
      # this workflow was invoked (schedule, workflow_dispatch, whatever the
      # caller wires up).
      - name: Verify Branch Is Main
        id: branch_check
        run: |
          BRANCH="${{ github.ref_name }}"
          echo "🔍 Triggered on branch: $BRANCH"
          if [ "$BRANCH" != "main" ]; then
            echo "❌ Play Store deploys only run from 'main'. Refusing to proceed on '$BRANCH'."
            echo "on_main=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ On main. Continuing."
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          fi

      # --- VERSION RESOLUTION ---
      # pubspec.yaml's `version:` is no longer what ships; version.json is, and
      # it is read here through the same check-version action the release lane
      # uses (universal-release.yml's resolve-version job) instead of grepping
      # pubspec by hand. That makes the
      # "version-unchanged-since-last-release" rule below mean exactly what the
      # release tag means, rather than comparing against a string nothing
      # stamps onto a binary any more.
      - name: Determine Context
        run: |
          if [ "${{ github.repository }}" = "RokctAI/shared-workflows" ]; then
            echo "IS_SELF=true" >> "$GITHUB_ENV"
          else
            echo "IS_SELF=false" >> "$GITHUB_ENV"
          fi

      - name: Checkout Shared Workflows Actions
        if: env.IS_SELF == 'false'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: RokctAI/shared-workflows
          path: .github/shared-workflows
          token: ${{ github.token }}

      # continue-on-error on both: check-version exits non-zero when the file
      # is missing or unparseable, and that has always been a clean no-op here
      # (the no-version-resolved rule in Decide), not a red run. Failing the
      # step leaves the output empty, which is exactly what that rule reads.
      - name: Get Version (Local)
        if: env.IS_SELF == 'true'
        id: version_local
        continue-on-error: true
        uses: ./.github/actions/check-version
        with:
          file_path: ${{ inputs.version_file }}

      - name: Get Version (Shared)
        if: env.IS_SELF == 'false'
        id: version_shared
        continue-on-error: true
        uses: ./.github/shared-workflows/.github/actions/check-version
        with:
          file_path: ${{ inputs.version_file }}

      - name: Resolve Current Version
        id: current_version
        run: |
          # Exactly one of the two steps above ran; the other contributes an
          # empty string. Both empty means nothing resolved.
          VERSION="${{ steps.version_local.outputs.version }}${{ steps.version_shared.outputs.version }}"
          FILE="${{ steps.version_local.outputs.file }}${{ steps.version_shared.outputs.file }}"
          if [ -z "$VERSION" ]; then
            echo "⚠️ No version resolved from ${{ inputs.version_file }}."
          else
            echo "📦 Current version: $VERSION (from $FILE)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve Package Name
        id: pkg
        run: |
          PKG="${{ inputs.package_name }}"
          if [ -z "$PKG" ] && [ -f "android/app/build.gradle" ]; then
            PKG=$(grep 'applicationId' android/app/build.gradle | head -n 1 | sed "s/.*applicationId *['\" ]*\([^'\" ]*\)['\" ]*.*/\1/")
          fi
          echo "📦 Package: $PKG"
          echo "package_name=$PKG" >> "$GITHUB_OUTPUT"

      - name: Read Release State Marker
        id: state
        run: |
          STATE_FILE="${{ inputs.state_file }}"
          # Three outcomes, not two. The marker is either fully readable
          # (state_known=true, and the Decide rules below have real values to
          # compare against) or it is NOT, and "not" is reported as such rather
          # than as a set of empty strings. Empty strings are what made every
          # rule below inert: each is guarded by `[ -n "$LAST_..." ]`, so with
          # nothing read there is nothing any of them can refuse.
          LAST_VERSION=""
          LAST_WEEK=""
          LAST_SHA=""
          STATE_KNOWN=false
          STATE_PROBLEM=""
          if [ ! -f "$STATE_FILE" ]; then
            STATE_PROBLEM="there is no release-state marker at $STATE_FILE"
          elif ! jq -e . "$STATE_FILE" > /dev/null 2>&1; then
            STATE_PROBLEM="the release-state marker $STATE_FILE could not be read as JSON"
          else
            LAST_VERSION=$(jq -r '.last_version // ""' "$STATE_FILE")
            LAST_WEEK=$(jq -r '.last_release_iso_week // ""' "$STATE_FILE")
            LAST_SHA=$(jq -r '.last_release_sha // ""' "$STATE_FILE")
            if [ -z "$LAST_VERSION" ] || [ -z "$LAST_WEEK" ] || [ -z "$LAST_SHA" ]; then
              # A partial marker is not a lesser marker - each missing field
              # silently switches OFF the rule that depends on it.
              STATE_PROBLEM="the release-state marker $STATE_FILE is missing last_version, last_release_iso_week or last_release_sha"
            else
              echo "📖 Found existing state marker: $STATE_FILE"
              cat "$STATE_FILE"
              STATE_KNOWN=true
            fi
          fi
          if [ "$STATE_KNOWN" != "true" ]; then
            echo "📖 Release state is UNKNOWN: $STATE_PROBLEM"
          fi
          {
            echo "last_version=$LAST_VERSION"
            echo "last_week=$LAST_WEEK"
            echo "last_sha=$LAST_SHA"
            echo "state_known=$STATE_KNOWN"
            echo "state_problem=$STATE_PROBLEM"
          } >> "$GITHUB_OUTPUT"

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.current_version.outputs.version }}"
          PACKAGE="${{ steps.pkg.outputs.package_name }}"
          CURRENT_WEEK=$(date -u +%G-W%V)
          CURRENT_SHA="${{ github.sha }}"

          LAST_VERSION="${{ steps.state.outputs.last_version }}"
          LAST_WEEK="${{ steps.state.outputs.last_week }}"
          LAST_SHA="${{ steps.state.outputs.last_sha }}"
          STATE_KNOWN="${{ steps.state.outputs.state_known }}"
          STATE_PROBLEM="${{ steps.state.outputs.state_problem }}"
          STATE_FILE="${{ inputs.state_file }}"
          ALLOW_FIRST="${{ inputs.allow_first_release }}"

          echo "🔍 Current ISO week: $CURRENT_WEEK (last release week recorded: ${LAST_WEEK:-none})"
          echo "🔍 Current version: $VERSION (last released version: ${LAST_VERSION:-none})"
          echo "🔍 Current SHA: $CURRENT_SHA (last released SHA: ${LAST_SHA:-none})"

          # PROCEED gates the whole deploy job (listing assets included).
          # UPLOAD_AAB gates only the binary: the upload, the release-state marker.
          # The listing (graphics, text, screenshots) still goes out when only
          # the binary is held back, so graphics-only changes ship without a
          # new version.
          PROCEED=true
          UPLOAD_AAB=true
          REASON=""

          # --- Rule: hard branch gate ---
          if [ "${{ steps.branch_check.outputs.on_main }}" != "true" ]; then
            PROCEED=false
            REASON="not-on-main"
          fi

          # --- Rule: version file must resolve ---
          if [ -z "$VERSION" ]; then
            PROCEED=false
            REASON="no-version-resolved"
          fi

          # --- Rule: the release state must be KNOWN ---
          # Every rule below is "the last value is set AND matches", so an
          # absent marker leaves all of them inert and this gate would wave
          # through an unattended, unreviewed store push - which also replaces
          # every listing image Play is serving. A state nobody can read is not
          # a first-ever release; it is an unknown, and an unknown is refused.
          # `allow_first_release` is the only way through, and it is a
          # deliberate, per-run decision by a person.
          # Guarded like the rules below it, so a reason already established
          # (not-on-main, no-version-resolved) keeps its own clean no-op and
          # this refusal only ever speaks for a run that was otherwise going
          # to deploy.
          if [ "$PROCEED" = "true" ] && [ "$STATE_KNOWN" != "true" ]; then
            if [ "$ALLOW_FIRST" = "true" ]; then
              echo "::warning::allow_first_release is set, so this run proceeds with an unknown release state ($STATE_PROBLEM). It will REPLACE every listing image Play currently serves for this app with what is in the repo."
            else
              PROCEED=false
              REASON="release-state-unknown"
            fi
          fi

          # --- Rule: at most one release per ISO week, no matter how many
          # times this is triggered (manual dispatch cannot bypass it) ---
          if [ "$PROCEED" = "true" ] && [ -n "$LAST_WEEK" ] && [ "$LAST_WEEK" = "$CURRENT_WEEK" ]; then
            UPLOAD_AAB=false
            REASON="already-released-this-week"
          fi

          # --- Rule: nothing new to ship — same version already released,
          # or HEAD hasn't moved since the last release ---
          if [ "$PROCEED" = "true" ] && [ -n "$LAST_VERSION" ] && [ "$LAST_VERSION" = "$VERSION" ]; then
            UPLOAD_AAB=false
            REASON="version-unchanged-since-last-release"
            echo "::notice::version.json is still $VERSION, the version already released. The AAB is not uploaded; listing assets still are."
          fi

          if [ "$PROCEED" = "true" ] && [ -n "$LAST_SHA" ] && [ "$LAST_SHA" = "$CURRENT_SHA" ]; then
            PROCEED=false
            REASON="no-new-commits-since-last-release"
          fi

          # --- Rule: the upload is the latest published release's AAB (see the
          # deploy job), so that release must be the version being decided on,
          # and it must not be the release already sent to Play. Otherwise a
          # run would re-send an old build or ship a build that does not match
          # version.json. Both refuse as no-ops, with a warning, not a deploy.
          if [ "$PROCEED" = "true" ] && [ "$UPLOAD_AAB" = "true" ]; then
            LATEST_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
            LATEST_VERSION="${LATEST_TAG#v}"
            if [ -z "$LATEST_TAG" ]; then
              UPLOAD_AAB=false
              REASON="no-published-release"
            elif [ "$LATEST_VERSION" != "$VERSION" ]; then
              UPLOAD_AAB=false
              REASON="release-version-mismatch"
              echo "::warning::Latest published release is $LATEST_TAG but version.json says $VERSION. Not uploading the AAB: it would carry $LATEST_TAG's build. Publish a v$VERSION release first. Listing assets still go out."
            elif [ -n "$LAST_VERSION" ] && [ "$LAST_VERSION" = "$LATEST_VERSION" ]; then
              UPLOAD_AAB=false
              REASON="release-already-deployed"
            fi
          fi

          {
            echo "proceed=$PROCEED"
            echo "upload_aab=$UPLOAD_AAB"
            echo "reason=$REASON"
            echo "version=$VERSION"
            echo "package_name=$PACKAGE"
          } >> "$GITHUB_OUTPUT"

          if [ "$PROCEED" = "true" ]; then
            echo "✅ Gate passed. Proceeding to build + deploy."
          elif [ "$REASON" = "release-state-unknown" ]; then
            # RED, not a clean no-op. The other reasons mean "nothing to do";
            # this one means "I do not know what has already been released",
            # and a silent green would leave that sitting unnoticed until a
            # credential fix turns it into a live store push.
            echo "::error::Refusing to deploy: $STATE_PROBLEM, so this workflow does not know what has already been released to Play. It is refusing rather than guessing - a missing marker is NOT a first-ever release. Publishing would also replace every listing image Play currently serves for this app. If this really is the first deploy, call this workflow once with allow_first_release: true (and let the record-state job land $STATE_FILE on main so later runs are gated normally)."
            exit 1
          else
            echo "⏭️ No-op ($REASON). Skipping build + deploy cleanly."
          fi

  # --- 2. BUILD + DEPLOY (only when the gate passes) ---
  deploy:
    name: 🚀 Build & Publish to Play Store
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    outputs:
      listing_state_changed: ${{ steps.listing.outputs.state_changed }}
    env:
      MONOREPO_PAT: ${{ secrets.MONOREPO_PAT }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Resolve deploy credentials with a per-secret fallback to the central
      # Occultation repo. Precedence:
      #   - JSON credentials (PLAY_STORE_SERVICE_ACCOUNT_JSON,
      #     GOOGLE_SERVICES_JSON): GitHub Actions secret -> dedicated JSON
      #     file in RokctAI/Occultation .env/ (play_store_service_account.json
      #     / google-services.json, fetched raw with MONOREPO_PAT) -> legacy
      #     base64 key in .env/production.env. The resolved JSON is written
      #     straight to a 0600 file under RUNNER_TEMP and only its PATH is
      #     exported (as <KEY>_FILE) — multi-line JSON cannot be add-masked
      #     line-safely, so the content is never echoed and never placed in
      #     GITHUB_ENV. These files hold private-key material and are removed
      #     by the always() cleanup step at the end of the job.
      #   - KEY_JKS / KEY_PASSWORD / ALIAS_PASSWORD: GitHub Actions secret ->
      #     same-named key in .env/production.env, masked before any use and
      #     exported only via GITHUB_ENV within this job.
      # Fetched files never leave this job (no job outputs, no artifacts).
      - name: Resolve Deploy Credentials
        env:
          SECRET_PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          SECRET_KEY_JKS: ${{ secrets.KEY_JKS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SECRET_ALIAS_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}
          SECRET_GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GH_TOKEN: ${{ secrets.MONOREPO_PAT }}
        run: |
          umask 077
          ENV_TMP="$RUNNER_TEMP/occultation-secrets.env"
          trap 'rm -f "$ENV_TMP"' EXIT

          fetch_env_file() {
            if [ -f "$ENV_TMP" ]; then
              return 0
            fi
            if [ -z "$GH_TOKEN" ]; then
              return 1
            fi
            if ! gh api "repos/RokctAI/Occultation/contents/.env/production.env" \
                 -H "Accept: application/vnd.github.v3.raw" > "$ENV_TMP" 2>/dev/null; then
              rm -f "$ENV_TMP"
              return 1
            fi
            sed -i 's/\r$//' "$ENV_TMP"
          }

          read_env_value() {
            { grep -m1 "^${1}=" "$ENV_TMP" || true; } | cut -d= -f2- \
              | sed -e 's/^"\(.*\)"$/\1/' -e "s/^'\(.*\)'\$/\1/"
          }

          # Fetch a raw file from Occultation straight to disk. The content is
          # never captured in a shell variable and never echoed.
          fetch_occultation_file() {
            local src="$1" dest="$2"
            if [ -z "$GH_TOKEN" ]; then
              return 1
            fi
            rm -f "$dest"
            if ! gh api "repos/RokctAI/Occultation/contents/${src}" \
                 -H "Accept: application/vnd.github.v3.raw" > "$dest" 2>/dev/null; then
              rm -f "$dest"
              return 1
            fi
          }

          # Write $1 (raw JSON or base64-encoded JSON) to file $2. Returns
          # non-zero (with $2 removed) if neither form yields valid JSON.
          write_json_value() {
            local value="$1" dest="$2"
            if printf '%s' "$value" | jq -e . >/dev/null 2>&1; then
              printf '%s' "$value" > "$dest"
            else
              printf '%s' "$value" | base64 --decode > "$dest" 2>/dev/null || true
            fi
            if ! jq -e . "$dest" >/dev/null 2>&1; then
              rm -f "$dest"
              return 1
            fi
          }

          # resolve_json KEY occultation-file dest-file
          # Secret -> dedicated Occultation JSON file -> legacy production.env
          # key. On success exports <KEY>_FILE=dest via GITHUB_ENV.
          resolve_json() {
            local key="$1" occ_file="$2" dest="$3" secret_var="SECRET_$1" value source=""
            value="${!secret_var}"
            if [ -n "$value" ]; then
              # Actions secrets are auto-masked by the runner already.
              if ! write_json_value "$value" "$dest"; then
                echo "::error::${key} GitHub Actions secret is set but is neither valid JSON nor base64-encoded JSON."
                exit 1
              fi
              source="github-secret"
            elif fetch_occultation_file "$occ_file" "$dest"; then
              if ! jq -e . "$dest" >/dev/null 2>&1; then
                rm -f "$dest"
                echo "::error::RokctAI/Occultation ${occ_file} was fetched but does not parse as JSON. Fix or remove that file."
                exit 1
              fi
              source="occultation-file ${occ_file}"
            elif fetch_env_file; then
              value="$(read_env_value "$key")"
              if [ -n "$value" ]; then
                # Single line by construction (grep -m1) — safe to mask as-is,
                # whether base64 or compact JSON.
                echo "::add-mask::$value"
                if ! write_json_value "$value" "$dest"; then
                  echo "::error::${key} from RokctAI/Occultation .env/production.env is neither valid JSON nor base64-encoded JSON. Prefer dropping the raw JSON file at ${occ_file} instead."
                  exit 1
                fi
                source="occultation-env (legacy)"
              fi
            fi
            if [ -n "$source" ]; then
              chmod 600 "$dest"
              echo "${key}_FILE=$dest" >> "$GITHUB_ENV"
              eval "RESOLVED_${key}=1"
              echo "🔑 $key resolved from $source."
            else
              echo "ℹ️ $key not available from GitHub secrets, RokctAI/Occultation ${occ_file}, or the legacy ${key}= key in .env/production.env."
            fi
          }

          resolve() {
            local key="$1" secret_var="SECRET_$1" value source
            value="${!secret_var}"
            source="github-secret"
            if [ -z "$value" ]; then
              if fetch_env_file; then
                value="$(read_env_value "$key")"
                source="occultation-env"
              fi
            fi
            if [ -n "$value" ]; then
              # Mask before the value can appear anywhere (GITHUB_ENV included).
              while IFS= read -r line; do
                if [ -n "$line" ]; then
                  echo "::add-mask::$line"
                fi
              done <<< "$value"
              {
                echo "${key}<<__ROKCT_SECRET_EOF__"
                echo "$value"
                echo "__ROKCT_SECRET_EOF__"
              } >> "$GITHUB_ENV"
              eval "RESOLVED_${key}=1"
              echo "🔑 $key resolved from $source."
            else
              echo "ℹ️ $key not available from GitHub secrets or Occultation production.env."
            fi
          }

          resolve_json PLAY_STORE_SERVICE_ACCOUNT_JSON ".env/play_store_service_account.json" "$RUNNER_TEMP/play-store-service-account.json"
          resolve_json GOOGLE_SERVICES_JSON ".env/google-services.json" "$RUNNER_TEMP/google-services.json"
          resolve KEY_JKS
          resolve KEY_PASSWORD
          resolve ALIAS_PASSWORD

          if [ -z "${RESOLVED_PLAY_STORE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::PLAY_STORE_SERVICE_ACCOUNT_JSON is not available. Set it as a GitHub Actions secret on the calling repo, or drop the service account JSON file at RokctAI/Occultation .env/play_store_service_account.json (or, legacy, a base64 PLAY_STORE_SERVICE_ACCOUNT_JSON= key in .env/production.env) and pass MONOREPO_PAT."
            exit 1
          fi

      - name: Fetch and Merge Private Repository
        shell: bash
        run: |
          if [ -f ".private_repo" ]; then
            REPO_NAME=$(tr -d '\r\n[:space:]' < .private_repo)
            if [ -n "$REPO_NAME" ]; then
              TOKEN="${{ secrets.MONOREPO_PAT || github.token }}"
              URL="https://x-access-token:${TOKEN}@github.com/${REPO_NAME}.git"
              if git clone --depth 1 "$URL" .private-temp; then
                mkdir -p .git/info
                (cd .private-temp && find . -type f) | sed 's|^\./||' >> .git/info/exclude
                rm -rf .private-temp/.git .private-temp/.github
                rsync -a .private-temp/ ./
                rm -rf .private-temp
              else
                echo "::warning::Failed to clone private repository $REPO_NAME."
              fi
            fi
          fi

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'zulu'
          java-version: ${{ inputs.java-version || '17' }}

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ inputs.flutter-channel }}
          flutter-version: ${{ inputs.flutter-version }}
          cache: true

      - name: Install Google Services JSON
        if: env.GOOGLE_SERVICES_JSON_FILE != ''
        run: |
          # GOOGLE_SERVICES_JSON_FILE is the already-validated JSON file
          # produced by the Resolve Deploy Credentials step.
          if [ -d "android" ] && [ ! -f "android/app/google-services.json" ]; then
            mkdir -p android/app
            install -m 600 "$GOOGLE_SERVICES_JSON_FILE" android/app/google-services.json
            echo "✅ google-services.json installed."
          fi

      - name: Decode Keystore
        if: env.KEY_JKS != ''
        run: |
          if [ ! -f "android/key.properties" ]; then
            mkdir -p android/app
            echo "$KEY_JKS" | base64 --decode > android/app/key.jks
            {
              echo "storePassword=$KEY_PASSWORD"
              echo "keyPassword=$ALIAS_PASSWORD"
              echo "keyAlias=upload"
              echo "storeFile=key.jks"
            } > android/key.properties
            echo "✅ Signing config generated from secrets."
          fi

      - name: Fetch Production Environment from Occultation
        if: env.MONOREPO_PAT != ''
        env:
          GH_TOKEN: ${{ env.MONOREPO_PAT }}
        run: |
          mkdir -p .env
          if gh api "repos/RokctAI/Occultation/contents/.env/production.env" -H "Accept: application/vnd.github.v3.raw" > ".env/production.env" 2>/dev/null; then
            if grep -q "##########END_FLUTTER##########" ".env/production.env"; then
              sed -i '1,/##########END_FLUTTER##########/!d' ".env/production.env"
            fi
            sed -i 's/\r$//' ".env/production.env"
            sed -i '/^[[:space:]]*#/d; /^[[:space:]]*$/d' ".env/production.env"
            # Sticks only (Ray, 2026-11-27): apps read WEB_URL; Sticks takes it from STICKS_WEB_URL.
            if [ "$(cat .rokct/config/app_type 2>/dev/null)" = "sticks" ] && grep -q '^STICKS_WEB_URL=' .env/production.env; then
              sed -i '/^WEB_URL=/d' .env/production.env
              sed -n 's/^STICKS_WEB_URL=/WEB_URL=/p' .env/production.env >> .env/production.env
            fi
            echo "✅ .env/production.env ready."
          else
            echo "ℹ️ No production.env found in Occultation. Continuing without it."
            rm -f .env/production.env
          fi

      # Shell apps declare path dependencies into .rokct/cache/, which exist
      # only after the SDK composer runs. Without this, `flutter pub get` fails
      # on every composed shell (sticks 2026-11-27: telemetry_sdk not found).
      # Same chain as universal-release.yml's compose step.
      - name: Compose SDK Modules (If Shell App)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          if [ ! -f "composer.json" ]; then
            echo "Not a composed shell app (no composer.json). Skipping composition."
            exit 0
          fi
          if [ ! -f ".rokct/skills/.rok/flutter/scripts/compose.py" ] && [ -f ".rokct/initiate.py" ]; then
            python3 .rokct/initiate.py
          fi
          if [ -f ".rokct/skills/.rok/flutter/scripts/compose.py" ]; then
            python3 .rokct/skills/.rok/flutter/scripts/compose.py
          elif [ -f ".rokct/skills/flutter/scripts/compose.py" ]; then
            python3 .rokct/skills/flutter/scripts/compose.py
          elif [ -f ".rokct/compose.py" ]; then
            python3 .rokct/compose.py
          else
            echo "::error::composer.json present but no composer found."
            exit 1
          fi

      - name: Get Dependencies
        run: |
          flutter pub get
          # build_runner >=2.15 AOT-compiles builders via 'dart compile',
          # which refuses to run when any resolved package ships a
          # native-asset build hook ("'dart compile' does not support build
          # hooks"). objective_c (transitive via path_provider_foundation)
          # ships one, so this lane is exposed on a plain app checkout.
          # --force-jit avoids it. Unlike the composing lanes, this job never
          # runs the SDK composer, so nothing earlier proves the flag is
          # supported -- and the composer would not prove it anyway, since it
          # falls back on an unrecognised flag rather than failing. Hence the
          # explicit fallback for older build_runner versions here.
          if ! dart run build_runner build --force-jit --delete-conflicting-outputs > build_runner_log.txt 2>&1; then
            if grep -q 'Could not find an option named' build_runner_log.txt; then
              echo 'build_runner does not recognize --force-jit (older version); retrying with plain build'
              dart run build_runner build --delete-conflicting-outputs >> build_runner_log.txt 2>&1
            else
              tail -n 100 build_runner_log.txt
              exit 1
            fi
          fi

      # --- BUILD STAMPING ---
      # pubspec.yaml's `version:` is no longer what ships; version.json is,
      # read here through the same check-version action the gate and the
      # release lane use, and stamped onto the AAB with --build-name. Nothing
      # rewrites pubspec.yaml: the flutter flags override whatever it still
      # says, so the uploaded bundle carries the resolved version instead of a
      # frozen one.
      # --build-number is Android's versionCode, set to UTC minutes since the
      # epoch so every upload is strictly newer than the one Play already
      # has — Play rejects a versionCode it has seen before, which is exactly
      # why a frozen pubspec "+1" could only ever be published once.
      - name: Determine Context
        run: |
          if [ "${{ github.repository }}" = "RokctAI/shared-workflows" ]; then
            echo "IS_SELF=true" >> "$GITHUB_ENV"
          else
            echo "IS_SELF=false" >> "$GITHUB_ENV"
          fi

      - name: Checkout Shared Workflows Actions
        if: env.IS_SELF == 'false'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: RokctAI/shared-workflows
          path: .github/shared-workflows
          token: ${{ github.token }}

      - name: Get Version (Local)
        if: env.IS_SELF == 'true'
        id: version_local
        uses: ./.github/actions/check-version
        with:
          file_path: ${{ inputs.version_file }}

      - name: Get Version (Shared)
        if: env.IS_SELF == 'false'
        id: version_shared
        uses: ./.github/shared-workflows/.github/actions/check-version
        with:
          file_path: ${{ inputs.version_file }}

      # Deploy the AAB that universal-release.yml already built and attached to
      # the latest published release, instead of building it again. A release is
      # the build that was tested and shipped, so the store receives those same
      # bytes. Drafts and pre-releases are skipped.
      - name: Download Latest Release AAB
        id: build_aab
        if: needs.gate.outputs.upload_aab == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')
          if [ -z "$TAG" ]; then
            echo "::error::No published release was found in $GITHUB_REPOSITORY, so there is no AAB to deploy."
            exit 1
          fi
          mkdir -p build/deploy
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.aab' --dir build/deploy --clobber
          COUNT=$(find build/deploy -maxdepth 1 -type f -name '*.aab' | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Release $TAG has $COUNT .aab assets; expected exactly one."
            exit 1
          fi
          AAB_PATH=$(ls build/deploy/*.aab)
          echo "Deploying $AAB_PATH from release $TAG"
          echo "aab_path=$AAB_PATH" >> "$GITHUB_OUTPUT"

          # The release may carry a What's New written from its release notes
          # (universal-release). Best-effort: no asset means no What's New here.
          mkdir -p build/whatsnew
          if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'whatsnew-en-US.txt' --dir build/whatsnew --clobber 2>/dev/null; then
            mv build/whatsnew/whatsnew-en-US.txt build/whatsnew/whatsnew-en-US
            echo "Release $TAG carries a What's New asset."
          else
            echo "Release $TAG has no What's New asset."
          fi

      # Which What's New the upload sends. The repo file wins only when it is a
      # real note: marketing/store/whatsnew/whatsnew-en-US often starts as a
      # template, and a template must not reach users as release notes. The
      # template is identified by digest of its normalized text (CRLF to LF,
      # trailing whitespace and blank lines removed), so editing it to a real
      # note switches it on without any other change.
      - name: Resolve What's New Source
        id: whatsnew
        if: needs.gate.outputs.upload_aab == 'true'
        run: |
          python3 - <<'PY'
          import hashlib
          import os

          # Digest of the template text marketing/store/whatsnew/whatsnew-en-US
          # ships with: "Latest lessons, performance improvements and fixes."
          TEMPLATE_SHA256 = "449461baf4099a6dc56c760dfc861d7355823a57792e54563c648b7e8c5da43b"
          REPO_FILE = "marketing/store/whatsnew/whatsnew-en-US"
          RELEASE_DIR = "build/whatsnew"

          def normalized_digest(path):
              with open(path, "rb") as handle:
                  text = handle.read().decode("utf-8").replace("\r\n", "\n")
              lines = [line.rstrip() for line in text.split("\n")]
              while lines and lines[-1] == "":
                  lines.pop()
              return hashlib.sha256("\n".join(lines).encode("utf-8")).hexdigest()

          def real_text(path):
              # Lines that are not blank and not "#" comments. A template that is
              # only comments (the app template's placeholder) has none, so it is unset.
              with open(path, "rb") as handle:
                  text = handle.read().decode("utf-8").replace("\r\n", "\n")
              return [line.strip() for line in text.split("\n")
                      if line.strip() and not line.lstrip().startswith("#")]

          source = ""
          if os.path.isfile(REPO_FILE) and real_text(REPO_FILE) and normalized_digest(REPO_FILE) != TEMPLATE_SHA256:
              # Upload only the note: strip the "#" comment lines (they are the
              # file's instructions, not store text) into the release folder.
              os.makedirs(RELEASE_DIR, exist_ok=True)
              with open(os.path.join(RELEASE_DIR, "whatsnew-en-US"), "w", encoding="utf-8", newline="\n") as out_file:
                  out_file.write("\n".join(real_text(REPO_FILE)) + "\n")
              source = RELEASE_DIR
              print("What's New: using the repo file (a real note, not the template or the comment-only placeholder).")
          elif os.path.isfile(os.path.join(RELEASE_DIR, "whatsnew-en-US")):
              source = RELEASE_DIR
              print("What's New: using the release asset.")
          else:
              print("What's New: none. The repo file is the template or missing, and the release has no asset.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"dir={source}\n")
          PY

      - name: Locate Play Store Service Account Key
        id: play_key
        run: |
          # PLAY_STORE_SERVICE_ACCOUNT_JSON_FILE was written (and validated as
          # JSON) by the Resolve Deploy Credentials step. Sanity-check it is
          # still there and still JSON without ever printing its content.
          KEY_PATH="$PLAY_STORE_SERVICE_ACCOUNT_JSON_FILE"
          if [ -z "$KEY_PATH" ] || ! jq -e . "$KEY_PATH" >/dev/null 2>&1; then
            echo "::error::Resolved Play Store service account key file is missing or not valid JSON (expected at \$RUNNER_TEMP/play-store-service-account.json)."
            exit 1
          fi
          echo "key_path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      # r0adkll/upload-google-play wraps the Google Play Developer API — this
      # is the standard, actively-maintained GitHub Action for this and
      # matches how this workspace already consumes third-party marketplace
      # actions for platform-specific steps (subosito/flutter-action,
      # actions/create-github-app-token) rather than shelling out to a
      # Ruby/fastlane toolchain that nothing else in this repo uses.
      - name: Upload to Play Store
        if: needs.gate.outputs.upload_aab == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJson: ${{ steps.play_key.outputs.key_path }}
          packageName: ${{ needs.gate.outputs.package_name }}
          releaseFiles: ${{ steps.build_aab.outputs.aab_path }}
          tracks: ${{ inputs.track }}
          status: ${{ inputs.release_status }}
          # What's New from the resolve step above: the repo's whatsnew folder
          # when it holds a real note, else the release's generated one, else
          # empty (the action then skips release notes).
          whatsNewDirectory: ${{ steps.whatsnew.outputs.dir }}
          # Ray, 2026-11-27: releases wait for him to send them for review in Console.
          changesNotSentForReview: true

      # The action above only ships the AAB. Store LISTING assets rendered
      # by the tour pipeline into the caller's checkout (this job's Checkout
      # Code step checks out the calling app repo, marketing/ included) are
      # pushed through the Google Play Edits API directly — Python +
      # google-api-python-client, matching this repo's tooling; still no
      # fastlane, for the same reason as above. The script maps
      # marketing/tour/store/ portrait stills -> phoneScreenshots (max 8,
      # skips logged; marketing/store/screenshots.txt optionally picks and
      # orders them), a 1024x500 image -> featureGraphic, a 512x512 image
      # -> icon, marketing/store/listing/<locale>/*.txt -> the listing's
      # title/short/full description text, and marketing/store/video.txt
      # (a YouTube URL — Play accepts no video file uploads) -> the
      # listing's promo-video field, and exits 0 cleanly when nothing
      # valid is found. The hashFiles gate skips the sparse checkout +
      # pip install entirely for apps that ship no marketing assets, so
      # their deploys run exactly as before.
      - name: Checkout Listing Assets Script
        if: hashFiles('marketing/tour/store/**', 'marketing/store/video.txt', 'marketing/store/listing/**') != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: RokctAI/shared-workflows
          token: ${{ github.token }}
          path: .github/shared-workflows
          sparse-checkout: scripts/play

      - name: Push Store Listing Assets
        id: listing
        if: hashFiles('marketing/tour/store/**', 'marketing/store/video.txt', 'marketing/store/listing/**') != ''
        env:
          PACKAGE_NAME: ${{ needs.gate.outputs.package_name }}
          PLAY_STORE_SERVICE_ACCOUNT_JSON_FILE: ${{ steps.play_key.outputs.key_path }}
        run: |
          python3 -m pip install --quiet google-api-python-client google-auth Pillow
          python3 .github/shared-workflows/scripts/play/upload_listing_assets.py \
            --app-dir . --language en-US
          rm -rf .github/shared-workflows

      # The new digests travel to record-listing-state as an artifact: that job
      # runs on another runner and must write exactly what this push left live.
      - name: Upload Listing State
        if: steps.listing.outputs.state_changed == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: play-listing-state
          path: .github/.play-store-listing-state.json
          # The state file is a dotfile. upload-artifact skips hidden files unless told
          # otherwise, which failed the upload with "No files were found".
          include-hidden-files: true
          if-no-files-found: error

      - name: Cleanup Resolved Credential Files
        if: always()
        # Remove every credential file the resolve step may have written
        # (both hold private-key / API-key material).
        run: |
          rm -f "$RUNNER_TEMP/play-store-service-account.json" \
                "$RUNNER_TEMP/google-services.json"

  # --- 5. SETUP GUIDE (only when the gate or the deploy failed) ---
  # The guide is the same for every app, so it is committed once to docs/ and
  # then left alone: a later failure only reuses it. The failure's reason goes
  # in the PR body, not in the file, so a repeating failure does not repeat PRs.
  setup-guide:
    name: 📘 Commit Play Setup Guide
    needs: [gate, deploy]
    if: always() && (needs.gate.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true

      - name: Determine Context
        run: |
          if [ "${{ github.repository }}" = "RokctAI/shared-workflows" ]; then
            echo "IS_SELF=true" >> "$GITHUB_ENV"
          else
            echo "IS_SELF=false" >> "$GITHUB_ENV"
          fi

      - name: Checkout Shared Workflows Actions
        if: env.IS_SELF == 'false'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: RokctAI/shared-workflows
          token: ${{ github.token }}
          path: .github/shared-workflows

      - name: Setup Identity (Local)
        if: env.IS_SELF == 'true'
        uses: ./.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Identity (Shared)
        if: env.IS_SELF == 'false'
        uses: ./.github/shared-workflows/.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Cleanup Shared Workflows Checkout
        if: always() && env.IS_SELF == 'false'
        run: rm -rf .github/shared-workflows

      - name: Write Setup Guide
        run: |
          mkdir -p docs
          cat > docs/play-deploy-setup.md <<'GUIDE'
          # Play deploy setup

          This repo deploys to Google Play through the shared `universal-play-deploy`
          workflow. A deploy fails until the items below are in place. Each is needed
          once, not on every run. Green no-op runs are not failures; see section 7.

          ## 1. Google Play Console

          - The app exists in Play Console under the package name in the Occultation
            `.env/production.env` key `<ROLE>_ANDROID_PACKAGE_NAME` (the role is the
            contents of `.rokct/config/app_type`).
          - The first build was uploaded by hand. Play requires it before any API upload.
          - The track you deploy to exists: `internal`, `alpha`, `beta` or `production`.

          ## 2. Google Cloud service account

          1. In the Google Cloud project linked to Play Console, enable the
             **Google Play Android Developer API**.
          2. IAM & Admin > Service accounts > Create service account. Grant it no
             Google Cloud roles.
          3. Open the account > Keys > Add key > Create new key > JSON. Keep the file private.

          ## 3. Give the service account access in Play Console

          1. Play Console > Users and permissions > Invite new users.
          2. Enter the service account email: the `client_email` field of the JSON key.
          3. Under App permissions, add this app with release permissions (Release
             manager). Store-listing permission is needed for the image and text upload.
          4. Play can take a while to apply new access. A deploy straight after may fail.

          ## 4. Secrets

          Set these on this repo (Settings > Secrets and variables > Actions), or leave
          them unset and provide the same values as files in RokctAI/Occultation `.env/`:

          - `PLAY_STORE_SERVICE_ACCOUNT_JSON`: the whole JSON key. File fallback:
            `.env/play_store_service_account.json`.
          - `KEY_JKS`, `KEY_PASSWORD`, `ALIAS_PASSWORD`: the upload keystore (base64) and
            its passwords. The key alias must be `upload`.
          - `GOOGLE_SERVICES_JSON`: Firebase config, if the app uses Firebase. File
            fallback: `.env/google-services.json`.
          - `MONOREPO_PAT`: a token that can read RokctAI/Occultation.
          - `APP_ID` and `APP_PRIVATE_KEY`: the GitHub App used to open the PRs this
            workflow writes.

          ## 5. Repo files

          - `version.json` at the repo root: `{"version": "X.Y.Z"}`, the version to ship.
          - `.rokct/config/app_type`: the app role, for example `launcher`.
          - `.github/.play-store-release-state.json`: the record of the last Play
            release. Create it by running the deploy once with `allow_first_release`
            set to true, then merge the PR it opens. Until it is merged, the gate refuses
            with `release-state-unknown`.

          ## 6. What a deploy uploads

          - The AAB attached to the latest published GitHub release. That release's tag
            must be `v` followed by the `version.json` version. Publish that release first.
          - Store listing images and text from `marketing/tour/store/`,
            `marketing/tour/tablet/store/`, `marketing/store/listing/` and
            `marketing/store/video.txt`. Images whose files did not change are not
            re-pushed.

          ## 7. Refusals

          - `release-state-unknown`: the state marker is missing. See section 5.
          - `release-version-mismatch`: the latest release is not `v` plus `version.json`.
            Publish that release.
          - `version-unchanged-since-last-release`: same version. The AAB is skipped;
            listing assets still update.
          - `already-released-this-week`: one AAB per ISO week. Listing assets still update.
          - `no-new-commits-since-last-release`: nothing changed. The whole run is a no-op.
          GUIDE

      - name: Commit Setup Guide (PR-First)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GATE_REASON: ${{ needs.gate.outputs.reason }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          GUIDE_FILE="docs/play-deploy-setup.md"

          # Committed once: if main already has this exact guide, nothing to do.
          if [[ -z "$(git status -s "$GUIDE_FILE")" ]]; then
            echo "Setup guide already on main; nothing to commit."
            exit 0
          fi

          BRANCH_NAME="play-deploy-setup-guide-${{ github.run_id }}"
          git checkout -b "$BRANCH_NAME"
          git add "$GUIDE_FILE"
          git commit -m "docs(play): Play deploy setup guide [skip ci]"

          # [skip ci] in the title too: the squash merge uses it as the commit message.
          if git push -u origin "$BRANCH_NAME"; then
            gh pr create --title "Play Store: setup guide [skip ci]" \
              --body "A Play deploy did not get through. Run: $RUN_URL. Gate reason: ${GATE_REASON:-none}. Deploy result: $DEPLOY_RESULT. This PR adds docs/play-deploy-setup.md, the setup checklist for Play deploys. Later failures reuse this file, so merge it and the reason stays in the run log only." \
              --head "$BRANCH_NAME" --base "${{ github.ref_name }}" || echo "PR already exists."
          else
            echo "::warning::Could not push the setup guide branch."
          fi

  # --- 4. RECORD LISTING STATE (only when this push changed a listing image) ---
  # The digests of what the listing push left live. Without them the next run
  # cannot tell an unchanged graphic from a changed one, so they are committed
  # PR-first like the release marker, with [skip ci] so the commit does not start CI.
  record-listing-state:
    name: 🧾 Record Listing State
    needs: [gate, deploy]
    if: needs.deploy.result == 'success' && needs.deploy.outputs.listing_state_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true

      - name: Determine Context
        run: |
          if [ "${{ github.repository }}" = "RokctAI/shared-workflows" ]; then
            echo "IS_SELF=true" >> "$GITHUB_ENV"
          else
            echo "IS_SELF=false" >> "$GITHUB_ENV"
          fi

      - name: Checkout Shared Workflows Actions
        if: env.IS_SELF == 'false'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: RokctAI/shared-workflows
          token: ${{ github.token }}
          path: .github/shared-workflows

      - name: Setup Identity (Local)
        if: env.IS_SELF == 'true'
        uses: ./.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Identity (Shared)
        if: env.IS_SELF == 'false'
        uses: ./.github/shared-workflows/.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Cleanup Shared Workflows Checkout
        if: always() && env.IS_SELF == 'false'
        run: rm -rf .github/shared-workflows

      - name: Download Listing State
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: play-listing-state
          path: .github

      - name: Commit Listing State (PR-First)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          STATE_FILE=".github/.play-store-listing-state.json"
          if [[ ! -f "$STATE_FILE" ]]; then
            echo "::error::listing state artifact did not arrive"
            exit 1
          fi

          if [[ -z "$(git status -s "$STATE_FILE")" ]]; then
            echo "No change to commit."
            exit 0
          fi

          BRANCH_NAME="play-store-listing-state-${{ github.run_id }}"
          git checkout -b "$BRANCH_NAME"
          git add "$STATE_FILE"
          git commit -m "chore(play-store): record listing state [skip ci]"

          # [skip ci] is in the title as well: the squash merge uses it as the
          # commit message on main.
          if git push -u origin "$BRANCH_NAME"; then
            gh pr create --title "Play Store: recorded listing state [skip ci]" \
              --body "Automated listing-state update after pushing store images and text to Play. Merge so the next run skips images that did not change. Until it merges, the next run pushes them all again." \
              --head "$BRANCH_NAME" --base "${{ github.ref_name }}" || echo "PR already exists."
          else
            echo "::warning::Could not push the listing state branch."
          fi

  # --- 3. RECORD STATE (only after a successful publish) ---
  record-state:
    name: 📝 Record Release State
    needs: [gate, deploy]
    # Only a run that uploaded the AAB records a release. A listing-only run
    # (same version) must not move the marker.
    if: needs.deploy.result == 'success' && needs.gate.outputs.upload_aab == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true

      - name: Determine Context
        run: |
          if [ "${{ github.repository }}" = "RokctAI/shared-workflows" ]; then
            echo "IS_SELF=true" >> "$GITHUB_ENV"
          else
            echo "IS_SELF=false" >> "$GITHUB_ENV"
          fi

      - name: Checkout Shared Workflows Actions
        if: env.IS_SELF == 'false'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: RokctAI/shared-workflows
          token: ${{ github.token }}
          path: .github/shared-workflows

      - name: Setup Identity (Local)
        if: env.IS_SELF == 'true'
        uses: ./.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Identity (Shared)
        if: env.IS_SELF == 'false'
        uses: ./.github/shared-workflows/.github/actions/setup-identity
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Cleanup Shared Workflows Checkout
        if: always() && env.IS_SELF == 'false'
        run: rm -rf .github/shared-workflows

      - name: Write & Commit State Marker (PR-First)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          STATE_FILE="${{ inputs.state_file }}"
          mkdir -p "$(dirname "$STATE_FILE")"

          jq -n \
            --arg version "${{ needs.gate.outputs.version }}" \
            --arg package "${{ needs.gate.outputs.package_name }}" \
            --arg week "$(date -u +%G-W%V)" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sha "${{ github.sha }}" \
            --arg track "${{ inputs.track }}" \
            '{last_version: $version, package_name: $package, last_release_iso_week: $week, last_release_date: $date, last_release_sha: $sha, track: $track}' \
            > "$STATE_FILE"

          echo "📄 State marker written:"
          cat "$STATE_FILE"

          if [[ -z "$(git status -s "$STATE_FILE")" ]]; then
            echo "⏭️ No change to commit."
            exit 0
          fi

          BRANCH_NAME="play-store-release-state-${{ github.run_id }}"
          git checkout -b "$BRANCH_NAME"
          git add "$STATE_FILE"
          git commit -m "chore(play-store): record release ${{ needs.gate.outputs.version }} [skip ci]"

          if git push -u origin "$BRANCH_NAME"; then
            gh pr create --title "🚀 Play Store: recorded release ${{ needs.gate.outputs.version }} [skip ci]" \
              --body "Automated marker update after publishing ${{ needs.gate.outputs.version }} to the '${{ inputs.track }}' track. Merge to keep the weekly-limit and no-op checks accurate." \
              --head "$BRANCH_NAME" --base "${{ github.ref_name }}" || echo "PR already exists."
          else
            echo "⚠️ Could not push state marker branch."
          fi
