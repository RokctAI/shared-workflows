# Weekly poller that rebuilds app shells only when the SDK sources they
# compose actually changed since the shell's last successful build. For
# every org repo whose root composer.json has enabled sdks[] entries, it
# finds the shell's last green build.yml run on its default branch, then
# compares the latest commit touching each composed SDK path against the
# same query bounded at that run's start time; any difference dispatches
# build.yml on the shell's default branch. Because detection is anchored
# to the last *successful* build, a failed or cancelled build never
# swallows a change: it stays detected and the next weekly run simply
# dispatches the build again.
# (The push-side sdk-dispatch.yml -> universal-sdk-dispatch.yml path was
# retired for private-repo Actions minutes cost; this poller runs on the
# public shared-workflows repo, which has free minutes.)

name: SDK Change Poller (Weekly)

permissions:
  contents: read

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Detect and log shells that would be rebuilt, but never dispatch builds'
        required: false
        type: boolean
        default: false

concurrency:
  group: sdk-bump-poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # Tolerable failures (missing PAT, transient org-listing / per-shell /
    # per-SDK API errors) are handled inside the steps, which warn and
    # exit 0. Anything that fails this job is a real script or
    # infrastructure problem and must be visible as a red run.
    env:
      GH_TOKEN: ${{ secrets.MONOREPO_PAT }}
      ORG: RokctAI
      WORKFLOW_FILE: build.yml
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - name: Check MONOREPO_PAT availability
        id: guard
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "MONOREPO_PAT is not available (fork or unconfigured repo); nothing to do."
            {
              echo "## SDK Change Poller"
              echo ""
              echo "\`MONOREPO_PAT\` is not available, so this run did nothing."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare shells against their last successful build and dispatch
        if: steps.guard.outputs.run == 'true'
        run: |
          WORK="$RUNNER_TEMP/sdk-poller"
          mkdir -p "$WORK"
          AUTH_HEADER="Authorization: Bearer $GH_TOKEN"
          JSON_ACCEPT="Accept: application/vnd.github+json"
          RAW_ACCEPT="Accept: application/vnd.github.raw"

          [ "$DRY_RUN" = "true" ] && echo "DRY RUN: no builds will be dispatched."

          # --- 1. List org repos (name + default branch), paginated -------------
          REPOS_FILE="$WORK/org-repos.tsv"
          : > "$REPOS_FILE"
          PAGE=1
          LIST_OK=true
          while :; do
            RESP="$(curl -sS -H "$AUTH_HEADER" -H "$JSON_ACCEPT" \
              "https://api.github.com/orgs/$ORG/repos?per_page=100&page=$PAGE" || true)"
            COUNT="$(echo "$RESP" | jq 'if type == "array" then length else -1 end' 2>/dev/null || echo -1)"
            if [ "$COUNT" -lt 0 ] 2>/dev/null; then
              LIST_OK=false
              break
            fi
            [ "$COUNT" -eq 0 ] && break
            echo "$RESP" | jq -r '.[] | select(.archived | not) | [.name, (.default_branch // "main")] | @tsv' >> "$REPOS_FILE"
            [ "$COUNT" -lt 100 ] && break
            PAGE=$((PAGE + 1))
          done

          if [ "$LIST_OK" != "true" ] || [ ! -s "$REPOS_FILE" ]; then
            echo "::warning::Failed to list $ORG repositories (transient API error?); skipping this poll."
            {
              echo "## SDK Change Poller"
              echo ""
              echo "Could not list \`$ORG\` repositories; this poll was skipped."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Discovered $(wc -l < "$REPOS_FILE") active repos in $ORG."

          # Lookup table for resolving composed git URLs to canonical repos:
          # lowercased_name<TAB>name<TAB>default_branch
          REPOS_LOWER="$WORK/org-repos-lower.tsv"
          awk -F'\t' '{ print tolower($1) "\t" $1 "\t" $2 }' "$REPOS_FILE" > "$REPOS_LOWER"

          # --- 2. Discover shells (root composer.json with enabled sdks[]) ------
          SHELLS_FILE="$WORK/shells.tsv"          # shell<TAB>default_branch
          : > "$SHELLS_FILE"
          while IFS=$'\t' read -r REPO_NAME DEFAULT_BRANCH; do
            COMPOSER="$WORK/composer-$REPO_NAME.json"
            CODE="$(curl -sS -o "$COMPOSER" -w '%{http_code}' -H "$AUTH_HEADER" -H "$RAW_ACCEPT" \
              "https://api.github.com/repos/$ORG/$REPO_NAME/contents/composer.json" || echo 000)"
            [ "$CODE" = "200" ] || continue
            if ! jq empty "$COMPOSER" 2>/dev/null; then
              echo "::warning::$REPO_NAME has a root composer.json that is not valid JSON; skipping it."
              continue
            fi
            if ! jq -e '(.sdks // empty) | type == "array" and ([.[] | select(.enabled == true)] | length > 0)' "$COMPOSER" >/dev/null 2>&1; then
              continue
            fi
            printf '%s\t%s\n' "$REPO_NAME" "$DEFAULT_BRANCH" >> "$SHELLS_FILE"
          done < "$REPOS_FILE"

          if [ ! -s "$SHELLS_FILE" ]; then
            echo "No shells (repos with enabled sdks[] in composer.json) found; nothing to do."
            {
              echo "## SDK Change Poller"
              echo ""
              echo "No shells with enabled \`sdks[]\` were found in \`$ORG\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Shells: $(cut -f1 "$SHELLS_FILE" | paste -sd ',' - | sed 's/,/, /g')"

          # Latest commit touching a path on a branch, optionally bounded by an
          # upper timestamp. Echoes the SHA ("" when no commit matches); returns
          # non-zero on API failure, leaving the HTTP code in $WORK/last-http.
          latest_commit_sha() {
            local repo="$1" branch="$2" path="$3" until="$4" out code
            local args=(--data-urlencode "sha=$branch" --data-urlencode "per_page=1")
            [ -n "$path" ] && args+=(--data-urlencode "path=$path")
            [ -n "$until" ] && args+=(--data-urlencode "until=$until")
            out="$WORK/commits.json"
            code="$(curl -sSG -o "$out" -w '%{http_code}' -H "$AUTH_HEADER" -H "$JSON_ACCEPT" \
              "${args[@]}" "https://api.github.com/repos/$ORG/$repo/commits" || echo 000)"
            echo "$code" > "$WORK/last-http"
            [ "$code" = "200" ] || return 1
            jq -r 'if type == "array" and length > 0 then .[0].sha else "" end' "$out" 2>/dev/null || echo ""
          }

          # --- 3. Per shell: last green build vs composed SDK paths -------------
          NEEDS_FILE="$WORK/needs-build.tsv"      # shell<TAB>branch<TAB>reason
          ROWS_FILE="$WORK/summary-rows.tsv"      # shell<TAB>last_green<TAB>result
          : > "$NEEDS_FILE"
          : > "$ROWS_FILE"
          while IFS=$'\t' read -r SHELL_REPO SHELL_BRANCH; do
            COMPOSER="$WORK/composer-$SHELL_REPO.json"

            RUNS="$WORK/runs.json"
            CODE="$(curl -sSG -o "$RUNS" -w '%{http_code}' -H "$AUTH_HEADER" -H "$JSON_ACCEPT" \
              --data-urlencode "branch=$SHELL_BRANCH" \
              --data-urlencode "status=success" \
              --data-urlencode "per_page=1" \
              "https://api.github.com/repos/$ORG/$SHELL_REPO/actions/workflows/$WORKFLOW_FILE/runs" || echo 000)"

            LAST_GREEN=""
            if [ "$CODE" = "200" ]; then
              LAST_GREEN="$(jq -r '.workflow_runs[0].run_started_at // .workflow_runs[0].created_at // empty' "$RUNS" 2>/dev/null || true)"
            elif [ "$CODE" != "404" ]; then
              echo "::warning::Could not list $WORKFLOW_FILE runs for $ORG/$SHELL_REPO (HTTP $CODE); skipping it this cycle."
              printf '%s\t%s\t%s\n' "$SHELL_REPO" "-" "skip (run lookup failed, HTTP $CODE)" >> "$ROWS_FILE"
              continue
            fi
            # A 404 means the shell has no build.yml (or no runs are visible);
            # treat it like "never built" - the dispatch below warns if it 404s.

            if [ -z "$LAST_GREEN" ]; then
              echo "$SHELL_REPO: no successful $WORKFLOW_FILE run on $SHELL_BRANCH yet -> needs a build."
              printf '%s\t%s\t%s\n' "$SHELL_REPO" "$SHELL_BRANCH" "never built successfully" >> "$NEEDS_FILE"
              printf '%s\t%s\t%s\n' "$SHELL_REPO" "never" "dispatch (never built successfully)" >> "$ROWS_FILE"
              continue
            fi

            # Enabled entries: lowercased repo basename of git URL + declared path.
            jq -r '(.sdks // [])[]
              | select(.enabled == true)
              | ((.git // "") | ascii_downcase | rtrimstr("/") | rtrimstr(".git")) as $g
              | select(($g | length) > 0)
              | [($g | split("/") | last), (.path // "")] | @tsv' "$COMPOSER" > "$WORK/entries.tsv"

            CHANGED=""
            ENTRY_ERRORS=0
            while IFS=$'\t' read -r SDK_LOWER SDK_PATH; do
              MATCH="$(awk -F'\t' -v l="$SDK_LOWER" '$1 == l { print $2 "\t" $3; exit }' "$REPOS_LOWER")"
              if [ -z "$MATCH" ]; then
                echo "::warning::$SHELL_REPO composes SDK repo '$SDK_LOWER' which is not an active $ORG repo; skipping that entry."
                ENTRY_ERRORS=$((ENTRY_ERRORS + 1))
                continue
              fi
              IFS=$'\t' read -r SDK_REPO SDK_BRANCH <<< "$MATCH"

              # Composed path like ../core/base/dart -> repo-relative base/dart.
              P="$SDK_PATH"
              P="${P#./}"
              while [ "${P#../}" != "$P" ]; do P="${P#../}"; done
              P="${P%/}"
              FIRST="$(printf '%s' "${P%%/*}" | tr '[:upper:]' '[:lower:]')"
              if [ "$FIRST" = "$SDK_LOWER" ]; then
                if [ "$P" = "${P%%/*}" ]; then P=""; else P="${P#*/}"; fi
              fi

              if ! NOW_SHA="$(latest_commit_sha "$SDK_REPO" "$SDK_BRANCH" "$P" "")"; then
                echo "::warning::Could not read the latest commit for $ORG/$SDK_REPO path '${P:-<root>}' (HTTP $(cat "$WORK/last-http")); skipping that entry this cycle."
                ENTRY_ERRORS=$((ENTRY_ERRORS + 1))
                continue
              fi
              if ! THEN_SHA="$(latest_commit_sha "$SDK_REPO" "$SDK_BRANCH" "$P" "$LAST_GREEN")"; then
                echo "::warning::Could not read the commit-as-of-last-build for $ORG/$SDK_REPO path '${P:-<root>}' (HTTP $(cat "$WORK/last-http")); skipping that entry this cycle."
                ENTRY_ERRORS=$((ENTRY_ERRORS + 1))
                continue
              fi
              if [ "$NOW_SHA" != "$THEN_SHA" ]; then
                CHANGED="$SDK_REPO/${P:-.}"
                break
              fi
            done < "$WORK/entries.tsv"

            if [ -n "$CHANGED" ]; then
              echo "$SHELL_REPO: $CHANGED changed since last successful build ($LAST_GREEN) -> needs a build."
              printf '%s\t%s\t%s\n' "$SHELL_REPO" "$SHELL_BRANCH" "$CHANGED changed" >> "$NEEDS_FILE"
              printf '%s\t%s\t%s\n' "$SHELL_REPO" "$LAST_GREEN" "dispatch ($CHANGED changed)" >> "$ROWS_FILE"
            elif [ "$ENTRY_ERRORS" -gt 0 ]; then
              echo "$SHELL_REPO: no changes detected, but $ENTRY_ERRORS entries could not be checked (see warnings); not dispatching."
              printf '%s\t%s\t%s\n' "$SHELL_REPO" "$LAST_GREEN" "skip ($ENTRY_ERRORS entries unchecked)" >> "$ROWS_FILE"
            else
              echo "$SHELL_REPO: up to date - no composed SDK changes since last successful build ($LAST_GREEN); skipping."
              printf '%s\t%s\t%s\n' "$SHELL_REPO" "$LAST_GREEN" "skip (up to date)" >> "$ROWS_FILE"
            fi
          done < "$SHELLS_FILE"

          # --- 4. Dispatch builds (one per shell; each appears at most once) ----
          DISPATCHED=""
          FAILED=""
          WOULD=""
          if [ -s "$NEEDS_FILE" ]; then
            while IFS=$'\t' read -r SHELL_REPO SHELL_BRANCH REASON; do
              if [ "$DRY_RUN" = "true" ]; then
                echo "DRY RUN: would dispatch $WORKFLOW_FILE in $ORG/$SHELL_REPO (ref: $SHELL_BRANCH; $REASON)."
                WOULD="$WOULD $SHELL_REPO"
                continue
              fi
              CODE="$(curl -sS -o "$WORK/dispatch-resp.json" -w '%{http_code}' -X POST \
                -H "$AUTH_HEADER" -H "$JSON_ACCEPT" \
                "https://api.github.com/repos/$ORG/$SHELL_REPO/actions/workflows/$WORKFLOW_FILE/dispatches" \
                -d "{\"ref\":\"$SHELL_BRANCH\"}" || echo 000)"
              if [ "$CODE" = "204" ]; then
                echo "Dispatched $WORKFLOW_FILE in $ORG/$SHELL_REPO (ref: $SHELL_BRANCH; $REASON)"
                DISPATCHED="$DISPATCHED $SHELL_REPO"
              else
                echo "::warning::Failed to dispatch $WORKFLOW_FILE in $ORG/$SHELL_REPO (HTTP $CODE): $(head -c 300 "$WORK/dispatch-resp.json" 2>/dev/null)"
                FAILED="$FAILED $SHELL_REPO"
              fi
            done < "$NEEDS_FILE"
          else
            echo "All shells are up to date; nothing to dispatch."
          fi

          # --- 5. Run summary ---------------------------------------------------
          {
            echo "## SDK Change Poller"
            echo ""
            echo "- Shells checked: **$(wc -l < "$SHELLS_FILE" | tr -d ' ')**"
            echo ""
            echo "| Shell | Last successful build | Result |"
            echo "|-------|-----------------------|--------|"
            while IFS=$'\t' read -r ROW_SHELL ROW_GREEN ROW_RESULT; do
              echo "| $ROW_SHELL | $ROW_GREEN | $ROW_RESULT |"
            done < "$ROWS_FILE"
            echo ""
            if [ "$DRY_RUN" = "true" ] && [ -n "$WOULD" ]; then
              echo "- Dispatches: none (dry run; would have dispatched$(echo "$WOULD" | sed 's/ /, /g' | sed 's/^,//'))"
            elif [ -n "$DISPATCHED" ]; then
              echo "- Dispatched:$(echo "$DISPATCHED" | sed 's/ /, /g' | sed 's/^,//')"
            else
              echo "- Dispatches: none"
            fi
            if [ -n "$FAILED" ]; then
              echo "- Dispatch failures (see warnings):$(echo "$FAILED" | sed 's/ /, /g' | sed 's/^,//')"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
