name: Universal Auto Assign

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PIP_BREAK_SYSTEM_PACKAGES: 1

permissions: write-all
on:
  workflow_call:
    secrets:
      COUNTER_API_KEY:
        required: false

jobs:
  telemetry:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Track Usage
        env:
          API_KEY: ${{ secrets.COUNTER_API_KEY }}
        if: env.API_KEY != ''
        run: |
          curl -X GET "https://api.counterapi.dev/v2/rokctai/usage/up" \
          -H "Authorization: Bearer $API_KEY"

  assign:
    needs: telemetry
    runs-on: ubuntu-latest
    steps:
      - uses: kentaro-m/auto-assign-action@v2.0.0
        with:
          configuration-path: '.github/auto_assign.yml'
        continue-on-error: true

      - name: Workload-based Auto Assigner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          CANDIDATES=("RendaniSinyage" "RokctBOT")
          LEAST_LOADED=""
          MIN_COUNT=9999
          
          for user in "${CANDIDATES[@]}"; do
            COUNT=$(gh api "search/issues?q=assignee:$user+is:open" --jq '.total_count' || echo "0")
            echo "Candidate: $user, Open Tasks: $COUNT"
            if [ "$COUNT" -lt "$MIN_COUNT" ]; then
              MIN_COUNT=$COUNT
              LEAST_LOADED=$user
            fi
          done
          
          echo "Selected least loaded assignee: $LEAST_LOADED with $MIN_COUNT open tasks"
          
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
             gh pr edit "$PR_NUMBER" --add-assignee "$LEAST_LOADED"
          fi
