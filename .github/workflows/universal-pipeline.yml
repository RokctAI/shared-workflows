name: Universal Pipeline Orchestrator

permissions: write-all
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PIP_BREAK_SYSTEM_PACKAGES: 1

on:
  workflow_call:
    inputs:
      project_type:
        required: true
        type: string
        description: "Project type: 'frappe', 'node', or 'flutter'"
      app-type:
        required: false
        type: string
        description: "App role: customer, driver, manager, pos (Flutter only)"
      run_security:
        type: boolean
        default: true
      run_lint:
        type: boolean
        default: true
      run_ci:
        type: boolean
        default: true
      run_import_healer:
        type: boolean
        default: false
        description: "Auto-heal missing imports after build_runner (Flutter only — commits fixes and reruns)"

      # Node.js
      node-version:
        type: string
        default: '24'
      package-manager:
        type: string
        default: 'pnpm'

      # Frappe / Python
      python-version:
        type: string
        default: '3.14.2'
      mariadb-version:
        type: string
        default: '10.6'
      postgres-version:
        type: string
        default: '15'
      db-type:
        type: string
        default: 'mariadb'
      db-password:
        required: false
        type: string
        default: 'travis'
      redis-version:
        type: string
        default: '6.0'
      install-erpnext:
        type: boolean
        default: false
      install-payments:
        type: boolean
        default: false
      bootstrap:
        type: boolean
        default: false

      # Flutter
      flutter-channel:
        type: string
        default: 'stable'
      flutter-version:
        type: string
        default: ''
      java-version:
        type: string
        default: '17'

      # Release
      release_strategy:
        type: string
        default: 'immediate'
      version_file:
        type: string
        default: 'version.json'
      version_format:
        type: string
        default: '##.##.##'
      brain_endpoint:
        type: string
      build_android:
        type: boolean
        default: false
      build_windows:
        type: boolean
        default: false
      cleanup_rc_releases:
        type: boolean
        default: true
      one_time_cleanup_cutoff_date:
        type: string
        default: ""
      backfill_ai_notes_cutoff_version:
        type: string
        default: ""

    secrets:
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false
      MONOREPO_PAT:
        required: false

jobs:
  # 🔥 NEW: Detect trivial (whitespace-only) changes
  detect-changes:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.project_type == 'frappe' && 'debian:bookworm' || '' }}
      options: --user root
    outputs:
      only_whitespace: ${{ steps.diff.outputs.only_whitespace }}
      trivial: ${{ steps.diff.outputs.trivial }}
    steps:
      - name: System Essentials
        if: inputs.project_type == 'frappe'
        run: git config --global --add safe.directory \"$GITHUB_WORKSPACE\" && apt-get update && apt-get install -y git curl sudo

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine base commit
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
            git fetch origin "${{ github.base_ref }}" || true
          else
            BASE_REF="HEAD~1"
          fi

          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"

      - name: Check if only whitespace changes
        id: diff
        run: |
          BASE="${{ steps.base.outputs.base_ref }}"

          echo "Comparing against: $BASE"

          if git rev-parse "$BASE" >/dev/null 2>&1; then
            DIFF="$(git diff -w "$BASE"...HEAD || true)"
            RAW_DIFF="$(git diff "$BASE"...HEAD || true)"
          else
            echo "Base not found, treating as non-trivial change"
            echo "only_whitespace=false" >> "$GITHUB_OUTPUT"
            echo "trivial=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$RAW_DIFF" ]; then
            echo "No changes at all"
            echo "only_whitespace=true" >> "$GITHUB_OUTPUT"
            echo "trivial=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$DIFF" ]; then
            echo "Only whitespace changes"
            echo "only_whitespace=true" >> "$GITHUB_OUTPUT"
            echo "trivial=true" >> "$GITHUB_OUTPUT"
          else
            echo "Real changes detected"
            echo "only_whitespace=false" >> "$GITHUB_OUTPUT"
            echo "trivial=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Label PR as trivial
        if: github.event_name == 'pull_request' && steps.diff.outputs.trivial == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels" \
            -d '{"labels":["trivial"]}' || echo "⚠️ Issue may already exist, skipping."

  # 0. PR RESURRECTOR
  pr-resurrector:
    needs: detect-changes
    if: needs.detect-changes.outputs.trivial != 'true'
    uses: RokctAI/shared-workflows/.github/workflows/universal-pr-resurrector.yml@main
    secrets: inherit

  # 1. SECURITY
  security:
    needs: detect-changes
    if: inputs.run_security && needs.detect-changes.outputs.trivial != 'true'
    uses: RokctAI/shared-workflows/.github/workflows/universal-security.yml@main
    with:
      project_type: ${{ inputs.project_type }}
    secrets: inherit

  # 2. LINT
  lint:
    needs: [detect-changes, security]
    if: always() && (needs.security.result == 'success' || needs.security.result == 'skipped') && inputs.run_lint && needs.detect-changes.outputs.trivial != 'true'
    uses: RokctAI/shared-workflows/.github/workflows/universal-linter.yml@main
    with:
      project_type: ${{ inputs.project_type }}
      run-build-runner: ${{ inputs.project_type == 'flutter' }}
      flutter-channel: ${{ inputs.flutter-channel || 'stable' }}
      flutter-version: ${{ inputs.flutter-version }}
      force-fix: ${{ github.ref_name == 'main' || github.ref_name == 'develop' }}
    secrets: inherit

  # 3. IMPORT HEALER (Flutter only — runs after lint so build_runner/freezed files exist)
  import-healer:
    needs: [detect-changes, lint]
    if: |
      always() &&
      inputs.run_import_healer &&
      inputs.project_type == 'flutter' &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      needs.detect-changes.outputs.trivial != 'true'
    uses: RokctAI/shared-workflows/.github/workflows/universal-flutter-import-healer.yml@main
    with:
      flutter-channel: ${{ inputs.flutter-channel || 'stable' }}
      flutter-version: ${{ inputs.flutter-version }}
      java-version: ${{ inputs.java-version || '17' }}
    secrets: inherit

  # 4. CI / BUILD
  ci-frappe:
    needs: [detect-changes, lint]
    if: always() && (needs.lint.result == 'success' || needs.lint.result == 'skipped') && inputs.run_ci && inputs.project_type == 'frappe' && needs.detect-changes.outputs.trivial != 'true'
    uses: RokctAI/shared-workflows/.github/workflows/universal-frappe-ci.yml@main
    with:
      python-version: ${{ inputs.python-version || '3.14' }}
      mariadb-version: ${{ inputs.mariadb-version || '10.6' }}
      postgres-version: ${{ inputs.postgres-version || '15' }}
      db-type: ${{ inputs.db-type || 'mariadb' }}
      db-password: ${{ inputs.db-password || 'travis' }}
      redis-version: ${{ inputs.redis-version || '6.0' }}
      node-version: ${{ inputs.node-version || '24' }}
      install-erpnext: ${{ inputs.install-erpnext }}
      install-payments: ${{ inputs.install-payments }}
      bootstrap: ${{ inputs.bootstrap }}
    secrets: inherit

  ci-node:
    needs: [detect-changes, lint]
    if: always() && (needs.lint.result == 'success' || needs.lint.result == 'skipped') && inputs.run_ci && inputs.project_type == 'node' && needs.detect-changes.outputs.trivial != 'true'
    uses: RokctAI/shared-workflows/.github/workflows/universal-node-ci.yml@main
    with:
      node-version: ${{ inputs.node-version || '24' }}
      package-manager: ${{ inputs.package-manager || 'pnpm' }}
      build-command: ${{ format('{0} run build', inputs.package-manager || 'pnpm') }}
      test-command: ${{ format('{0} run test', inputs.package-manager || 'pnpm') }}
    secrets: inherit

  ci-flutter:
    needs: [detect-changes, lint, import-healer]
    if: |
      always() &&
      inputs.run_ci &&
      inputs.project_type == 'flutter' &&
      needs.detect-changes.outputs.trivial != 'true' &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.import-healer.result == 'success' || needs.import-healer.result == 'skipped')
    uses: RokctAI/shared-workflows/.github/workflows/universal-flutter-build.yml@main
    with:
      build-type: ${{ inputs.build_android && 'apk' || 'apk' }}
      flutter-channel: ${{ inputs.flutter-channel || 'stable' }}
      flutter-version: ${{ inputs.flutter-version }}
      java-version: ${{ inputs.java-version || '17' }}
      app-type: ${{ inputs.app-type }}
    secrets: inherit

  # 5. RELEASE
  release:
    needs: [detect-changes, ci-frappe, ci-node, ci-flutter]
    if: |
      always() && 
      needs.detect-changes.outputs.trivial != 'true' &&
      (github.ref_name == 'develop' || (
        (needs.ci-frappe.result == 'success' || needs.ci-frappe.result == 'skipped') &&
        (needs.ci-node.result == 'success' || needs.ci-node.result == 'skipped') &&
        (needs.ci-flutter.result == 'success' || needs.ci-flutter.result == 'skipped')
      )) &&
      (inputs.build_windows == false || (inputs.build_windows == true && (github.event_name == 'schedule' || (github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main' || startsWith(github.ref_name, 'build_'))))))
    uses: RokctAI/shared-workflows/.github/workflows/universal-release.yml@main
    with:
      project_type: ${{ inputs.project_type }}
      release_strategy: ${{ inputs.release_strategy || 'immediate' }}
      version_file: ${{ inputs.version_file || 'version.json' }}
      version_format: ${{ inputs.version_format || '##.##.##' }}
      brain_endpoint: ${{ inputs.brain_endpoint }}
      build_android: ${{ inputs.build_android }}
      build_windows: ${{ inputs.build_windows }}
      cleanup_rc_releases: ${{ inputs.cleanup_rc_releases }}
      one_time_cleanup_cutoff_date: ${{ inputs.one_time_cleanup_cutoff_date }}
      backfill_ai_notes_cutoff_version: ${{ inputs.backfill_ai_notes_cutoff_version }}
      node-version: ${{ inputs.node-version || '24' }}
      flutter-channel: ${{ inputs.flutter-channel || 'stable' }}
      flutter-version: ${{ inputs.flutter-version }}
      java-version: ${{ inputs.java-version || '17' }}
      python-version: ${{ inputs.python-version || '3.14' }}
      app-type: ${{ inputs.app-type }}
    secrets: inherit