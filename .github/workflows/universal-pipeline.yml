# Copyright 2024 RokctAI

name: Universal Pipeline Orchestrator

permissions: write-all
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PIP_BREAK_SYSTEM_PACKAGES: 1

on:
  workflow_call:
    inputs:
      project_type:
        required: true
        type: string
        description: "Project type: 'frappe', 'node', or 'flutter'"
      app-type:
        required: false
        type: string
        description: "App role: customer, driver, manager, pos (Flutter only)"
      run_security:
        type: boolean
        default: true
      run_lint:
        type: boolean
        default: true
      run_ci:
        type: boolean
        default: true
      run_verify:
        type: boolean
        default: true
        description: "Run continuous verification on Android emulator (Flutter only)"

      # Node.js
      node-version:
        type: string
        default: '24'
      package-manager:
        type: string
        default: 'pnpm'

      # Frappe / Python
      python-version:
        type: string
        default: '3.14.2'
      mariadb-version:
        type: string
        default: '10.6'
      postgres-version:
        type: string
        default: '16'
      db-type:
        type: string
        default: 'mariadb'
      db-password:
        required: false
        type: string
        default: 'travis'
      redis-version:
        type: string
        default: '6.0'
      install-erpnext:
        type: boolean
        default: false
      install-rpanel:
        type: boolean
        default: false
      install-payments:
        type: boolean
        default: false
      bootstrap:
        type: boolean
        default: false

      # Flutter
      flutter-channel:
        type: string
        default: 'stable'
      flutter-version:
        type: string
        # Pinned: Flutter 3.47.0 + analyzer <8 (freezed 2.x) hangs build_runner; remove once SDKs move to freezed 3.x / analyzer 8.
        default: '3.44.9'
      java-version:
        type: string
        default: '17'

      # Release
      release_strategy:
        type: string
        default: 'immediate'
      version_file:
        type: string
        default: 'version.json'
      version_format:
        type: string
        default: '##.##.##'
      brain_endpoint:
        type: string
      build_android:
        type: boolean
        default: false
      build_windows:
        type: boolean
        default: false
      cleanup_rc_releases:
        type: boolean
        default: true
      one_time_cleanup_cutoff_date:
        type: string
        default: ""
      backfill_ai_notes_cutoff_version:
        type: string
        default: ""

    secrets:
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false
      MONOREPO_PAT:
        required: false
      GROQ_API:
        required: false

jobs:
  # 🔥 NEW: Detect trivial (whitespace-only) changes
  detect-changes:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.project_type == 'frappe' && 'debian:bookworm' || '' }}
      options: --user root
    outputs:
      only_whitespace: ${{ steps.diff.outputs.only_whitespace }}
      trivial: ${{ steps.diff.outputs.trivial }}
    steps:
      - name: System Essentials
        if: inputs.project_type == 'frappe'
        run: |
           apt-get update
           apt-get install -y git curl sudo
           git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Determine base commit
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
            git fetch origin "${{ github.base_ref }}" || true
          else
            BASE_REF="HEAD~1"
          fi

          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"

      - name: Check if only whitespace changes
        id: diff
        run: |
          BASE="${{ steps.base.outputs.base_ref }}"

          echo "Comparing against: $BASE"

          if git rev-parse "$BASE" >/dev/null 2>&1; then
            DIFF="$(git diff -w "$BASE"...HEAD || true)"
            RAW_DIFF="$(git diff "$BASE"...HEAD || true)"
          else
            echo "Base not found, treating as non-trivial change"
            echo "only_whitespace=false" >> "$GITHUB_OUTPUT"
            echo "trivial=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$RAW_DIFF" ]; then
            echo "No changes at all"
            echo "only_whitespace=true" >> "$GITHUB_OUTPUT"
            echo "trivial=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$DIFF" ]; then
            echo "Only whitespace changes"
            echo "only_whitespace=true" >> "$GITHUB_OUTPUT"
            echo "trivial=true" >> "$GITHUB_OUTPUT"
          else
            echo "Real changes detected"
            echo "only_whitespace=false" >> "$GITHUB_OUTPUT"
            echo "trivial=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Label PR as trivial
        if: github.event_name == 'pull_request' && steps.diff.outputs.trivial == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels" \
            -d '{"labels":["trivial"]}' || echo "⚠️ Issue may already exist, skipping."

      - name: Conventional Commit & PR Auto-Labeler
        if: github.event_name == 'pull_request' && steps.diff.outputs.trivial != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API: ${{ secrets.GROQ_API }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "${{ github.repository }}" = "RokctAI/shared-workflows" ]; then
             python3 scripts/pr_auto_labeler.py
          else
             git clone --depth 1 https://github.com/RokctAI/shared-workflows.git /tmp/shared-workflows
             python3 /tmp/shared-workflows/scripts/pr_auto_labeler.py
          fi

  # 0. PR RESURRECTOR
  pr-resurrector:
    needs: detect-changes
    if: needs.detect-changes.outputs.trivial != 'true'
    uses: RokctAI/shared-workflows/.github/workflows/universal-pr-resurrector.yml@fed18a76a3107bcd8293a24d3e949addfdd09e84 # main
    secrets: inherit

  # 1. SECURITY
  security:
    needs: detect-changes
    if: inputs.run_security && needs.detect-changes.outputs.trivial != 'true'
    uses: RokctAI/shared-workflows/.github/workflows/universal-security.yml@fed18a76a3107bcd8293a24d3e949addfdd09e84 # main
    with:
      project_type: ${{ inputs.project_type }}
    secrets: inherit

  # 🔥 NEW: Observability Compliance Gatekeeper for Frappe/Python projects
  observability-compliance:
    needs: detect-changes
    if: always() && inputs.project_type == 'frappe' && needs.detect-changes.outputs.trivial != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target codebase
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Checkout shared compliance action script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: RokctAI/shared-workflows
          path: .shared-workflows
          ref: main

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Run Observability AST Scanner
        env:
          GROQ_API: ${{ secrets.GROQ_API }}
        run: |
          python3 .shared-workflows/scripts/compliance_scanner.py

      - name: Commit Auto-Generated Documentation
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          HAS_CHANGES=false
          if [[ -n $(git status -s docs/api/) ]] || [[ -n $(git status -s .rokct/agent/logs/) ]]; then
            HAS_CHANGES=true
          fi

          if [[ "$HAS_CHANGES" == "true" ]]; then
            echo "Auto-generated documentation or logs found. Committing..."
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git add docs/api/ || true
            git add .rokct/agent/logs/ || true
            git commit -m "docs: auto-heal API documentation and logs [skip ci]"
            # Only push if this is a PR or branch push, not a detached head
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              git push origin "HEAD:$HEAD_REF"
            else
              git push
            fi
          else
            echo "No missing documentation or logs were generated."
          fi

      - name: Install and Run Actionlint
        run: |
          bash <(curl -L https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          sudo mv actionlint /usr/local/bin/
          actionlint -color

  # 2. LINT
  lint:
    needs: [detect-changes, security]
    if: always() && (needs.security.result == 'success' || needs.security.result == 'skipped') && inputs.run_lint && needs.detect-changes.outputs.trivial != 'true'
    uses: RokctAI/shared-workflows/.github/workflows/universal-linter.yml@fed18a76a3107bcd8293a24d3e949addfdd09e84 # main
    with:
      project_type: ${{ inputs.project_type }}
      run-build-runner: ${{ inputs.project_type == 'flutter' }}
      flutter-channel: ${{ inputs.flutter-channel || 'stable' }}
      # 3.44.9 fallback: Flutter 3.47.0 + analyzer <8 hangs build_runner (see flutter-version input default); remove once SDKs move to freezed 3.x / analyzer 8.
      flutter-version: ${{ inputs.flutter-version || '3.44.9' }}
      force-fix: ${{ github.ref_name == 'main' || github.ref_name == 'develop' }}
    secrets: inherit

  # 3. CI / BUILD
  ci-frappe:
    needs: [detect-changes, lint, observability-compliance]
    if: always() && (needs.lint.result == 'success' || needs.lint.result == 'skipped') && (needs.observability-compliance.result == 'success' || needs.observability-compliance.result == 'skipped') && inputs.run_ci && inputs.project_type == 'frappe' && needs.detect-changes.outputs.trivial != 'true'
    uses: RokctAI/shared-workflows/.github/workflows/universal-frappe-ci.yml@fed18a76a3107bcd8293a24d3e949addfdd09e84 # main
    with:
      python-version: ${{ inputs.python-version || '3.14' }}
      mariadb-version: ${{ inputs.mariadb-version || '10.6' }}
      postgres-version: ${{ inputs.postgres-version || '16' }}
      db-type: ${{ inputs.db-type || 'mariadb' }}
      db-password: ${{ inputs.db-password || 'travis' }}
      redis-version: ${{ inputs.redis-version || '6.0' }}
      node-version: ${{ inputs.node-version || '24' }}
      install-erpnext: ${{ inputs.install-erpnext }}
      install-rpanel: ${{ inputs.install-rpanel }}
      install-payments: ${{ inputs.install-payments }}
      bootstrap: ${{ inputs.bootstrap }}
      rpanel-db-version: '2.4.8'
    secrets: inherit

  ci-node:
    needs: [detect-changes, lint]
    if: always() && (needs.lint.result == 'success' || needs.lint.result == 'skipped') && inputs.run_ci && inputs.project_type == 'node' && needs.detect-changes.outputs.trivial != 'true'
    uses: RokctAI/shared-workflows/.github/workflows/universal-node-ci.yml@fed18a76a3107bcd8293a24d3e949addfdd09e84 # main
    with:
      node-version: ${{ inputs.node-version || '24' }}
      package-manager: ${{ inputs.package-manager || 'pnpm' }}
      build-command: ${{ format('{0} run build', inputs.package-manager || 'pnpm') }}
      test-command: ${{ format('{0} run test', inputs.package-manager || 'pnpm') }}
    secrets: inherit

  ci-flutter:
    needs: [detect-changes, lint]
    if: |
      always() &&
      inputs.run_ci &&
      inputs.project_type == 'flutter' &&
      needs.detect-changes.outputs.trivial != 'true' &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped')
    uses: RokctAI/shared-workflows/.github/workflows/universal-flutter-build.yml@fed18a76a3107bcd8293a24d3e949addfdd09e84 # main
    with:
      # develop is purely for development: debug APK + AAB only (no release APK).
      # Every other branch gets the full set (release APK + debug APK + AAB).
      build-type: ${{ github.ref_name == 'develop' && 'develop' || 'all' }}
      flutter-channel: ${{ inputs.flutter-channel || 'stable' }}
      # 3.44.9 fallback: Flutter 3.47.0 + analyzer <8 hangs build_runner (see flutter-version input default); remove once SDKs move to freezed 3.x / analyzer 8.
      flutter-version: ${{ inputs.flutter-version || '3.44.9' }}
      java-version: ${{ inputs.java-version || '17' }}
      app-type: ${{ inputs.app-type }}
    secrets: inherit

  ci-flutter-windows:
    needs: [detect-changes, lint]
    if: |
      always() &&
      inputs.run_ci &&
      inputs.project_type == 'flutter' &&
      inputs.build_windows == true &&
      needs.detect-changes.outputs.trivial != 'true' &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped')
    uses: RokctAI/shared-workflows/.github/workflows/universal-flutter-build.yml@fed18a76a3107bcd8293a24d3e949addfdd09e84 # main
    with:
      build-type: windows
      flutter-channel: ${{ inputs.flutter-channel || 'stable' }}
      # 3.44.9 fallback: Flutter 3.47.0 + analyzer <8 hangs build_runner (see flutter-version input default); remove once SDKs move to freezed 3.x / analyzer 8.
      flutter-version: ${{ inputs.flutter-version || '3.44.9' }}
      java-version: ${{ inputs.java-version || '17' }}
      app-type: ${{ inputs.app-type }}
    secrets: inherit

  verify-flutter:
    needs: ci-flutter
    if: |
      !cancelled() &&
      inputs.run_verify &&
      inputs.project_type == 'flutter' &&
      needs.ci-flutter.result == 'success'
    uses: RokctAI/shared-workflows/.github/workflows/universal-flutter-verify.yml@fed18a76a3107bcd8293a24d3e949addfdd09e84 # main
    with:
      package_name: ${{ needs.ci-flutter.outputs.package_name }}
    secrets: inherit

  # 4. RELEASE
  release:
    needs: [detect-changes, ci-frappe, ci-node, ci-flutter, verify-flutter, observability-compliance]
    if: |
      always() && 
      needs.detect-changes.outputs.trivial != 'true' &&
      (needs.observability-compliance.result == 'success' || needs.observability-compliance.result == 'skipped') &&
      (github.ref_name == 'develop' || (
        (needs.ci-frappe.result == 'success' || needs.ci-frappe.result == 'skipped') &&
        (needs.ci-node.result == 'success' || needs.ci-node.result == 'skipped') &&
        (needs.ci-flutter.result == 'success' || needs.ci-flutter.result == 'skipped') &&
        (needs.verify-flutter.result == 'success' || needs.verify-flutter.result == 'skipped')
      )) &&
      (inputs.build_windows == false || (inputs.build_windows == true && (github.event_name == 'schedule' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'develop' || github.ref_name == 'main' || startsWith(github.ref_name, 'build_'))))))
    uses: RokctAI/shared-workflows/.github/workflows/universal-release.yml@fed18a76a3107bcd8293a24d3e949addfdd09e84 # main
    with:
      project_type: ${{ inputs.project_type }}
      release_strategy: ${{ inputs.release_strategy || 'immediate' }}
      version_file: ${{ inputs.version_file || 'version.json' }}
      version_format: ${{ inputs.version_format || '##.##.##' }}
      brain_endpoint: ${{ inputs.brain_endpoint }}
      build_android: ${{ inputs.build_android }}
      build_windows: ${{ inputs.build_windows }}
      cleanup_rc_releases: ${{ inputs.cleanup_rc_releases }}
      one_time_cleanup_cutoff_date: ${{ inputs.one_time_cleanup_cutoff_date }}
      backfill_ai_notes_cutoff_version: ${{ inputs.backfill_ai_notes_cutoff_version }}
      node-version: ${{ inputs.node-version || '24' }}
      flutter-channel: ${{ inputs.flutter-channel || 'stable' }}
      # 3.44.9 fallback: Flutter 3.47.0 + analyzer <8 hangs build_runner (see flutter-version input default); remove once SDKs move to freezed 3.x / analyzer 8.
      flutter-version: ${{ inputs.flutter-version || '3.44.9' }}
      java-version: ${{ inputs.java-version || '17' }}
      python-version: ${{ inputs.python-version || '3.14' }}
      app-type: ${{ inputs.app-type }}
    secrets: inherit
