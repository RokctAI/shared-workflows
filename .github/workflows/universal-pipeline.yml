name: Universal Pipeline Orchestrator

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true


on:
  workflow_call:
    inputs:
      project_type:
        required: true
        type: string
        description: "Project type: 'frappe', 'node', or 'flutter'"
      app-type:
        required: false
        type: string
        description: "App role: customer, driver, manager, pos (Flutter only)"
      run_security:
        type: boolean
        default: true
      run_lint:
        type: boolean
        default: true
      run_ci:
        type: boolean
        default: true
      # --- CI Environment Inputs ---
      # Node.js
      node-version:
        type: string
        default: '24'
      package-manager:
        type: string
        default: 'pnpm'
      # Frappe / Python
      python-version:
        type: string
        default: '3.14.2'
      mariadb-version:
        type: string
        default: '10.6'
      postgres-version:
        type: string
        default: '15'
      db-type:
        type: string
        default: 'mariadb'
        description: "Database type: 'mariadb' or 'postgres'"
      db-password:
        required: false
        type: string
        default: 'travis'
        description: "Password for the database service"
      redis-version:
        type: string
        default: '6.0'
      install-erpnext:
        type: boolean
        default: false
      install-payments:
        type: boolean
        default: false
      bootstrap:
        type: boolean
        default: false
      # Flutter
      flutter-channel:
        type: string
        default: 'stable'
      flutter-version:
        type: string
        default: ''
      java-version:
        type: string
        default: '17'

      # --- Release Inputs (Proxied to universal-release.yml) ---
      release_strategy:
        type: string
        default: 'immediate'
      version_file:
        type: string
        default: 'version.json'
      version_format:
        type: string
        default: '##.##.##'
        description: "Format for version bumping (e.g. ##.##.## or ##.##.#)"
      brain_endpoint:
        type: string
      build_android:
        type: boolean
        default: false
      build_windows:
        type: boolean
        default: false
      cleanup_rc_releases:
        type: boolean
        default: true
      one_time_cleanup_cutoff_date:
        type: string
        default: ""
      backfill_ai_notes_cutoff_version:
        type: string
        default: ""
        description: "Version (e.g. 1.0.0) - Regenerate AI release notes for all stable tags *starting* from this version. Leave empty to disable."

    secrets:
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

jobs:
  # 0. PR RESURRECTOR (Catch-all for revived branches)
  pr-resurrector:
    uses: RokctAI/shared-workflows/.github/workflows/universal-pr-resurrector.yml@main
    secrets: inherit

  # 1. SECURITY
  security:
    if: inputs.run_security
    uses: RokctAI/shared-workflows/.github/workflows/universal-security.yml@main
    secrets: inherit

  # 2. LINT
  lint:
    needs: security
    if: always() && (needs.security.result == 'success' || needs.security.result == 'skipped') && inputs.run_lint
    uses: RokctAI/shared-workflows/.github/workflows/universal-linter.yml@main
    with:
      run-build-runner: ${{ inputs.project_type == 'flutter' }}
      flutter-channel: ${{ inputs.flutter-channel || 'stable' }}
      flutter-version: ${{ inputs.flutter-version }}
      force-fix: ${{ github.ref_name == 'main' || github.ref_name == 'develop' }}
    secrets: inherit

  # 3. CI / BUILD (Project Specific Jobs)
  ci-frappe:
    needs: lint
    if: always() && (needs.lint.result == 'success' || needs.lint.result == 'skipped') && inputs.run_ci && inputs.project_type == 'frappe'
    uses: RokctAI/shared-workflows/.github/workflows/universal-frappe-ci.yml@main
    with:
      python-version: ${{ inputs.python-version || '3.14' }}
      mariadb-version: ${{ inputs.mariadb-version || '10.6' }}
      postgres-version: ${{ inputs.postgres-version || '15' }}
      db-type: ${{ inputs.db-type || 'mariadb' }}
      db-password: ${{ inputs.db-password || 'travis' }}
      redis-version: ${{ inputs.redis-version || '6.0' }}
      node-version: ${{ inputs.node-version || '24' }}
      install-erpnext: ${{ inputs.install-erpnext }}
      install-payments: ${{ inputs.install-payments }}
      bootstrap: ${{ inputs.bootstrap }}
    secrets: inherit

  ci-node:
    needs: lint
    if: always() && (needs.lint.result == 'success' || needs.lint.result == 'skipped') && inputs.run_ci && inputs.project_type == 'node'
    uses: RokctAI/shared-workflows/.github/workflows/universal-node-ci.yml@main
    with:
      node-version: ${{ inputs.node-version || '24' }}
      package-manager: ${{ inputs.package-manager || 'pnpm' }}
      # Dynamic command generation based on package manager
      build-command: ${{ format('{0} run build', inputs.package-manager || 'pnpm') }}
      test-command: ${{ format('{0} run test', inputs.package-manager || 'pnpm') }}
    secrets: inherit

  ci-flutter:
    needs: lint
    if: always() && (needs.lint.result == 'success' || needs.lint.result == 'skipped') && inputs.run_ci && inputs.project_type == 'flutter'
    uses: RokctAI/shared-workflows/.github/workflows/universal-flutter-build.yml@main
    with:
      # Note: build-type here for CI is usually 'apk' or similar to verify compilation
      build-type: ${{ inputs.build_android && 'apk' || 'apk' }} 
      flutter-channel: ${{ inputs.flutter-channel || 'stable' }}
      flutter-version: ${{ inputs.flutter-version }}
      java-version: ${{ inputs.java-version || '17' }}
      app-type: ${{ inputs.app-type }}
    secrets: inherit

  # 4. RELEASE (The Gate)
  release:
    needs: [ci-frappe, ci-node, ci-flutter]
    # Gate logic: SUCCESS or SKIPPED for all needs, OR Bypass if develop
    if: |
      always() && 
      (github.ref_name == 'develop' || (
        (needs.ci-frappe.result == 'success' || needs.ci-frappe.result == 'skipped') &&
        (needs.ci-node.result == 'success' || needs.ci-node.result == 'skipped') &&
        (needs.ci-flutter.result == 'success' || needs.ci-flutter.result == 'skipped')
      )) &&
      (inputs.build_windows == false || (inputs.build_windows == true && (github.event_name == 'schedule' || (github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main' || startsWith(github.ref_name, 'build_'))))))
    uses: RokctAI/shared-workflows/.github/workflows/universal-release.yml@main
    with:
      release_strategy: ${{ inputs.release_strategy || 'immediate' }}
      version_file: ${{ inputs.version_file || 'version.json' }}
      version_format: ${{ inputs.version_format || '##.##.##' }}
      brain_endpoint: ${{ inputs.brain_endpoint }}
      build_android: ${{ inputs.build_android }}
      build_windows: ${{ inputs.build_windows }}
      cleanup_rc_releases: ${{ inputs.cleanup_rc_releases }}
      one_time_cleanup_cutoff_date: ${{ inputs.one_time_cleanup_cutoff_date }}
      backfill_ai_notes_cutoff_version: ${{ inputs.backfill_ai_notes_cutoff_version }}
      # Environment 
      node-version: ${{ inputs.node-version || '24' }}
      flutter-channel: ${{ inputs.flutter-channel || 'stable' }}
      flutter-version: ${{ inputs.flutter-version }}
      java-version: ${{ inputs.java-version || '17' }}
      python-version: ${{ inputs.python-version || '3.14' }}
      app-type: ${{ inputs.app-type }}
    secrets: inherit
