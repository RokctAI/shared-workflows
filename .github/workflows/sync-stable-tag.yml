name: Sync Stable Tag
on:
  release:
    types: [published]
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      target_tag:
        description: "Tag to point 'stable' to (Auto-calculated if empty)"
        required: false
        type: string

jobs:
  sync-tag:
    # Trigger on release (if not pre-release), manual dispatch, or push to main
    if: |
      github.event_name == 'workflow_dispatch' || 
      github.event_name == 'push' ||
      (github.event_name == 'release' && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Resolve Target Tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "Using release tag: ${{ github.event.release.tag_name }}"
            echo "target=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ ! -z "${{ inputs.target_tag }}" ]; then
            INPUT_TAG="${{ inputs.target_tag }}"
            # Robust check for 'v' prefix
            if git rev-parse "$INPUT_TAG" >/dev/null 2>&1; then
              echo "target=$INPUT_TAG" >> $GITHUB_OUTPUT
            elif git rev-parse "v$INPUT_TAG" >/dev/null 2>&1; then
              echo "target=v$INPUT_TAG" >> $GITHUB_OUTPUT
            else
              echo "❌ Failed to resolve '$INPUT_TAG' as a valid ref."
              exit 1
            fi
          else
            echo "🔍 Finding latest stable release using GitHub labels..."
            # 🎯 Finds the latest release NOT marked as a pre-release
            LATEST=$(gh release list --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName' || echo "")
            if [ -z "$LATEST" ]; then
               # Fallback to git tags if no releases found
               LATEST=$(git tag --sort=-v:refname | grep -vE "-(rc|beta|alpha|dev)" | head -n 1 || echo "")
            fi
            echo "✅ Found: $LATEST"
            echo "target=$LATEST" >> $GITHUB_OUTPUT
          fi

      - name: Sync stable tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET="${{ steps.resolve.outputs.target }}"
          if [ -z "$TARGET" ]; then
            echo "❌ No stable tag found to sync."
            exit 0
          fi
          
          echo "🚀 Pointing '@stable' to $TARGET..."
          
          # Check if 'stable' already points here
          CURRENT_STABLE=$(git rev-parse stable 2>/dev/null || echo "none")
          TARGET_SHA=$(git rev-parse "$TARGET")
          
          if [ "$CURRENT_STABLE" == "$TARGET_SHA" ]; then
            echo "✅ '@stable' is already up to date."
            exit 0
          fi

          # Use git push approach - will work for future non-workflow changes
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f stable "$TARGET"
          git push origin stable --force
