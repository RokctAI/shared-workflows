name: Sync Stable Tag
on:
  release:
    types: [published]
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      target_tag:
        description: "Tag to point 'stable' to (Auto-calculated if empty)"
        required: false
        type: string

jobs:
  sync-tag:
    # Trigger on release (if not pre-release), manual dispatch, or push to main
    if: |
      github.event_name == 'workflow_dispatch' || 
      github.event_name == 'push' ||
      (github.event_name == 'release' && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Resolve Target Tag
        id: resolve
        run: |
          # Ensure all tags are available for resolution
          git fetch --tags --force
          
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "Using release tag: ${{ github.event.release.tag_name }}"
            echo "target=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ ! -z "${{ inputs.target_tag }}" ]; then
            INPUT_TAG="${{ inputs.target_tag }}"
            # Robust check for 'v' prefix
            if git rev-parse "$INPUT_TAG" >/dev/null 2>&1; then
              echo "target=$INPUT_TAG" >> $GITHUB_OUTPUT
            elif git rev-parse "v$INPUT_TAG" >/dev/null 2>&1; then
              echo "✅ Resolved $INPUT_TAG to v$INPUT_TAG"
              echo "target=v$INPUT_TAG" >> $GITHUB_OUTPUT
            else
              echo "❌ Failed to resolve '$INPUT_TAG' or 'v$INPUT_TAG' as a valid ref."
              exit 1
            fi
          else
            echo "🔍 Calculating latest stable tag from history..."
            # Simplified grep for maximum portability
            LATEST=$(git tag --sort=-v:refname | grep -v "\-rc" | grep -v "\-beta" | grep -v "\-alpha" | grep -v "\-dev" | head -n 1)
            echo "✅ Found: $LATEST"
            echo "target=$LATEST" >> $GITHUB_OUTPUT
          fi

      - name: Sync stable tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET="${{ steps.resolve.outputs.target }}"
          if [ -z "$TARGET" ]; then
            echo "❌ No stable tag found to sync."
            exit 0
          fi
          
          echo "🚀 Pointing '@stable' pointer to $TARGET..."
          
          # Use high-level 'gh release' which is often more privileged than 'git push' 
          # for workflow-related commits.
          
          # 1. Delete existing 'stable' release/tag if it exists
          gh release delete stable --yes --cleanup-tag 2>/dev/null || echo "Stable release not found, creating new..."
          
          # 2. Create new release named 'stable' pointing to our target
          # This automatically creates the 'stable' tag at the same commit as $TARGET
          gh release create stable --target "$TARGET" \
            --title "Stable Pointer" \
            --notes "This is an automated pointer for the fleet. Current version: $TARGET" \
            --prerelease=false
          
          echo "✅ '@stable' pointer successfully updated to $TARGET."
