name: Sync Stable Tag
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target_tag:
        description: "Tag to point 'stable' to (Auto-calculated if empty)"
        required: false
        type: string

jobs:
  sync-tag:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Resolve Target Tag
        id: resolve
        run: |
          # Ensure all tags are available for resolution
          git fetch --tags --force
          
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            INPUT_TAG="${{ inputs.target_tag }}"
            if [ -z "$INPUT_TAG" ]; then
              echo "🔍 Calculating latest stable tag..."
              # Find latest tag that doesn't contain -rc, -beta, -alpha, etc.
              LATEST=$(git tag --sort=-v:refname | grep -vE "-(rc|beta|alpha|dev)" | head -n 1)
              echo "✅ Found: $LATEST"
              echo "target=$LATEST" >> $GITHUB_OUTPUT
            else
              # Robust check for 'v' prefix if direct resolution fails
              if git rev-parse "$INPUT_TAG" >/dev/null 2>&1; then
                echo "target=$INPUT_TAG" >> $GITHUB_OUTPUT
              elif git rev-parse "v$INPUT_TAG" >/dev/null 2>&1; then
                echo "✅ Resolved $INPUT_TAG to v$INPUT_TAG"
                echo "target=v$INPUT_TAG" >> $GITHUB_OUTPUT
              else
                echo "❌ Failed to resolve '$INPUT_TAG' or 'v$INPUT_TAG' as a valid ref."
                exit 1
              fi
            fi
          else
            echo "Using release tag: ${{ github.event.release.tag_name }}"
            echo "target=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Sync stable tag
        run: |
          TARGET="${{ steps.resolve.outputs.target }}"
          if [ -z "$TARGET" ]; then
            echo "❌ No stable tag found to sync."
            exit 1
          fi
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "🚀 Pointing 'stable' to $TARGET..."
          git tag -f stable "$TARGET"
          git push origin stable --force
