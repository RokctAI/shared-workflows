# Copyright 2026 ROKCT INTELLIGENCE (PTY) LTD

name: Universal Guided Tour

# Builds the calling app shell with its built-in demo dataset
# (--dart-define=IS_DEMO=true --dart-define=TOUR_MODE=true), walks a scripted
# guided tour on a headless Android emulator, captures a screenshot per step,
# assembles a markdown feature guide (required) and a vertical marketing
# video (best-effort), and commits the outputs to marketing/tour/ in the
# caller repo. Tour steps are merged from the app's tour/app.tour.yaml plus
# the brand-neutral fragments each composed SDK ships in templates/tour/.
# See scripts/tour/README.md in this repo for the format.
#
# After the phone leg, a second SERIAL emulator leg (input `tablet`, on by
# default) reruns the same tour on a 10-inch tablet AVD and commits tablet
# geometry outputs to marketing/tour/tablet/ — its store/ stills feed the
# Play listing's tenInchScreenshots slot. A tablet failure fails the job
# (honest signal) but never blocks the phone outputs from committing.

permissions: write-all
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PIP_BREAK_SYSTEM_PACKAGES: 1

on:
  workflow_call:
    inputs:
      flutter-channel:
        required: false
        type: string
        default: 'stable'
      flutter-version:
        required: false
        type: string
        # Pinned for the same reason as universal-flutter-build: 3.47.0 hangs
        # build_runner with freezed 2.x.
        default: '3.44.9'
      java-version:
        required: false
        type: string
        default: '17'
      tools-ref:
        required: false
        type: string
        default: 'main'
        description: "Ref of RokctAI/shared-workflows to take the tour scripts from"
      fragments-ref:
        required: false
        type: string
        default: 'main'
        description: "Ref to fetch SDK tour fragments from when the composed cache has none"
      manifest-ref:
        required: false
        type: string
        default: 'main'
        description: "Ref of RokctAI/The-Rokct-Protocol to fetch the canonical composer manifest from"
      tour-manifest:
        required: false
        type: string
        default: 'tour/app.tour.yaml'
      output-dir:
        required: false
        type: string
        default: 'marketing/tour'
      commit-outputs:
        required: false
        type: boolean
        default: true
        description: "Commit the assembled outputs back to the caller repo"
      tablet:
        required: false
        type: boolean
        default: true
        description: "Also rerun the tour on a 10-inch tablet emulator leg and publish tablet assets to <output-dir>/tablet"
    secrets:
      MONOREPO_PAT:
        required: false
      GOOGLE_SERVICES_JSON:
        required: false

jobs:
  tour:
    name: 🎬 Guided Tour
    runs-on: ubuntu-latest
    # Compose + build_runner + debug build + emulator tour is a long ride —
    # and the tablet leg reruns the tour on a second emulator; cap it so a
    # wedged emulator cannot squat a runner for hours.
    timeout-minutes: 210
    env:
      MONOREPO_PAT: ${{ secrets.MONOREPO_PAT }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Checkout Tour Tooling (shared-workflows)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: RokctAI/shared-workflows
          ref: ${{ inputs.tools-ref }}
          path: .tour-tools

      - name: Initiate Protocol
        shell: bash
        run: |
          if [ -f ".rokct/initiate.py" ]; then
            python .rokct/initiate.py
          else
            curl -sSL https://raw.githubusercontent.com/RokctAI/The-Rokct-Protocol/main/profiles/web/initiate.py -o initiate_temp.py
            python initiate_temp.py
            rm initiate_temp.py
          fi

      - name: Select Composer Manifest (If App Shell)
        shell: bash
        env:
          MANIFEST_REF: ${{ inputs.manifest-ref }}
        run: |
          if [ -f ".rokct/config/app_type" ]; then
            APP_TYPE=$(tr -d '\r\n[:space:]' < .rokct/config/app_type)
            echo "🔧 App shell detected (app_type=$APP_TYPE). Selecting composer manifest (ref: ${MANIFEST_REF})..."
            curl -sSL "https://raw.githubusercontent.com/RokctAI/The-Rokct-Protocol/${MANIFEST_REF}/core/utils/flutter/composer/${APP_TYPE}.json" -o composer.json.tmp
            if [ -s composer.json.tmp ] && python3 -c "import json; json.load(open('composer.json.tmp'))" 2>/dev/null; then
              mv composer.json.tmp composer.json
              echo "✅ composer.json set from composer/${APP_TYPE}.json (overwritten)"
            else
              echo "::error::No composer manifest found for app_type='${APP_TYPE}' at core/utils/flutter/composer/${APP_TYPE}.json"
              rm -f composer.json.tmp
              exit 1
            fi
          else
            echo "ℹ️ No .rokct/config/app_type - not an app shell. Skipping composer manifest selection."
          fi

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'zulu'
          java-version: ${{ inputs.java-version }}

      - name: Helper - Subosito Flutter
        # Must run BEFORE the compose step: the composer itself invokes
        # `flutter pub get` inside the SDK caches it clones.
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ inputs.flutter-channel }}
          flutter-version: ${{ inputs.flutter-version }}
          cache: true

      - name: Compose Flutter SDK Modules (If Shell App)
        shell: bash
        run: |
          if [ -f "composer.json" ]; then
            echo "🚀 Shell app detected (composer.json found). Composing SDK modules..."
            if [ ! -f ".rokct/skills/.rok/flutter/scripts/compose.py" ] && [ -f ".rokct/initiate.py" ]; then
              echo "Canonical composer missing. Provisioning via .rokct/initiate.py..."
              python .rokct/initiate.py
            fi
            if [ -f ".rokct/skills/.rok/flutter/scripts/compose.py" ]; then
              python .rokct/skills/.rok/flutter/scripts/compose.py
            elif [ -f ".rokct/skills/flutter/scripts/compose.py" ]; then
              python .rokct/skills/flutter/scripts/compose.py
            elif [ -f ".rokct/compose.py" ]; then
              python .rokct/compose.py
            else
              echo "::error::composer.json present but no composer found (no initiate.py, no skills composer, no legacy wrapper)."
              exit 1
            fi
          else
            echo "ℹ️ Not a shell app (no composer.json). Building lib/ as-is."
          fi

      # The composer re-injects core's android/ template on EVERY run, and
      # its overwrite guard (The-Rokct-Protocol sdk_installer_base.py, the
      # `if os.path.exists(file_dest):` branch) only protects files that
      # ALREADY exist - so deleting a stray template source in the caller
      # repo removes its own protection and the next compose copies it
      # straight back in. That is silent: sdk_composer.py runs installers
      # with capture_output=True and discards stdout on success.
      #
      # Concretely: core's templates/android ships
      # app/src/main/kotlin/com/app/demo/JuvoApplication.kt, which extends
      # androidx.multidex.MultiDexApplication. A shell whose own
      # android/app/build.gradle declares no multidex dependency still
      # COMPILES that file - Gradle compiles the whole kotlin source root,
      # not just the namespace dir - and assembleDebug dies with
      # "Unresolved reference 'multidex'" (RokctAI/radio run 33331414844).
      #
      # universal-flutter-build already prunes this inside its Dynamic
      # Source Rename step, but the tour lane has no rename step at all, so
      # it needs its own prune. There is no app-type/production.env package
      # resolution in this lane and no rename happens here, so the app's OWN
      # build.gradle namespace is the correct source of truth for what to
      # keep.
      - name: Prune Stray Kotlin Sources Outside App Package
        shell: bash
        run: |
          BASE_DIR="android/app/src/main/kotlin"
          GRADLE_FILE="android/app/build.gradle"
          if [ ! -f "$GRADLE_FILE" ] && [ -f "android/app/build.gradle.kts" ]; then
            GRADLE_FILE="android/app/build.gradle.kts"
          fi

          # FAIL-SAFE 1: no kotlin source root, nothing to prune.
          if [ ! -d "$BASE_DIR" ]; then
            echo "ℹ️ No $BASE_DIR - nothing to prune. Skipping."
            exit 0
          fi

          # FAIL-SAFE 2: no build.gradle means no namespace to trust.
          if [ ! -f "$GRADLE_FILE" ]; then
            echo "⚠️ No android/app/build.gradle(.kts) found - cannot determine the app package. Skipping prune (nothing deleted)."
            exit 0
          fi

          # Anchored at line start so a commented-out namespace or an
          # unrelated key (testNamespace, ...) cannot win the match, and the
          # separator is optional so BOTH Gradle spellings parse:
          #   namespace "com.app.demo"      (core's template)
          #   namespace = "app.radio.fm"    (radio, and the Kotlin DSL)
          # Single quotes, a trailing semicolon and a trailing comment are
          # all tolerated; only the quoted package itself is captured, so an
          # "=" can never be mistaken for the package name.
          TARGET_PACKAGE=$(sed -n -E "s/^[[:space:]]*namespace[[:space:]]*[=(]?[[:space:]]*['\"]([A-Za-z0-9_.]+)['\"].*$/\1/p" "$GRADLE_FILE" | head -n 1)

          # FAIL-SAFE 3: an empty/garbage package would make the keep
          # pattern match nothing and delete EVERY Kotlin source, MainActivity
          # included. Never prune on an unparsed namespace.
          if [ -z "$TARGET_PACKAGE" ]; then
            echo "⚠️ Could not parse a namespace from $GRADLE_FILE - skipping prune (nothing deleted)."
            echo "   Namespace-ish lines seen:"
            grep -n -i "namespace" "$GRADLE_FILE" | sed 's/^/     /' || echo "     (none)"
            exit 0
          fi

          TARGET_PATH=$(echo "$TARGET_PACKAGE" | tr '.' '/')

          # FAIL-SAFE 4: if the app's own package dir is not there, the
          # namespace does not describe this source tree - pruning would
          # wipe the whole root. Skip instead.
          if [ ! -d "$BASE_DIR/$TARGET_PATH" ]; then
            echo "⚠️ Namespace '$TARGET_PACKAGE' resolves to $BASE_DIR/$TARGET_PATH, which does not exist - skipping prune (nothing deleted)."
            exit 0
          fi

          echo "🎯 App package: $TARGET_PACKAGE (keeping $BASE_DIR/$TARGET_PATH)"
          KEPT=0
          REMOVED=0
          while IFS= read -r KT_FILE; do
            case "$KT_FILE" in
              "$BASE_DIR/$TARGET_PATH"/*)
                # Inside the app's own package (any depth) - always keep.
                echo "  ✅ keep:   $KT_FILE"
                KEPT=$((KEPT + 1))
                ;;
              *)
                echo "  🗑️ remove: $KT_FILE (outside $TARGET_PACKAGE)"
                rm -f "$KT_FILE"
                REMOVED=$((REMOVED + 1))
                ;;
            esac
          done < <(find "$BASE_DIR" -type f -name '*.kt' | sort)

          if [ "$REMOVED" -gt 0 ]; then
            find "$BASE_DIR" -mindepth 1 -type d -empty -delete
          fi
          echo "✅ Kotlin source root pruned: $KEPT kept, $REMOVED removed."

      - name: Get Dependencies
        shell: bash
        run: |
          flutter pub get
          # See universal-flutter-build: build_runner >=2.15 needs --force-jit
          # when any resolved package ships a native-asset build hook; older
          # build_runner versions do not know the flag.
          if ! dart run build_runner build --force-jit --delete-conflicting-outputs > build_runner_log.txt 2>&1; then
            if grep -q 'Could not find an option named' build_runner_log.txt; then
              echo 'build_runner does not recognize --force-jit (older version); retrying with plain build'
              dart run build_runner build --delete-conflicting-outputs >> build_runner_log.txt 2>&1
            else
              tail -n 100 build_runner_log.txt
              exit 1
            fi
          fi

      - name: "Fetch/Decode Google Services JSON (Priority: Local > Occultation > Secret)"
        env:
          GH_TOKEN: ${{ env.MONOREPO_PAT }}
          DEFAULT_JSON: "${{ secrets.GOOGLE_SERVICES_JSON }}"
        shell: bash
        run: |
          if [ -f android/app/google-services.json ]; then
            echo "✅ android/app/google-services.json already exists. Skipping."
          elif [ -n "$GH_TOKEN" ] && gh api repos/RokctAI/Occultation/contents/.env/google-services.json -H "Accept: application/vnd.github.v3.raw" > android/app/google-services.json 2>/dev/null; then
            echo "✅ Successfully synced google-services.json from Occultation."
          elif [ -n "$DEFAULT_JSON" ]; then
            echo "$DEFAULT_JSON" | base64 --decode > android/app/google-services.json
            echo "✅ Successfully decoded google-services.json from secrets."
          else
            echo "ℹ️ No Google Services configuration found."
          fi

      - name: Fetch Production Environment from Occultation
        if: env.MONOREPO_PAT != ''
        env:
          GH_TOKEN: ${{ env.MONOREPO_PAT }}
        shell: bash
        run: |
          mkdir -p .env
          echo "🔍 Fetching production.env from RokctAI/Occultation..."
          gh api "repos/RokctAI/Occultation/contents/.env/production.env" -H "Accept: application/vnd.github.v3.raw" > ".env/production.env"
          if grep -q "##########END_FLUTTER##########" ".env/production.env"; then
            sed -i '1,/##########END_FLUTTER##########/!d' ".env/production.env"
          fi
          sed -i 's/\r$//' ".env/production.env"
          # dart-define-from-file does not support # comments or blank lines
          sed -i '/^[[:space:]]*#/d; /^[[:space:]]*$/d' ".env/production.env"
          echo "✅ .env/production.env ready for Flutter ($(wc -l < .env/production.env) keys)."

      - name: Install Tour Python Dependencies
        shell: bash
        run: python3 -m pip install --quiet pyyaml pillow

      - name: Merge Tour Fragments and Generate Runner
        id: merge
        shell: bash
        env:
          FRAGMENTS_REF: ${{ inputs.fragments-ref }}
        run: |
          python3 .tour-tools/scripts/tour/merge_fragments.py \
            --app-manifest "${{ inputs.tour-manifest }}" \
            --composer composer.json \
            --cache-dir .rokct/cache \
            --fragments-ref "$FRAGMENTS_REF" \
            --fallback-ref main \
            --out-json tour.resolved.json \
            --out-dart integration_test/tour_steps.g.dart

      - name: Build Demo Debug APK (warm cache + compile gate)
        id: build-apk
        shell: bash
        run: |
          BUILD_ARGS=(--debug --dart-define=IS_DEMO=true --dart-define=TOUR_MODE=true)
          if [ -f .env/production.env ]; then
            BUILD_ARGS+=(--dart-define-from-file=.env/production.env)
          fi
          flutter build apk "${BUILD_ARGS[@]}"

      # The debug build leaves a Gradle daemon (and a Kotlin compile daemon)
      # resident, idling on their multi-GB heaps for hours by default. The
      # emulator legs then add a 3-4GB guest plus SwiftShader rendering on
      # the same 16GB runner. On paas_manager run 33750918166 the tablet
      # leg's qemu vanished ~2 minutes after the app install on BOTH
      # attempts with the host's swap at 1861/3071 and then 2829/3071 MB
      # used, no qemu process left, no kernel OOM line and no emulator
      # minidump - the profile of a userspace (systemd-oomd) kill under
      # memory pressure rather than a crash. Hand the memory back before the
      # first leg; the emulator reset steps below repeat this before every
      # later leg, because `flutter test` respawns the daemon to build the
      # test APK. Evidence, not a gate: nothing here may fail the job.
      - name: Stop Gradle Daemons Before the Emulator Legs
        continue-on-error: true
        shell: bash
        run: |
          if [ -x android/gradlew ]; then
            (cd android && ./gradlew --stop) || true
          fi
          pkill -f 'GradleDaemon|KotlinCompileDaemon' || true
          sleep 2
          free -m

      # reactivecircus/android-emulator-runner executes each line of its
      # `script:` input as a SEPARATE `sh -c` command, so the whole tour flow
      # lives in one script file handed over as a single line (same pattern
      # as universal-flutter-verify).
      - name: Prepare Tour Script
        shell: bash
        env:
          EXPECTED_SHOTS: ${{ steps.merge.outputs.expected_screenshots }}
        run: |
          cat > run_tour.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -uo pipefail

          # One script for BOTH device legs: the phone defaults below match
          # the historical behaviour byte-for-byte; the tablet leg overrides
          # them via the step-level TOUR_* env vars instead of duplicating
          # the script.
          OUT="${TOUR_OUT:-tour_screenshots}"
          WM_SIZE="${TOUR_WM_SIZE:-1080x1920}"
          WM_DENSITY="${TOUR_WM_DENSITY:-400}"
          LOGCAT_DUMP="${TOUR_LOGCAT:-tour_logcat.txt}"
          TEST_LOG="${TOUR_TEST_LOG:-tour_test_output.log}"
          # A retry must start from an EMPTY "$OUT" (never merge with the
          # previous attempt's set) - but it must not throw that set away
          # either. On paas_manager run 33750918166 the tablet retry's
          # emulator was starved from boot (launcher ANR, 0 of 19) and the
          # plain `rm -rf "$OUT"` here erased the 7 stills the first attempt
          # had captured, so nothing was assembled or committed. "$OUT.status"
          # is written by every completed attempt, so its presence is what
          # says "this is a retry": park the previous attempt's stills and
          # sidecars as "$OUT.prev*" and let the end of this script keep
          # whichever attempt captured more (see the [tour-retry] block).
          # The ANR sidecar lives NEXT to the output dir, so it is parked
          # too - a retry can never inherit the previous attempt's verdict.
          rm -rf "$OUT.prev" "$OUT.prev.status" "$OUT.prev.anr"
          if [ -f "$OUT.status" ] && [ -d "$OUT" ]; then
            echo "[tour-retry] previous attempt found for $OUT - parking it as $OUT.prev until this attempt is counted"
            mv "$OUT" "$OUT.prev" || rm -rf "$OUT"
            mv "$OUT.status" "$OUT.prev.status" || rm -f "$OUT.status"
            if [ -f "$OUT.anr" ]; then
              mv "$OUT.anr" "$OUT.prev.anr" || rm -f "$OUT.anr"
            fi
          fi
          rm -rf "$OUT"
          mkdir -p "$OUT"
          rm -f "$OUT.anr"

          # Host-side baseline for this leg, taken before the app install so
          # the death diagnostics further down (same file, appended) can be
          # read against what the host looked like when the emulator was
          # still healthy: memory and swap, whether systemd-oomd is armed and
          # what it watches, and which processes hold the memory (a Gradle
          # or Kotlin daemon left over from the build shows up here).
          # Never allowed to fail the leg.
          {
            echo "=== baseline for $OUT: $(date -u) ==="
            echo "--- free -m ---"
            free -m || true
            echo "--- systemctl is-active systemd-oomd ---"
            systemctl is-active systemd-oomd 2>&1 || true
            echo "--- oomctl (first 20 lines) ---"
            if command -v oomctl >/dev/null 2>&1; then oomctl 2>&1 | head -n 20; else echo "oomctl: not installed"; fi || true
            echo "--- top processes by RSS (KB) ---"
            ps -eo pid,rss,etimes,comm --sort=-rss 2>&1 | head -n 12 || true
            echo "=== end baseline ==="
          } >> "$OUT.host-diag.txt" 2>&1 || true

          adb wait-for-device
          # Portrait canvas for the stills/video: 1080x1920 9:16 at density
          # 400 on the phone leg (1080 / (400/160) = 432dp wide, one plane,
          # a phone), 1600x2560 10:16 at density 240 on the tablet leg
          # (1600 / (240/160) = 1066dp wide, past the 840dp three-plane
          # breakpoint - see the tablet leg's comment below). Tablet AVDs
          # are landscape-natural, so pin rotation to portrait too — a no-op
          # on the phone AVD, which already boots portrait.
          adb shell settings put system accelerometer_rotation 0 || true
          adb shell settings put system user_rotation 0 || true
          # The tablet retry boots an AVD whose config.ini ALREADY carries
          # its portrait geometry (see its pre-emulator-launch-script) and
          # sets TOUR_SKIP_DISPLAY_OVERRIDE=1, so the post-boot override
          # below is skipped there. On paas_manager run 33788543637 that
          # natively portrait retry (1600x2560 @ 240, no override) died with
          # the same SIGSEGV as the overridden first attempt, so the
          # override itself is exonerated; it stays skippable so the retry
          # can vary the AVD geometry without the override rewriting it.
          # Nothing later undoes the override (no `wm size reset`), so
          # skipping it leaves nothing else to skip. Log when it applies so
          # the leg's log says which geometry the stills were taken at.
          if [ "${TOUR_SKIP_DISPLAY_OVERRIDE:-}" != "1" ]; then
            echo "[tour] display override: wm size ${WM_SIZE} density ${WM_DENSITY}"
            adb shell wm size "$WM_SIZE" || true
            adb shell wm density "$WM_DENSITY" || true
          else
            echo "[tour] display override skipped (native portrait AVD)"
          fi
          # Forcing `wm size`/`wm density` re-enters immersive mode, and the
          # first time an app goes full screen Android throws up its own
          # ImmersiveModeConfirmation window ("Viewing full screen / To exit,
          # swipe down from the top / Got it"). Captures take the whole
          # framebuffer, so that dialog is burned over the app in the stills
          # (Window{... ImmersiveModeConfirmation} in the logcat dump; it is
          # neither an ANR nor a crash, so the ANR watcher correctly ignores
          # it). Marking it pre-confirmed keeps it out of frame entirely.
          adb shell settings put secure immersive_mode_confirmations confirmed || true

          TOUR_APK="build/app/outputs/flutter-apk/app-debug.apk"
          TOUR_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          # Read by the pre-tour ANR clear right below (which must never
          # force-stop the app under test), by the grant loop further down
          # AND handed to the capture watcher (--package), whose foreground
          # guard keeps a still only while this package owns the focused
          # window. Declared out here so a shell whose APK or aapt could not
          # be read leaves it empty instead of tripping `set -u`.
          #
          # The applicationId is NOT the gradle `namespace` (com.app.demo) -
          # it comes from dartDefines.<ROLE>_ANDROID_PACKAGE_NAME in
          # .env/production.env and differs per shell, so read it off the
          # APK that is about to be installed rather than guessing.
          TOUR_PKG=""
          if [ -f "$TOUR_APK" ]; then
            TOUR_AAPT2=$(find "$TOUR_SDK/build-tools" -name aapt2 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$TOUR_AAPT2" ]; then
              TOUR_PKG=$("$TOUR_AAPT2" dump packagename "$TOUR_APK" 2>/dev/null | tr -d '\r' | head -n 1)
            fi
            if [ -z "$TOUR_PKG" ]; then
              TOUR_AAPT=$(find "$TOUR_SDK/build-tools" -name aapt 2>/dev/null | sort -V | tail -n 1)
              if [ -n "$TOUR_AAPT" ]; then
                TOUR_PKG=$("$TOUR_AAPT" dump badging "$TOUR_APK" 2>/dev/null | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)
              fi
            fi
          fi

          # ANR guard, shared primitives. `dumpsys window` is the primitive
          # because it lists what is actually IN THE WINDOW STACK, which is
          # exactly what a framebuffer capture burns in. AppNotRespondingDialog
          # titles its window "Application Not Responding: <process>" and
          # AppErrorDialog "Application Error: <process>", and nothing else
          # prints those strings, so a match is positive evidence rather than
          # a heuristic. The narrow `windows` sub-command first, the bare dump
          # as the fallback. Same detector and same BACK dismissal as
          # capture_screenshots.py's per-step anr_guard, used by the pre-tour
          # clear right below and by the end-of-leg check at the bottom.
          tour_window_dump() {
            # Writes the window stack to "$1"; true when something was read.
            rm -f "$1"
            adb shell dumpsys window windows > "$1" 2>/dev/null || true
            if [ ! -s "$1" ]; then
              adb shell dumpsys window > "$1" 2>/dev/null || true
            fi
            [ -s "$1" ]
          }
          tour_anr_window() {
            # Prints the ANR/crash dialog title found in the dump "$1", or nothing.
            tr -d '\r' < "$1" | grep -m1 -oE "Application (Not Responding|Error): ?[^ }]*" || true
          }
          tour_focus_owner() {
            # Prints the owner (package/component) of mCurrentFocus in the
            # dump "$1", or nothing when the focus is null or unreadable.
            tr -d '\r' < "$1" | grep -m1 -oE 'mCurrentFocus=Window\{[^}]*\}' | sed -nE 's/.*[[:space:]]([^[:space:]}]+)\}$/\1/p' || true
          }
          tour_anr_dismiss() {
            # BACK goes to the dialog, whose BACK action is "wait" - it does
            # not kill the process (same dismissal the per-step guard uses).
            adb shell input keyevent KEYCODE_BACK >/dev/null 2>&1 || true
            sleep 2
          }

          # ANR guard, pre-tour half. On paas_manager runs 33799655546 and
          # 33757931973 the tablet retry (fresh AVD, force-avd-creation) had
          # the launcher wedge on its very first boot: 26 s after "Boot
          # completed" and two minutes BEFORE the app was installed, logcat
          # showed "ANR in com.google.android.apps.nexuslauncher ... Input
          # dispatching timed out (Application does not have a focused
          # window)". That dialog sat in the window stack for the whole tour;
          # the per-step guard dismissed it and retried once per still, it
          # came straight back each time, so every still was refused and the
          # leg finished with 0 of 26 although `flutter test` exited 0. The
          # wedge is a host artefact of the first boot, not the app, so it is
          # cleared HERE, before the app is launched: dismiss the dialog,
          # force-stop the wedged package (the launcher is relaunched via its
          # HOME intent) and wait until the stack is clean AND something owns
          # input focus. Up to 3 rounds. The per-step guard and the
          # end-of-leg refusal stay exactly as they are; and this never
          # force-stops the app under test (its package is known from the
          # APK by now), so an ANR of the app itself is left for the per-step
          # guard to judge. Never allowed to fail the leg.
          PRE_ANR_DUMP="$OUT.windows.pre.tmp"
          PRE_ANR_WINDOW=""
          PRE_ANR_READ=""
          PRE_ANR_ATTEMPTS=0
          if tour_window_dump "$PRE_ANR_DUMP"; then
            PRE_ANR_READ=1
            PRE_ANR_WINDOW=$(tour_anr_window "$PRE_ANR_DUMP")
          fi
          while [ -n "$PRE_ANR_WINDOW" ] && [ "$PRE_ANR_ATTEMPTS" -lt 3 ]; do
            PRE_ANR_ATTEMPTS=$((PRE_ANR_ATTEMPTS + 1))
            # "Application Not Responding: com.foo:remote" -> com.foo
            PRE_ANR_PKG=$(printf '%s' "$PRE_ANR_WINDOW" | sed -E 's/^Application (Not Responding|Error): *//; s/:.*$//')
            echo "[tour-anr] pre-tour: ANR dialog for ${PRE_ANR_PKG:-<unknown package>} present before the tour started (fresh-boot host artefact) - clearing it (attempt $PRE_ANR_ATTEMPTS of 3, '$PRE_ANR_WINDOW')"
            tour_anr_dismiss
            if [ -z "$PRE_ANR_PKG" ]; then
              echo "[tour-anr] pre-tour: no package name in '$PRE_ANR_WINDOW' - dismissed only, nothing to force-stop"
            elif [ -n "$TOUR_PKG" ] && [ "$PRE_ANR_PKG" = "$TOUR_PKG" ]; then
              echo "[tour-anr] pre-tour: the ANR belongs to the app under test ($TOUR_PKG) - dismissed only, NOT force-stopping it; the per-step guard judges the app's own ANRs"
            else
              adb shell am force-stop "$PRE_ANR_PKG" >/dev/null 2>&1 || true
              case "$PRE_ANR_PKG" in
                *launcher*)
                  echo "[tour-anr] pre-tour: force-stopped the launcher ($PRE_ANR_PKG) - relaunching it via the HOME intent"
                  adb shell am start -a android.intent.action.MAIN -c android.intent.category.HOME >/dev/null 2>&1 || true ;;
                *)
                  echo "[tour-anr] pre-tour: force-stopped $PRE_ANR_PKG" ;;
              esac
            fi
            # Wait for the stack to be clean AND for a window to own input
            # focus (mCurrentFocus non-null) - the wedge above is precisely a
            # launcher with no focused window. Up to 60 s, 3 s apart.
            PRE_ANR_WAITED=0
            while [ "$PRE_ANR_WAITED" -lt 60 ]; do
              sleep 3
              PRE_ANR_WAITED=$((PRE_ANR_WAITED + 3))
              if tour_window_dump "$PRE_ANR_DUMP"; then
                PRE_ANR_WINDOW=$(tour_anr_window "$PRE_ANR_DUMP")
                if [ -z "$PRE_ANR_WINDOW" ] && [ -n "$(tour_focus_owner "$PRE_ANR_DUMP")" ]; then
                  break
                fi
              fi
            done
          done
          if [ -n "$PRE_ANR_WINDOW" ]; then
            echo "::warning::[tour-anr] pre-tour: ANR dialog ($PRE_ANR_WINDOW) still present after 3 attempts - continuing, the per-step guard will refuse contaminated stills"
          elif [ "$PRE_ANR_ATTEMPTS" -gt 0 ]; then
            echo "[tour-anr] pre-tour: ANR dialog cleared after $PRE_ANR_ATTEMPTS attempt(s)"
          elif [ -n "$PRE_ANR_READ" ]; then
            echo "[tour-anr] pre-tour: no ANR dialog present"
          else
            echo "::warning::[tour-anr] pre-tour: could not read the window stack before the tour started (dumpsys window returned nothing usable) - continuing, the per-step guard will refuse contaminated stills"
          fi
          # Before the first still: give the launcher up to 60 s to own a
          # focused window, so the "Application does not have a focused
          # window" wedge is less likely to appear once the app launches.
          PRE_FOCUS=""
          PRE_FOCUS_WAITED=0
          while :; do
            if tour_window_dump "$PRE_ANR_DUMP"; then
              PRE_FOCUS=$(tour_focus_owner "$PRE_ANR_DUMP")
            fi
            if [ -n "$PRE_FOCUS" ] || [ "$PRE_FOCUS_WAITED" -ge 60 ]; then
              break
            fi
            sleep 3
            PRE_FOCUS_WAITED=$((PRE_FOCUS_WAITED + 3))
          done
          rm -f "$PRE_ANR_DUMP"
          if [ -n "$PRE_FOCUS" ]; then
            echo "[tour-anr] pre-tour: focused window before the first still: $PRE_FOCUS (after ${PRE_FOCUS_WAITED}s)"
          else
            echo "::warning::[tour-anr] pre-tour: no focused window after ${PRE_FOCUS_WAITED}s (mCurrentFocus=null) - continuing, the per-step guard will refuse contaminated stills"
          fi

          # The manager main page and the driver home page both call
          # PushPermissionService.request() on mount, and on API 33+ that
          # raises the system POST_NOTIFICATIONS dialog. Captures use
          # `adb exec-out screencap -p` (the whole framebuffer), so the dialog
          # is burned into the stills - it was sitting over the app in the
          # paas_manager shots. Pre-granting the runtime permission keeps the
          # app's own request() call under test (it simply returns authorized)
          # while taking the dialog out of the frame.
          #
          # ACCESS_FINE_LOCATION/ACCESS_COARSE_LOCATION are pre-granted the
          # same way, for the same reason. The driver home page asks for a
          # position the moment it mounts; the emulator grants nothing, so
          # Android refused the call outright (no GrantPermissionsActivity
          # and no ACCESS_*_LOCATION request anywhere in tour_logcat.txt) and
          # the driver tour died on driver_home instead of walking it. This
          # is what lets the scripted demo reach that screen at all.
          #
          # It is NOT what makes a real denial survivable - that is the app's
          # job, and zones' delivery_sdk 1.17.4 does it: a refused fix now
          # leaves the page rendering, shows the driver one friendly line and
          # sends the detail to telemetry. #482's worry that a pre-grant would
          # mask a permission regression is answered there, by unit tests over
          # every denial state, rather than by a tour that has to be denied to
          # prove anything.
          #
          # Still deliberately NOT `adb install -g`: a blanket grant would
          # hand the app every permission the fleet's tours might one day want
          # to exercise, silently changing which branch they take. Grant the
          # named permissions, one at a time, and nothing else.
          #
          # `pm grant` needs the package installed and nothing installs it
          # before `flutter test` does, hence the explicit install here; the
          # same-signature upgrade install `flutter test` performs afterwards
          # preserves runtime grants.
          #
          # A shell whose AndroidManifest does not declare one of these (the
          # customer/manager tours and location) makes `pm grant` fail for
          # that permission alone; each is judged on its own and never stops
          # the others, exactly as failure-tolerant as the single grant was.
          TOUR_PERMS="android.permission.POST_NOTIFICATIONS android.permission.ACCESS_FINE_LOCATION android.permission.ACCESS_COARSE_LOCATION"
          TOUR_PERMS_LABEL="POST_NOTIFICATIONS/ACCESS_FINE_LOCATION/ACCESS_COARSE_LOCATION"
          if [ ! -f "$TOUR_APK" ]; then
            echo "[tour-permission] WARNING: failed to grant $TOUR_PERMS_LABEL ($TOUR_APK not found) - screenshots may contain the permission dialog and the driver tour may not reach driver_home"
          elif ! adb install -r "$TOUR_APK"; then
            echo "[tour-permission] WARNING: failed to grant $TOUR_PERMS_LABEL (adb install -r $TOUR_APK failed) - screenshots may contain the permission dialog and the driver tour may not reach driver_home"
          else
            if [ -z "$TOUR_PKG" ]; then
              echo "[tour-permission] WARNING: failed to grant $TOUR_PERMS_LABEL (could not read the package name out of $TOUR_APK - no usable aapt2/aapt under $TOUR_SDK/build-tools) - screenshots may contain the permission dialog and the driver tour may not reach driver_home"
            else
              for TOUR_PERM in $TOUR_PERMS; do
                case "$TOUR_PERM" in
                  *POST_NOTIFICATIONS)
                    TOUR_PERM_WHY="screenshots may contain the permission dialog" ;;
                  *)
                    TOUR_PERM_WHY="the driver tour may not reach driver_home" ;;
                esac
                # adb shell does not always propagate the guest exit code, so
                # judge `pm grant` by its output: silence is success.
                GRANT_ERR=$(adb shell pm grant "$TOUR_PKG" "$TOUR_PERM" 2>&1 | tr -d '\r')
                if [ -z "$GRANT_ERR" ]; then
                  echo "[tour-permission] granted ${TOUR_PERM##*.} to $TOUR_PKG"
                else
                  echo "[tour-permission] WARNING: failed to grant ${TOUR_PERM##*.} to $TOUR_PKG ($GRANT_ERR) - $TOUR_PERM_WHY"
                fi
              done
            fi
          fi

          rm -f "$TEST_LOG"
          python3 .tour-tools/scripts/tour/capture_screenshots.py \
            --out "$OUT" \
            --expected "${EXPECTED_SHOTS:-0}" \
            --timeout 2400 \
            --serial emulator-5554 \
            --package "$TOUR_PKG" \
            --logcat-dump "$LOGCAT_DUMP" \
            --stdout-log "$TEST_LOG" &
          CAP_PID=$!

          TEST_EXIT=0
          TEST_ARGS=(--dart-define=IS_DEMO=true --dart-define=TOUR_MODE=true)
          if [ -f .env/production.env ]; then
            TEST_ARGS+=(--dart-define-from-file=.env/production.env)
          fi
          # Bound the whole flutter test invocation (test-APK build, install,
          # on-device run). On run 32456359666 a degraded runner left
          # `flutter test` wedged after a 699s install with no output and no
          # exit - unbounded, it consumed the entire 150-minute job, so the
          # fresh-AVD retry leg never even got a chance. 35 minutes is over
          # 2x the active phase observed on a healthy runner.
          # Output is tee'd so the capture watcher can read markers from the
          # host-side test console too - under `flutter test`, Dart prints
          # reach the host, not logcat.
          timeout --kill-after=60 2100 \
            flutter test integration_test/guided_tour_test.dart \
            -d emulator-5554 --timeout none "${TEST_ARGS[@]}" 2>&1 \
            | tee "$TEST_LOG"
          TEST_EXIT=${PIPESTATUS[0]}
          if [ "$TEST_EXIT" -eq 124 ] || [ "$TEST_EXIT" -eq 137 ]; then
            echo "::warning::flutter test hit the 35-minute wall-clock bound and was terminated (exit $TEST_EXIT)."
          fi
          echo "flutter test exit code: $TEST_EXIT"

          # Host-side evidence for a leg whose emulator died under it. On
          # paas_manager runs 33734114092 and 33738362844 the tablet leg's
          # qemu process vanished ~2 minutes after the app install on every
          # attempt (port 5554 refused, `adb: device offline`, flutter test
          # exit 79) and nothing in the job's artifacts could say why: the
          # emulator announces "Storing crashdata in:
          # /tmp/android-runner/emu-crash-*.db" but that db, the host's
          # memory and the kernel log were never captured. Collected only
          # when the leg looks broken (non-zero exit, or the device gone),
          # APPENDED so a retry cannot erase the first attempt's evidence
          # (unlike "$OUT" and "$OUT.anr", which a retry must start clean),
          # and never allowed to fail the leg - it is evidence, not a gate.
          # The small, high-value items come first so the 40-line head the
          # status steps print into the job log carries them.
          ADB_STATE=$(timeout 20 adb -s emulator-5554 get-state 2>/dev/null | tr -d '\r' || true)
          if [ "$TEST_EXIT" -ne 0 ] || [ "${ADB_STATE:-}" != "device" ]; then
            HOST_DIAG="$OUT.host-diag.txt"
            echo "::warning::Collecting host diagnostics into $HOST_DIAG (flutter test exit $TEST_EXIT, adb state '${ADB_STATE:-none}')."
            {
              echo "=== host diagnostics for $OUT: $(date -u) ==="
              echo "flutter test exit: $TEST_EXIT"
              echo "adb -s emulator-5554 get-state: ${ADB_STATE:-<no answer>}"
              echo "--- free -m ---"
              free -m || true
              echo "--- df -h /tmp ---"
              df -h /tmp || true
              echo "--- qemu processes ---"
              ps -o pid,rss,etime,args -C qemu-system-x86_64-headless || echo "(no qemu-system-x86_64-headless process running)"
              echo "--- ls -la /tmp/android-runner/ ---"
              ls -la /tmp/android-runner/ 2>/dev/null || echo "(no /tmp/android-runner)"
              echo "--- dmesg (last 150 lines, filtered) ---"
              sudo dmesg --time-format iso 2>/dev/null | tail -n 150 | grep -iE 'killed process|out of memory|oom|qemu|segfault|emulator' || echo "(nothing matched)"
              # Unfiltered, stderr included, exit code printed: on run
              # 33750918166 the filtered dmesg above "matched nothing", which
              # cannot tell a quiet kernel from a `sudo dmesg` that was
              # refused. The journal is where a userspace killer
              # (systemd-oomd) leaves its trace - the kernel log never shows
              # one. Bulkiest dumps last so the head the status steps print
              # keeps the summary lines above.
              echo "--- dmesg (last 60 lines, unfiltered) ---"
              sudo dmesg --time-format iso 2>&1 | tail -n 60
              echo "dmesg exit: ${PIPESTATUS[0]}"
              echo "--- journalctl -k (last 80 lines) ---"
              journalctl -k -n 80 --no-pager 2>&1 | tail -n 80 || true
              echo "--- journalctl -u systemd-oomd (last 40 lines) ---"
              journalctl -u systemd-oomd -n 40 --no-pager 2>&1 || true
              echo "--- journalctl last 10 min, oom/killed/qemu/emulator/memory pressure (last 40 matches) ---"
              journalctl --since '-10 min' --no-pager 2>&1 | grep -iE 'oom|killed|qemu|emulator|memory pressure' | tail -n 40 || echo "(nothing matched)"
              # Run 33757931973: the tablet leg's qemu dumped core twice with
              # 13 GB available and systemd-oomd inactive - a crash, not a
              # memory kill. Name the signal, command line and stack.
              echo "--- coredumpctl list (last 10) ---"
              sudo coredumpctl list --no-pager 2>&1 | tail -n 10 || true
              echo "--- coredumpctl info (most recent qemu core: signal, cmdline, stack) ---"
              sudo coredumpctl info --no-pager -1 qemu-system-x86 2>&1 | head -n 200 || true
              # Run 33766830185: coredumpctl info gave a single unsymbolized
              # frame (`#0 0x0000562536e989f1 n/a`) because the emulator and
              # its GLES translator libs are stripped, and the journal-field
              # grep printed nothing. Dump the core (~1.2 GB, /tmp has room)
              # and let gdb walk every thread: module+offset frames are enough
              # to place the fault in a translator lib. The executable path
              # comes from the `Executable:` line of coredumpctl info - the
              # columns of `coredumpctl list` shift between systemd versions.
              echo "--- gdb backtrace of the most recent qemu core (stripped binary: expect module+offset frames) ---"
              # Run 33781378641: this block never ran - the runner image
              # ships no gdb ("gdb: not installed" was the whole backtrace).
              # Install it here, bounded, so the core is walked instead of
              # skipped; a failed install is reported and the dump continues.
              if ! command -v gdb >/dev/null 2>&1; then echo "gdb: not installed - installing"; sudo timeout 180 apt-get install -y -qq --no-install-recommends gdb >/dev/null 2>&1 || echo "gdb: apt-get install failed"; fi
              # Run 33788543637: gdb installed, but `coredumpctl dump` failed
              # instantly with its stderr discarded ("no qemu core available")
              # while `coredumpctl list` showed the cores present (1.2G/1.3G)
              # and `coredumpctl info` worked. The target file came from an
              # unprivileged mktemp in sticky /tmp (owned by `runner`); root
              # then opened it O_CREAT|O_TRUNC, which Ubuntu's
              # fs.protected_regular=2 refuses with EACCES. Dump into a
              # root-owned scratch directory instead, keep stderr, and print
              # the coredumpctl version and the protected_regular setting so
              # the next run proves or refutes that cause.
              if command -v gdb >/dev/null 2>&1; then
                echo "coredumpctl version: $(sudo coredumpctl --version 2>&1 | head -n 1)"
                echo "sysctl: $(sysctl fs.protected_regular 2>&1)"
                CORE_DIR="$(sudo mktemp -d /tmp/qemu-core.XXXXXX 2>/dev/null || mktemp -d /tmp/qemu-core.XXXXXX)"
                CORE_TMP="$CORE_DIR/qemu.core"
                echo "--- coredumpctl dump (stderr kept) ---"
                sudo coredumpctl dump --no-pager -o "$CORE_TMP" qemu-system-x86 2>&1 | tail -n 5
                DUMP_EXIT="${PIPESTATUS[0]}"
                if [ "$DUMP_EXIT" -eq 0 ] && sudo test -s "$CORE_TMP"; then
                  QEMU_EXE="$(sudo coredumpctl info --no-pager -1 qemu-system-x86 2>/dev/null | sed -n 's/^ *Executable: //p' | head -n 1)"
                  echo "core: $CORE_TMP ($(sudo du -h "$CORE_TMP" 2>/dev/null | cut -f1)), executable: ${QEMU_EXE:-<unknown, letting gdb read it from the core>}"
                  # Run 33799655546: the old `bt 40; info sharedlibrary; thread
                  # apply all bt 12 | head -n 400` printed threads 106 down to
                  # 91 and cut off Thread 1 - the crashing one - and its `bt`
                  # was all `??` frames because the PC (0x0000560843fee9f1)
                  # sat outside every mapped module, most likely SwiftShader
                  # JIT code in a `memfd:SwiftShader.Memory` mapping. So the
                  # crashing thread comes FIRST and is never truncated: its
                  # PC, registers, a disassembly at the PC and its backtrace,
                  # then the module list, then the mapping that CONTAINS the
                  # PC (filtered from `info proc mappings`), and only then
                  # every thread, capped at 2500 lines. Sections are marked
                  # with gdb `echo` so the filter below can tell them apart;
                  # a failing -ex (unreadable PC) does not stop the next one.
                  GDB_CMDS=(-ex 'set pagination off'
                    -ex 'echo === crashing thread ===\n' -ex 'thread 1' -ex 'p/x $pc' -ex 'info registers rip rsp rbp' -ex 'x/16i $pc' -ex 'bt 40'
                    -ex 'echo === shared libraries ===\n' -ex 'info sharedlibrary'
                    -ex 'echo === mappings ===\n' -ex 'info proc mappings'
                    -ex 'echo === all threads ===\n' -ex 'thread apply all bt 12')
                  GDB_OUT="$OUT.gdb.tmp"
                  if [ -n "$QEMU_EXE" ] && [ -r "$QEMU_EXE" ]; then
                    sudo timeout 300 gdb -q -batch "${GDB_CMDS[@]}" "$QEMU_EXE" "$CORE_TMP" > "$GDB_OUT" 2>&1 || true
                  else
                    sudo timeout 300 gdb -q -batch "${GDB_CMDS[@]}" -c "$CORE_TMP" > "$GDB_OUT" 2>&1 || true
                  fi
                  # `p/x $pc` prints "$1 = 0x...". The mapping filter compares
                  # addresses as zero-padded hex strings so it runs the same
                  # under mawk (no strtonum) and gawk.
                  GDB_PC=$(sed -n 's/^\$1 = \(0x[0-9a-fA-F]*\)$/\1/p' "$GDB_OUT" | head -n 1)
                  echo "crashing thread pc: ${GDB_PC:-<not parsed>}"
                  awk -v pc="$GDB_PC" -v cap=2500 '
                    function hex(s) { sub(/^0x/, "", s); s = tolower(s); while (length(s) < 16) s = "0" s; return s }
                    function flushmaps(  i) {
                      if (hit == 0) {
                        if (pc == "") print "(could not parse $pc from the p/x output - first 40 mappings instead)"
                        else print "(no mapping contains pc " pc " - anonymous JIT memory is not in the core NT_FILE note; first 40 mappings instead)"
                        for (i = 0; i < nbuf; i++) print buf[i]
                      } else print "(" hit " mapping(s) contain pc " pc ")"
                    }
                    BEGIN { if (pc != "") pcn = hex(pc) }
                    /^=== mappings ===$/ { sec = "maps"; print; next }
                    /^=== all threads ===$/ { if (sec == "maps") flushmaps(); sec = "threads"; n = 0; print; next }
                    sec == "maps" {
                      if ($1 !~ /^0x/) { print; next }
                      if (pc != "" && hex($1) <= pcn && pcn < hex($2)) { print; hit++; next }
                      if (nbuf < 40) buf[nbuf++] = $0
                      next
                    }
                    sec == "threads" {
                      n++
                      if (n <= cap) print
                      else if (n == cap + 1) print "(thread apply all output truncated at " cap " lines)"
                      next
                    }
                    { print }
                    END { if (sec == "maps") flushmaps() }
                  ' "$GDB_OUT" 2>&1 || true
                  rm -f "$GDB_OUT"
                else
                  echo "coredumpctl dump failed (exit $DUMP_EXIT) or produced an empty core (see stderr above)"
                fi
                sudo rm -rf "$CORE_DIR" 2>/dev/null || rm -rf "$CORE_DIR" || true
              else
                echo "gdb: not installed"
              fi
              echo "--- emulator translator libs (map gdb's module+offset frames against these) ---"
              # Recursive: the translator libs named in the core's module list
              # (libGLESv2.so, libEGL.so, libGLES_CM.so) live one level down,
              # in lib64/gles_swiftshader, gles_angle and gles_llvmpipe, which
              # the old flat `ls lib64` never showed.
              find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/emulator/lib64" -maxdepth 2 -name '*.so*' -printf '%12s %p\n' 2>/dev/null | sort -k2 | head -n 80 || true
              echo "=== end ==="
            } >> "$HOST_DIAG" 2>&1 || true
            # The emulator's own crash database, if it wrote one.
            for EMU_CRASH in /tmp/android-runner/emu-crash-*.db; do
              [ -e "$EMU_CRASH" ] || continue
              mkdir -p "$OUT.emu-crash" && cp -r "$EMU_CRASH" "$OUT.emu-crash/" || true
            done
          fi

          # flutter test has exited, so no further markers are coming. Give
          # the watcher a short grace window for trailing logcat lines, then
          # signal it to wrap up (it handles SIGTERM by writing its manifest
          # and the logcat dump) - without this, a failed test left the
          # watcher idling out its full capture timeout (~40 minutes of dead
          # emulator time on run 32386564857).
          sleep 15
          if kill -0 "$CAP_PID" 2>/dev/null; then
            kill "$CAP_PID" 2>/dev/null || true
          fi
          wait "$CAP_PID" || true
          COUNT=$(ls "$OUT"/*.png 2>/dev/null | wc -l | tr -d ' ')
          echo "Captured $COUNT screenshots (expected ${EXPECTED_SHOTS:-0})"

          # [tour-retry] Keep the better attempt. A retry parked the previous
          # attempt as "$OUT.prev" at the top of this script; if that set has
          # MORE published stills than this one (same count as above, so
          # `.png.rejected` frames never count for either side), put it back
          # - stills AND its ANR sidecar, so the ANR/foreground verdict and
          # the "$OUT.status" written below are judged on the stills that are
          # actually kept. TEST_EXIT stays THIS attempt's `flutter test` exit
          # code on purpose: the retry is the attempt that was just run, and
          # a non-zero exit there is what keeps the leg honestly PARTIAL for
          # the completeness gate; only count/partial follow the kept set.
          # Never merged: it is one set or the other.
          if [ -d "$OUT.prev" ]; then
            PREV_COUNT=$(ls "$OUT.prev"/*.png 2>/dev/null | wc -l | tr -d ' ')
            if [ "${PREV_COUNT:-0}" -gt "$COUNT" ]; then
              echo "::warning::[tour-retry] retry captured $COUNT < first attempt $PREV_COUNT — keeping the first attempt's stills"
              rm -rf "$OUT"
              mv "$OUT.prev" "$OUT"
              rm -f "$OUT.anr"
              if [ -f "$OUT.prev.anr" ]; then
                mv "$OUT.prev.anr" "$OUT.anr"
              fi
              COUNT=$(ls "$OUT"/*.png 2>/dev/null | wc -l | tr -d ' ')
              echo "Kept $COUNT screenshots from the first attempt (expected ${EXPECTED_SHOTS:-0})"
            else
              echo "[tour-retry] retry captured $COUNT >= first attempt ${PREV_COUNT:-0} - keeping this attempt's stills"
            fi
          fi
          # "$OUT.status" is rewritten below from whichever set was kept, so
          # the parked copy is never needed again.
          rm -rf "$OUT.prev" "$OUT.prev.status" "$OUT.prev.anr"

          # ANR guard, leg-level half. Captures are whole-framebuffer
          # `adb exec-out screencap -p` while `flutter test` drives the widgets
          # IN-PROCESS, so a blocking Android system dialog sits OVER the app
          # and the test still passes and still reports its full expected
          # count: the run concludes `success` with the "<app> isn't
          # responding" dialog burned into every still, and assemble.py then
          # feeds those stills to store/ and the Play listing. Nothing about
          # that is tablet-specific, so the guard lives HERE, in the one script
          # all four emulator invocations run (phone, phone retry, tablet,
          # tablet retry).
          #
          # capture_screenshots.py does the per-still work - it is the only
          # thing that runs around each capture and the only thing that knows
          # the step name - and leaves its tally in "$OUT.anr". This half reads
          # that tally and adds the one case a per-capture check cannot cover:
          # a dialog that comes up when no TOUR_SHOT marker is left to guard.
          ANR_COUNT=$(sed -n 's/^TOUR_ANR_BLOCKED=//p' "$OUT.anr" 2>/dev/null | tail -1 | tr -cd '0-9')
          ANR_STEPS=$(sed -n 's/^TOUR_ANR_STEPS=//p' "$OUT.anr" 2>/dev/null | tail -1 | tr -cd 'A-Za-z0-9_,-')
          ANR_CHECKED=$(sed -n 's/^TOUR_ANR_CHECKED=//p' "$OUT.anr" 2>/dev/null | tail -1 | tr -cd '0-9')
          ANR_VERIFIED=""
          if [ "${ANR_CHECKED:-0}" -gt 0 ]; then
            ANR_VERIFIED=1
          elif [ ! -f "$OUT.anr" ]; then
            echo "::warning::[tour-anr] WARNING: no $OUT.anr was written - the per-capture ANR check did not report, so only the end-of-leg check below applies."
          fi
          # Same detector as the pre-tour clear and the per-step guard (see
          # tour_window_dump / tour_anr_window above): the window stack is
          # what a framebuffer capture burns in; an unreadable dump is
          # reported as a WARNING and never discards stills that were fine.
          ANR_DUMP="$OUT.windows.tmp"
          ANR_WINDOW=""
          if tour_window_dump "$ANR_DUMP"; then
            ANR_VERIFIED=1
            ANR_WINDOW=$(tour_anr_window "$ANR_DUMP")
          fi
          rm -f "$ANR_DUMP"
          if [ -n "$ANR_WINDOW" ]; then
            echo "::error::[tour-anr] ERROR: ANR dialog present at step end-of-leg ($ANR_WINDOW) on $OUT - the system dialog was still in the window stack when the leg finished."
            ANR_COUNT=$(( ${ANR_COUNT:-0} + 1 ))
            ANR_STEPS="${ANR_STEPS:+$ANR_STEPS,}end-of-leg"
          fi
          if [ "${ANR_COUNT:-0}" -gt 0 ]; then
            echo "::error::[tour-anr] ERROR: ANR dialog present at step ${ANR_STEPS:-unknown} on $OUT - the affected stills were refused, and the completeness gate fails this run rather than ship a contaminated Play-store asset."
          elif [ -n "$ANR_VERIFIED" ]; then
            # The POSITIVE line, for the same reason the POST_NOTIFICATIONS
            # grant logs one: a grep must tell "checked, no ANR" apart from
            # "never checked".
            echo "[tour-anr] no ANR dialog detected on $OUT"
          else
            echo "::warning::[tour-anr] WARNING: this leg's stills are UNVERIFIED for ANR contamination - neither the per-capture tally nor the end-of-leg window dump could be read."
          fi
          # Foreground guard, leg-level half. Same split as the ANR guard
          # above and the same sidecar: capture_screenshots.py is the only
          # thing that runs around each capture and knows the step name, so
          # it does the per-still work and leaves its tally in "$OUT.anr";
          # this half turns that tally into the leg's verdict.
          #
          # A TOUR_SHOT marker only proves the Dart widget tree settled, and
          # the capture answering it is the whole framebuffer - so through the
          # app launch transition, and the window shuffle the forced `wm size`
          # / `wm density` above triggers, the still is a picture of the
          # LAUNCHER. That is what put the home screen and its taskbar into
          # steps 01-04 of supacharge, paas_driver and minilauncher.
          #
          # No end-of-leg half, unlike the ANR guard: once the tour has
          # finished the launcher owning the screen is normal and says
          # nothing about the stills.
          FG_COUNT=$(sed -n 's/^TOUR_FOREGROUND_BLOCKED=//p' "$OUT.anr" 2>/dev/null | tail -1 | tr -cd '0-9')
          FG_STEPS=$(sed -n 's/^TOUR_FOREGROUND_STEPS=//p' "$OUT.anr" 2>/dev/null | tail -1 | tr -cd 'A-Za-z0-9_,-')
          FG_CHECKED=$(sed -n 's/^TOUR_FOREGROUND_CHECKED=//p' "$OUT.anr" 2>/dev/null | tail -1 | tr -cd '0-9')
          if [ "${FG_COUNT:-0}" -gt 0 ]; then
            echo "::error::[tour-foreground] ERROR: the launcher still owned the screen at step ${FG_STEPS:-unknown} on $OUT - the affected stills were refused, and the completeness gate fails this run rather than ship a Play-store asset with the launcher in frame."
          elif [ "${FG_CHECKED:-0}" -gt 0 ]; then
            # The POSITIVE line, same reason as the ANR one above: a grep has
            # to tell "checked, the app had the screen" from "never checked".
            echo "[tour-foreground] the app owned the screen for every checked capture on $OUT"
          else
            echo "::warning::[tour-foreground] WARNING: this leg's stills are UNVERIFIED for launcher contamination - the per-capture tally could not be read."
          fi
          # What this leg actually produced, for the status gates further
          # down the job. This script deliberately exits 0 on a PARTIAL
          # capture so the stills it did get are still assembled and
          # committed - which also means its exit code cannot be the
          # honest verdict on the run. One file per leg (the tablet leg
          # overrides TOUR_OUT), rewritten by a retry so the KEPT attempt
          # (see the [tour-retry] block above) is the one judged.
          #
          # The same verdict also goes out as STEP OUTPUTS (partial,
          # test_exit, count) so the retry steps can fire on a partial leg.
          # Because of the exit-0 above, the retry conditions
          # `steps.<leg>.outcome == 'failure'` never fired on paas_manager
          # runs 33734114092 / 33738362844: the tablet leg died at 6 of 19
          # with `flutter test` exit 79, reported success, got no retry, and
          # was then failed by the completeness gate. $GITHUB_OUTPUT is
          # inherited from the emulator-runner step this script runs under,
          # so a line written here lands on that step's outputs; guarded so
          # the script still runs outside Actions.
          {
            echo "TOUR_LEG_OUT=$OUT"
            echo "TOUR_LEG_EXPECTED=${EXPECTED_SHOTS:-0}"
            echo "TOUR_LEG_COUNT=$COUNT"
            echo "TOUR_LEG_TEST_EXIT=$TEST_EXIT"
            echo "TOUR_LEG_ANR=${ANR_COUNT:-0}"
            echo "TOUR_LEG_ANR_STEPS=${ANR_STEPS:-}"
            echo "TOUR_LEG_FOREGROUND=${FG_COUNT:-0}"
            echo "TOUR_LEG_FOREGROUND_STEPS=${FG_STEPS:-}"
          } > "$OUT.status"
          PARTIAL_LEG=false
          if [ "$TEST_EXIT" -ne 0 ] || [ "$COUNT" -lt "${EXPECTED_SHOTS:-0}" ]; then
            PARTIAL_LEG=true
          fi
          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            {
              echo "partial=$PARTIAL_LEG"
              echo "test_exit=$TEST_EXIT"
              echo "count=$COUNT"
            } >> "$GITHUB_OUTPUT"
          fi
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Guided tour captured zero screenshots."
            exit 1
          fi
          if [ "$TEST_EXIT" -ne 0 ]; then
            echo "::warning::flutter test exited $TEST_EXIT but $COUNT screenshots were captured - continuing."
          fi
          exit 0
          SCRIPT
          chmod +x run_tour.sh

      # GitHub's Linux runners support KVM, but /dev/kvm is not accessible
      # to the runner user by default - without this rule the emulator
      # action's hardware-acceleration probe fails and it silently launches
      # qemu with `-accel off` (full software emulation). That is what made
      # every earlier tour run crawl: 700-800s APK installs, the guest
      # pinned at 100% CPU with system_server ANRs, and the on-device test
      # isolate too slow to reach its first marker (runs 32386564857,
      # 32456359666, 32468427355) - and run 32478818508's 600s boot
      # timeouts. This is the setup step reactivecircus documents for
      # GitHub-hosted Linux runners.
      - name: Enable KVM for the Emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "::warning::/dev/kvm still unavailable - emulator will fall back to software emulation"

      # Emulator infra flakes (boot timeouts, adb "Broken pipe", dead adb
      # daemon) are a known hazard - give the tour ONE retry with a freshly
      # created AVD before failing for real (same pattern as
      # universal-flutter-verify).
      - name: Run Emulator and Tour
        id: tour
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          EXPECTED_SHOTS: ${{ steps.merge.outputs.expected_screenshots }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel
          # 3 of the runner's 4 vCPUs and 4GB guest RAM: run 32456359666's
          # guest sat at 100% CPU (74% kernel) with system_server ANRs on
          # the default 2-core/2GB allocation - the Gradle build is already
          # done by the time the tour runs, so the host can spare the cores.
          cores: 3
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ./run_tour.sh

      # Also on a PARTIAL first attempt (run_tour.sh's own verdict, see the
      # step-output comment in the script): the leg exits 0 with whatever
      # stills it got, so `outcome` alone would leave a 6-of-19 leg without
      # its retry. run_tour.sh parks the first attempt's stills as
      # "$OUT.prev" and keeps whichever attempt captured more - never a
      # merge of the two.
      - name: Reset Emulator State Before Retry
        if: steps.tour.outcome == 'failure' || steps.tour.outputs.partial == 'true'
        env:
          TOUR_OUTCOME: ${{ steps.tour.outcome }}
          TOUR_PARTIAL: ${{ steps.tour.outputs.partial }}
          TOUR_TEST_EXIT: ${{ steps.tour.outputs.test_exit }}
        run: |
          echo "First tour attempt did not complete (outcome: $TOUR_OUTCOME, partial: ${TOUR_PARTIAL:-false}, flutter test exit: ${TOUR_TEST_EXIT:-?}) — killing stale emulator/adb before retry."
          adb emu kill || true
          pkill -f "qemu-system" || true
          adb kill-server || true
          # `flutter test` respawned the Gradle daemon to build the test APK;
          # hand its memory back before the next emulator (see the "Stop
          # Gradle Daemons" step above).
          if [ -x android/gradlew ]; then (cd android && ./gradlew --stop) || true; fi
          pkill -f 'GradleDaemon|KotlinCompileDaemon' || true
          sleep 10
          free -m || true

      - name: Run Emulator and Tour (Retry)
        id: tour-retry
        if: steps.tour.outcome == 'failure' || steps.tour.outputs.partial == 'true'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          EXPECTED_SHOTS: ${{ steps.merge.outputs.expected_screenshots }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel
          # 3 of the runner's 4 vCPUs and 4GB guest RAM: run 32456359666's
          # guest sat at 100% CPU (74% kernel) with system_server ANRs on
          # the default 2-core/2GB allocation - the Gradle build is already
          # done by the time the tour runs, so the host can spare the cores.
          cores: 3
          ram-size: 4096M
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ./run_tour.sh

      # always() so this gate reports even when an EARLIER step (compose,
      # build_runner, the debug APK build) already failed the job - which is
      # exactly the case the old two-branch form got wrong: with neither
      # emulator step reached, both outcomes render as "skipped" and it
      # printed "Tour failed on both attempts (first: skipped, retry:
      # skipped)", sending people hunting a flaky emulator instead of the
      # deterministic upstream break (RokctAI/radio run 33331414844). The
      # third branch below tells those two situations apart. Outcomes go
      # through env so the shell compares values, not interpolated literals.
      - name: Tour Status
        id: tour-status
        if: always()
        env:
          TOUR_OUTCOME: ${{ steps.tour.outcome }}
          TOUR_RETRY_OUTCOME: ${{ steps.tour-retry.outcome }}
          TOUR_PARTIAL_FIRST: ${{ steps.tour.outputs.partial }}
          TOUR_TEST_EXIT_FIRST: ${{ steps.tour.outputs.test_exit }}
        run: |
          # Host diagnostics straight into the job log, so nobody has to
          # download the artifact to see why an emulator died: run_tour.sh
          # writes a short baseline at the start of every leg and the death
          # diagnostics only when a leg looked broken. 100 lines covers the
          # baseline plus the summary lines of a death; the journal dumps
          # that follow are artifact-only.
          if [ -f tour_screenshots.host-diag.txt ]; then
            echo "--- tour_screenshots.host-diag.txt (first 100 lines; the full file and any tour_screenshots.emu-crash/ are in the guided-tour-results artifact) ---"
            head -n 100 tour_screenshots.host-diag.txt
            echo "--- end of host diagnostics ---"
          fi
          # A green emulator step is not a verdict (see below): name a first
          # attempt that run_tour.sh reported PARTIAL as such, so the retry
          # it triggered is not read as a retry of a "success".
          FIRST_ATTEMPT="$TOUR_OUTCOME"
          if [ "$TOUR_PARTIAL_FIRST" = "true" ]; then
            FIRST_ATTEMPT="partial (flutter test exit ${TOUR_TEST_EXIT_FIRST:-?})"
          fi
          if [ "$TOUR_OUTCOME" = "success" ] || [ "$TOUR_RETRY_OUTCOME" = "success" ]; then
            # A green emulator step is NOT a complete tour. run_tour.sh
            # exits 0 whenever at least ONE still was captured, on purpose,
            # so a partial run still gets its screenshots assembled and
            # committed - which means its exit code cannot double as the
            # verdict. Judge the leg on what it actually produced (run
            # 33448833555 reported ✅ having captured 4 of 19 stills, with
            # `flutter test` exited 1, because an SDK crash killed every
            # step after sign-in).
            #
            # The verdict is only RECORDED here; the gate that acts on it
            # sits after the commit step, so partial stills still ship.
            PARTIAL=""
            if [ -f tour_screenshots.status ]; then
              EXPECTED=$(sed -n 's/^TOUR_LEG_EXPECTED=//p' tour_screenshots.status | tail -1)
              COUNT=$(sed -n 's/^TOUR_LEG_COUNT=//p' tour_screenshots.status | tail -1)
              TEST_EXIT=$(sed -n 's/^TOUR_LEG_TEST_EXIT=//p' tour_screenshots.status | tail -1)
              ANR=$(sed -n 's/^TOUR_LEG_ANR=//p' tour_screenshots.status | tail -1)
              ANR_STEPS=$(sed -n 's/^TOUR_LEG_ANR_STEPS=//p' tour_screenshots.status | tail -1)
              FG=$(sed -n 's/^TOUR_LEG_FOREGROUND=//p' tour_screenshots.status | tail -1)
              FG_STEPS=$(sed -n 's/^TOUR_LEG_FOREGROUND_STEPS=//p' tour_screenshots.status | tail -1)
              # One dropped still (a single flaky finder) stays a warning;
              # anything beyond that, or a non-zero `flutter test`, means
              # steps did not run and the tour is not a success.
              #
              # An ANR outranks both. A blocking system dialog is captured by
              # the whole-framebuffer screencap while the in-process
              # `flutter test` sails on reporting its full expected count, so
              # the run would otherwise conclude ✅ with the dialog burned into
              # stills that assemble.py feeds straight to the Play listing.
              # The capture watcher REJECTS those frames instead of
              # publishing them, and this is where that becomes a red run. Not
              # count-tolerant: ONE contaminated still is one too many.
              #
              # A launcher-contaminated still is refused for exactly the same
              # reason and judged exactly the same way - the framebuffer
              # capture caught the home screen or its taskbar because the app
              # did not have the screen yet, and the test never noticed.
              if [ "${ANR:-0}" -gt 0 ]; then
                PARTIAL="ANR dialog present at step ${ANR_STEPS:-unknown} - contaminated stills refused"
              elif [ "${FG:-0}" -gt 0 ]; then
                PARTIAL="launcher still owned the screen at step ${FG_STEPS:-unknown} - contaminated stills refused"
              elif [ "${TEST_EXIT:-0}" -ne 0 ]; then
                PARTIAL="flutter test exited $TEST_EXIT"
              elif [ "${EXPECTED:-0}" -gt 0 ] && [ "${COUNT:-0}" -lt "$((EXPECTED - 1))" ]; then
                PARTIAL="captured $COUNT of $EXPECTED screenshots"
              elif [ "${EXPECTED:-0}" -gt 0 ] && [ "${COUNT:-0}" -lt "$EXPECTED" ]; then
                echo "::warning::Tour captured $COUNT of $EXPECTED screenshots - one still short."
              fi
            else
              echo "::warning::No tour_screenshots.status written - capture completeness could not be checked."
            fi
            if [ -n "$PARTIAL" ]; then
              echo "partial=true" >> "$GITHUB_OUTPUT"
              echo "partial-reason=$PARTIAL" >> "$GITHUB_OUTPUT"
              echo "::error::Tour did NOT complete: $PARTIAL. Whatever was captured is still assembled and committed below; the job is failed afterwards by the Tour Completeness gate."
            else
              echo "✅ Tour succeeded (first attempt: $FIRST_ATTEMPT, retry: $TOUR_RETRY_OUTCOME)."
            fi
          elif [ "$TOUR_OUTCOME" != "failure" ] && [ "$TOUR_RETRY_OUTCOME" != "failure" ]; then
            echo "partial=true" >> "$GITHUB_OUTPUT"
            echo "partial-reason=tour never ran - an earlier step failed before the emulator leg (first: ${TOUR_OUTCOME:-not run}, retry: ${TOUR_RETRY_OUTCOME:-not run})" >> "$GITHUB_OUTPUT"
            echo "::error::Tour never ran (first: ${TOUR_OUTCOME:-not run}, retry: ${TOUR_RETRY_OUTCOME:-not run}) - an earlier step failed before the emulator leg. Fix the upstream failure logged above; the tour itself was not attempted."
            exit 1
          else
            echo "❌ Tour failed on both attempts (first: $FIRST_ATTEMPT, retry: $TOUR_RETRY_OUTCOME)."
            exit 1
          fi

      - name: Assemble Feature Guide (required)
        shell: bash
        run: |
          python3 .tour-tools/scripts/tour/assemble.py \
            --resolved tour.resolved.json \
            --shots tour_screenshots \
            --out "${{ inputs.output-dir }}" \
            --guide

      # Screenshots + guide are the required outputs; the video is
      # best-effort by design - a video hiccup must never fail the run or
      # block the committed stills.
      - name: Assemble Tour Video (best-effort)
        id: video
        continue-on-error: true
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-dejavu-core
          python3 .tour-tools/scripts/tour/assemble.py \
            --resolved tour.resolved.json \
            --shots tour_screenshots \
            --out "${{ inputs.output-dir }}" \
            --video --codec libx264 --container mp4

      - name: Video Status
        if: always()
        run: |
          if [ "${{ steps.video.outcome }}" = "success" ]; then
            echo "✅ Tour video rendered."
          else
            echo "::warning::Tour video assembly failed or was skipped - screenshots and guide are unaffected."
          fi

      # ----------------------------------------------------------------------
      # TABLET LEG (input `tablet`, on by default): rerun the SAME tour test
      # on a 10-inch tablet AVD, serially after the phone leg so it reuses
      # all the compose/build_runner/APK work above. The AVD uses the SDK's
      # `pixel_tablet` device profile (shipped by current cmdline-tools;
      # same api-34 google_apis x86_64 system image as the phone leg) and
      # the canvas is forced anyway via `wm size 1600x2560` +
      # `wm density 240` — 1600px / (240/160) = 1066dp of portrait width,
      # the geometry a 12.4-inch 2560x1600 tablet (Galaxy Tab S7 FE class,
      # ~243ppi, so the hdpi 240 bucket) really reports.
      #
      # The DENSITY is what makes this leg a tablet, not the pixels.
      # PlaneHost.planeCountFor in RokctAI/core hands out three planes only
      # from AppBreakpoints.expanded (840dp) up, two from medium (600dp) and
      # one below that. The previous `wm density 320` made this same 1600px
      # panel 1600 / (320/160) = 800dp wide — UNDER 840 — so every "tablet"
      # still was the two-plane FOLDABLE layout and the tablet gallery was
      # mislabelled. Real 10-inch tablets land there too (the pixel_tablet
      # profile's own 2560x1600 @ 320 is exactly 800dp in portrait), which
      # is why the number has to be chosen rather than inherited. 1066dp
      # clears 840 by 226dp, so the leg cannot slip back to two planes on a
      # rounding change.
      #
      # The pixel size is deliberately UNCHANGED: it is what assemble.py's
      # `tablet` device preset composites onto (WIDTH/HEIGHT 1600x2560) and
      # it sits inside Play's 320-3840px screenshot bounds. Every tablet
      # step below is
      # continue-on-error or outcome-gated so a tablet failure can NEVER
      # block the phone outputs from committing; the "Tablet Leg Status"
      # gate AFTER the commit step then fails the job for real (honest
      # red), with the phone assets already safely pushed.
      - name: Reset Emulator State Before Tablet Leg
        if: inputs.tablet == true
        run: |
          echo "Phone leg done — killing any leftover emulator/adb before the tablet leg."
          adb emu kill || true
          pkill -f "qemu-system" || true
          adb kill-server || true
          # `flutter test` respawned the Gradle daemon to build the test APK;
          # hand its memory back before the next emulator (see the "Stop
          # Gradle Daemons" step above).
          if [ -x android/gradlew ]; then (cd android && ./gradlew --stop) || true; fi
          pkill -f 'GradleDaemon|KotlinCompileDaemon' || true
          sleep 10
          free -m || true

      - name: Run Emulator and Tour (Tablet)
        id: tour-tablet
        if: inputs.tablet == true
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          EXPECTED_SHOTS: ${{ steps.merge.outputs.expected_screenshots }}
          TOUR_OUT: tour_screenshots_tablet
          TOUR_WM_SIZE: 1600x2560
          TOUR_WM_DENSITY: "240"
          TOUR_LOGCAT: tour_logcat_tablet.txt
          TOUR_TEST_LOG: tour_test_output_tablet.log
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          # Its own AVD name: the phone leg's default AVD was created with
          # the `pixel` profile and AVD profiles are fixed at creation.
          avd-name: tour_tablet_api34
          # Same core split as the phone leg (see the comment there), but
          # 3GB of guest RAM rather than 4GB: this leg also renders a
          # 1600x2560 canvas through SwiftShader on the host, and it is the
          # leg whose qemu died ~2 minutes after the app install on every
          # attempt of paas_manager runs 33734114092, 33738362844 and
          # 33750918166 - the last with the host's swap at 92% and no kernel
          # OOM line, i.e. host memory pressure, not a guest crash. The
          # phone leg completes at 4096M and keeps it.
          cores: 3
          ram-size: 3072M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ./run_tour.sh

      # Same partial-leg trigger as the phone retry above: on paas_manager
      # runs 33734114092 and 33738362844 this leg died at 6 of 19 (flutter
      # test exit 79) with a green outcome, so this retry never ran.
      - name: Reset Emulator State Before Tablet Retry
        if: inputs.tablet == true && (steps.tour-tablet.outcome == 'failure' || steps.tour-tablet.outputs.partial == 'true')
        env:
          TABLET_OUTCOME: ${{ steps.tour-tablet.outcome }}
          TABLET_PARTIAL: ${{ steps.tour-tablet.outputs.partial }}
          TABLET_TEST_EXIT: ${{ steps.tour-tablet.outputs.test_exit }}
        run: |
          echo "First tablet attempt did not complete (outcome: $TABLET_OUTCOME, partial: ${TABLET_PARTIAL:-false}, flutter test exit: ${TABLET_TEST_EXIT:-?}) — killing stale emulator/adb before retry."
          adb emu kill || true
          pkill -f "qemu-system" || true
          adb kill-server || true
          # `flutter test` respawned the Gradle daemon to build the test APK;
          # hand its memory back before the next emulator (see the "Stop
          # Gradle Daemons" step above).
          if [ -x android/gradlew ]; then (cd android && ./gradlew --stop) || true; fi
          pkill -f 'GradleDaemon|KotlinCompileDaemon' || true
          sleep 10
          free -m || true

      - name: Run Emulator and Tour (Tablet Retry)
        id: tour-tablet-retry
        if: inputs.tablet == true && (steps.tour-tablet.outcome == 'failure' || steps.tour-tablet.outputs.partial == 'true')
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          EXPECTED_SHOTS: ${{ steps.merge.outputs.expected_screenshots }}
          TOUR_OUT: tour_screenshots_tablet
          # Informational only on this step: the AVD below already boots as
          # 1600x2560 @ 320 in portrait and TOUR_SKIP_DISPLAY_OVERRIDE keeps
          # run_tour.sh from re-applying `wm size` / `wm density` on top.
          TOUR_WM_SIZE: 1600x2560
          TOUR_WM_DENSITY: "320"
          TOUR_SKIP_DISPLAY_OVERRIDE: "1"
          TOUR_LOGCAT: tour_logcat_tablet.txt
          TOUR_TEST_LOG: tour_test_output_tablet.log
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          avd-name: tour_tablet_api34
          cores: 3
          # 3072M, not 4096M - see the first tablet leg.
          ram-size: 3072M
          force-avd-creation: true
          # The pre-2026-09-02 geometry, natively portrait, no post-boot
          # display override. On paas_manager run 33781378641 both tablet
          # attempts died with SIGSEGV in qemu-system-x86_64-headless 5 s
          # after the pos_scan still, at the same page offset (...9f1) in
          # the PIE main binary, under TWO renderers (swiftshader_indirect,
          # then the lavapipe/swangle fallback the image substitutes for
          # -gpu guest), so the renderer is not the variable. On run
          # 33788543637 this retry booted NATIVELY portrait at 1600x2560 @
          # 240 (`Setting display: 0 configuration to: 1600x2560, dpi:
          # 240x240`, override skipped) and STILL segfaulted 4 s after
          # 05-pos_scan at the same ...9f1 page offset (PCs
          # 0x000055854ccf09f1 / 0x000055eee71209f1), so the post-boot
          # `wm size` / `wm density` override is exonerated too.
          #
          # What DID change when the deaths began: the tablet leg last
          # passed at density 320 (1600 / (320/160) = 800dp wide, the
          # "medium" layout: rail plus a compact orders list). Commit
          # d9c27ac (#484, 2026-09-02) moved the tablet density 320 -> 240
          # (800 -> 1066dp), which selects the >= 840dp "expanded" layout,
          # and every tablet emulator death since has been at 1066dp. At
          # >= 840dp the app preloads an offstage seven-column orders
          # kanban board (OrdersHomePage's expanded branch, with per-second
          # timers) that never existed in the passing runs. This retry
          # therefore boots the known-good 1600x2560 @ 320 (800x1280 dp)
          # natively, everything else equal, to test whether the expanded
          # layout is what the emulator cannot survive. Survives: the
          # expanded layout is the trigger (and the stills are the medium
          # layout the leg shipped before #484). Dies identically: the
          # layout is exonerated as well. The pixel size is unchanged, so
          # assemble.py's tablet preset (1600x2560) fits as before; the
          # keep-better logic in run_tour.sh keeps whichever attempt
          # captured more stills.
          #
          # The action runs each line of this input as its own `sh -c` after
          # creating the AVD and before launching the emulator, hence one
          # folded line. ANDROID_AVD_HOME is exported by the action's SDK
          # installer ($HOME/.android/avd).
          pre-emulator-launch-script: >-
            CFG="${ANDROID_AVD_HOME:-$HOME/.android/avd}/tour_tablet_api34.avd/config.ini";
            for KV in hw.lcd.width=1600 hw.lcd.height=2560 hw.lcd.density=320 hw.initialOrientation=portrait skin.name=1600x2560 skin.path=_no_skin; do
            K="${KV%%=*}";
            if grep -q "^${K}[[:space:]]*=" "$CFG"; then sed -i "s|^${K}[[:space:]]*=.*|${KV}|" "$CFG"; else echo "$KV" >> "$CFG"; fi;
            done;
            echo "[tour-retry] tablet retry AVD config ($CFG):";
            grep -E '^(hw\.lcd\.|hw\.initialOrientation|skin\.)' "$CFG"
          # Back on swiftshader_indirect: `-gpu guest` is refused by this
          # system image ("WARNING | Your AVD has been configured with an
          # in-guest renderer, but the system image does not support guest
          # rendering.Falling back to 'lavapipe' mode.") and crashed identically.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: 'echo "[tour-retry] tablet retry: native portrait 1600x2560@320 (800x1280 dp, the pre-2026-09-02 geometry), no post-boot display override, -gpu swiftshader_indirect" && bash ./run_tour.sh'

      # continue-on-error so an assembly bug cannot stop the phone assets
      # from committing below — the Tablet Leg Status gate turns a failure
      # here into the job's red signal afterwards.
      - name: Assemble Tablet Feature Guide
        id: tablet-assemble
        if: inputs.tablet == true && (steps.tour-tablet.outcome == 'success' || steps.tour-tablet-retry.outcome == 'success')
        continue-on-error: true
        shell: bash
        run: |
          python3 .tour-tools/scripts/tour/assemble.py \
            --resolved tour.resolved.json \
            --shots tour_screenshots_tablet \
            --out "${{ inputs.output-dir }}/tablet" \
            --device tablet \
            --guide

      # Best-effort like the phone video; --device tablet renders the
      # per-chapter videos and store stills (tenInchScreenshots) on the
      # tablet canvas and skips the phone-only feature graphic/icon/wide
      # reel. apt install is a fast no-op when the phone video step
      # already ran it.
      - name: Assemble Tablet Tour Video (best-effort)
        id: tablet-video
        if: inputs.tablet == true && (steps.tour-tablet.outcome == 'success' || steps.tour-tablet-retry.outcome == 'success')
        continue-on-error: true
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-dejavu-core
          python3 .tour-tools/scripts/tour/assemble.py \
            --resolved tour.resolved.json \
            --shots tour_screenshots_tablet \
            --out "${{ inputs.output-dir }}/tablet" \
            --device tablet \
            --video --codec libx264 --container mp4

      # Refresh the README's generated marker sections (store-description
      # + tour-gallery blocks, see scripts/tour/readme_sections.py) so the
      # README always references the stills the commit below ships. Chosen
      # trade-off: a store-listing edit is reflected in the README on the
      # NEXT tour run (or a manual workflow_dispatch), not immediately.
      - name: Refresh README Generated Sections
        if: inputs.commit-outputs == true && github.event_name != 'pull_request'
        shell: bash
        run: |
          # Drop any compose-time edits to README.md first, so the commit
          # below carries ONLY the regenerated marker blocks.
          git checkout -- README.md 2>/dev/null || true
          python3 .tour-tools/scripts/tour/readme_sections.py --repo-root .

      - name: Commit Tour Outputs
        if: inputs.commit-outputs == true && github.event_name != 'pull_request'
        shell: bash
        run: |
          # Stage ONLY the tour output directory - never `git add -A`/`.`:
          # the workspace also holds the composer's .rokct/cache (which can
          # contain nested git clones - committing those as dangling gitlinks
          # broke rCore checkouts, see rCore #121) plus compose-time edits to
          # tracked files. Refuse output-dir values that could widen the
          # pathspec to any of that.
          case "${{ inputs.output-dir }}" in
            ""|"."|".."*|"/"*|".rokct"*|".git"*)
              echo "::error::Refusing unsafe output-dir '${{ inputs.output-dir }}' for the commit-back pathspec."
              exit 1
              ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Seed the Play-listing config files on the first run so nobody has
          # to create them by hand - but NEVER touch an existing one: repo
          # files are the source of truth for what universal-play-deploy
          # pushes to the Play listing. One guarded block per file; re-runs
          # are no-ops.
          [ -f marketing/store/video.txt ] || {
            mkdir -p marketing/store
            echo "# Replace this line with the public YouTube URL of the promo reel (https://youtu.be/...). The Play deploy sets it on the store listing." > marketing/store/video.txt
            git add -f marketing/store/video.txt
          }
          # Listing text: comment-only placeholders (the deploy pushes
          # nothing until the real copy replaces them).
          [ -f marketing/store/listing/en-US/title.txt ] || {
            mkdir -p marketing/store/listing/en-US
            echo "# Play listing app title, max 30 characters. Replace this comment with the title on its own line; lines starting with # are ignored." > marketing/store/listing/en-US/title.txt
            git add -f marketing/store/listing/en-US/title.txt
          }
          [ -f marketing/store/listing/en-US/short_description.txt ] || {
            mkdir -p marketing/store/listing/en-US
            echo "# Play listing short description, max 80 characters (the one-liner under the title). Replace this comment with the text on its own line; lines starting with # are ignored." > marketing/store/listing/en-US/short_description.txt
            git add -f marketing/store/listing/en-US/short_description.txt
          }
          [ -f marketing/store/listing/en-US/full_description.txt ] || {
            mkdir -p marketing/store/listing/en-US
            {
              echo "# Play listing full description, max 4000 characters."
              echo "# Only LEADING comment/blank lines like these are stripped - everything after the first real line is pushed verbatim, blank lines and all."
            } > marketing/store/listing/en-US/full_description.txt
            git add -f marketing/store/listing/en-US/full_description.txt
          }
          # Curated screenshot pick-list: one marketing/tour/store/ still key
          # per line (with or without .png); the order here is the Play
          # order, max 8. Seeded comment-only because step keys are per-app:
          # upload_listing_assets.py treats a comment-only file exactly like
          # an absent one (first 8 stills in filename order), so the seed is
          # a discoverable template, never a wrong curation. Keys that do
          # not exist in an app's tour are skipped with a log at deploy time.
          [ -f marketing/store/screenshots.txt ] || {
            mkdir -p marketing/store
            {
              echo "# Play phone screenshots: one marketing/tour/store/ filename per line (with or without .png)."
              echo "# This order IS the Play Store order; at most 8 are pushed; missing keys are skipped with a log."
              echo "# While this file holds only comments, the first 8 stills in filename order are pushed."
              echo "# Curate by listing your app's step keys here, e.g.:"
              echo "#   01-welcome"
            } > marketing/store/screenshots.txt
            git add -f marketing/store/screenshots.txt
          }
          # Release notes (user-visible on Play, so real copy - no comments):
          # one whatsnew-<BCP-47 locale> file per language, no extension.
          [ -f marketing/store/whatsnew/whatsnew-en-US ] || {
            mkdir -p marketing/store/whatsnew
            echo "Latest lessons, performance improvements and fixes." > marketing/store/whatsnew/whatsnew-en-US
            git add -f marketing/store/whatsnew/whatsnew-en-US
          }
          # This pathspec also stages the tablet leg's outputs: they live
          # at <output-dir>/tablet, INSIDE the same directory, on purpose.
          git add -f "${{ inputs.output-dir }}"
          # The README's generated sections were refreshed by the step
          # above (only the marker blocks can differ from HEAD - it reset
          # compose-time edits first); ride them in the same commit.
          if [ -f README.md ]; then git add -f README.md; fi
          if ! git commit -m "docs: refresh guided tour screenshots and feature guide [skip ci]"; then
            echo "ℹ️ No changes in ${{ inputs.output-dir }} - nothing to commit."
            exit 0
          fi
          # The workspace carries compose-time modifications to tracked files;
          # drop them so the rebase below starts from a clean tree (only the
          # tour outputs were staged into the commit above).
          git checkout -- . || true
          # Another workflow may have pushed to this ref while the tour ran;
          # rebase our single output commit on top rather than failing. That
          # rebase can be blocked with no real conflict in sight: a compose
          # commit-back landing on the ref mid-tour adds files under the
          # TRACKED .rokct/cache, and this runner's composer has already
          # written its own UNTRACKED copy at the same path, so the checkout
          # refuses ("untracked working tree files would be overwritten") and
          # the tour's screenshots are thrown away (paas_driver run
          # 33474911777). The composer rewrites .rokct/cache from scratch on
          # every run, so an untracked file in there is disposable - drop
          # those, strictly inside that directory, and try the rebase again.
          rebased=""
          for attempt in 1 2; do
            git fetch origin "$GITHUB_REF"
            if git rebase FETCH_HEAD; then
              echo "✅ Rebased the tour output commit onto $GITHUB_REF (attempt $attempt)."
              rebased=1
              break
            fi
            # When the checkout refuses before HEAD is even detached there is
            # no rebase to abort, so `git rebase --abort` exits 128 - which
            # under `set -e` ended this step before it could report anything.
            git rebase --abort || true
            if [ "$attempt" -ge 2 ] || [ ! -d .rokct/cache ]; then
              echo "::warning::Rebase attempt $attempt on $GITHUB_REF failed and there is nothing left to retry."
              break
            fi
            echo "::warning::Rebase attempt $attempt on $GITHUB_REF was blocked; clearing untracked files under .rokct/cache (the composer regenerates that directory every run) and retrying."
            # Scoped to .rokct/cache and NOTHING else - a clean at the repo
            # root would destroy real work. `git clean` never removes tracked
            # files, so the cache's committed contents are untouched; -ff is
            # what lets it clear the nested SDK clones the composer leaves
            # in there.
            git clean -ffd -- .rokct/cache
          done
          if [ -z "$rebased" ]; then
            echo "::error::Tour output commit could not be rebased onto $GITHUB_REF; it was NOT pushed."
            exit 1
          fi
          git push origin HEAD:${{ github.ref }}
          echo "✅ Tour outputs committed to ${{ github.ref }}."

      # The tablet leg's honest failure signal, deliberately AFTER the
      # commit step: every tablet step above is continue-on-error, so a
      # tablet failure reaches this gate only once the phone outputs are
      # already committed — then it turns the job red for real. Tablet
      # video failures stay a warning, same as the phone video.
      - name: Tablet Leg Status
        if: inputs.tablet == true
        env:
          TABLET_PARTIAL_FIRST: ${{ steps.tour-tablet.outputs.partial }}
          TABLET_TEST_EXIT_FIRST: ${{ steps.tour-tablet.outputs.test_exit }}
          TABLET_PARTIAL_RETRY: ${{ steps.tour-tablet-retry.outputs.partial }}
          TABLET_TEST_EXIT_RETRY: ${{ steps.tour-tablet-retry.outputs.test_exit }}
        run: |
          # Host diagnostics straight into the job log (same as the phone
          # leg's Tour Status): a baseline at the start of every leg, plus
          # the death diagnostics run_tour.sh writes when the leg looked
          # broken - which is exactly the tablet leg on paas_manager runs
          # 33734114092, 33738362844 and 33750918166.
          if [ -f tour_screenshots_tablet.host-diag.txt ]; then
            echo "--- tour_screenshots_tablet.host-diag.txt (first 100 lines; the full file and any tour_screenshots_tablet.emu-crash/ are in the guided-tour-results artifact) ---"
            head -n 100 tour_screenshots_tablet.host-diag.txt
            echo "--- end of host diagnostics ---"
          fi
          # Name a PARTIAL attempt as such rather than as the emulator
          # step's green outcome (run_tour.sh exits 0 with whatever stills
          # it got); the completeness gate below is still what judges it.
          FIRST_ATTEMPT="${{ steps.tour-tablet.outcome }}"
          if [ "$TABLET_PARTIAL_FIRST" = "true" ]; then
            FIRST_ATTEMPT="partial (flutter test exit ${TABLET_TEST_EXIT_FIRST:-?})"
          fi
          RETRY_ATTEMPT="${{ steps.tour-tablet-retry.outcome }}"
          if [ "$TABLET_PARTIAL_RETRY" = "true" ]; then
            RETRY_ATTEMPT="partial (flutter test exit ${TABLET_TEST_EXIT_RETRY:-?})"
          fi
          if [ "${{ steps.tour-tablet.outcome }}" != "success" ] && [ "${{ steps.tour-tablet-retry.outcome }}" != "success" ]; then
            echo "::error::Tablet tour failed on both attempts (first: $FIRST_ATTEMPT, retry: $RETRY_ATTEMPT)."
            exit 1
          fi
          if [ "${{ steps.tablet-assemble.outcome }}" != "success" ]; then
            echo "::error::Tablet feature-guide assembly failed (outcome: ${{ steps.tablet-assemble.outcome }})."
            exit 1
          fi
          if [ "${{ steps.tablet-video.outcome }}" != "success" ]; then
            echo "::warning::Tablet video assembly failed - tablet screenshots and stills are unaffected."
          fi
          if [ "$TABLET_PARTIAL_FIRST" = "true" ] && [ "${{ steps.tour-tablet-retry.outcome }}" != "success" ]; then
            echo "::warning::Tablet leg ran (tour: $FIRST_ATTEMPT, retry: $RETRY_ATTEMPT) - the retry did not succeed, so the Tour Completeness Gate below judges the partial capture."
          elif [ "$TABLET_PARTIAL_RETRY" = "true" ]; then
            echo "::warning::Tablet leg ran (tour: $FIRST_ATTEMPT, retry: $RETRY_ATTEMPT) - the retry was partial too, so the Tour Completeness Gate below judges it."
          else
            echo "✅ Tablet leg succeeded (tour: $FIRST_ATTEMPT, retry: $RETRY_ATTEMPT)."
          fi

      # The phone leg's honest failure signal, deliberately AFTER the commit
      # step for the same reason as the tablet gate above: run_tour.sh keeps
      # going on a PARTIAL capture so the stills it did get are assembled and
      # pushed, and "Tour Status" only RECORDS the verdict. This is where a
      # tour that captured materially fewer screenshots than its resolved
      # step count - or whose `flutter test` exited non-zero - turns the job
      # red, with the partial assets already safely committed. Before this
      # gate existed, such a run reported ✅ (run 33448833555: 4 of 19).
      # A tour that never RAN is judged here too: when the APK build (or any
      # step before the emulator leg) fails, "Tour Status" exits 1 without a
      # capture to judge, and this gate used to read an empty `partial` and
      # print "Tour capture complete" (run 33653121405).
      - name: Tour Completeness Gate
        if: always()
        env:
          TOUR_PARTIAL: ${{ steps.tour-status.outputs.partial }}
          TOUR_PARTIAL_REASON: ${{ steps.tour-status.outputs.partial-reason }}
          BUILD_OUTCOME: ${{ steps.build-apk.outcome }}
          TOUR_STATUS_OUTCOME: ${{ steps.tour-status.outcome }}
        run: |
          STATUS=0
          if [ "$TOUR_PARTIAL" = "true" ]; then
            echo "::error::Guided tour incomplete: $TOUR_PARTIAL_REASON. The screenshots that WERE captured are committed; the tour itself did not finish, so this run is not a success."
            STATUS=1
          fi
          if [ "$BUILD_OUTCOME" = "failure" ]; then
            echo "::error::Tour never ran: build failed. The demo APK did not compile, so the emulator leg was never attempted and there is nothing to judge; this run is not a success."
            STATUS=1
          elif [ "$TOUR_STATUS_OUTCOME" != "success" ]; then
            echo "::error::Tour did not succeed: Tour Status reported '$TOUR_STATUS_OUTCOME' (build: '$BUILD_OUTCOME'). See the Tour Status step above for the failure; this run is not a success."
            STATUS=1
          fi
          # Same judgement for the tablet leg when it ran. Its own status
          # gate above only sees the emulator step's outcome, which is green
          # for a partial capture just like the phone leg's.
          if [ -f tour_screenshots_tablet.status ]; then
            EXPECTED=$(sed -n 's/^TOUR_LEG_EXPECTED=//p' tour_screenshots_tablet.status | tail -1)
            COUNT=$(sed -n 's/^TOUR_LEG_COUNT=//p' tour_screenshots_tablet.status | tail -1)
            TEST_EXIT=$(sed -n 's/^TOUR_LEG_TEST_EXIT=//p' tour_screenshots_tablet.status | tail -1)
            ANR=$(sed -n 's/^TOUR_LEG_ANR=//p' tour_screenshots_tablet.status | tail -1)
            ANR_STEPS=$(sed -n 's/^TOUR_LEG_ANR_STEPS=//p' tour_screenshots_tablet.status | tail -1)
            FG=$(sed -n 's/^TOUR_LEG_FOREGROUND=//p' tour_screenshots_tablet.status | tail -1)
            FG_STEPS=$(sed -n 's/^TOUR_LEG_FOREGROUND_STEPS=//p' tour_screenshots_tablet.status | tail -1)
            # Same judgement as the phone leg above, and the leg the ANR was
            # actually found on: an "isn't responding" dialog was burned into
            # all 8 paas_customer and all 23 supacharge TABLET stills while
            # both runs reported success.
            if [ "${ANR:-0}" -gt 0 ]; then
              echo "::error::[tour-anr] ERROR: ANR dialog present at step ${ANR_STEPS:-unknown} on the tablet leg - the contaminated stills were refused rather than committed to the store assets."
              STATUS=1
            elif [ "${FG:-0}" -gt 0 ]; then
              echo "::error::[tour-foreground] ERROR: the launcher still owned the screen at step ${FG_STEPS:-unknown} on the tablet leg - the contaminated stills were refused rather than committed to the store assets."
              STATUS=1
            elif [ "${TEST_EXIT:-0}" -ne 0 ]; then
              echo "::error::Tablet tour incomplete: flutter test exited $TEST_EXIT (captured ${COUNT:-0} of ${EXPECTED:-0} screenshots)."
              STATUS=1
            elif [ "${EXPECTED:-0}" -gt 0 ] && [ "${COUNT:-0}" -lt "$((EXPECTED - 1))" ]; then
              echo "::error::Tablet tour incomplete: captured $COUNT of $EXPECTED screenshots."
              STATUS=1
            elif [ "${EXPECTED:-0}" -gt 0 ] && [ "${COUNT:-0}" -lt "$EXPECTED" ]; then
              echo "::warning::Tablet tour captured $COUNT of $EXPECTED screenshots - one still short."
            fi
          fi
          if [ "$STATUS" -eq 0 ]; then
            echo "✅ Tour capture complete."
          fi
          exit "$STATUS"

      - name: Upload Tour Artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: guided-tour-results
          path: |
            tour_screenshots/
            tour_screenshots_tablet/
            ${{ inputs.output-dir }}/
            tour.resolved.json
            tour_logcat.txt
            tour_test_output.log
            tour_screenshots.status
            tour_screenshots.anr
            tour_screenshots.host-diag.txt
            tour_screenshots.emu-crash/
            tour_logcat_tablet.txt
            tour_test_output_tablet.log
            tour_screenshots_tablet.status
            tour_screenshots_tablet.anr
            tour_screenshots_tablet.host-diag.txt
            tour_screenshots_tablet.emu-crash/
          if-no-files-found: warn
