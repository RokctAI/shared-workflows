# TEMPORARY: live-test of universal-clean-head.yml generic mode.
# Dispatched once on the PR branch to prove the three generic-mode paths
# (clean pass, drift fail, dart+python toolchain), then deleted before merge.

name: TMP Test Clean HEAD Generic

permissions:
  contents: read

on:
  workflow_dispatch:
  # Push trigger only as a self-dispatch mechanism: the workflow_dispatch API
  # is unavailable to the automation session that runs this test.
  push:
    branches:
      - claude/hearth-thread-lisgct

jobs:
  clean-pass:
    uses: ./.github/workflows/universal-clean-head.yml
    permissions:
      contents: read
    with:
      generate-command: 'echo clean run'
    secrets: inherit

  drift-fail:
    uses: ./.github/workflows/universal-clean-head.yml
    permissions:
      contents: read
    with:
      generate-command: 'echo drift > drift-canary.txt'
    secrets: inherit

  toolchain:
    uses: ./.github/workflows/universal-clean-head.yml
    permissions:
      contents: read
    with:
      generate-command: 'dart --version && python3 -c "import PIL; print(PIL.__version__)"'
      setup-dart: true
      python-packages: 'Pillow'
    secrets: inherit
