name: Universal Security Check

permissions: write-all
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
    secrets:
      COUNTER_API_KEY:
        required: false
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false
      MONOREPO_PAT:
        required: false
      GITLEAKS_LICENSE:
        required: false

jobs:
  # -----------------------------
  # Pre-check job to evaluate secret presence
  # -----------------------------
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      has_monorepo_pat: ${{ steps.vars.outputs.has_monorepo_pat }}
      has_app_id: ${{ steps.vars.outputs.has_app_id }}
    steps:
      - id: vars
        run: |
          if [ -n "${{ secrets.MONOREPO_PAT }}" ]; then
            echo "has_monorepo_pat=true" >> $GITHUB_OUTPUT
          else
            echo "has_monorepo_pat=false" >> $GITHUB_OUTPUT
          fi
          if [ -n "${{ secrets.APP_ID }}" ]; then
            echo "has_app_id=true" >> $GITHUB_OUTPUT
          else
            echo "has_app_id=false" >> $GITHUB_OUTPUT
          fi

  # -----------------------------
  # Telemetry
  # -----------------------------
  telemetry:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Track Usage
        env:
          API_KEY: ${{ secrets.COUNTER_API_KEY }}
        if: env.API_KEY != ''
        run: |
          curl -X GET "https://api.counterapi.dev/v2/rokctai/usage/up" \
          -H "Authorization: Bearer $API_KEY"

  # -----------------------------
  # Secret Scanning (Gitleaks)
  # -----------------------------
  secret-scan:
    needs: telemetry
    name: 🔑 Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    if: github.event.repository.visibility == 'public'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

      - name: Display Found Secret Types
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "🔍 Analyzing findings..."
          echo "-------------------------------------------------------"
          echo "❌ SECURITY ALERT: The following secret types were found:"
          echo "-------------------------------------------------------"
          jq -r '.[] | "- Found: " + .Description + " in file: " + .File' gitleaks-report.json || echo "Could not parse report, check raw logs above."
          echo "-------------------------------------------------------"

      - name: Create Remediation Issue
        if: steps.gitleaks.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_PAT }}
        run: |
          gh issue create \
            --title "🚨 Secret Detected in Git History" \
            --label "Security" \
            --body "### 🔑 Secret Found in Repository

            Gitleaks detected a secret committed in this repository.

            **Commit:** \`${{ github.sha }}\`
            **Branch:** \`${{ github.ref_name }}\`

            ---

            ### 🛠️ Remediation Steps

            **Step 1 — Rotate the key immediately**  
            Assume it is already compromised. Revoke and reissue it in the relevant service before doing anything else.

            **Step 2 — Install git-filter-repo**  
            \`\`\`bash
            pip install git-filter-repo
            \`\`\`

            **Step 3 — Clone a fresh copy**  
            \`\`\`bash
            git clone https://github.com/${{ github.repository }}.git repo-clean
            cd repo-clean
            \`\`\`

            **Step 4 — Purge sensitive files from all history**  
            \`\`\`bash
            git filter-repo --path-glob '**/*.env' --path-glob '**/.env*' --invert-paths
            \`\`\`

            **Step 5 — Re-add origin and force push**  
            \`\`\`bash
            git remote add origin https://github.com/${{ github.repository }}.git
            git push origin --force --all
            git push origin --force --tags
            \`\`\`

            **Step 6 — Reset your local repo**  
            \`\`\`bash
            git fetch origin
            git reset --hard origin/main
            \`\`\`

            **Step 7 — Add to .gitignore**  
            \`\`\`bash
            echo '.env/' >> .gitignore
            echo '*.env' >> .gitignore
            git add .gitignore && git commit -m 'chore: ignore .env files' && git push
            \`\`\`

            ---
            > ⚠️ After force pushing, contact GitHub Support to purge any cached views of the old history." \
            || echo "⚠️ Issue may already exist, skipping."

      - name: Fail if Secret Found
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "❌ Secret detected. See the issue created for remediation steps."
          exit 1

  # -----------------------------
  # Python Security
  # -----------------------------
  security-python:
    needs: [telemetry, secret-scan]
    name: 🐍 Python Security (Bandit & Pip Audit)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Generate App Token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ secrets.APP_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
      continue-on-error: true

    - name: Check for Python
      id: check_python
      run: |
        if [ -f "requirements.txt" ] || [ -f "pyproject.toml" ] || [ -f "setup.py" ] || [ -f "Pipfile" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: Set up Python
      if: steps.check_python.outputs.exists == 'true'
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install Security Tools
      if: steps.check_python.outputs.exists == 'true'
      run: |
        pip install bandit pip-audit

    - name: Run Bandit (Code Analysis)
      if: steps.check_python.outputs.exists == 'true'
      run: |
        bandit -r . --exclude ./.git,./node_modules,./venv --severity high > bandit_output.txt 2>&1 || true
        if [ -s bandit_output.txt ] && grep -q "Severity: High" bandit_output.txt; then
           echo "bandit_findings=true" >> $GITHUB_ENV
        else
           echo "bandit_findings=false" >> $GITHUB_ENV
        fi

    - name: Create Issue on Bandit Findings
      if: env.bandit_findings == 'true' && steps.check_python.outputs.exists == 'true'
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
      run: |
        BODY="### 🐍 Python Security Scan Failure (Bandit)
        **Commit:** ${{ github.sha }}

        #### Findings (High Severity):
        \`\`\`
        $(head -c 2000 bandit_output.txt)
        \`\`\`
        "
        gh issue create --title "🚨 Security: Bandit High Severity Findings" --body "$BODY" --label "Security" || echo "Issue already exists."

    - name: Run Pip Audit (Dependency Vulnerabilities)
      if: steps.check_python.outputs.exists == 'true'
      run: |
        if [ -f "requirements.txt" ]; then
          pip-audit -r requirements.txt > pip_audit_output.txt 2>&1 || true
          if [ -s pip_audit_output.txt ] && grep -q "dependency" pip_audit_output.txt; then
             echo "pip_audit_findings=true" >> $GITHUB_ENV
          else
             echo "pip_audit_findings=false" >> $GITHUB_ENV
          fi
        else
          echo "Skipping pip-audit (No requirements.txt found)"
          echo "pip_audit_findings=false" >> $GITHUB_ENV
        fi

    - name: Create Issue on Pip Audit Findings
      if: env.pip_audit_findings == 'true' && steps.check_python.outputs.exists == 'true'
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
      run: |
        if [ -f "pip_audit_output.txt" ]; then
          BODY=$(cat <<EOF
          ### 🐍 Python Dependency Audit Failure
          **Commit:** ${{ github.sha }}

          #### Findings:
          \`\`\`
          $(head -c 2000 pip_audit_output.txt)
          \`\`\`
          EOF
          )
          gh issue create --title "🚨 Security: Pip Audit Vulnerabilities" --body "$BODY" --label "Security" || echo "Issue already exists."
        fi

# -----------------------------
# Node Security
# -----------------------------
  security-node:
    needs: [telemetry, secret-scan]
    name: 📦 Node Security (NPM Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true

      - name: Check for Node
        id: check_node
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Run NPM Audit
        if: steps.check_node.outputs.exists == 'true'
        run: |
          npm audit --audit-level=high > npm_audit_output.txt 2>&1 || true
          if grep -qEi "high|critical" "npm_audit_output.txt"; then
            echo "npm_findings=true" >> "$GITHUB_ENV"
          else
            echo "npm_findings=false" >> "$GITHUB_ENV"
          fi

      - name: Create Issue on NPM Audit Findings
        if: env.npm_findings == 'true' && steps.check_node.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          BODY="### 📦 Node Security Audit Failure
          **High/Critical vulnerabilities found.**

          #### Audit Summary:
          \`\`\`
          $(head -c 2000 npm_audit_output.txt)
          \`\`\`
          "
          gh issue create --title "🚨 Security: Node Security Alert (High/Critical)" --body "$BODY" --label "Security" || echo "Issue already exists."

# -----------------------------
# Enable Push Protection
# -----------------------------
  enable-push-protection:
    needs: [telemetry, secret-scan, pre-check]
    name: 🔒 Enable Push Protection
    runs-on: ubuntu-latest
    if: github.event.repository.visibility == 'public' && needs.pre-check.outputs.has_monorepo_pat == 'true'
    steps:
      - name: Enable Secret Scanning & Push Protection
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_PAT }}
        run: |
            gh api --method PATCH "/repos/${{ github.repository }}" \
            -f "security_and_analysis[secret_scanning][status]=enabled" \
            -f "security_and_analysis[secret_scanning_push_protection][status]=enabled"
              echo "✅ Secret scanning and push protection enabled."

# -----------------------------
# Notify Bot Required
# -----------------------------
  notify-bot-required:
    needs: [telemetry, pre-check]
    name: 🤖 Notify Bot Required
    runs-on: ubuntu-latest
    if: github.event.repository.visibility == 'public' && needs.pre-check.outputs.has_app_id == 'false'
    steps:
      - name: Create Bot Installation Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "⚠️ Action Required: Install RokctAI Bot to Enable Push Protection" \
            --label "Security" \
            --body "### 🤖 RokctAI Bot Not Detected

          This repository is using RokctAI shared workflows but the **RokctAI Bot** is not installed.

          Some security features are unavailable without it:
          - ❌ Automatic secret scanning push protection
          - ❌ GitHub Advanced Security settings management
          - ❌ Automated issue creation with app tokens

          ---

          ### 📦 How to Install

          Install the RokctAI Bot on this repository:
          👉 **https://github.com/apps/rokctai-bot**

          Once installed, add the following secrets to this repo:
          - \`APP_ID\` — provided after installation
          - \`APP_PRIVATE_KEY\` — provided after installation

          ---

          > This issue was auto-created by the Universal Security workflow.
          > Once the bot is installed this issue can be closed." \
          || echo "⚠️ Issue may already exist, skipping."