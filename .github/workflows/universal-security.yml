# Copyright 2024 RokctAI

name: Universal Security Check

permissions:
  contents: read
  issues: write
  pull-requests: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PIP_BREAK_SYSTEM_PACKAGES: 1

on:
  workflow_call:
    inputs:
      project_type:
        required: false
        type: string
        default: 'smart'
        description: "Project type: 'frappe', 'node', or 'flutter'"
    secrets:
      COUNTER_API_KEY:
        required: false
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false
      MONOREPO_PAT:
        required: false
      GITLEAKS_LICENSE:
        required: false

jobs:
  # -----------------------------
  # Pre-check job to evaluate secret presence
  # -----------------------------
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      has_monorepo_pat: ${{ steps.vars.outputs.has_monorepo_pat }}
      has_app_id: ${{ steps.vars.outputs.has_app_id }}
    steps:
      - name: System Essentials
        run: |
          if [[ "${{ inputs.project_type }}" == "frappe" ]]; then
            sudo apt-get update && sudo apt-get install -y git
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - id: vars
        run: |
          if [ -n "${{ secrets.MONOREPO_PAT }}" ]; then
            echo "has_monorepo_pat=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_monorepo_pat=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ secrets.APP_ID }}" ]; then
            echo "has_app_id=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app_id=false" >> "$GITHUB_OUTPUT"
          fi

  # -----------------------------
  # Telemetry
  # -----------------------------
  telemetry:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: System Essentials
        run: |
          if [[ "${{ inputs.project_type }}" == "frappe" ]]; then
            sudo apt-get update && sudo apt-get install -y git curl
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Track Usage
        env:
          API_KEY: ${{ secrets.COUNTER_API_KEY }}
        if: env.API_KEY != ''
        run: |
          curl -X GET "https://api.counterapi.dev/v2/rokctai/usage/up" \
          -H "Authorization: Bearer $API_KEY"

  # -----------------------------
  # Secret Scanning (Gitleaks)
  # -----------------------------
  secret-scan:
    needs: telemetry
    name: 🔑 Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    if: github.event.repository.visibility == 'public'
    steps:
      - name: System Essentials
        run: |
          if [[ "${{ inputs.project_type }}" == "frappe" ]]; then
            sudo apt-get update && sudo apt-get install -y git jq
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        with:
          report-path: gitleaks-report.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

      - name: Display Found Secret Types
        if: steps.gitleaks.outcome == 'failure' && hashFiles('gitleaks-report.json') != ''
        run: |
          echo "🔍 Analyzing findings..."
          echo "-------------------------------------------------------"
          echo "❌ SECURITY ALERT: The following secret types were found:"
          echo "-------------------------------------------------------"
          jq -r '.[] | "- Found: " + .Description + " in file: " + .File' gitleaks-report.json
          echo "-------------------------------------------------------"

      - name: Build Secret Remediation Notes
        if: steps.gitleaks.outcome == 'failure' && hashFiles('gitleaks-report.json') != ''
        run: |
          {
            echo "### 🔑 Secret Found in Repository"
            echo ""
            echo "Gitleaks detected a secret committed in this repository."
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo "**Branch:** \`${{ github.ref_name }}\`"
            echo ""
            echo "---"
            echo ""
            echo "### 🛠️ Remediation Steps"
            echo ""
            echo "**Step 1 — Rotate the key immediately**  "
            echo "Assume it is already compromised. Revoke and reissue it in the relevant service before doing anything else."
            echo ""
            echo "**Step 2 — Install git-filter-repo**  "
            echo "\`\`\`bash"
            echo "pip install git-filter-repo"
            echo "\`\`\`"
            echo ""
            echo "**Step 3 — Clone a fresh copy**  "
            echo "\`\`\`bash"
            echo "git clone https://github.com/${{ github.repository }}.git repo-clean"
            echo "cd repo-clean"
            echo "\`\`\`"
            echo ""
            echo "**Step 4 — Purge sensitive files from all history**  "
            echo "\`\`\`bash"
            echo "git filter-repo --path-glob '**/*.env' --path-glob '**/.env*' --invert-paths"
            echo "\`\`\`"
            echo ""
            echo "**Step 5 — Re-add origin and force push**  "
            echo "\`\`\`bash"
            echo "git remote add origin https://github.com/${{ github.repository }}.git"
            echo "git push origin --force --all"
            echo "git push origin --force --tags"
            echo "\`\`\`"
            echo ""
            echo "**Step 6 — Reset your local repo**  "
            echo "\`\`\`bash"
            echo "git fetch origin"
            echo "git reset --hard origin/main"
            echo "\`\`\`"
            echo ""
            echo "**Step 7 — Add to .gitignore**  "
            echo "\`\`\`bash"
            echo "echo '.env/' >> .gitignore"
            echo "echo '*.env' >> .gitignore"
            echo "git add .gitignore && git commit -m 'chore: ignore .env files' && git push"
            echo "\`\`\`"
            echo ""
            echo "---"
            echo "> ⚠️ After force pushing, contact GitHub Support to purge any cached views of the old history."
          } > "$RUNNER_TEMP/secret_remediation.md"

      - name: Report Secret Scan to Central Repo
        # One deduped, auto-closing issue per repo in RokctAI/platformstack
        # (remediation notes embedded). No report on a tool crash (failure
        # with no gitleaks-report.json) - that is not a finding, and it must
        # not close an open issue either.
        if: github.event_name != 'pull_request' && (steps.gitleaks.outcome == 'success' || (steps.gitleaks.outcome == 'failure' && hashFiles('gitleaks-report.json') != ''))
        continue-on-error: true
        uses: RokctAI/shared-workflows/.github/actions/central-report@main
        with:
          token: ${{ secrets.MONOREPO_PAT }}
          check: secret scan
          label: secret-leak
          findings: ${{ steps.gitleaks.outcome == 'failure' }}
          extra-body-file: ${{ runner.temp }}/secret_remediation.md

      - name: Fail if Secret Found
        if: steps.gitleaks.outcome == 'failure' && hashFiles('gitleaks-report.json') != ''
        run: |
          echo "❌ Secret detected. See the central report issue in RokctAI/platformstack for remediation steps."
          exit 1

      - name: Warning on Tool Failure
        if: steps.gitleaks.outcome == 'failure' && hashFiles('gitleaks-report.json') == ''
        run: |
          echo "⚠️ Gitleaks tool failed to run correctly, but no report was generated."
          echo "This usually indicates a tool crash rather than a security finding."

  # -----------------------------
  # Python Security
  # -----------------------------
  security-python:
    needs: [telemetry, secret-scan]
    name: 🐍 Python Security (Bandit & Pip Audit)
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.project_type == 'frappe' && 'debian:bookworm' || '' }}
      options: --user root
    steps:
    - name: System Essentials
      if: inputs.project_type == 'frappe'
      run: |
        apt-get update && apt-get install -y git sudo curl python3 python3-pip jq gpg
        curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | gpg --dearmor -o /usr/share/keyrings/githubcli-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
        apt-get update && apt-get install -y gh
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Checkout Code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Generate App Token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
      with:
        client-id: ${{ secrets.APP_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
      continue-on-error: true

    - name: Check for Python
      id: check_python
      run: |
        if [ -f "requirements.txt" ] || [ -f "pyproject.toml" ] || [ -f "setup.py" ] || [ -f "Pipfile" ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi
      shell: bash

    - name: Set up Python
      if: steps.check_python.outputs.exists == 'true'
      run: |
        if [ "${{ inputs.project_type }}" = "frappe" ]; then
          apt-get update && apt-get install -y python3 python3-pip
        else
          sudo apt-get update && sudo apt-get install -y python3 python3-pip
        fi

    - name: Install Security Tools
      if: steps.check_python.outputs.exists == 'true'
      run: |
        pip install bandit pip-audit

    - name: Run Bandit (Code Analysis)
      if: steps.check_python.outputs.exists == 'true'
      run: |
        bandit -r . --exclude ./.git,./node_modules,./venv --severity high > bandit_output.txt 2>&1 || true
        if [ -s bandit_output.txt ] && grep -q "Severity: High" bandit_output.txt; then
           echo "bandit_findings=true" >> "$GITHUB_ENV"
        else
           echo "bandit_findings=false" >> "$GITHUB_ENV"
        fi

    - name: Report Bandit Scan to Central Repo
      # One deduped, auto-closing issue per repo in RokctAI/platformstack
      # instead of a fresh per-repo issue on every red run.
      if: steps.check_python.outputs.exists == 'true' && github.event_name != 'pull_request'
      continue-on-error: true
      uses: RokctAI/shared-workflows/.github/actions/central-report@main
      with:
        token: ${{ secrets.MONOREPO_PAT }}
        check: bandit scan
        label: security-scan-failure
        findings: ${{ env.bandit_findings }}
        output-file: bandit_output.txt

    - name: Run Pip Audit (Dependency Vulnerabilities)
      if: steps.check_python.outputs.exists == 'true'
      run: |
        if [ -f "requirements.txt" ]; then
          pip-audit -r requirements.txt > pip_audit_output.txt 2>&1 || true
          if [ -s pip_audit_output.txt ] && grep -q "dependency" pip_audit_output.txt; then
             echo "pip_audit_findings=true" >> "$GITHUB_ENV"
          else
             echo "pip_audit_findings=false" >> "$GITHUB_ENV"
          fi
        else
          echo "Skipping pip-audit (No requirements.txt found)"
          echo "pip_audit_findings=false" >> "$GITHUB_ENV"
        fi

    - name: Report Pip Audit to Central Repo
      if: steps.check_python.outputs.exists == 'true' && github.event_name != 'pull_request'
      continue-on-error: true
      uses: RokctAI/shared-workflows/.github/actions/central-report@main
      with:
        token: ${{ secrets.MONOREPO_PAT }}
        check: pip audit
        label: pip-audit-failure
        findings: ${{ env.pip_audit_findings }}
        output-file: pip_audit_output.txt

# -----------------------------
# Node Security
# -----------------------------
  security-node:
    needs: [telemetry, secret-scan]
    name: 📦 Node Security (NPM Audit)
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.project_type == 'frappe' && 'debian:bookworm' || '' }}
      options: --user root
    steps:
      - name: System Essentials
        if: inputs.project_type == 'frappe'
        run: |
          apt-get update && apt-get install -y git sudo curl nodejs npm gpg
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | gpg --dearmor -o /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
          apt-get update && apt-get install -y gh
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true

      - name: Check for Node
        id: check_node
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Run NPM Audit
        if: steps.check_node.outputs.exists == 'true'
        run: |
          npm audit --audit-level=high > npm_audit_output.txt 2>&1 || true
          if grep -qEi "high|critical" "npm_audit_output.txt"; then
            echo "npm_findings=true" >> "$GITHUB_ENV"
          else
            echo "npm_findings=false" >> "$GITHUB_ENV"
          fi

      - name: Report NPM Audit to Central Repo
        # Same title key as universal-linter.yml's npm audit report, so both
        # workflows track (and close) the SAME central issue for this check.
        if: steps.check_node.outputs.exists == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        uses: RokctAI/shared-workflows/.github/actions/central-report@main
        with:
          token: ${{ secrets.MONOREPO_PAT }}
          check: npm audit
          label: npm-audit-failure
          findings: ${{ env.npm_findings }}
          output-file: npm_audit_output.txt

# -----------------------------
# Enable Push Protection
# -----------------------------
  enable-push-protection:
    needs: [telemetry, secret-scan, pre-check]
    name: 🔒 Enable Push Protection
    runs-on: ubuntu-latest
    if: github.event.repository.visibility == 'public' && needs.pre-check.outputs.has_monorepo_pat == 'true'
    steps:
      - name: System Essentials
        run: |
          if [[ "${{ inputs.project_type }}" == "frappe" ]]; then
            sudo apt-get update && sudo apt-get install -y git curl
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Enable Secret Scanning & Push Protection
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_PAT }}
        run: |
            if ! command -v gh >/dev/null 2>&1; then
              echo "Installing GitHub CLI..."
              sudo apt-get update && sudo apt-get install -y curl gpg
              curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo gpg --dearmor -o /usr/share/keyrings/githubcli-archive-keyring.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list
              sudo apt-get update && sudo apt-get install -y gh
            fi
            gh api --method PATCH "/repos/${{ github.repository }}" \
            -f "security_and_analysis[secret_scanning][status]=enabled" \
            -f "security_and_analysis[secret_scanning_push_protection][status]=enabled"
              echo "✅ Secret scanning and push protection enabled."

# -----------------------------
# Notify Bot Required
# -----------------------------
  notify-bot-required:
    needs: [telemetry, pre-check]
    name: 🤖 Notify Bot Required
    runs-on: ubuntu-latest
    if: github.event.repository.visibility == 'public' && needs.pre-check.outputs.has_app_id == 'false'
    steps:
      - name: System Essentials
        run: |
          if [[ "${{ inputs.project_type }}" == "frappe" ]]; then
            sudo apt-get update && sudo apt-get install -y git curl
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create Bot Installation Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job, so gh cannot infer the repo from a git
          # remote - point it at the caller repo explicitly.
          GH_REPO: ${{ github.repository }}
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "Installing GitHub CLI..."
            sudo apt-get update && sudo apt-get install -y curl gpg
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo gpg --dearmor -o /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list
            sudo apt-get update && sudo apt-get install -y gh
          fi
          {
            echo "### 🤖 RokctAI Bot Not Detected"
            echo ""
            echo "This repository is using RokctAI shared workflows but the **RokctAI Bot** is not installed."
            echo ""
            echo "Some security features are unavailable without it:"
            echo "- ❌ Automatic secret scanning push protection"
            echo "- ❌ GitHub Advanced Security settings management"
            echo "- ❌ Automated issue creation with app tokens"
            echo ""
            echo "---"
            echo ""
            echo "### 📦 How to Install"
            echo ""
            echo "Install the RokctAI Bot on this repository:"
            echo "👉 **https://github.com/apps/rokctai-bot**"
            echo ""
            echo "Once installed, add the following secrets to this repo:"
            echo "- \`APP_ID\` — provided after installation"
            echo "- \`APP_PRIVATE_KEY\` — provided after installation"
            echo ""
            echo "---"
            echo ""
            echo "> This issue was auto-created by the Universal Security workflow."
            echo "> Once the bot is installed this issue can be closed."
          } > bot_required_issue_body.txt
          gh issue create \
            --title "⚠️ Action Required: Install RokctAI Bot to Enable Push Protection" \
            --label "Security" \
            --body-file bot_required_issue_body.txt \
            || echo "⚠️ Issue may already exist, skipping."
