name: Universal Security Check

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
    secrets:
      COUNTER_API_KEY:
        required: false
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

jobs:
  telemetry:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Track Usage
        env:
          API_KEY: ${{ secrets.COUNTER_API_KEY }}
        if: env.API_KEY != ''
        run: |
          curl -X GET "https://api.counterapi.dev/v2/rokctai/usage/up" \
          -H "Authorization: Bearer $API_KEY"

  security-python:
    needs: telemetry
    name: 🐍 Python Security (Bandit & Pip Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true

      - name: Check for Python
        id: check_python
        run: |
          if [ -f "requirements.txt" ] || [ -f "pyproject.toml" ] || [ -f "setup.py" ] || [ -f "Pipfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Set up Python
        if: steps.check_python.outputs.exists == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Security Tools
        if: steps.check_python.outputs.exists == 'true'
        run: |
          pip install bandit pip-audit

      - name: Run Bandit (Code Analysis)
        if: steps.check_python.outputs.exists == 'true'
        run: |
          # Recursive scan, skip hidden dirs, HIGH severity. Non-blocking exit.
          bandit -r . --exclude ./.git,./node_modules,./venv --severity high > bandit_output.txt 2>&1 || true
          
          if [ -s bandit_output.txt ] && grep -q "Severity: High" bandit_output.txt; then
             echo "bandit_findings=true" >> $GITHUB_ENV
          else
             echo "bandit_findings=false" >> $GITHUB_ENV
          fi

      - name: Create Issue on Bandit Findings
        if: env.bandit_findings == 'true' && steps.check_python.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          BODY="### 🐍 Python Security Scan Failure (Bandit)
          **Commit:** ${{ github.sha }}
          
          #### Findings (High Severity):
          \`\`\`
          $(head -c 2000 bandit_output.txt)
          \`\`\`
          "
          gh issue create --title "🚨 Security: Bandit High Severity Findings" --body "$BODY" --label "Security" || echo "Issue already exists."

      - name: Run Pip Audit (Dependency Vulnerabilities)
        if: steps.check_python.outputs.exists == 'true'
        run: |
          if [ -f "requirements.txt" ]; then
            pip-audit -r requirements.txt > pip_audit_output.txt 2>&1 || true
            if [ -s pip_audit_output.txt ] && grep -q "dependency" pip_audit_output.txt; then
               echo "pip_audit_findings=true" >> $GITHUB_ENV
            else
               echo "pip_audit_findings=false" >> $GITHUB_ENV
            fi
          else
            echo "Skipping pip-audit (No requirements.txt found)"
            echo "pip_audit_findings=false" >> $GITHUB_ENV
          fi

      - name: Create Issue on Pip Audit Findings
        if: env.pip_audit_findings == 'true' && steps.check_python.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          if [ -f "pip_audit_output.txt" ]; then
            BODY="### 🐍 Python Dependency Audit Failure
            **Commit:** ${{ github.sha }}
            
            #### Findings:
            \`\`\`
            $(head -c 2000 pip_audit_output.txt)
            \`\`\`
            "
            gh issue create --title "🚨 Security: Pip Audit Vulnerabilities" --body "$BODY" --label "Security" || echo "Issue already exists."
          fi

  security-node:
    needs: telemetry
    name: 📦 Node Security (NPM Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true

      - name: Check for Node
        id: check_node
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Run NPM Audit
        if: steps.check_node.outputs.exists == 'true'
        run: |
          npm audit --audit-level=high > npm_audit_output.txt 2>&1 || true
          
          if grep -qEi "high|critical" npm_audit_output.txt; then
             echo "npm_findings=true" >> $GITHUB_ENV
          else
             echo "npm_findings=false" >> $GITHUB_ENV
          fi

      - name: Create Issue on NPM Audit Findings
        if: env.npm_findings == 'true' && steps.check_node.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          BODY="### 📦 Node Security Audit Failure
          **High/Critical vulnerabilities found.**
          
          #### Audit Summary:
          \`\`\`
          $(head -c 2000 npm_audit_output.txt)
          \`\`\`
          "
          gh issue create --title "🚨 Security: Node Security Alert (High/Critical)" --body "$BODY" --label "Security" || echo "Issue already exists."
