name: "Setup ROKCT Bot Identity"
description: "Configures git with standardized ROKCT bot credentials"

inputs:
  token:
    description: "PAT for high-authority pushing"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Configure Git
      shell: bash
      run: |
        git config user.name "rokctbot"
        git config user.email "bot@rokct.ai"
        if [ -n "${{ inputs.token }}" ]; then
          git remote set-url origin https://x-access-token:${{ inputs.token }}@github.com/${{ github.repository }}
        fi
