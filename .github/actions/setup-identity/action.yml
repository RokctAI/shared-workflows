name: "Setup ROKCT Bot Identity"
description: "Configures git with standardized ROKCT bot credentials"

runs:
  using: "composite"
  steps:
    - name: Configure Git
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
