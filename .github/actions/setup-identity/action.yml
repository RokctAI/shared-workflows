name: "Setup ROKCT Bot Identity"
description: "Configures git with standardized ROKCT bot credentials and handles high-authority token injection"

inputs:
  token:
    description: "Optional PAT or App Token for pushing (triggers downstream CI)"
    required: false
    default: ""
  bot-name:
    description: "Name for git commits"
    required: false
    default: "RokctBOT[bot]"
  bot-email:
    description: "Email for git commits"
    required: false
    default: "2956274+RokctBOT[bot]@users.noreply.github.com"

runs:
  using: "composite"
  steps:
    - name: Configure Git
      shell: bash
      run: |
        git config user.name "${{ inputs.bot-name }}"
        git config user.email "${{ inputs.bot-email }}"
        
        if [ -n "${{ inputs.token }}" ]; then
          echo "🔐 High-Authority Token detected. Configuring remote..."
          
          # CRITICAL: Remove the default GITHUB_TOKEN header persisted by actions/checkout
          # This prevents the restricted GITHUB_TOKEN from overriding our App Token
          git config --local --unset-all http.https://github.com/.extraheader || true
          
          # Set the remote URL with the high-authority token
          git remote set-url origin "https://x-access-token:${{ inputs.token }}@github.com/${{ github.repository }}"
          
          # Pre-verify token authority for logging
          echo "🔍 Verifying token identity..."
          GH_TOKEN="${{ inputs.token }}" gh auth status || echo "⚠️ gh auth status failed, but continuing..."
        else
          echo "ℹ️ No high-authority token provided. Using default GITHUB_TOKEN permissions."
        fi
