name: "Setup ROKCT Bot Identity"
description: "Configures git with standardized ROKCT bot credentials and handles high-authority token injection"

inputs:
  token:
    description: "Optional PAT or App Token for pushing (triggers downstream CI)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Configure Git
      shell: bash
      run: |
        git config user.name "rokctbot[bot]"
        git config user.email "2956274+rokctbot[bot]@users.noreply.github.com"
        
        if [ -n "${{ inputs.token }}" ]; then
          echo "🔐 High-Authority Token detected. Configuring remote..."
          git remote set-url origin https://x-access-token:${{ inputs.token }}@github.com/${{ github.repository }}
        fi
