name: 'Checkout and Merge Private'
description: 'Checkout the repository and dynamically merge its private repository if configured via .private_repo'
inputs:
  repository:
    description: 'Repository name'
    required: false
    default: ''
  ref:
    description: 'Ref to checkout'
    required: false
    default: ''
  token:
    description: 'GitHub token'
    required: false
    default: ''
  fetch-depth:
    description: 'Fetch depth'
    required: false
    default: '1'
  path:
    description: 'Relative path under $GITHUB_WORKSPACE to place the repository'
    required: false
    default: ''
  token_private:
    description: 'Personal Access Token to read the private repository'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Checkout Host Repository
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.repository || github.repository }}
        ref: ${{ inputs.ref }}
        token: ${{ inputs.token || github.token }}
        fetch-depth: ${{ inputs.fetch-depth }}
        path: ${{ inputs.path }}

    - name: Read Private Repo Config
      id: read-private
      shell: bash
      run: |
        TARGET_PATH="${{ inputs.path }}"
        FILE_PATH=".private_repo"
        if [ -n "$TARGET_PATH" ]; then
          FILE_PATH="$TARGET_PATH/.private_repo"
        fi
        if [ -f "$FILE_PATH" ]; then
          REPO_NAME=$(cat "$FILE_PATH" | tr -d '\r\n[:space:]')
          echo "repo=$REPO_NAME" >> "$GITHUB_OUTPUT"
          echo "Found private repo config: $REPO_NAME"
        else
          echo "repo=" >> "$GITHUB_OUTPUT"
        fi

    - name: Checkout Private Repository
      if: steps.read-private.outputs.repo != ''
      shell: bash
      run: |
        REPO="${{ steps.read-private.outputs.repo }}"
        TOKEN="${{ inputs.token_private || inputs.token || github.token }}"
        echo "Cloning private repository $REPO..."
        
        # Configure URL with token
        URL="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
        
        # Clone to .private-temp
        if git clone --depth 1 "$URL" .private-temp; then
          echo "Successfully cloned private repository."
        else
          echo "::warning::Failed to clone private repository $REPO."
        fi

    - name: Merge Private Repository and Setup Git Exclude
      if: steps.read-private.outputs.repo != ''
      shell: bash
      run: |
        if [ -d ".private-temp" ]; then
          TARGET_DIR="./"
          if [ -n "${{ inputs.path }}" ]; then
            TARGET_DIR="${{ inputs.path }}/"
          fi
          
          echo "Excluding private files from git tracking..."
          # Add to .git/info/exclude in the host repository
          mkdir -p "${TARGET_DIR}.git/info"
          (cd .private-temp && find . -type f) | sed 's|^\./||' >> "${TARGET_DIR}.git/info/exclude"
          
          echo "Merging private files into $TARGET_DIR..."
          rm -rf .private-temp/.git .private-temp/.github
          rsync -a .private-temp/ "$TARGET_DIR"
          rm -rf .private-temp
        else
          echo "::warning::Private repository was configured but not checked out successfully. Skipping merge."
        fi
