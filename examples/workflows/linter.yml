name: Code Quality

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]
  pull_request:

permissions: write-all
jobs:
  lint:
    permissions: write-all
    uses: RokctAI/shared-workflows/.github/workflows/universal-linter.yml@main
    secrets: inherit



